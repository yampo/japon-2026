"7115425106354344098","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"KAMA-ASA(Kitchen Knife Section)","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17443480694399095197","n":"Koshinoitto Kappabashi Shop","cat":"tienda","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"3 Chome-1-16 Matsugaya, Taito City, Tokyo 111-0036, Japón","lat":35.7146659,"lng":139.7888003,"aprox":false,"gcid":"17443480694399095197","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Koshinoitto Kappabashi Shop","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_985297853145714191","n":"Yuzuya Ryokan Isshinkyo","cat":"comida","hood":"Kioto","why":"Es un ryokan de 8 habitaciones pegado al costado sur del santuario Yasaka, en Gion, cuya cocina —el restaurante Isshinkyo, en planta baja— está abierta al público sin necesidad de alojarse: ahí está el valor real para ustedes. El plato de la casa es el yuzu zosui (arroz caldoso con yuzu) y el yuzu-nabe, cocina kioteña de temporada con cítrico como eje; almuerzo ¥5.500 (zosui) o ¥7.700 (pargo en caldo de yuzu), cena kaiseki desde ¥14.520 hasta ¥27.830, precios oficiales con impuesto y 10% de servicio incluidos. Se come mirando el jardín interior desde la sala de planta baja, en una casona de madera con portón y almacén antiguos, a metros del santuario Yasaka, lo cual en diciembre-enero significa poder cortar el día de templos sin cruzar la ciudad. Dormir ahí es otra liga: ¥49.500-68.200 por persona por noche con cena y desayuno según Rakuten (el impuesto de alojamiento de Kioto se cobra aparte al check-out), adultos solamente (no admiten menores de 13) — como alojamiento no entra en un viaje de 25 días salvo que quieran quemar una noche entera de presupuesto en esto.","addr":"Japón, 〒605-0074 Kyoto, Higashiyama Ward, 南隣545 八坂神社 京都市東山区祇園町","lat":35.0033804,"lng":135.7773273,"aprox":false,"gcid":"985297853145714191","cost":5500,"dur":1.5,"sub":"Kaiseki / cocina kioteña de yuzu (almuerzo accesible, cena cara)","typ":"Ryokan","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Yuzuya Ryokan Isshinkyo","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.65,"tip":"Yuzu zosui (¥5.500) o tai-yuzu (pargo en caldo de yuzu, ¥7.700) al mediodía; ambos vienen con unos quince platitos kioteños de temporada y postre, así que para dos foodies que comparten alcanza y sobra. La especialidad de la noche es el yuzu-nabe dentro del kaiseki (¥14.520 el más barato). Reserva previa por teléfono (075-533-6374, 10:00–20:00) o por su sistema online; el kaiseki sin nabe hay que pedirlo con una semana de anticipación. 7 lugares de mesa más sala privada de tatami para hasta 28 personas. Aceptan tarjeta (VISA, Master, JCB, AMEX, Diners).","season":"No aplica: es urbano, opera todo el año. El yuzu es justamente producto de invierno, así que diciembre-enero es su mejor momento. · Año nuevo (29/12 al 3/1): Abre en Año Nuevo, que en Kioto es la excepción. El patrón conocido (aviso oficial publicado el 19/12/2023 para el shōgatsu 2024): operación normal hasta el 31 de diciembre y del 1 al 5 de enero menú especial de Año Nuevo, más caro — almuerzo \"祝 柚子雑炊膳\" ¥8.800 y \"祝 鯛柚子鍋膳\" ¥11.000, con reserva entre 11:30 y 13:00; cena ¥18.000 y ¥27.830, con reserva entre 17:00 y 18:30. Ojo: eso es la edición 2024, la de 2026-2027 todavía no está anunciada. Hay que llamar en noviembre-diciembre de 2026 para confirmar fechas, precios y disponibilidad.","conf":"alta","warn":["Está mal categorizado: figura como 'alojamiento' pero la ficha de Google es la del restaurante Isshinkyo (Tabelog 3,65 con 375 reseñas). Como hotel cuesta ¥49.500-68.200 por persona por noche con dos comidas (Rakuten); como restaurante se entra por ¥5.500. Reclasificar a 'comida'.","La zona SÍ está bien: 545 Gionmachi, Higashiyama-ku, Kioto, literalmente pegado al lado sur del santuario Yasaka. No hay error de prefectura.","Esa misma ubicación es el problema del 31/12 al 3/1: Yasaka-jinja es uno de los mayores destinos de hatsumōde de Kioto y la cuadra se vuelve intransitable. Con reserva se entra, pero calculá el doble de tiempo para llegar y no lo encadenes con nada apretado.","Trabajan con reserva previa en ambos turnos y piden llegar a la hora reservada; no cuenten con entrar caminando. En Año Nuevo el almuerzo solo admite ingreso entre 11:30 y 13:00, y la cena entre 17:00 y 18:30.","Las fechas y precios de shōgatsu que figuran son de la edición 2024 (aviso del 19/12/2023): hay que reconfirmar los de 2026-2027 por teléfono.","La web oficial avisa que el ofuro grande de hinoki de planta baja está fuera de servicio por una falla de válvula — irrelevante si solo van a comer, decisivo si pensaban dormir ahí por el baño de yuzu. Sin fecha de reparación publicada.","No alojan menores (restricción de estadía para niños) y varios sitios lo listan como 'Adult Only'."],"refs":["https://yuzuyaryokan.com/restaurant/","https://yuzuyaryokan.com/","https://kiwa-group.co.jp/isshinkyo_kyoto/","https://tabelog.com/en/kyoto/A2601/A260301/26004222/","https://hotel.travel.rakuten.co.jp/hotelinfo/plan/79386","https://yukusas-kyoto.com/isshinkyo/news"]},{"id":"u_g_15915173481287631238","n":"Shinsaibashi ARTY Inn","cat":"alojamiento","hood":"Osaka","why":"Business hotel de 116 habitaciones en Nishi-Shinsaibashi, al borde de Amerikamura, a 4 minutos de la estacion Yotsubashi y a menos de 10 de Dotonbori caminando (el hotel dice 5): para dos que van a comer y picar por Namba/Shinsaibashi, la ubicacion es de las mejores relacion precio-posicion de Osaka. Su gancho real es el ofuro grande con sauna a 100°C y pileta fria a 15°C, separado por sexo, util para volver caminando a las 23 de comer y meterse al agua en pleno invierno (las habitaciones solo tienen box de ducha, salvo la Family). El resto es un hotel de negocios estandar: cuartos chicos, sin desayuno propio, sin nada de encanto. No es un lugar a \"visitar\" sino un candidato a base en Osaka; si el viaje pasa por Osaka con varias noches, entra por la ubicacion y el bano, no por el hotel.","addr":"2 Chome-17-3 Nishishinsaibashi, Chuo Ward, Osaka, 542-0086, Japón","lat":34.6708797,"lng":135.497433,"aprox":false,"gcid":"15915173481287631238","cost":7000,"dur":12,"sub":"Base en Osaka: business hotel con ofuro y sauna, a pasos de Amerikamura y Dotonbori","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Shinsaibashi ARTY Inn","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Parcial. En el archivo de avisos de la web oficial (revisado hasta junio 2026) no hay ninguna nota de cierre por año nuevo, y un business hotel no cierra: la recepción sigue operando. Lo que no verifiqué es precio ni disponibilidad para el 29/12-3/1, que en Osaka es la semana de mayor demanda del año. Reservar con meses de anticipación.","conf":"alta","warn":["Para dos personas sirven solo Double (13 m2, cama de 140 cm) o Twin (18 m2, dos camas de 120). Budget y Single son de 1 persona y la Semi-Double es una cama de 120 para dos: apretada. Verificar el tipo de cuarto al reservar, no el precio mas barato.","Ninguna habitacion tiene banera salvo la Family (37 m2); el resto es box de ducha. El bano grande compensa, pero es comunal y desnudo.","Politica de tatuajes del ofuro: NO esta publicada en la web oficial. Si alguno de los dos tiene tatuajes, preguntar por telefono (06-6211-8100) antes de reservar por el bano.","Horario del ofuro: lo unico confirmado por la web oficial es que la sauna se apaga de 1:00 a 5:00 por seguridad. El horario de apertura y cierre del bano en si no esta publicado, y los portales dan versiones que no coinciden. Si el bano es una razon para elegir el hotel, confirmalo al reservar.","Impuesto de alojamiento de Osaka, subido el 1/9/2025 y confirmado en el aviso oficial del hotel: 200 yenes por persona y noche para tarifas de 5.000 a 14.999, 400 de 15.000 a 19.999, 500 de 20.000 en adelante. Se paga aparte.","El costo de 7.000 yenes por persona es una referencia fuera de temporada (promedio de Trip.com, ~97 USD la habitacion, dividido en dos). Fin de diciembre y ano nuevo cuestan mas: no lo verifique para esas fechas.","Esta a unos 150 m de Amerikamura, zona de vida nocturna. No hay reportes verificados de ruido, pero si dormis liviano conviene pedir habitacion alta o al contrafrente."],"refs":["https://arty-inn.com/shinsaibashi/en/","https://arty-inn.com/shinsaibashi/access/","https://arty-inn.com/shinsaibashi/room/","https://arty-inn.com/shinsaibashi/largebath/","https://arty-inn.com/shinsaibashi/category/news/","https://arty-inn.com/shinsaibashi/news/archives/20250316_1494/","https://us.trip.com/hotels/osaka-hotel-detail-88627973/shinsaibashi-arty-inn/"]},{"id":"u_g_13150975437697492995","n":"Laon Inn Gion Nawate","cat":"alojamiento","hood":"Kioto","why":"No es un lugar para visitar: es una base donde dormir en Kioto, y como base la ubicación es de las mejores posibles — Yamato-oji bajando de Shijo, a 2 minutos de la salida 6 de Gion-Shijo (Keihan) y caminando a Hanamikoji, Kenninji, Yasaka y Pontocho cruzando el río. Es un hotel chico y funcional, no un ryokan: 40 habitaciones de 13 a 17 m², todas no fumador, con baño privado, heladera, pava, wifi y lavandería a monedas; recepción 24 h, check-in 15:00 y check-out 10:00 (fuente oficial). Quedan a pie de la concentración de restaurantes de Gion y Kawaramachi, y se vuelve caminando a las 23:00 sin depender del último tren. Ojo con el fin de año: Yasaka queda a unos 10 minutos a pie y en hatsumōde concentra multitud, así que del 31/12 al 3/1 la zona se pone densa — puede ser una ventaja (llegan a pie) o una molestia según cómo lo tomen. Los cortes de tránsito de esas noches no están verificados: el aviso lo publica la policía de Kioto en diciembre.","addr":"16-1 Yamatocho, Higashiyama Ward, Kyoto, 605-0802, Japón","lat":35.003026999999996,"lng":135.773044,"aprox":false,"gcid":"13150975437697492995","cost":0,"dur":0.5,"sub":"Hotel de 40 habitaciones en Gion (Higashiyama), a 2 min de Gion-Shijo","typ":"Alojamiento","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Laon Inn Gion Nawate","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"","conf":"alta","warn":["La zona está bien asignada: 〒605-0802 京都市東山区大和大路四条下る大和町16-1, Higashiyama-ku, ciudad de Kioto, prefectura de Kioto. Está en Gion mismo, no hay error de rotulado.","IMPUESTO DE ALOJAMIENTO DE KIOTO: cambia el 1 de marzo de 2026, o sea que al viaje (dic 2026) le aplica el esquema NUEVO, por persona y por noche: menos de 6.000 ¥ de tarifa = 200 ¥; 6.000-19.999 ¥ = 400 ¥; 20.000-49.999 ¥ = 1.000 ¥. No suele venir incluido en el precio que muestran los buscadores.","No pude leer una tarifa real para las fechas del viaje. Trip.com muestra un 'desde' de alrededor de 4.900 ¥ y un promedio de 17.785 ¥ por habitación, pero sin fechas: no sirve para presupuestar fin de año, que es el pico de precio en Gion. Cotizar con fechas puestas.","No verifiqué que opere normal del 29/12 al 3/1. Es un hotel con recepción 24 h y el sitio oficial no menciona cierre de fin de año, pero eso no es confirmación: preguntar al reservar.","Fin de año en Gion se agota temprano y son solo 40 habitaciones. Si Kioto entra al itinerario para esas fechas, reservar es de lo primero que hay que hacer.","Habitaciones chicas: twin 16,71 m² (31 hab.), queen 14,14 m² (6) y doble 13,12 m² (3). Para 25 días de viaje con valijas, la twin es la única que da aire.","Del 31/12 al 3/1 el hotel queda cerca del área de hatsumōde de Yasaka (unos 10 min a pie): esperar multitud en la zona. Si hay cortes de calle, el aviso lo publica la policía de Kioto en diciembre — chequearlo entonces."],"refs":["https://www.laoninn.com/english/nawate/","https://www.laoninn.com/nawate/","https://kyoto.travel/en/news/tax-change/","https://jp.trip.com/hotels/kyoto-hotel-detail-13663906/laon-inn-gion-nawate/"]},{"id":"u_g_7552043122514986352","n":"Sotetsu Fresa Inn Hamamatsucho Daimon","cat":"alojamiento","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-2-7 Shibadaimon, Minato City, Tokyo 105-0012, Japón","lat":35.6595972,"lng":139.7544087,"aprox":false,"gcid":"7552043122514986352","cost":0,"dur":0,"sub":"-","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Sotetsu Fresa Inn Hamamatsucho Daimon","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_6355049266444838481","n":"teamLab Borderless: MORI Building DIGITAL ART MUSEUM","cat":"museo","hood":"Minato","why":"Museo de arte digital inmersivo de teamLab en el subsuelo de Azabudai Hills: salas oscuras con proyecciones que se mueven de un ambiente a otro, sin mapa ni recorrido fijo, y la web oficial no fija un límite de estadía una vez adentro. Es de lo poco que juega a favor en diciembre: es todo bajo techo y abre hasta las 21:00, así que es el plan para después de las 16:30, cuando ya es de noche y los jardines y miradores no sirven — no le quemes un bloque de luz de día. Y por el precedente de la temporada pasada, es de los pocos lugares que probablemente esté abierto y funcionando entre el 29/12 y el 3/1, cuando los museos públicos cierran. La logística es lo delicado: entrada con hora fija, se agota, y el precio de adulto es dinámico (3.600 de piso, hasta 5.600 según el día).","addr":"Japón, 〒106-0041 Tokyo, Minato City, Toranomon, 5 Chome−９ Azabudai Hills Garden Plaza B, B1","lat":35.6620689,"lng":139.7432671,"aprox":false,"gcid":"6355049266444838481","cost":3600,"dur":3,"sub":"Arte digital","typ":"Museo de arte","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"teamLab Borderless: MORI Building DIGITAL ART MUSEUM","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): No cerró en shōgatsu la temporada pasada: en el snapshot oficial del 20/12/2025 los únicos cierres listados eran martes 9/12, martes 20/1 y tres días de febrero — ninguno entre el 29/12 y el 3/1 — y encima extendían el horario hasta las 22:00 del 20 al 25/12. Precedente fuerte de que abre, pero el calendario 2026-27 no está publicado: confirmar en la web oficial cuando salga la venta.","conf":"alta","warn":["El calendario de cierres de diciembre 2026 / enero 2027 NO está publicado todavía: los cierres son martes sueltos e irregulares, y además hay días con cierre adelantado a las 17:00 que tumbarían el plan de ir después de las 16:30. Hay que verificar las dos cosas antes de comprar","Precio dinámico: 3.600 es el piso; la web oficial aclara que el adulto va de 3.600 a 5.600 según el día, pero no publica cuáles son los días caros — mirar el precio de la fecha concreta. +200 si se compra en el lugar, y puede estar agotado","Entrada con fecha y hora asignada, se agota en fines de semana y feriados. Sin reingreso: una vez que salís, se terminó","Hay DOS teamLab en Tokio y se confunden todo el tiempo: éste es Borderless (Azabudai Hills, Minato) y el otro es teamLab Planets (Toyosu, anunciado hasta fin de 2027). Si en la lista de Thais aparecen los dos, son visitas distintas, no un duplicado","Prohibido entrar comida (hay lockers gratis). Salas oscuras, techos bajos y pisos espejados: prestan pareo para faldas. Se puede fotografiar, sin flash ni palo de selfie","La dirección que trae Google (Toranomon 5-9) y la que usa la web japonesa (麻布台 1-2-4) son la misma puerta: Azabudai Hills Garden Plaza B, B1. Se llega por pasaje subterráneo desde Kamiyachō salida 5 (Hibiya, 2 min) sin salir a la calle"],"refs":["https://www.teamlab.art/e/borderless-azabudai/","https://www.teamlab.art/jp/e/tokyo/","https://web.archive.org/web/20251220234532/https://www.teamlab.art/e/tokyo/","https://www.teamlab.art/e/planets/"]},{"id":"u_g_1936271296456478889","n":"The Head Spa Tokyo Daikanyama","cat":"sinclasificar","hood":"Shibuya","why":"Head spa: masaje de cuero cabelludo, cuello y hombros, con lavado y secado incluidos. No es turismo, es una hora larga de descanso pago — tiene sentido como válvula de escape a mitad de viaje, no como \"lugar para visitar\". Está en el subsuelo (B1F) de un edificio a 5 min de la salida oeste de Ebisu, así que la luz del día no importa y entra bien en una tarde ya vencida para museos, siempre que se respete el último ingreso (19:00 entre semana, 17:00 domingos y feriados). El curso base son 70 min por ¥12.100 y el de 90 min ¥14.300, o sea que sale como dos cenas buenas: si el presupuesto de comida manda, esto es lo primero que se cae.","addr":"B1F, 1 Chome-17-6 Ebisunishi, Shibuya, Tokyo 150-0021, Japón","lat":35.6482029,"lng":139.7069136,"aprox":false,"gcid":"1936271296456478889","cost":12100,"dur":2,"sub":"Head spa","typ":"Head spa","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: no encaja en ninguna categoría. Es un head spa en sótano (salón de masaje capilar), no naturaleza ni onsen; ninguna categoría de la lista le calza bien","src":"lista","gname":"The Head Spa Tokyo Daikanyama","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"media","warn":["Es una cadena: 8 locales en Tokio (Shibuya, Shibuya Annex, Daikanyama, Ebisu, Nakameguro, Gakugeidaigaku, Harajuku, Harajuku Annex) más uno en Kioto. La web oficial anuncia además dos por abrir (EDITION y LUX|AZABU): si se re-verifica cerca del viaje, el conteo puede cambiar. No es un lugar único.","Ojo al reservar: 'Daikanyama' y 'Ebisu' son DOS sucursales distintas de la misma marca, en lados OPUESTOS de la estación de Ebisu. El de esta ficha se llama Daikanyama pero está en Ebisu-nishi 1-17-6, a 5 min de la salida oeste; el otro está en Ebisu-higashi 3-25-8, 3F, del lado este. Son 700-800 m, unos 10 min a pie: equivocarse cuesta 20 minutos.","NO acepta efectivo. Solo tarjeta (Visa, Master, JCB, Amex, Diners), IC de transporte, QUICPay, Apple Pay, iD.","Cierra los MARTES — dato de la web oficial, no del horario de Google.","El local es el B1F del edificio Ebisu S. En el 1F, misma dirección, está la peluquería 'Beige' (mismo grupo): sirve para reconocer el edificio desde la calle.","Shōgatsu sin verificar: la web oficial no publica calendario de 年末年始. Hay que preguntar al reservar si se cae entre el 29/12 y el 3/1.","Categoría 'sinclasificar' es la correcta: no es comida, ni museo, ni tienda. Forzarlo a otra casilla lo pinta mal en el mapa.","La reserva es online, por select-type.com desde la web oficial. El listado de addagio no tiene booking online. Ninguna fuente dice si aceptan walk-ins."],"refs":["https://www.headspatokyo.com/salon/the-headspa-tokyo-daikanyama","https://www.headspatokyo.com/menu","https://www.headspatokyo.com/salon","https://book.addagio.io/book/the-head-spa-tokyo-daikanyama-tokyo"]},{"id":"u_g_13406956947370744229","n":"The Head Spa Tokyo Harajuku Annex","cat":"sinclasificar","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒150-0001 Tokyo, Shibuya, Jingumae, 6 Chome−24−24 ビルディング神宮前 ４W 2F Aroom","lat":35.6654858,"lng":139.7024456,"aprox":false,"gcid":"13406956947370744229","cost":0,"dur":0,"sub":"-","typ":"Head spa","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Pin sin nombre en Jingumae 6-24-24, 2F «Aroom». Zona de tiendas chicas y estudios en Harajuku, pero podría ser café o showroom. Falta el nombre.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_7065371965908019590","n":"Tokyo Iriya Shodo Club (Japanese calligraphy Experience in Tokyo)","cat":"comida","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒110-0013 Tokyo, Taito City, Iriya, 2 Chome−29−2 2階","lat":35.7213317,"lng":139.789042,"aprox":false,"gcid":"7065371965908019590","cost":0,"dur":0,"sub":"-","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Pin sin nombre en Iriya 2-29-2, 2F (Taito). No hay dato para deducir el rubro más allá de la zona.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_3194088047498504681","n":"Daihonzan Eiheiji","cat":"arq","hood":"Yoshida District","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"5-15 Shihi, Eiheiji, Yoshida District, Fukui 910-1228, Japón","lat":36.056593299999996,"lng":136.3568759,"aprox":false,"gcid":"3194088047498504681","cost":0,"dur":0,"sub":"-","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Daihonzan Eiheiji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Otras zonas","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_9165369992688813062","n":"Himi Fishing Port 2F Fish Market Restaurant","cat":"comida","hood":"Tateyama / Kurobe","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒935-0012 Toyama, Himi, Himimachi, 435 地方卸売市場 氷見魚市場 ２階","lat":36.8596784,"lng":136.9912898,"aprox":false,"gcid":"9165369992688813062","cost":0,"dur":0,"sub":"-","typ":"Marisquería","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Himi Fishing Port 2F Fish Market Restaurant","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Otras zonas","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_6132261747819151994","n":"Ainokura Gassho-zukuri Village","cat":"barrio","hood":"Tateyama / Kurobe","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Ainokura, Nanto, Toyama 939-1915, Japón","lat":36.426006099999995,"lng":136.9354778,"aprox":false,"gcid":"6132261747819151994","cost":0,"dur":0,"sub":"-","typ":"Pueblo histórico","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Ainokura Gassho-zukuri Village","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Shirakawa-go","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_531301034515359583","n":"Toyama Glass Art Museum","cat":"museo","hood":"Tateyama / Kurobe","why":"Museo municipal de arte en vidrio dentro del edificio TOYAMA Kirari, de Kengo Kuma, en pleno centro de la ciudad de Toyama (no en la montaña). El edificio comparte espacio con la biblioteca municipal y el atrio de madera y vidrio es la mitad del atractivo; arriba está el Glass Art Garden del piso 6, con instalaciones de Dale Chihuly, más la colección permanente en el 4. Se ve en hora y media y sale 200 yenes la permanente (ese ticket cubre los dos pisos), así que es barato y no depende de la luz del día: sirve perfecto para la tarde de diciembre, cuando el sol se pone cerca de las 16:40 y a las 17 ya es de noche. No justifica ir a Toyama por él, pero si Toyama entra al viaje por otra razón, es la parada obvia del centro.","addr":"5-1 Nishicho, Toyama, 930-0062, Japón","lat":36.688415899999995,"lng":137.2151858,"aprox":false,"gcid":"531301034515359583","cost":200,"dur":1.5,"sub":"Arte en vidrio · edificio de Kengo Kuma","typ":"Museo de arte","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Toyama Glass Art Museum","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"Museo urbano bajo techo, abierto todo el invierno. No es un lugar estacional ni de montaña: no lo afecta la nieve más allá del traslado hasta Toyama. · Año nuevo (29/12 al 3/1): Cierra. La página oficial de visitantes declara cierre por 年末年始 sin dar fechas, y el calendario 2026-2027 todavía no está publicado (chequeado en septiembre de 2026). El aviso de la temporada anterior sirve de referencia: en 2025-2026 cerró del 29/12 al 1/1, abrió especialmente el 2 y el 3 de enero de 9:30 a 17:00 (entrada hasta 16:30) y volvió al horario normal el 4, con el miércoles 7 cerrado. Si repite el patrón, en el viaje habría que darlo por cerrado del 29/12 al 1/1 y mirar la web en diciembre para confirmar la apertura del 2 y 3.","conf":"alta","warn":["Zona mal rotulada: no está en Tateyama ni en Kurobe. Está en Nishicho, centro de la ciudad de Toyama, prefectura de Toyama, a un par de kilómetros de la estación de Toyama (tranvía urbano hasta Grand Plaza-mae o Nishicho, 2 minutos a pie). Tateyama queda a unos 25 km al sudeste y Unazuki/Kurobe a unos 55 km al noreste: son excursiones aparte, no la misma parada.","La Tateyama Kurobe Alpine Route opera del 15/4 al 30/11/2026 y está cerrada por nieve en diciembre y enero. Si Toyama estaba en la lista por la ruta alpina, ese motivo no existe en estas fechas. Este museo sí abre, pero solo no alcanza para justificar el desvío.","Cerrado el 16/12/2026 y el 6/1/2027 por la regla del 1º y 3er miércoles (en el rango también caen el 2/12/2026 y el 20/1/2027). La web oficial avisa además que puede cerrar sin aviso por cambio de montaje: mirar la página el día anterior.","Los 200 yenes son solo la colección permanente. Si hay muestra temporal en diciembre-enero se paga aparte; no hay nada anunciado todavía para esas fechas."],"refs":["https://toyama-glass-art-museum.jp/visitor/","https://toyama-glass-art-museum.jp/en/visitor/","https://toyama-glass-art-museum.jp/news/news-6811/","https://toyama-glass-art-museum.jp/exhibition/","https://toyama-glass-art-museum.jp/en/","https://www.japan-guide.com/e/e7503.html","https://www.alpen-route.com/en/"]},{"id":"u_g_342949114577380026","n":"Kurobe Gorge Trolley Train","cat":"mirador","hood":"Tateyama / Kurobe","why":"Está cerrado durante todo el viaje: el tren opera de fines de abril al 30 de noviembre y cierra de diciembre a mediados de abril por nieve, así que del 14/12 al 7/1 no hay servicio ninguno. Es un trencito abierto de vía angosta que sube 20 km por el desfiladero del río Kurobe desde Unazuki Onsen hasta Keyakidaira; su razón de ser es el follaje de otoño y el verde de verano, nada de eso existe en invierno. Encima la línea recién vuelve a operar completa (Unazuki–Keyakidaira) desde el 1 de octubre de 2026 tras dos años y medio de reparaciones por el terremoto de Noto, y la zona de Keyakidaira sigue con obras y acceso restringido. Descartar: no entra al viaje.","addr":"11 Kurobekyokokuguchi, Kurobe, Toyama 938-0283, Japón","lat":36.8150304,"lng":137.58601,"aprox":false,"gcid":"342949114577380026","cost":0,"dur":0,"sub":"Tateyama / Kurobe","typ":"Tren panorámico","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kurobe Gorge Trolley Train","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"Cerrado. Opera solo de fines de abril a fin de noviembre; en diciembre y enero no circula por nieve. · Año nuevo (29/12 al 3/1): Cerrado, como todo diciembre y enero: el cierre invernal cubre de diciembre a abril y la temporada recién arranca el 20 de abril.","conf":"alta","warn":["CERRADO EN LAS FECHAS DEL VIAJE: el Kurobe Gorge Railway opera del 20/4 al 30/11 y cierra de diciembre a mediados de abril. Descartar.","Aunque estuviera abierto, es un tren al aire libre de ~80 min por tramo (ida y vuelta con la parada, ~3h30-4h más traslados) y necesita luz de día: en diciembre el sol se pone alrededor de las 16:40.","Zona: está en la ciudad de Kurobe, prefectura de TOYAMA (no Ishikawa). Unos 40 km al este-noreste de la ciudad de Toyama y ~30 km en línea recta del área de Tateyama, con la que comparte rótulo pero no ubicación: son dos valles distintos.","La línea completa Unazuki-Keyakidaira recién se reabrió el 1/10/2026 tras el terremoto de Noto; en Keyakidaira siguen las obras y hay accesos restringidos. Si algún día se planifica el viaje en temporada, verificar estado antes.","Unazuki Onsen sí funciona en invierno (onsen y ryokan). Si igual se quiere ir a la zona, ese es el plan, no el tren. Ojo con los museos: la Selene Museum of Art y el Kurobe River Electric Memorial Hall cierran los MARTES de noviembre a marzo; el Memorial Hall abre 9:00-16:00 en invierno (del 1/12 al 19/4) y es gratis, y Selene cierra además del 29 al 31 de diciembre (confirmar el arranque de enero por teléfono: 0765-62-2000)."],"refs":["https://www.kurotetu.co.jp/en/timetable/","https://www.kurotetu.co.jp/en/","https://www.japan-guide.com/e/e7575.html","https://www.kurotetu.co.jp/timetable/","https://railf.jp/news/2026/07/04/233000.html"]},{"id":"u_g_14126350926868590622","n":"Daikanbo","cat":"mirador","hood":"Tateyama / Kurobe","why":"Está cerrado del 1 de diciembre de 2026 al 15 de abril de 2027: no hay forma de llegar durante el viaje. Daikanbo es una estación-mirador a 2.316 m en el medio de la Tateyama Kurobe Alpine Route, la travesía alpina que cruza los Alpes del Norte entre Toyama y Nagano; se llega solo encadenando funicular, bus de altura, bus eléctrico por túnel y teleférico, y la ruta entera —sus seis transportes— deja de operar por nieve al terminar noviembre. La estación cuelga sobre un acantilado, así que lo único que se puede pisar es la terraza del techo, con vista al lago Kurobe y a la cadena Ushiro-Tateyama; en temporada es una parada de 20-30 minutos entre transbordos, no un destino en sí. Si Toyama entra al viaje, hay que reemplazarlo por cosas de baja altura que sí abren en invierno (Shirakawa-go, Gokayama, Takaoka, la costa de Amaharashi).","addr":"Ashikuraji, Tateyama, Nakaniikawa District, Toyama 930-1406, Japón","lat":36.569503399999995,"lng":137.6317731,"aprox":false,"gcid":"14126350926868590622","cost":0,"dur":0,"sub":"Descartar: cerrado en las fechas del viaje","typ":"Observatorio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Daikanbo","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"No opera en diciembre ni en enero. La Alpine Route cierra por nieve de fin de noviembre a mediados de abril y no hay operación invernal parcial: paran el funicular de Tateyama, el bus de altura, el bus eléctrico del túnel (que reemplazó al trolebús en abril de 2025) y el teleférico. Sin excepciones ni tours alternativos hasta la estación. · Año nuevo (29/12 al 3/1): Cerrado. No es un cierre de Año Nuevo: es el cierre invernal de toda la ruta, vigente desde el 1/12 hasta abril. El 29/12–3/1 no cambia nada porque ya está fuera de servicio.","conf":"alta","warn":["CERRADO EN LAS FECHAS DEL VIAJE. La Tateyama Kurobe Alpine Route opera 15/4/2026-30/11/2026. El viaje es 14/12/2026-7/1/2027: la ruta lleva dos semanas cerrada cuando aterrizan y reabre recién a mediados de abril de 2027.","La zona rotulada 'Tateyama / Kurobe' es correcta en cuanto a prefectura (Toyama), pero engaña sobre la distancia: Daikanbo NO está en la ciudad de Toyama ni se llega en auto. La dirección (Ashikuraji, Tateyama) es la del municipio, a unos 25 km en línea recta al sudeste de Toyama ciudad (30-35 km por ruta); el punto en sí está a 2.316 m en el medio de la montaña, a ~2,5-3 h de transbordos encadenados desde la estación de Toyama, y solo en temporada.","No hay acceso por carretera a Daikanbo en ninguna época: el único camino es el propio sistema de transportes de la ruta. Cerrado el sistema, cerrado el lugar.","El muro de nieve (Yuki-no-Otani), que es lo que la mayoría busca de esta ruta, es de abril a junio. No existe en diciembre.","Si Toyama/Ishikawa se mantiene como candidata, no la sostengan con la Alpine Route. En invierno lo que funciona ahí es de baja altura: Shirakawa-go y Gokayama, Takaoka, la costa de Amaharashi, la ciudad de Kanazawa."],"refs":["https://www.alpen-route.com/en/transport/opening.html","https://www.alpen-route.com/en/tateyama-kurobe-alpine-route-will-open-on-april-15th-2026","https://www.alpen-route.com/area/daikanbo.php","https://www.alpen-route.com/facilities/station/station05.html","https://www.snowmonkeyresorts.com/news/the-tateyama-kurobe-alpine-route-in-january-what-to-know/"]},{"id":"u_g_9765461644217985484","n":"Bijodaira station","cat":"transporte","hood":"Tateyama / Kurobe","why":"Está cerrado en las fechas del viaje: el funicular Tateyama–Bijodaira no opera del 1 de diciembre al 31 de marzo, y toda la Ruta Alpina Tateyama-Kurobe tiene temporada 15 de abril – 30 de noviembre de 2026 (confirmado en la web oficial). Bijodaira es solo la estación intermedia a 977 m donde uno se baja del cable car y toma el bus de altura hacia Murodo; su atractivo son los senderos por el bosque primario de cedros milenarios, que en diciembre están bajo nieve y sin transporte que llegue. No hay forma de subir en las fechas del viaje salvo montañismo invernal con equipo. Fuera del catálogo: no es un lugar al que se pueda ir entre el 14/12 y el 7/1.","addr":"Ashikuraji, Tateyama, Nakaniikawa District, Toyama 930-1406, Japón","lat":36.5833009,"lng":137.45864219999999,"aprox":false,"gcid":"9765461644217985484","cost":0,"dur":0,"sub":"Estación de funicular de la Ruta Alpina Tateyama-Kurobe","typ":"Estación","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Bijodaira station","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"No opera en diciembre ni en enero. El viaje (14/12/2026 – 7/1/2027) cae entero dentro del cierre invernal. · Año nuevo (29/12 al 3/1): Cerrado, igual que todo diciembre a marzo. El shōgatsu no cambia nada: no es un cierre de fiestas sino estacional por nieve.","conf":"alta","warn":["CERRADO EN LAS FECHAS DEL VIAJE: el funicular Tateyama–Bijodaira no opera del 1/12 al 31/3, y la Ruta Alpina completa solo abre a mediados de abril (temporada 2026: 15/4 al 30/11; la de 2027 aún no está anunciada). Descartar.","Zona: está bien rotulado Tateyama/Kurobe, pero conviene tener claro que es prefectura de TOYAMA, en la montaña — no es un punto urbano. La estación base (Tateyama) queda cerca de una hora de tren desde la ciudad de Toyama, y Toyama está a ~2 h de Tokio en Hokuriku Shinkansen. Nada de esto sirve mientras la ruta esté cerrada.","Si Juan quiere Toyama/Ishikawa en el viaje, hay que armarlo con otra cosa (Kanazawa, Shirakawa-go, el casco de Takaoka): la Ruta Alpina no es una opción en invierno."],"refs":["https://www.alpen-route.com/en/","https://www.alpen-route.com/timetable/","https://ja.wikipedia.org/wiki/%E7%AB%8B%E5%B1%B1%E9%BB%92%E9%83%A8%E8%B2%AB%E5%85%89%E7%AB%8B%E5%B1%B1%E3%82%B1%E3%83%BC%E3%83%96%E3%83%AB%E3%82%AB%E3%83%BC"]},{"id":"u_g_17599931458310809924","n":"Murodo","cat":"parque","hood":"Tateyama / Kurobe","why":"Está cerrado los 25 días del viaje: Murodō es el punto más alto (2.450 m) de la Ruta Alpina Tateyama-Kurobe, y la ruta entera —funicular, buses eléctricos de túnel, teleférico y buses de altura— opera solo del 15 de abril al 30 de noviembre de 2026 y vuelve a abrir recién a mediados de abril de 2027. Del 1 de diciembre al 14 de abril no hay ningún medio de transporte que llegue: no es que esté \"difícil\", es que no existe forma de subir. Lo que la gente va a ver ahí es el Yuki-no-Ōtani, el corredor entre paredes de nieve de hasta 20 m, que se camina de mediados de abril a fines de junio; en diciembre esa misma nieve es la razón por la que está clausurado. Bórrenlo del catálogo: no hay versión de este viaje en la que entre.","addr":"Ashikuraji, Tateyama, Distrito de Nakaniikawa, Prefectura de Toyama 930-1406, Japón","lat":36.5788857,"lng":137.5995446,"aprox":false,"gcid":"17599931458310809924","cost":0,"dur":0,"sub":"Alta montaña","typ":"Meseta alpina","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Murodo","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"No opera en diciembre ni enero. Cierre invernal total de toda la ruta —funicular Tateyama-Bijodaira, bus de altura Bijodaira-Murodō, bus eléctrico del túnel de Tateyama, teleférico de Daikanbō y funicular de Kurobe— por nieve. Sin transporte público ni privado hasta abril. · Año nuevo (29/12 al 3/1): Cerrado, como todo diciembre y enero: el cierre es estacional por nieve, no por Año Nuevo. No hay hatsumōde ni actividad de ningún tipo.","conf":"alta","warn":["CERRADO EN LAS FECHAS DEL VIAJE: la Ruta Alpina Tateyama-Kurobe opera del 15/4 al 30/11/2026 y reabre recién a mediados de abril de 2027. Del 14/12/2026 al 7/1/2027 no hay acceso a Murodō por ningún medio.","Descartar del catálogo. No es un 'llegar temprano' ni un 'consultar el clima': el transporte no circula.","Zona: la etiqueta Tateyama/Kurobe es correcta — Prefectura de Toyama, municipio de Tateyama (Ashikuraji). No está mal asignado. Desde la estación Dentetsu-Toyama son unos 2,5 h y ~5.510 yenes de subida encadenando tren + funicular + bus... cuando la ruta funciona.","Si igual quieren Toyama/Ishikawa en diciembre, la montaña alta no es la opción: lo que sí funciona en invierno en esa zona es la costa, Takaoka, Shirakawa-gō y Gokayama. Eso hay que investigarlo aparte.","Si aparece una fecha de apertura de temporada en alguna web, chequeen que sea la de 2027 y no la de 2026 (15/4/2026): a esta altura del año todavía circula la vieja."],"refs":["https://www.alpen-route.com/en/","https://www.japan-guide.com/e/e7553.html","https://www.snowmonkeyresorts.com/news/the-tateyama-kurobe-alpine-route-in-december/"]},{"id":"u_g_8265136746631940375","n":"Tateyama Ropeway","cat":"transporte","hood":"Tateyama / Kurobe","why":"No opera en las fechas del viaje: el Tateyama Ropeway es un tramo de la Ruta Alpina Tateyama-Kurobe, que cierra entera del 1 de diciembre hasta mediados de abril por nieve — la temporada 2026 fue del 15/4 al 30/11/2026 y la siguiente arranca a mediados de abril de 2027 (fecha exacta todavía sin anunciar). Es un cablecarril de 1,7 km sin pilares (por las avalanchas) entre Daikanbo (2.316 m) y Kurobedaira (1.828 m), 488 m de desnivel, 7 minutos, 1.700 ¥ el tramo, y solo se llega en temporada encadenando funicular + bus de altura + bus de túnel desde la estación de Tateyama. Descartar sin más vueltas.","addr":"Ashikuraji, Tateyama, Nakaniikawa District, Toyama 930-1406, Japón","lat":36.569023,"lng":137.6360224,"aprox":false,"gcid":"8265136746631940375","cost":0,"dur":0,"sub":"Cablecarril de montaña (cerrado en invierno)","typ":"Teleférico","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: Google no devolvió el nombre. Es la localidad base de la ruta Tateyama; el pin podría apuntar al santuario Oyama Jinja o a la estación de cable.","src":"lista","gname":"Ashikuraji","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"No opera en diciembre ni enero. La ruta completa (funicular de Tateyama, bus de altura a Murodo, bus eléctrico del túnel de Tateyama, ropeway y cable de Kurobe) está cerrada del 1/12 hasta mediados de abril por nieve. · Año nuevo (29/12 al 3/1): Cerrado. El 29/12–3/1 cae de lleno dentro del cierre invernal de la Ruta Alpina; no opera ningún tramo.","conf":"alta","warn":["CERRADO EN LAS FECHAS DEL VIAJE (14/12/2026 – 7/1/2027). La Ruta Alpina Tateyama-Kurobe opera 15/4–30/11; la próxima apertura es abril de 2027.","La zona rotulada está bien: es prefectura de Toyama, municipio de Tateyama. La dirección (Ashikuraji) es la administrativa, no el lugar físico: el teleférico va de Kurobedaira (1.828 m) a Daikanbo (2.316 m), inaccesible salvo por la ruta misma.","Distancia real: la estación de Tateyama está a ~1 h en el Toyama Chiho Railway desde Dentetsu-Toyama (1.420 ¥). De Kioto u Osaka son 4+ h. No es un desvío desde ninguna otra ciudad candidata.","Si en el viaje aparece cualquier otro punto de la Ruta Alpina (Murodo, Kurobe Dam, Daikanbo, Bijodaira, Ogizawa), aplica el mismo cierre: descartarlos todos en bloque."],"refs":["https://www.alpen-route.com/en/","https://www.alpen-route.com/enjoy_navi/ropeway/","https://www.japan-guide.com/e/e7550.html","https://www.snowmonkeyresorts.com/news/the-tateyama-kurobe-alpine-route-in-december/"]},{"id":"u_g_13118643222678801555","n":"Kurehayama Park Observatory","cat":"mirador","hood":"Tateyama / Kurobe","why":"Mirador público arriba del cerro Kureha (unos 75 m), dentro de la ciudad de Toyama: se ve la cordillera Tateyama al este, la bahía de Toyama al norte y con suerte la península de Noto. Es gratis, abierto las 24 horas y todos los días del año (「終日開放」／「無休」 en la ficha oficial), así que como parada no cuesta nada más que llegar. El problema es diciembre-enero: la asociación de turismo de la prefectura dice textualmente que los días de cielo limpio en que el Tateyama se recorta nítido son pocos en todo el año (「立山連峰がくっきりと浮かび上がる光景に出会える日は、1年のうちでもわずかです」), y el invierno de Hokuriku suma nubes y nieve — se va si amaneció despejado, no se agenda a ciegas. La misma nota recomienda ir a primera hora, cuando el aire está más limpio y la montaña suele verse mejor. Además oscurece antes de las 17, o sea que la ventana con luz para ver la montaña es corta; de noche queda la vista de las luces de la ciudad, que es otra cosa y mucho menos interesante.","addr":"Anyobo, Toyama, 930-0881, Japón","lat":36.7090155,"lng":137.1854816,"aprox":false,"gcid":"13118643222678801555","cost":0,"dur":0.75,"sub":"-","typ":"Observatorio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kurehayama Park Observatory","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"Opera en diciembre y enero sin restricción. No es montaña ni ruta alpina: es un cerro urbano de unos 75 m, no cierra por nieve. La ficha oficial marca noviembre-junio como la mejor época justamente porque el Tateyama está nevado; el limitante no es el acceso sino el cielo. · Año nuevo (29/12 al 3/1): Abre igual: la fuente oficial de la Asociación de Turismo de Toyama lo declara sin días de cierre (「無休」) y sin horario (「終日開放」), y no es un edificio que se pueda cerrar. La guía oficial de la prefectura (info-toyama) lo lista entre los spots de amanecer de invierno sobre el Tateyama, así que es razonable esperar gente de madrugada en Año Nuevo, aunque ninguna fuente lo declara explícitamente como punto de hatsuhinode. Lo que no verifiqué es el horario del bus urbano en Año Nuevo, que en Japón suele correr con frecuencia reducida del 29/12 al 3/1.","conf":"alta","warn":["ZONA MAL ROTULADA: no está en Tateyama ni en Kurobe. La dirección oficial (富山市安養坊, Toyama-shi Anyobo) es ciudad de Toyama, prefectura de Toyama, a unos 3 km en línea recta al oeste de la estación de Toyama (unos 5 km por camino, 10 a 15 minutos en auto). El pueblo de Tateyama queda ~30 km al sureste y la ciudad de Kurobe ~40 km al este: agruparlo con esos destinos manda el itinerario para el lado equivocado. Es una parada de la ciudad de Toyama, no de la zona alpina.","Depende 100% del clima. Guía oficial de la prefectura: los días de aire limpio en que el Tateyama se ve nítido son pocos en el año, y la misma nota recomienda ir a primera hora de la mañana, cuando el aire está más limpio y la montaña suele verse mejor. El invierno de Hokuriku es nublado, con lluvia y nieve. Se decide la mañana misma mirando el cielo; con nubes no hay nada que ver y el viaje es al pedo.","Necesita luz de día para lo que importa. En Toyama a fin de diciembre ya es de noche cerca de las 17, así que la ventana útil es de mañana o primera tarde.","Sin auto es caro en tiempo: bus del Toyama Chihō desde la parada 7 de la salida sur de la estación hacia Shin-Sakuradani-chō, bajar en 'Toyama Shimin Minzoku Mingeimura' y 20 minutos de subida a pie — unos 45 min por tramo, en invierno con frío y posible nieve en el sendero. En auto son 10-15 min desde la estación y el estacionamiento es de 8 lugares.","Solo tiene sentido si Toyama ya está en el itinerario por otra razón. No justifica desviarse: es un mirador de 30-40 minutos, no un destino."],"refs":["https://www.toyamashi-kankoukyoukai.jp/en/spot/kurehayama-kouen-tenboudai/","https://www.toyamashi-kankoukyoukai.jp/spot/kurehayama-kouen-tenboudai/","https://www.info-toyama.com/attractions/11037","https://www.info-toyama.com/articles/mika-asahi","https://yakei.jp/japan/spot.php?i=kureha","https://tatekuro.jp/enjoy/pointDetail.php?id=172"]},{"id":"u_g_7879821155331153379","n":"Toyama","cat":"sinclasificar","hood":"Tateyama / Kurobe","why":"Las dos razones por las que Toyama aparece en cualquier lista están cerradas en las fechas del viaje: la Ruta Alpina Tateyama-Kurobe opera del 15/4 al 30/11 de 2026 y reabre recién a mediados de abril de 2027 (fecha exacta todavía sin anunciar), y el tren del desfiladero de Kurobe corre del 20/4 al 30/11 — los dos cierran por nieve diciembre, enero, febrero y marzo. Además esto no es un lugar sino una prefectura entera: la ciudad de Toyama está a 2h08 de Tokio en Kagayaki (unos ¥13.000 en reservado; ¥13.180 en temporada normal y ~¥13.580 en el pico del 25/12 al 6/1, que es cuando cae el viaje) y no se visita desde ninguna otra ciudad candidata en el día. Lo que queda en diciembre-enero es comida de invierno — kanburi de Himi, benizuwai y zuwai (el zuwai abre el 6/11) —, los onsen de Unazuki, el museo del vidrio de Kengo Kuma en la ciudad y la costa de Amaharashi con el Tateyama nevado sobre la bahía en días claros, que son pocos: la costa del Mar de Japón en invierno es gris, húmeda y con nieve constante. Descartarlo como base; si quieren Hokuriku, Kanazawa (Ishikawa) está a 20 minutos en shinkansen de Toyama y en invierno rinde más por día.","addr":"Prefectura de Toyama, Japón","lat":36.695822299999996,"lng":137.2137211,"aprox":false,"gcid":"7879821155331153379","cost":13180,"dur":8,"sub":"Prefectura entera, no un lugar visitable","typ":"Prefectura","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Es la prefectura entera, no un punto concreto; entra en barrio solo como «zona».","src":"lista","gname":"Toyama","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"Lo principal, cerrado. Ruta Alpina Tateyama-Kurobe: temporada 2026 del 15/4 al 30/11, sin servicio en diciembre ni enero (verificado en alpen-route.com, que solo publica la temporada 2026). La fecha de reapertura 2027 todavía no está anunciada; visit-toyama-japan.com describe el cierre habitual como «de diciembre a mediados de abril». Kurobe Gorge Railway (trolley Unazuki-Keyakidaira): del 20/4 al 30/11, sin servicio en invierno (verificado en kurotetu.co.jp; la web anuncia además que la línea completa hasta Keyakidaira vuelve a operar el 1/10/2026, y que desde esa fecha deja de poder subirse o bajarse en Nekomata). La ciudad de Toyama, Unazuki onsen, Gokayama y los museos sí funcionan. Nieve constante en el interior: manejar exige neumáticos de invierno.","conf":"media","warn":["ZONA: la etiqueta Tateyama / Kurobe es correcta dentro de la prefectura, pero esto no es un barrio de ninguna ciudad candidata. Es la prefectura de Toyama completa, ~250 km de Tokio (2h08 de shinkansen, ~¥13.000) y a unas 2h20-2h35 de Kioto (Thunderbird a Tsuruga + Hokuriku Shinkansen). No entra como excursión de un día desde Tokio, Kioto, Osaka ni Nara: o se duerme allá o no se va.","CERRADO EN LAS FECHAS: Ruta Alpina Tateyama-Kurobe sin servicio del 1/12 a mediados de abril. Verificado en la web oficial (temporada 2026: 15/4-30/11).","CERRADO EN LAS FECHAS: Kurobe Gorge Railway sin servicio en diciembre y enero. Verificado en el horario oficial (20/4-30/11).","Las iluminaciones invernales de Gokayama (Suganuma, Ainokura) caen FUERA del viaje: en las ediciones recientes fueron a fines de enero y en febrero, y las fechas 2027 todavía no están confirmadas. NO fetcheé fuente oficial de esto: verificar en la web de turismo de Nanto antes de armar nada alrededor.","Shiroebi (la gamba blanca de la bahía, el souvenir gastronómico de Toyama): la veda va del 1/12 al 31/3, así que en diciembre-enero solo hay congelado, no fresco del día. Dato de fuentes locales japonesas vía búsqueda, NO confirmado con fetch de fuente oficial pesquera.","El kanburi de Himi depende de una declaración anual del mercado de Himi (ひみ寒ぶり宣言) que solo se emite si la pesca alcanza el umbral, y puede no emitirse o emitirse tarde. La fecha de la temporada 2026-27 no está anunciada. No prometer buri antes de llegar: verificar en himi-banya.jp o en la web del mercado de Himi.","Luz: a fin de diciembre oscurece cerca de las 16:30 y en la costa del Mar de Japón el cielo está tapado casi todos los días. Amaharashi con el Tateyama nevado detrás es la mejor postal de la zona en invierno, pero es una lotería meteorológica.","Qué hace la prefectura del 29/12 al 3/1: no verificado. Si igual se decide ir en esas fechas, hay que chequear uno por uno museos, mercados y restaurantes."],"refs":["https://www.alpen-route.com/en/","https://www.kurotetu.co.jp/en/timetable/","https://www.kurotetu.co.jp/en/","https://visit-toyama-japan.com/en/travel-inspiration/seasons","https://www.japan-guide.com/e/e7501.html","https://ekitan.com/en/article/tokyo-to-toyama-shinkansen","https://www.snowmonkeyresorts.com/news/toyama-in-january/"]},{"id":"u_g_14328627673236365801","n":"Kimono Forest","cat":"arq","hood":"Kioto","why":"Son unos 600 postes de acrílico de ~2 m forrados con tela de kioyuzen, plantados como un bosquecito en el andén de la estación Arashiyama del Randen (tranvía Keifuku); diseño de Yasumichi Morita, de la remodelación de 2013. Es gratis, está fuera de cualquier entrada y se recorre en 15 minutos: no es un destino, es lo que ven al bajar o al subir al tranvía en Arashiyama. De noche los postes se encienden por dentro y ahí sí vale la foto — y en diciembre eso pesa más que en otras épocas, porque el Hanatōro (la iluminación invernal del bosque de bambú) terminó en 2021 y su reemplazo, el Tsukitōro, es en octubre: el Kimono Forest queda como casi lo único iluminado de Arashiyama a la noche. Como en Kioto el sol se pone 16:52 a fin de diciembre, alcanza con quedarse hasta que oscurezca después de Tenryū-ji en vez de programar una vuelta aparte.","addr":"20-2 Sagatenryuji Tsukurimichicho, Ukyo Ward, Kyoto, 616-8384, Japón","lat":35.0152682,"lng":135.6783695,"aprox":false,"gcid":"14328627673236365801","cost":0,"dur":0.3,"sub":"Instalación","typ":"Instalación","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: no se pudo determinar qué es.","src":"lista","gname":"Kimono Forest","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): El paseo en sí es andén al aire libre y sin molinetes, así que no tiene cierre; el Randen corre con horario de fin de semana del 27/12 al 4/1 y NO hace servicio nocturno el 31/12 (dato oficial de Kioto para 2025-26, el calendario 2026-27 no está publicado todavía). Los locales de la estación y el baño de pies, sin verificar para el 29/12–3/1: los negocios japoneses suelen cerrar esos días. Ojo con el entorno: Tenryū-ji está a ~230 m del andén y el acceso sur al camino de bambú (Nonomiya) a ~420 m, y en hatsumōde Arashiyama se llena.","conf":"media","warn":["No es una parada, es un pasillo de 15 m: solo funciona si entran o salen de Arashiyama por el Randen. Si llegan por JR Saga-Arashiyama o por Hankyu Arashiyama (son tres estaciones distintas y separadas), no lo van a cruzar.","La hora de apagado (21:00) sale únicamente de Jalan; el turismo de Kioto solo dice que se ilumina desde el atardecer, sin hora de fin. No se pudo leer el sitio del Randen: randen.keifuku.co.jp falla el HTTPS por cadena de certificados incompleta. Verificar en el lugar antes de volver de noche.","Google lo lista como 'Instalación'; el nombre oficial del predio es 嵐山駅 はんなり・ほっこりスクエア (Hannari-Hokkori Square), estación Arashiyama del Keifuku.","La categoría 'arq' es discutible: es más instalación lumínica dentro de una estación que arquitectura visitable.","De día es bastante menos que en las fotos: los postes solo brillan encendidos. Si van a Arashiyama de mañana, no gasten tiempo acá."],"refs":["https://www.kyoto-kankou.or.jp/info_search/8193","https://www.kyoto-kankou.or.jp/info_search/8194","https://www.jalan.net/kankou/spt_guide000000190827/","https://www.kanpai-japan.com/kyoto/kimono-forest-arashiyama-randen","https://en.japantravel.com/kyoto/the-kimono-forest-of-arashiyama/20545","https://ja.kyoto.travel/news/format.php?id=459","https://kyotokankoyagi.com/arashiyamatsukitoro-jp","https://api.sunrise-sunset.org/json?lat=35.0116&lng=135.7681&date=2026-12-25&formatted=0","https://www.kyotoarashiyama.jp/"]},{"id":"u_g_17011495368415127613","n":"Togetsukyō Bridge","cat":"arq","hood":"Kioto","why":"Puente de 155 m sobre el río Katsura, la postal de Arashiyama y el eje por donde se pasa sí o sí cuando se hace la zona (Tenryū-ji, el bambú, el monte Ogura enfrente). Es vía pública: gratis, sin horario y sin días de cierre —la ficha oficial de la Ciudad de Kioto no consigna ninguno de los tres—. En diciembre-enero no hay follaje ni iluminación —la que existió en diciembre (Arashiyama Hanatōro) no se hace más—, así que lo que se ve es montaña pelada y pino sobre el río, y solo con luz: a fin de diciembre en Kioto oscurece cerca de las 16:50 y el puente queda a oscuras. Son 15 minutos dentro de una mañana en Arashiyama, no un destino que justifique el viaje por sí solo.","addr":"1-5 Sagatenryuji Susukinobabacho, Ukyo Ward, Kyoto, 616-8384, Japón","lat":35.0128769,"lng":135.67777479999998,"aprox":false,"gcid":"17011495368415127613","cost":0,"dur":0.25,"sub":"puente","typ":"Puente","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Togetsukyō Bridge","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es estacional ni de montaña: opera todo el año, 24 h. Lo que cambia en diciembre-enero es que no queda follaje y que la ventana de luz útil termina cerca de las 16:50. · Año nuevo (29/12 al 3/1): El puente en sí no cierra: es calle pública y la ficha oficial no consigna días de cierre, así que del 29/12 al 3/1 se cruza igual. Lo de alrededor (Tenryū-ji, comercios de la calle Nagatsuji, restaurantes de la ribera) no lo verifiqué: hay que chequear cada uno aparte. Tampoco verifiqué el movimiento de hatsumōde en los santuarios de la zona; asumir que del 1 al 3 de enero Arashiyama no va a estar vacía.","conf":"alta","warn":["Ojo con el año: NO hay iluminación en las fechas del viaje. El Kyoto Arashiyama Hanatōro (diciembre) no se realiza más; el evento de iluminación vigente en la zona es el Arashiyama Tsukitōro, que en 2026 va del 30/9 al 8/11, 18:00-21:00. Y la iluminación del propio puente del proyecto Meets Arashiyama fue del 13 al 29 de marzo de 2026, 18:00-21:00. Del 14/12/2026 al 7/1/2027 no hay ninguna: el puente de noche está simplemente oscuro.","Necesita luz de día. En Kioto a fines de diciembre oscurece cerca de las 16:50; toda la vista de Arashiyama (río, monte, bambú) hay que hacerla de mañana o primera tarde.","Misma zona, ojo con las fechas: el tren panorámico Sagano Torokko opera su temporada 2026 hasta fin de año y después retira sus vagones actuales —los nuevos recién llegan en primavera de 2027 (aviso oficial del 20/1/2026)—. O sea que del 14 al 29/12 probablemente sí anda, y del 30/12 al 7/1 no (parada invernal habitual de fin de año). Confirmar el último día de operación en la web de Sagano Kanko Tetsudo antes de contar con él.","Zona correcta: está en Ukyo-ku, ciudad de Kioto, prefectura de Kioto. Unos 15-20 min en tren desde la estación de Kioto (línea JR Sagano hasta Saga-Arashiyama) más 11 min a pie. No es un lugar mal rotulado.","Es el cuello de botella turístico de Arashiyama. Con la vereda angosta y todo el flujo cruzando, en horario pico se camina de a poco: conviene llegar temprano."],"refs":["https://ja.kyoto.travel/tourism/single01.php?tourism_id=2682","https://kyoto.travel/en/destinations/togetsukyo-bridge/","https://www.japan.travel/en/spot/72/","https://ja.kyoto.travel/event/single.php?event_id=5579","https://www.timeout.com/osaka/news/kyoto-arashiyamas-togetsukyo-bridge-will-light-up-at-night-for-the-next-two-weeks-030926","https://www.sagano-kanko.co.jp/news/3756/"]},{"id":"u_g_18120885053331855507","n":"FUTO","cat":"comida","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒111-0051 de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_7646744610971579015","n":"Jardín Nacional Shinjuku Gyoen","cat":"parque","hood":"Shinjuku","why":"58,3 hectáreas de jardín cerrado y con entrada paga en el medio de Shinjuku, partido en tres: jardín francés formal con alameda de plátanos, jardín inglés de pradera abierta y jardín japonés con estanques, más un invernadero. Diciembre sigue siendo buen momento: el momiji acá llega tarde y arces y metasecuoyas alcanzan su punto en diciembre, así que del 14 al 20 todavía puede quedar color que en otros lados ya se perdió — no está garantizado y conviene mirar el parte de koyo esa semana. Necesita luz de día y encima cierra 16:30 en invierno (última entrada 16:00): es plan de mañana o de primera tarde, nunca de cierre de jornada. Dos horas alcanzan y no da para armar un día entero alrededor.","addr":"11 Naitomachi, Shinjuku City, Tokyo 160-0014, Japón","lat":35.685176299999995,"lng":139.71005169999998,"aprox":false,"gcid":"7646744610971579015","cost":500,"dur":2,"sub":"Jardín","typ":"Jardín","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Jardín Nacional Shinjuku Gyoen","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Cerrado del 29/12 al 3/1, confirmado en la web oficial. Además el 4/1/2027 cae lunes, su día de cierre habitual, así que lo más probable es que reabra recién el martes 5/1 — eso último es deducción de la regla oficial, no un anuncio publicado para 2027; rechequear en diciembre.","conf":"alta","warn":["Cierra los lunes Y del 29/12 al 3/1: en la ventana del viaje eso son el 14, 21 y 28 de diciembre y el 4 de enero, más el bloque de fin de año. Unos 10 días de los 25 el jardín está cerrado. Ojo que el 14/12, día de llegada, es lunes.","Cierra 16:30 en invierno con última entrada 16:00: si llegan 15:50 pagan 500 yenes por 40 minutos. No hay iluminación nocturna anunciada para este diciembre; rechequear antes de contar con una visita de noche.","Prohibido el alcohol, los juegos de pelota y las mascotas dentro del jardín (regla oficial). No es un parque de picnic con cerveza tipo Yoyogi.","Tres puertas separadas y no da lo mismo: Shinjuku y Ōkido a 5 min de Shinjuku-Gyoemmae (Marunouchi), Sendagaya a 5 min de la estación Sendagaya (JR Sobu). Entrar por la puerta equivocada son 20 minutos bordeando el muro.","Adentro hay cafés y casas de té (Yurinoki, Rakuutei, Shōtentei, SASAYAIORI+, National Parks Café) según la lista oficial de instalaciones, pero no encontré horarios ni precios publicados: no lo cuenten como comida planificada."],"refs":["https://policies.env.go.jp/national-garden/shinjukugyoen/english/guide/information/","https://policies.env.go.jp/national-garden/shinjukugyoen/english/guide/access/","https://policies.env.go.jp/national-garden/shinjukugyoen/english/guide/rule/","https://fng.or.jp/shinjuku/en/","https://fng.or.jp/shinjuku/guide/","https://fng.or.jp/shinjuku/place/","https://media.jreast.co.jp/articles/2131"]},{"id":"u_g_301452758040559499","n":"Sky Walk","cat":"mirador","hood":"Minato","why":"No es un observatorio: es la pasarela peatonal elevada del parque Odaiba Kaihin Kōen, una rampa con forma de ola (pendiente menor al 4%, accesible) que baja desde la zona Hilton/Aqua City hasta el deck mirador y la réplica de la Estatua de la Libertad de unos 11 m. Desde ahí se ven el Rainbow Bridge, la Torre de Tokio, el skyline de Shibaura-Shinagawa y los viejos fuertes de la bahía. Es gratis y calculen media hora larga contando el deck, no un plan de día: vale como remate del atardecer si ya están en Odaiba, no como motivo para cruzar Tokio. En diciembre oscurece 16:30, así que acá eso juega a favor —el puente se enciende unos 30 minutos después del atardecer y queda prendido hasta las 24:00, en la versión invernal de blanco cálido (nov-mar)—; a cambio, el viento de la bahía en diciembre pega fuerte y no hay dónde resguardarse en la pasarela.","addr":"1 Chome-4-1 Daiba, Minato City, Tokyo 135-0091, Japón","lat":35.6283909,"lng":139.7727356,"aprox":false,"gcid":"301452758040559499","cost":0,"dur":0.5,"sub":"Paseo costero","typ":"Paseo panorámico","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Parece la pasarela elevada del Odaiba Seaside Park, junto al observatorio y con vista a la bahía y al Rainbow Bridge; no está 100% confirmado que el pin sea ese y no una pasarela interna de Dec","src":"lista","gname":"Sky Walk","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abierto: es un parque marino público de acceso libre, sin horario ni día de cierre, así que del 29/12 al 3/1 se puede caminar igual. Lo que sí cierra o cambia horario alrededor son los shoppings (Aqua City, Decks) y los restaurantes: no cuenten con comer ahí esos días sin verificar cada local. Confianza media: lo deduzco del régimen de acceso libre, no de un aviso de fin de año publicado por el parque.","conf":"media","warn":["No es un mirador de altura ni un observatorio pago: es un deck a nivel de paseo costero. Si esperan algo tipo Shibuya Sky, este lugar no es eso.","Hay varios 'Sky Walk' en Japón (Mishima Skywalk, Yokohama Bay Bridge Skywalk, Ginza Sky Walk). El pin de esta ficha es el de Odaiba, en el parque Kaihin Kōen.","Ojo con confundirlo con el Rainbow Promenade, que es caminar el puente mismo: eso es otra cosa, con horario 10:00-18:00 de noviembre a marzo y cierre el tercer lunes de cada mes. En diciembre no se puede cruzar el puente de noche ni verlo iluminado desde arriba, y el posible cierre de fin de año no lo pude confirmar.","Es un complemento, no un destino. Solo tiene sentido encadenado a otra cosa en Odaiba en la misma salida.","Diciembre en la bahía: viento y sensación térmica baja, sin reparo en la pasarela.","El sitio oficial del parque (TPTC) no publica horario ni precio; el dato de acceso libre y gratuito sale de una ficha de terceros (Rurubu). En un parque público sin puertas es consistente, pero no es fuente oficial.","En diciembre suele haber fuegos artificiales los sábados sobre la bahía (Odaiba Rainbow Hanabi) e iluminación especial del puente esas noches, con este deck como uno de los puntos de visión. El calendario 2026 todavía no está publicado: hay que chequearlo cerca de la fecha."],"refs":["https://www.tptc.co.jp/park/01_02/point","https://www.tptc.co.jp/park/01_02","https://tokyo-trip.org/spot/visiting/tk0822/","https://rurubu.jp/andmore/spot/80011002","https://www.japan.travel/en/spot/371/","https://visit-minato-city.tokyo/en/articles/603","https://illumi.walkerplus.com/detail/ar0313e371386/","https://ja.wikipedia.org/wiki/%E3%83%AC%E3%82%A4%E3%83%B3%E3%83%9C%E3%83%BC%E3%83%97%E3%83%AD%E3%83%A0%E3%83%8A%E3%83%BC%E3%83%89","https://www.shutoko.jp/fun/lightup/rainbowbridge/lightup/"]},{"id":"u_g_8790616497012609209","n":"Odaiba","cat":"barrio","hood":"Tokio","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Tokio, Japón","lat":35.6205834,"lng":139.7805445,"aprox":false,"gcid":"8790616497012609209","cost":0,"dur":0,"sub":"-","typ":"Barrio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Odaiba","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_14473025377591378393","n":"Odaiba Seaside Park","cat":"parque","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒135-0091 Tokyo, Minato City, Daiba, 2 Chome−3−3 ゆりかもめお台場海浜公園駅 改札付近","lat":35.6299085,"lng":139.7788077,"aprox":false,"gcid":"14473025377591378393","cost":0,"dur":0,"sub":"-","typ":"Parque","book"
