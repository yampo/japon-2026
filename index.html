\"Zenagi\"","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Otras zonas","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_15974904196836280717","n":"KAMATA Hakensha - Japanese knife store","cat":"tienda","hood":"Tokio","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"","lat":35.7131359,"lng":139.7885437,"aprox":false,"gcid":"15974904196836280717","cost":0,"dur":0,"sub":"-","typ":"Cuchillos","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: Google no devolvió el nombre. Pin sin nombre ni dirección: no hay ningún dato para clasificar. Hace falta la coordenada o el contexto de quien lo guardó.","src":"lista","gname":"Sin nombre","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_11825067745107360701","n":"Fukui","cat":"barrio","hood":"Prefectura de Fukui","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Prefectura de Fukui, Japón","lat":36.0641386,"lng":136.21962299999998,"aprox":false,"gcid":"11825067745107360701","cost":0,"dur":0,"sub":"-","typ":"Prefectura","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: no encaja en ninguna categoría. Es una prefectura entera, no un barrio ni un punto; no hay categoría de región, entra forzado como zona","src":"lista","gname":"Fukui","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Otras zonas","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_13587463603788008684","n":"Tokito","cat":"comida","hood":"Osaka","why":"Izakaya moderna de 13 lugares (9 en barra, 4 de pie) en un pasaje del complejo Karahori Kawarayaen, un nagaya reciclado en el barrio de Karahori (Kawaraya-machi 1-2-11). Cocina sin género fijo —verdura y pescado de estación, pan casero, y platos que los reseñistas repiten como la hamburguesa simple, la ensalada de papa con keema picante y el cerdo asado con kimchi de la casa— con 3,50 en Tabelog sobre 97 reseñas, que para un local de barrio de este tamaño es un puntaje sólido. Es carta de picoteo, no menú cerrado: encaja exacto con la idea de ir compartiendo platos. Última orden de comida a las 23:00, así que también funciona como segunda cena después de un día largo.","addr":"Japón, 〒542-0066 Osaka, Chuo Ward, Kawarayamachi, 1 Chome−2−11 からほりかわらやえん101","lat":34.6731249,"lng":135.5137406,"aprox":false,"gcid":"13587463603788008684","cost":5000,"dur":2,"sub":"izakaya de platos para compartir","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Sin nombre. El pin es un local (101) en Karahori Kawaraya-en, complejo de casas viejas recicladas con cafés, tiendas y restaurantes: podría ser comida o tienda.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.5,"tip":"Para compartir: la hamburguesa simple (el plato que más se repite en las reseñas), la ensalada de papa con keema mapo, el cerdo asado con kimchi casero, la croqueta de cangrejo y los tacos con crema agria; de postre, el tiramisú de la casa. El pan es hecho ahí. RESERVAR la cena: son 13 lugares en total y la barra se llena. NO es solo efectivo: aceptan VISA, Mastercard, JCB, AMEX, Diners, dinero electrónico y PayPay. Tabelog declara un presupuesto de cena de ¥3.000-3.999 pero la franja según reseñas reales es ¥5.000-5.999 por persona. Aparte hay almuerzo 11:00-15:00, SOLO por orden de llegada y sin reservas (así lo declara la bio de Instagram; Tabelog directamente no lista turno de almuerzo, así que confirmalo por historias antes de ir al mediodía).","season":"Año nuevo (29/12 al 3/1): Tabelog declara cierre el 31/12 y el 1/1. Del 29 y 30 de diciembre y del 2 y 3 de enero no hay confirmación publicada: el local maneja cierres irregulares que anuncia únicamente por historias de Instagram (@tokito_karahori), así que esos cuatro días quedan sin verificar y hay que chequearlos sobre la fecha.","conf":"media","warn":["13 lugares en total (9 en barra + 4 de pie). Sin reserva de cena es probable quedarse afuera; se reserva por TableCheck (tablecheck.com/en/tokito-karahori), por DM de Instagram o al 080-9479-1034.","Cierra el 31/12 y el 1/1 según Tabelog. El resto del shogatsu (29, 30/12 y 2, 3/1) no está confirmado en ninguna fuente: sus cierres irregulares se avisan solo por historias de Instagram, que desaparecen a las 24 horas.","El turno de almuerzo (11:00-15:00) no toma reservas, es solo por orden de llegada. Ojo: solo lo declara la bio de Instagram — Tabelog no lista almuerzo para este local, así que conviene chequear las historias el mismo día.","La zona está bien asignada (Chuo-ku, Osaka), pero no es el centro turístico: Karahori/Matsuyamachi queda a 4-5 minutos a pie de la estación Matsuyamachi o Tanimachi 6-chome, y desde Namba son unos 10-15 minutos con un transbordo de metro. Es un desvío deliberado, no algo que quede de paso.","Es un pasaje interior: el local está adentro del complejo de nagaya reciclado Karahori Kawarayaen (unidad 101), no sobre la calle. De noche cuesta encontrarlo.","El puntaje 3,50 sobre 97 reseñas y el presupuesto salen de la ficha de ESTE local: と木と (To Ki To), Tabelog 27131920, Kawaraya-machi 1-2-11."],"refs":["https://tabelog.com/en/osaka/A2701/A270204/27131920/","https://www.instagram.com/tokito_karahori/","https://www.tablecheck.com/en/tokito-karahori","https://retty.me/area/PRE27/ARE96/SUB9601/100001728183/"]},{"id":"u_g_5906910810534897283","n":"grenier Kitahama branch","cat":"comida","hood":"Osaka","why":"Pastelería chica en Kitahama (Chuo-ku, Osaka centro) especializada en una millefeuille cuadrada portátil: hojaldre, crema pastelera casera y azúcar quemada a soplete. Es el 2号店 de grenier —la casa madre y primera tienda está en Umeda, en el Hankyu Grand Building—. Tabelog le da 3,39 sobre 5 con 75 reseñas: bien arriba de la vara de 3,0, aunque es un local de take-out, no una parada de media hora sentado. Sirve como merienda o café de media mañana si el día pasa por Kitahama/Nakanoshima, no como destino propio.","addr":"Japón, 〒541-0045 Osaka, Chuo Ward, Doshomachi, 1 Chome−3−8 カンプラビル 1F","lat":34.6883479,"lng":135.5089984,"aprox":false,"gcid":"5906910810534897283","cost":1000,"dur":0.4,"sub":"pastelería / merienda","typ":"Pastelería","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"grenier Kitahama branch","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.39,"tip":"La ミルフィーユ ブリュレ (millefeuille brûlée) a ¥1.000, que es lo que hace el local: hojaldre, crema y azúcar quemada a soplete. Hay versiones limitadas con fruta de estación que el dueño compra directo en el mercado (Rurubu: 季節限定のミルフィーユはオーナーが市場で直接仕入れたフルーツを使用). Otras opciones: croffle con helado ¥900 (precio de Rurubu, julio 2023 — el menú de Tabelog está vacío, verificar en el local); financiers ¥300 (nature) / ¥320 (chocolate) y lata de galletas ¥3.240 según la tienda online oficial. NO se reserva y no hace falta: es mostrador. NO es solo efectivo — Tabelog confirma tarjetas de crédito y pagos con QR (dinero electrónico tipo Suica/ICOCA no). Es para llevar: no hay salón, apenas un banco y sillas en la vereda. Para dos foodies que comparten, una millefeuille alcanza y sobra.","season":"Abierto todo el año, no depende de la estación. Lo que cambia es la fruta de la millefeuille limitada; en diciembre-enero lo esperable es frutilla (temporada japonesa), pero no encontré confirmación de la carta de invierno 2026-27.","conf":"alta","warn":["No hay salón: se come parado o en un banco en la vereda. En Osaka a fin de diciembre oscurece cerca de las 17:00 y hace frío — conviene meterlo a media mañana o de merienda temprana, no después de las 16:30.","Shōgatsu sin verificar. La web oficial dice 無休 (sin día de cierre) pero NO publica aviso de 年末年始, y a septiembre 2026 todavía no existe. Ojo: Rurubu, con el mismo 無休, aclara que puede haber cierre temporal en 年末年始 / Obon / Golden Week. Hay que chequear su Instagram (@patisserie_grenier) en diciembre antes de contarlo para el 29/12–3/1.","Precios (¥1.000 la millefeuille brûlée) salen de una nota de Rurubu de julio de 2023 y el menú de Tabelog está vacío. Tabelog muestra presupuesto declarado 〜¥999 y rango derivado de reseñas ¥1.000–1.999, así que el orden de magnitud se sostiene, pero el número exacto puede estar viejo.","La zona está bien asignada: Doshomachi 1-chome es Chuo-ku, Osaka ciudad, a 397 m de la estación Kitahama (metro Sakaisuji / Keihan). No hay confusión de prefectura.","Está a pasos de Nakanoshima y del Osaka City Central Public Hall: solo tiene sentido si el día ya pasa por ahí. No cruzar Osaka por una millefeuille de ¥1.000."],"refs":["https://tabelog.com/en/osaka/A2701/A270102/27132581/","https://tabelog.com/en/osaka/A2701/A270102/27132581/dtlmenu/","https://grenier.shopselect.net/","https://rurubu.jp/andmore/article/19742","https://rurubu.jp/andmore/spot/80133014"]},{"id":"u_g_15078777037245280881","n":"Matcha d’or 587","cat":"comida","hood":"Osaka","why":"Cafetería de dorayaki y matcha de seis asientos en Ura-Namba (Nipponbashi 2-6-9, Chuo-ku), abierta el 17/6/2025 — según la reseña de Tabelog el proyecto viene de una casa de dorayaki de Sakai. Todo es casero y la reseña destaca el método con que hacen el anko; también matcha y hojicha, matcha latte y cerveza artesanal. Abre 13:00-19:00: no sirve para desayuno ni para café de media mañana, es exclusivamente merienda. Tabelog le da 3,00 sobre 5, pero con solo 2 reseñas eso es el piso por defecto de la plataforma, no un puntaje real — no hay dato que lo respalde ni a favor ni en contra. Opcional: entra si ya están caminando Nipponbashi/Den Den Town o Ura-Namba, no justifica un desvío teniendo Osaka la densidad de wagashi que tiene.","addr":"2 Chome-6-9 Nipponbashi, Chuo Ward, Osaka, 542-0073, Japón","lat":34.6641148,"lng":135.5056567,"aprox":false,"gcid":"15078777037245280881","cost":1000,"dur":0.5,"sub":"Merienda / cafetería de dorayaki y matcha","typ":"Casa de té","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Sin nombre. Nipponbashi 2-chome, junto al mercado Kuromon: asumo comida por la zona, pero no identifiqué el local.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.0,"tip":"Dorayaki hecho a mano — todo es casero y la reseña de Tabelog destaca el método con que hacen el anko; los sabores concretos no están confirmados en ninguna fuente abierta. Para tomar: matcha y hojicha, matcha latte, y cerveza artesanal. Precio por persona alrededor de ¥1.000 (Tabelog: hasta ¥999; Yahoo Maps: ¥1.000 al mediodía, hasta ¥999 de noche). Son 6 asientos y no fumadores: si están ocupados hay que esperar o volver más tarde, y ninguna fuente aclara si toman reserva ni si hacen takeout. NO es solo efectivo — Yahoo Maps lista tarjeta de crédito, dinero electrónico y pago con QR.","season":"","conf":"media","warn":["Abre recién a las 13:00 y cierra 19:00: no cubre desayuno ni café de media mañana. Solo sirve como merienda.","El 3,00 de Tabelog es el puntaje base con 2 reseñas, no una calificación ganada. No lo trates como validación.","Seis asientos. Con dos personas es muy fácil que no haya lugar; tengan plan B a mano.","Día de cierre sin confirmar: fuentes secundarias dicen lunes + feriados irregulares, Tabelog no lista ninguno. Chequear Instagram @matchador587 antes de ir.","Shōgatsu sin verificar. Es un local chico abierto hace poco más de un año: alta probabilidad de que cierre parte del 29/12-3/1, pero no hay fuente. Verificar por Instagram en diciembre."],"refs":["https://tabelog.com/en/osaka/A2701/A270202/27150587/","https://tabelog.com/en/osaka/A2701/A270202/27150587/dtlrvwlst/","https://map.yahoo.co.jp/v3/place/-pwq5wAt6rU","https://matchaplaces.com/best-matcha/osaka"]},{"id":"u_g_11008093871873421586","n":"#kuromonmaru","cat":"comida","hood":"Osaka","why":"No es una marisquería: Google la clasificó mal. Es 黒門市場 MARU -まる-, un puesto de melón dentro del mercado Kuromon (Nipponbashi 2-11-8, Chuo-ku, Osaka) que vende medio melón con soft serve encima, jugos de fruta entera y raspados; Tabelog la cataloga literalmente como \"juice stand\" con 3.05 sobre 13 reseñas. Sirve como parada de 10 minutos mientras se recorre Kuromon, no como comida. En diciembre juega en contra: el melón japonés es fruta de verano —lo que haya será de invernadero, caro y desparejo, y una reseña ya apunta melones no del todo maduros— y comer helado parado en un mercado techado pero sin calefacción, con la temperatura de un mediodía de invierno en Osaka (alrededor de 10 grados y bastante menos a la mañana), es una decisión rara. Cierra 17:30 entre semana, así que solo entra en un plan de mañana o mediodía.","addr":"2 Chome-11-8 Nipponbashi, Chuo Ward, Osaka, 542-0073, Japón","lat":34.663817699999996,"lng":135.5068336,"aprox":false,"gcid":"11008093871873421586","cost":1000,"dur":0.3,"sub":"Puesto de melón y soft serve en el mercado Kuromon","typ":"Marisquería","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: La dirección cae dentro del mercado Kuromon; asumo puesto de mariscos (Kuromon Maru), pero el nombre viene como hashtag y no lo verifiqué.","src":"lista","gname":"#kuromonmaru","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.05,"tip":"La \"marumaru melon soft\": medio melón vaciado con soft serve encima (hay versión melón entero, un cuarto y porción chica). También jugo de fruta entera y kakigori de durazno. Tabelog marca presupuesto bajo ¥999, pero las reseñas mencionan tickets de ¥890 a ¥1.999 según el tamaño de melón — el melón entero es lo caro. Ninguna de las 13 reseñas menciona esperas, aunque eso no descarta cola en día pico. No se reserva. NO acepta tarjeta de crédito; sí acepta dinero electrónico (IC tipo ICOCA/Suica).","season":"El melón japonés es fruta de verano; en diciembre-enero lo que haya es de invernadero. El local opera todo el año, pero la calidad y el precio de la temporada de invierno son el punto flojo del producto.","conf":"alta","warn":["La categoría de Google es incorrecta: dice 'Marisquería' y es un puesto de fruta. Tabelog lo lista como juice stand (ジューススタンド). No lleven a nadie esperando sashimi.","La zona SÍ está bien: Nipponbashi 2-11-8, Chuo-ku, Osaka, dentro del mercado Kuromon, a ~340 m de la estación Kintetsu Nipponbashi. No hay confusión de prefectura.","No acepta tarjeta de crédito. Sí dinero electrónico (IC). Llevar efectivo o ICOCA cargada.","Cierra 17:30 de lunes a viernes (18:00 sáb-dom): en diciembre a esa hora en Osaka ya es de noche. Es parada de mañana o mediodía, nunca de noche.","不定休: cierra sin patrón fijo, puede estar bajado cualquier día sin aviso.","Shōgatsu no verificado para ESTE local. Contexto del mercado, con la salvedad del año: en la temporada 2025-26 Kuromon Sanpei (otro local del mismo mercado) anunció horario normal hasta el 28/12, horario extendido del 29 al 31/12 (29 y 30 de 8:00 a 18:00, 31 desde las 7:00) y CERRADO del 1 al 4 de enero. La edición 2026-27 todavía no está publicada. Asumir que Kuromon está casi todo cerrado del 1 al 3-4 de enero y reventado de gente del 29 al 31.","Del 29 al 31 de diciembre Kuromon es la compra de fin de año de Osaka y se llena. Si van esos días, ir temprano: la guía de trip.com recomienda recorrerlo entre las 9:00 y las 11:00, y varios locales del mercado abren a las 7:00-8:00 en esas fechas (MARU no: abre 10:00)."],"refs":["https://tabelog.com/en/osaka/A2701/A270202/27104379/","https://tabelog.com/en/osaka/A2701/A270202/27104379/dtlrvwlst/","https://jp.trip.com/blog/kuromon/","https://kuromon-sanpei.co.jp/2025/12/26/%E3%80%90%E9%BB%92%E9%96%80%E5%B8%82%E5%A0%B4%E5%BA%97%E3%80%91%E5%B9%B4%E6%9C%AB%E5%B9%B4%E5%A7%8B%E5%96%B6%E6%A5%AD%E6%97%A5/"]},{"id":"u_g_10140178314206753449","n":"Maguroya Kurogin Kuromon","cat":"comida","hood":"Osaka","why":"Puesto de atún dentro del mercado Kuromon, en Nipponbashi: solo maguro, cortado a la vista, con seis lugares de mostrador y el resto comiendo de parado. Tabelog le da 3,38 sobre 137 reseñas, que para un puesto de mercado es alto. Sirve exactamente para lo que ustedes quieren: parada corta de media mañana o almuerzo temprano compartiendo un par de bowls, no un plan de una hora. Ojo con las fechas: el eat-in corta cerca de las 15:00, cierra domingos, y entre el 1 y el 4 de enero el mercado Kuromon baja casi entero las persianas —ese fue el patrón 2025-2026, todavía sin confirmar para 2027—.","addr":"2 Chome-11-1 Nipponbashi, Chuo Ward, Osaka, 542-0073, Japón","lat":34.6645566,"lng":135.5069356,"aprox":false,"gcid":"10140178314206753449","cost":1500,"dur":0.5,"sub":"Marisquería / atún","typ":"Marisquería","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Maguroya Kurogin Kuromon","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.38,"tip":"Elegís el corte —akami, chutoro, otoro o el kama-toro (carrilada/collar del atún), que es lo que la casa destaca— y te lo preparan a la vista, en bowl, sushi o sashimi. El único precio con respaldo de fuente es el bowl de akami y toro a ¥1.300 (Tabelog); el presupuesto que reporta Tabelog es ¥1.000–1.999 por persona y HotPepper lo pone incluso por debajo de ¥999. Los precios exactos del resto de la carta no están publicados en ningún lado: se ven en el mostrador. NO toma reservas y se espera parado en el pasillo del mercado. El único ítem con reserva es el negima-nabe (olla de atún y verdeo), solo en la sucursal Kuromon y sin takeout. Hay takeout del resto. Sobre el pago hay contradicción entre fuentes (Tabelog dice que acepta AMEX, la ficha de GoodLuckTrip dice solo efectivo): llevá yenes. No hay menú en inglés ni con fotos.","season":"Año nuevo (29/12 al 3/1): Sin verificar para este local puntual — la web oficial y su Instagram no publican calendario de año nuevo. Lo verificado es el patrón del mercado Kuromon: en la edición 2025-2026, del 28 al 30 de diciembre operó a full, el 31 solo hasta el mediodía y del 1 al 4 de enero cerró casi todo, con reapertura normal el 5. El calendario 2026-2027 todavía no está publicado. Asumí que del 1 al 4 de enero de 2027 este puesto está cerrado y confirmá por Instagram (@maguroyakuroginkuromonhonten) unos días antes.","conf":"alta","warn":["La zona está BIEN asignada: 2-11-1 Nipponbashi, Chuo-ku, es el mercado Kuromon, en pleno centro de Osaka, a 3 minutos de la estación Kintetsu-Nipponbashi. No hay error de prefectura.","Cierra domingos según Tabelog, HotPepper y la ficha del mercado. Si el único día en Osaka cae domingo, este lugar no entra.","Es un local de la MAÑANA. El eat-in corta cerca de las 15:00 y cierra cuando se acaba el atún: no sirve como cena ni como merienda tardía.","Del 29 al 31 de diciembre el mercado Kuromon es el peor momento del año para caminarlo: son los días en que Osaka entera compra el pescado de año nuevo y el pasillo principal queda, textual de la fuente japonesa, 'como un tren en hora pico' entre las 10 y las 14. Si van esa semana, entrar a las 8-9 de la mañana.","Del 1 al 4 de enero, cerrado con alta probabilidad (patrón del mercado, no confirmado para 2027).","Existe una sucursal Kurogin en Tsukiji, Tokio, con su propia ficha de Tabelog. El 3,38 es el del local de Kuromon, no el de Tokio. No mezclarlos.","Contradicción entre fuentes sobre si acepta tarjeta. Llevar efectivo."],"refs":["https://tabelog.com/en/osaka/A2701/A270202/27025397/","https://kurogin.co.jp/en/kuromon/","https://kurogin.co.jp/kuromon/","https://www.gltjp.com/en/directory/item/14540/","https://www.hotpepper.jp/strJ000680809/","https://tabepark.com/kuromon/shop17/","https://kyomikyomi.com/kuromon_ichiba_nenmatunensi/"]},{"id":"u_g_9023255257523951743","n":"Kitan Hibiki","cat":"comida","hood":"Osaka","why":"Steakhouse de wagyu madurado en seco en Namba, abierto en junio de 2024: 27 asientos, todos en barra, con el chef cocinando enfrente. Tabelog 3,50 sobre 5, en categoría bife/hamburguesa. Tiene dos precios muy distintos según la hora: al mediodía funciona como hamburguesera de wagyu de 1.800 a 4.300 yenes, y a la noche es una cena de 15.000 a 20.000 yenes por cabeza según el gasto real que reporta Tabelog. Para dos que van compartiendo platos, lo que cierra es el mediodía. No necesita luz de día, así que el anochecer a las 16:30 no lo afecta.","addr":"1 Chome-1-7 Namba, Chuo Ward, Osaka, 542-0076, Japón","lat":34.6680359,"lng":135.502638,"aprox":false,"gcid":"9023255257523951743","cost":3000,"dur":1.5,"sub":"Bife y hamburguesa de wagyu madurado","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kitan Hibiki","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.5,"tip":"La hamburguesa de wagyu: Wagyu Cheese Burger 1.800 yenes (100 g) o 2.800 (200 g) con papas; Crispy Potato Wagyu Burger 1.900 / 2.900; y la fuerte, Dry Aged Wagyu Steak Burger 3.200 (100 g de wagyu + 70 g de carne madurada) o 4.300. Las hamburguesas son menú limitado: Tabelog las lista 11:00-15:00 (última orden 14:30) y 17:00-19:00, y el local abre recién a las 12:00, así que en la práctica la ventana de mediodía es 12:00-14:30. Alternativas de mediodía: bento de wagyu A5 3.500, lunch de ribeye madurado 300 g 7.000. De noche: lomo 150 g 13.200, chateaubriand 150 g 16.500, ojo de bife 300 g 12.000, más entradas tipo yukhoe 2.400 o sushi de wagyu 2.300. Conviene reservar: con 27 asientos de barra el walk-in es poco confiable. Acepta VISA, Master, JCB, AMEX y Diners; NO acepta dinero electrónico ni pago por QR (nada de PayPay ni Suica: tarjeta o efectivo).","season":"","conf":"alta","warn":["Reservar: 27 asientos, todos en barra, así que conviene sí o sí (ninguna fuente dice que sea obligatorio, pero el walk-in es poco confiable). Cancelar el mismo día se cobra al 100% y llegar más de 15 minutos tarde cuenta como cancelación (Tabelog).","Las hamburguesas de wagyu son menú limitado: Tabelog las lista 11:00-15:00 (última orden 14:30) y 17:00-19:00, y el local abre a las 12:00. Fuera de esa ventana el ticket salta a cena de bife: 15.000-20.000 yenes por persona de gasto real.","No acepta dinero electrónico ni pago por QR. Solo tarjeta de crédito (VISA, Master, JCB, AMEX, Diners) o efectivo.","Shōgatsu sin verificar: ninguna fuente publica horario del 29/12 al 3/1 y el local marca 'cierres irregulares'. Hay que llamar al 06-6226-7428 o confirmar por Tabelog antes de contar con él en esas fechas.","Zona correcta: Namba, Chuo-ku, ciudad de Osaka, prefectura de Osaka. La dirección de las fuentes coincide con la ficha de Google, a unos 5 minutos a pie de la estación Namba del metro."],"refs":["https://tabelog.com/en/osaka/A2701/A270202/27141837/","https://tabelog.com/en/osaka/A2701/A270202/27141837/dtlmenu/","https://tabelog.com/en/osaka/A2701/A270202/27141837/dtlmenu/lunch/","https://hitosara.com/0020008140/","https://jp.openrice.com/en/osaka-kobe/r-kitan-hibiki-namba-nipponbashi-dotonbori-yakiniku-r844875"]},{"id":"u_g_2908985192280873366","n":"Tosei Hotel Cocone Asakusa","cat":"alojamiento","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒111-0032 Tokyo, Taito City, Asakusa, 3 Chome−26−10 1F","lat":35.7166147,"lng":139.79829999999998,"aprox":false,"gcid":"2908985192280873366","cost":0,"dur":0,"sub":"-","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tosei Hotel Cocone Asakusa","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_4810270307101483137","n":"BON Tokyo Asakusa","cat":"alojamiento","hood":"Sumida","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-10-12 Azumabashi, Sumida City, Tokyo 130-0001, Japón","lat":35.7080743,"lng":139.7992667,"aprox":false,"gcid":"4810270307101483137","cost":0,"dur":0,"sub":"-","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"BON Tokyo Asakusa","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_779575391429231756","n":"Tosei Hotel Cocone Ueno Okachimachi","cat":"alojamiento","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"3 Chome-23-9 Ueno, Taito City, Tokyo 110-0005, Japón","lat":35.7065033,"lng":139.7731522,"aprox":false,"gcid":"779575391429231756","cost":0,"dur":0,"sub":"-","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tosei Hotel Cocone Ueno Okachimachi","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17958858454349277509","n":"Kayotei","cat":"alojamiento","hood":"Kaga","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-ホ２０ Yamanakaonsen Higashimachi, Kaga, Ishikawa 922-0114, Japón","lat":36.2503515,"lng":136.37648529999998,"aprox":false,"gcid":"17958858454349277509","cost":0,"dur":0,"sub":"-","typ":"Ryokan","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kayotei","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Otras zonas","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_1040930456608094136","n":"Apple 銀座","cat":"tienda","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒104-0061 Tokyo, Chuo City, Ginza, 3 Chome−5−12 サヱグサビル","lat":35.6723189,"lng":139.7657394,"aprox":false,"gcid":"1040930456608094136","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Ginza 3-5-12 es el edificio Sayegusa, sede histórica de Apple Ginza (reabierta tras remodelación). Si el pin es de otro inquilino del edificio, podría ser comida.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17179290743664196562","n":"La Collina Ōmi-Hachiman","cat":"comida","hood":"Omihachiman","why":"No es una pastelería: es el complejo insignia de Taneya / Club Harie —unos ocho locales, fábrica de baumkuchen a la vista, panadería, food court y jardines— en un edificio con techo de pasto de Terunobu Fujimori, entrada libre. Tabelog 3.71 con 3.080 reseñas y elegido en el Tabelog Sweets WEST 100 de 2026, así que como comida se sostiene; el problema es dónde está. Está en Shiga, no en Kioto: JR hasta Ōmihachiman (~35-40 min desde Kioto) más 10 min de bus, así que solo cierra si arman un día de Ōmihachiman completo (canales de Hachiman-bori, Himure Hachimangū, el ropeway) y no si van a cruzar media provincia por una torta. En diciembre además el argumento visual está en su punto más flojo: el techo de pasto está seco y marrón, los arrozales del predio son rastrojo y todo el atractivo del lugar es al aire libre —cierra 18:00 y el sol se pone cerca de las 16:50, así que hay que ir de mañana o temprano a la tarde.","addr":"615-1 Kitanoshocho, Omihachiman, Shiga 523-8533, Japón","lat":35.1488952,"lng":136.0913848,"aprox":false,"gcid":"17179290743664196562","cost":1500,"dur":2,"sub":"Pastelería","typ":"Pastelería","book":"","free":"","closed":"","main":true,"costN":"⚠ categoría por confirmar: Es la tienda insignia de Taneya (baumkuchen y dulces); podría ir a arq si lo guardaron por la arquitectura de Fujimori","src":"lista","gname":"La Collina Ōmi-Hachiman","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.71,"tip":"","season":"","conf":"media","warn":["Zona mal asignada: figura como 'Omihachiman / Kioto' pero está en la prefectura de Shiga. Son ~35-40 min de JR desde Kioto hasta Ōmihachiman más 10 min de bus Ōmi Railway (línea Chōmeiji) hasta la parada Kitanoshō La Collina. No es una parada dentro de Kioto: es un día aparte.","Es cadena. Taneya y Club Harie tienen locales en toda Kansai; en Kioto, Club Harie está en el subsuelo de Takashimaya, en Shijo-Kawaramachi, y en Osaka hay varios. Si lo único que quieren es probar el baumkuchen, lo consiguen sin viajar; lo exclusivo de acá es la versión recién horneada y el edificio.","La ficha de Google es del complejo entero, no de un restaurante. Adentro hay ~8 locales con horarios distintos (main shop, Baum Factory, Castella Shop, panadería, food court): el '9:00–18:00' no aplica a todos.","Cerrado el 1/1.","Lugar de exterior y de luz de día: techo de pasto, arrozales y jardines. En diciembre el pasto está seco y el sol se pone cerca de las 16:50. Y no hay iluminación invernal documentada, no cuenten con eso."],"refs":["https://tabelog.com/en/shiga/A2503/A250301/25007466/","https://taneya.jp/la_collina/","https://taneya.jp/la_collina/news/detail/638","https://www.omi8.com/spot/detail_1141.html","https://www.gltjp.com/en/directory/item/11711/","https://media.kepco.co.jp/town-and-life/17608624"]},{"id":"u_g_8511313074295460791","n":"Ōmihachiman","cat":"barrio","hood":"Prefectura de Shiga","why":"Ciudad chica de Shiga a orillas del lago Biwa: un canal cavado en 1585 (Hachiman-bori) con almacenes blancos, un casco de casas de mercaderes ōmi en zona de preservación, y un teleférico de pocos minutos al cerro Hachiman con vista al lago. No es Kioto en miniatura: se camina entero en tres o cuatro horas y no hay un templo grande que sostenga el viaje por sí solo. Para dos foodies el enganche real es gastronómico: La Collina, la sede-jardín de Taneya/Club Harie con arquitectura de Terunobu Fujimori, entrada gratis, baumkuchen y panadería, 9:00-18:00 con la zona de comidas 10:00-17:00; más la carne ōmi, una de las wagyu clásicas. En invierno el pueblo está vacío y el sol se pone cerca de las 16:50 (noche cerrada alrededor de las 17:20), así que hay que salir de Kioto temprano y hacer el paseo en barco antes de las 15:00 si quieren ver el canal con luz.","addr":"Prefectura de Shiga, Japón","lat":35.1283594,"lng":136.0979635,"aprox":false,"gcid":"8511313074295460791","cost":2950,"dur":5,"sub":"Ciudad histórica de mercaderes ōmi en Shiga, excursión de medio día desde Kioto","typ":"Ciudad","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Ōmihachiman","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Opera en diciembre-enero, pero recortado. El paseo largo por los juncales (水郷めぐり, 60-80 min, ¥2.200-2.400 según operador) es de temporada: los principales van de abril (uno desde mediados de marzo) al 30/11 y suspenden en invierno; solo Biwako Kanko figura como operación anual, y aun así su salida de las 15:30 no corre en invierno. El paseo corto por el canal (八幡堀めぐり, 30 min) sí funciona en invierno: Waden, a motor, ¥1.500, todo el año, 10:00-16:00. El bote a remo de Gallery Space Shinmachihama (¥1.300) es 完全予約制 —reserva obligatoria siempre—, cierra los miércoles y en año nuevo, y en enero-febrero solo opera viernes, sábado y domingo. No es un lugar alpino, no hay rutas de montaña que cierren por nieve. · Año nuevo (29/12 al 3/1): Mixto, y hay que planearlo. Los museos municipales cierran del 28/12 al 3/1 completo (verificado en la web del museo): ese bloque del pueblo no existe en esas fechas. El teleférico figura como 年中無休 en la web de Ohmi Tetsudo; en diciembre de 2025 anunció una 新春早朝営業 (apertura especial de madrugada de Año Nuevo) para el 1/1/2026, pero la edición 2027 no está anunciada — no la den por hecha. La Collina no publica días de cierre ni horario de año nuevo en su sitio, y su calendario de congestión de enero 2027 todavía no está cargado: hay que confirmar por teléfono (0748-33-6666); no la den ni por abierta ni por cerrada. El santuario Himure Hachimangū, al pie del cerro, concentra el hatsumōde de la zona: del 1 al 3 de enero es lo único que va a estar con gente, el resto del pueblo va a estar más muerto que de costumbre. Si el día cae entre el 28/12 y el 3/1, el saldo es malo: museos cerrados y buena parte del comercio también.","conf":"media","warn":["No es Kioto ni un barrio de Kioto: está en la prefectura de Shiga, a unos 40 km al noreste. La etiqueta de zona es aceptable como base de salida (JR Biwako Line, estación Ōmihachiman, entre 33 y 45 minutos desde la estación de Kioto según el tren), pero es un día aparte, no algo que se encaja en una tarde de Kioto.","El casco histórico y el canal están a unos 2 km de la estación: hay que tomar bus o bicicleta, caminando son 25-30 minutos.","La Collina no publica días de cierre en su web y el calendario de enero 2027 no está cargado: si el plan cae entre el 30/12 y el 3/1, confirmar por teléfono (0748-33-6666) antes de salir de Kioto. Los museos municipales sí cierran del 28/12 al 3/1, y además los lunes (si el lunes es feriado abren y cierran el martes).","La apertura a las 6:00 del teleférico para el primer amanecer está verificada para el 1/1/2026, no para el 1/1/2027: la edición nueva no está anunciada.","El paseo largo por los juncales (水郷めぐり) tiene suspensión invernal de diciembre a febrero. El corto del canal (30 min, ¥1.500) sí anda, pero en invierno varios operadores pasan a reserva previa o a fines de semana: confirmar por teléfono el día antes.","Luz: el sol se pone alrededor de las 16:50 y a las 17:20 ya es noche cerrada. El canal, que es lo que se viene a ver, no se ve. Salir de Kioto antes de las 9:00.","Con 25 días y Tokio, Kioto, Nara y Osaka en la lista, este es un candidato a descarte. Entra solo si quieren un día de pueblo tranquilo con foco en La Collina y carne ōmi, o si lo combinan con Hikone o Azuchi en el mismo eje ferroviario."],"refs":["https://www.ohmitetudo.co.jp/ropeway/open-price/","https://www.ohmitetudo.co.jp/ropeway/","https://www.omihachiman-shiryoukan-kawara.jp/omimuseum/","https://taneya.jp/la_collina/","http://www.omi8.com/spot/detail_1030.html","http://www.omi8.com/stories/suigo","https://www.suigou-meguri.net/"]},{"id":"u_g_18214617625610518175","n":"Shin-machi Dori","cat":"barrio","hood":"Prefectura de Shiga","why":"Calle de casas de comerciantes ōmi de fines de Edo y Meiji, con celosías, \"udatsu\" cortafuegos y pinos podados; en 1991 fue el primer distrito de Shiga declarado Área Importante de Conservación (13,1 ha que incluyen también el canal Hachimanbori, Nagahara-chō y el santuario Himure Hachimangū). Caminar la calle es gratis y son 30-40 minutos; las dos horas largas aparecen si se entra a las tres casas convertidas en museo —Kyū-Nishikawa es Bien Cultural Importante, 500 ¥ el combinado de 3 edificios— y se suman los almacenes que dan al canal. Con 25 días y cinco ciudades en juego, esto es una excursión de medio día desde Kioto, no un destino: 35 min de tren más 2 km desde la estación, y en el mismo pueblo hay canal, paseo en barco, teleférico al monte Hachiman y La Collina (Taneya/Club Harie), que es lo que realmente justifica el viaje si son foodies. En diciembre-enero el problema es la luz: la última entrada a los museos es 16:00 y el sol se pone entre las 16:47 (principios de diciembre) y las 17:10 (mediados de enero), así que hay que estar en el barrio a las 12:00-13:00 como muy tarde.","addr":"Ōmihachiman, Prefectura de Shiga, Japón","lat":35.1368632,"lng":136.090306,"aprox":false,"gcid":"18214617625610518175","cost":500,"dur":2.5,"sub":"Calle histórica de comerciantes ōmi (distrito preservado)","typ":"Calle histórica","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Shin-machi Dori","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es de montaña ni estacional: la calle opera todo el año. En diciembre-enero hace frío y puede nevar en el lado del lago Biwa, pero el barrio es plano y transitable. Lo que manda es la luz: el sol se pone entre las 16:47 (principios de diciembre) y las 17:10 (mediados de enero), y la última entrada a los museos es a las 16:00. · Año nuevo (29/12 al 3/1): La calle en sí es vía pública y se camina cualquier día. Los museos del barrio están cerrados del 28 de diciembre al 3 de enero (verificado en el sitio oficial del museo): si caen en esas fechas, queda solo el paseo exterior. La Collina (Taneya/Club Harie), en la temporada 2025-26 solo cerró el 1 de enero y reabrió el 2; la edición 2026-27 todavía no está anunciada.","conf":"alta","warn":["ZONA MAL ROTULADA: no es Kioto. Está en Ōmihachiman, prefectura de SHIGA, a unos 40 km de Kioto: 35 min en JR Special Rapid de la línea Biwako (680 ¥ por tramo, dos por hora). Cubierto por el JR Pass y por el Kansai Wide Area Pass.","Desde la estación JR Ōmihachiman al barrio hay 2 km: unos 5 min en bus de Ōmi Bus (línea a Chōmeiji, bajar en Obatachō Shiryōkan-mae o en Shinmachi; tarifa ~220 ¥, confirmar en la parada) o unos 25 min a pie. Los buses no son frecuentes: si no pasa uno, se camina.","Museos cerrados del 28/12 al 3/1 y todos los lunes. Si van entre esas fechas, el lugar se reduce a caminar la calle.","Necesita luz de día: la última entrada a los museos es 16:00 y el sol se pone entre las 16:47 y las 17:10 según la fecha. No sirve como plan de tarde.","Va en combo obligado con Hachimanbori (el canal, a 3 min a pie) y La Collina (a ~3,5 km: sin auto hay que volver a la estación JR y tomar bus, o taxi); suelto, la calle son 30-40 minutos y no justifica el viaje en tren."],"refs":["https://www.omi8.com/spot/detail_1177.html","https://www.omi8.com/stories/machinami","https://www.omihachiman-shiryoukan-kawara.jp/omimuseum/","https://global.biwako-visitors.jp/things-to-do/22006","https://www.japan-guide.com/e/e7075.html","https://taneya.jp/la_collina/news/detail/638"]},{"id":"u_g_1267198906255134921","n":"Chalet Mizugahama","cat":"comida","hood":"水ヶ浜１８２－８","why":"Café tipo cabaña de madera abierto desde 1981, en un alto sobre el lago Biwa, con terraza volada sobre el agua: toda su gracia es la vista y sentarse afuera. Tabelog 3,49 con 458 reseñas — bien puntuado, pero lo que se come (curry de carne, pilaf, sándwich caliente, tortas caseras) no justifica el viaje por sí solo. En diciembre-enero la terraza sobre el agua es un lugar helado y ventoso, y el local cierra 16:30, así que la única franja útil es mediodía-media tarde. Además NO está en Kioto: es Shiga, y desde la estación de Omihachiman hay 15 minutos más de taxi (o un bus de baja frecuencia a Chomeiji más caminata). Para dos foodies con 25 días es un descarte, salvo que ya haya un día armado en Omihachiman por el casco histórico.","addr":"Japón, 〒523-0808 Shiga, Omihachiman, Chomeijicho, 水ヶ浜１８２－８","lat":35.1682054,"lng":136.05964029999998,"aprox":false,"gcid":"1267198906255134921","cost":1500,"dur":1.5,"sub":"Café con terraza sobre el lago Biwa","typ":"Café","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: El pin no tiene nombre; la dirección (Mizugahama 182-8, Omihachiman) corresponde a Chalet Mizugahama, café con terraza sobre el lago Biwa","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.49,"tip":"Set de sándwich caliente con bebida ¥1.150; también curry de carne, pilaf, spaghetti de brotes silvestres, y tortas caseras (chiffon, cheesecake, pound cake). El café se hace con agua de napa. NO toma tarjeta de crédito: efectivo, dinero electrónico o QR. No se reserva, es por orden de llegada; los fines de semana buenos se llena y la terraza es lo que todos quieren.","season":"Abre todo el año, pero es un café de terraza al aire libre sobre el lago: en diciembre-enero, con viento del Biwa, el atractivo principal queda inutilizable buena parte del tiempo. Y cierra 16:30, con el sol poniéndose cerca de las 16:50 — hay que ir a mediodía o no ir. · Año nuevo (29/12 al 3/1): Mapple lo da cerrado del 29/12 al 3/1, pero esa misma ficha trae los días de cierre viejos (dice \"lunes\" cuando el sitio oficial dice martes a jueves), así que no la tomaría como palabra final. El local publica sus cambios de horario solo en Instagram. Tratar como probablemente cerrado en shōgatsu y confirmar por teléfono (0748-32-3959).","conf":"alta","warn":["ZONA MAL ROTULADA: no es Kioto. Está en la prefectura de SHIGA, ciudad de Omihachiman, a unos 40 km de la estación de Kioto (34 min en JR Biwako Line shinkaisoku, ¥680) y encima 15 min de taxi más desde la estación de Omihachiman.","Acceso real difícil sin auto: bus Omi Tetsudo línea Chomeiji desde la estación de Omihachiman, con muy pocas frecuencias. Las fuentes no coinciden en el último tramo: el turismo oficial de Shiga (Biwako Visitors) indica bajarse en la parada «Mizugahama», a 1 min a pie; Good Luck Trip dice bajarse en Chomeiji (~20 min de bus) y caminar ~20 min más. Confirmar la parada antes de salir. En taxi son ~15 min desde la estación. Ida y vuelta desde Kioto es medio día completo.","No acepta tarjeta de crédito: efectivo, dinero electrónico o QR.","No se reserva. Fila probable en fin de semana con buen clima.","Necesita luz de día: cierra 16:30 y a fines de diciembre el sol se pone cerca de las 16:50.","Cierra martes, miércoles y jueves: solo sirve viernes a lunes.","Shogatsu sin confirmar del todo: una fuente secundaria lo da cerrado del 29/12 al 3/1."],"refs":["https://tabelog.com/en/shiga/A2503/A250301/25000112/","https://mizugahama.com/","https://www.mapple.net/spot/25001362/","https://global.biwako-visitors.jp/things-to-do/22007","https://www.gltjp.com/en/directory/item/12149/","https://www.trip.com/transport/station/kyoto-station-to-%C5%8Dmihachiman-station.html"]},{"id":"u_g_10203167288420262745","n":"Mangetsu-ji Temple Uki-midō (Floating Hall)","cat":"arq","hood":"Otsu","why":"Es un pabellón budista de madera montado sobre pilotes adentro del lago Biwa, con mil estatuillas doradas de Amida en su interior; es la estampa de \"Katata no Rakugan\", una de las Ocho Vistas de Ōmi. La visita real son 30-45 minutos: se cruza la pasarela, se rodea el pabellón, se mira el lago y listo — el edificio actual es una reconstrucción de 1937 reparada en 1982, no una ruina antigua. El problema en diciembre es la luz: cierra 16:30 y el sol se pone cerca de las 16:50, así que la hora dorada que recomiendan todas las guías te agarra del lado de afuera del portón; hay que ir de mañana o a primera hora de la tarde. No justifica un viaje propio desde Kioto para dos foodies con 25 días, pero sí funciona como parada de 2-3 horas puerta a puerta si ya bajan al lado oeste del lago o combinan con Hiei/Sakamoto.","addr":"1 Chome-16-18 Honkatata, Otsu, Shiga 520-0242, Japón","lat":35.10988,"lng":135.9216095,"aprox":false,"gcid":"10203167288420262745","cost":300,"dur":1,"sub":"Pabellón de Mangetsu-ji montado sobre el lago Biwa, en Katata (Ōtsu, Shiga), a 23 min de Kioto en la línea JR Kosei","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Mangetsu-ji Temple Uki-midō (Floating Hall)","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Opera todo el año, no es de montaña ni estacional. Pero es un pabellón abierto sobre el agua: en diciembre-enero el viento del lago Biwa pega directo y no hay dónde resguardarse. Ojo aparte con la línea JR Kosei, que se corta por viento fuerte en invierno. · Año nuevo (29/12 al 3/1): sin verificar. Las fuentes de turismo lo dan como 年中無休 / \"open every day\", pero ninguna aclara qué pasa del 29/12 al 3/1 ni si hay algo por hatsumōde. Si el día cae en esa ventana, conviene llamar al 077-572-0455 antes de tomarse el tren.","conf":"alta","warn":["ZONA MAL ROTULADA: figura como 'Otsu / Kioto', pero Ōtsu es la capital de la prefectura de SHIGA, no de Kioto. Además está en Katata, el extremo NORTE de Ōtsu, no en el centro: 23,2 km y 23 minutos directos desde la estación de Kioto por la línea JR Kosei, 410 yenes (verificado en ekitan). Está más cerca de Kioto que de casi cualquier otra candidata del viaje, pero es otra prefectura.","LUZ: en diciembre cierra a las 16:30 y el atardecer es cerca de las 16:50. La recomendación estándar de 'ir al atardecer' no se puede cumplir en estas fechas. Es visita de día.","Desde la estación de Katata: ~20-25 min a pie (kanpai lo da como 15, las oficiales no publican el trayecto completo), o bus Kojak 5 min hasta 'Katata Demachi' + 5-7 min caminando. Sábados, domingos y feriados hay un bus que llega hasta el mismo Ukimido (parada Ukimido-mae).","La línea JR Kosei corre elevada bordeando el lago Biwa y JR West suspende el servicio por viento fuerte con frecuencia en invierno, sobre todo del lado norte (Wani hacia Ōmi-Imazu). Chequeá el estado de la línea antes de salir y no la dejes como último tren del día.","Costo real por persona: 300 de entrada + 820 de tren ida y vuelta desde Kioto."],"refs":["https://www.biwako-visitors.jp/spot/detail/91/","https://global.biwako-visitors.jp/things-to-do/21953","https://otsu.or.jp/cherry-blossoms_green-maple/temple/ukimido/","https://www.gltjp.com/en/directory/item/11903/","https://www.kanpai-japan.com/otsu/ukimido-mangetsuji","https://ekitan.com/transit/route/sf-5198/st-5073"]},{"id":"u_g_13671399909049183886","n":"Hakuryū-en Garden","cat":"parque","hood":"Kioto","why":"Está cerrado durante todo el viaje: el sitio oficial (aviso del 31/08/2026) anuncia que la apertura de otoño 2026 va del 10 de octubre al 6 de diciembre, y Juan y Thais llegan el 14 de diciembre. Después de esa fecha el jardín suspende la apertura al público hasta la primavera siguiente (solo sigue tomando alquileres privados y fotos de casamiento). Es un jardín privado de la empresa Aono, en la montaña de Ninose camino a Kurama, con reserva anticipada (web hasta las 17 hs del día anterior o postal de ida y vuelta; entrada del día solo si sobra cupo), cupo de 50 personas por turno y franjas de 10 a 14 hs — o sea que además es difícil de improvisar el día. No hay forma de entrar entre el 14/12/2026 y el 07/01/2027: sacalo de la lista.","addr":"106 Kuramaninosecho, Sakyo Ward, Kyoto, 601-1113, Japan","lat":35.096766099999996,"lng":135.76444039999998,"aprox":false,"gcid":"13671399909049183886","cost":1600,"dur":2,"sub":"-","typ":"Jardín","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Hakuryū-en Garden","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No opera en diciembre-enero para las fechas del viaje. Solo abre en dos ventanas al año: primavera y otoño; en 2026 la de otoño va del 10/10 al 6/12 (aviso oficial del 31/08/2026) y no hay anuncio publicado de fechas de primavera. Históricamente el cierre de otoño cae siempre en la primera decena de diciembre: 8/12 en 2024 (con una semana de extensión por el color de las hojas) y 10/12 en 2025. Ni con una extensión llegaría al 14/12. · Año nuevo (29/12 al 3/1): Cerrado. La apertura de otoño 2026 termina el 6 de diciembre y el jardín no vuelve a abrir al público hasta la primavera; entre el 29/12 y el 3/1 no hay ninguna visita posible. Verificado en el aviso oficial del 31/08/2026.","conf":"alta","warn":["CERRADO durante todo el viaje: la temporada 2026 termina el 6 de diciembre y llegan el 14. Descartar.","La zona está bien rotulada como Kioto (dirección oficial: Kyoto-shi, Sakyo-ku, Kurama Ninose-cho 106), pero NO es Kioto centro: está en la montaña del norte, camino a Kurama. Se llega en el tren Eizan hasta la estación Ninose y 7 minutos a pie, o en taxi ~15 min desde la estación de metro Kokusaikaikan (~2.000 ¥ por tramo, según la web oficial). Sumado al traslado desde el centro, es medio día.","Si en algún viaje futuro cae en temporada: reserva anticipada obligatoria, cupo de 50 por turno, pago solo en efectivo y cancelación con cargo (50% al reservar, 100% desde 48 hs antes)."],"refs":["https://hakuryuen.com/plan/event/post-394/","https://hakuryuen.com/","https://hakuryuen.com/plan/event/","https://hakuryuen.com/plan/event/post-2105/","https://hakuryuen.com/plan/event/post-2017/"]},{"id":"u_g_6287455153737173042","n":"CICON ROOFTOP BAR by NOHGA HOTEL","cat":"comida","hood":"Kioto","why":"Terraza en el 6º piso del NOHGA HOTEL, sobre Gojo, con vista abierta a Higashiyama, Kiyomizu-dera y el monte Hiei; abre 15:00-24:00 y tiene 3,44 en Tabelog con 96 reseñas. Es un trago con vista, no una comida: se come tapas, tacos y picoteo, y el peso está en los cócteles de autor y los vinos naturales. Para diciembre-enero el problema es doble: es al aire libre (cierran cuando llueve o el tiempo se pone feo) y abre recién a las 15:00, cuando ya queda menos de dos horas de luz — si la idea es la vista de Higashiyama de día, hay una ventana muy corta. Mitigan el frío con fogata, calefactores de aire caliente y mantas, así que de noche funciona igual, con la ciudad iluminada en vez del paisaje.","addr":"Japón, 〒605-0846 Kyoto, Higashiyama Ward, Gojobashihigashi, 4 Chome−450 1 NOHGAHOTEL 6F","lat":34.995199,"lng":135.7740835,"aprox":false,"gcid":"6287455153737173042","cost":4000,"dur":1.5,"sub":"rooftop bar / tapas y cócteles","typ":"Bar","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: El pin marca el 6F del NOHGA HOTEL KIYOMIZU (rooftop bar/restaurante); si en realidad guardaron el hotel para dormir, va a transporte","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.44,"tip":"Cócteles de autor y vinos naturales (japoneses e importados) con tapas y tacos para compartir; no es una cena. Tabelog marca presupuesto de cena ¥3.000-3.999 y almuerzo ¥2.000-2.999, y avisa que después de las 17:00 se suma 10% de cargo de servicio/mesa. Toma tarjeta y dinero electrónico — no es solo efectivo. Reservas: Tabelog declara que solo acepta reservas del mismo día por teléfono (075-323-7121), pero un blog de visita reporta haber reservado con anticipación y que la reserva trae límite de 1,5 h. Ante la duda, llamar. 40 lugares incluyendo barra de pie. A 7 minutos a pie de la estación Kiyomizu-Gojo (Keihan), salida 4.","season":"Opera en invierno: hay fogata, calefactores de aire caliente y mantas para las piernas. Lo que sí lo saca de agenda es la lluvia o el viento — es una terraza abierta y cancelan el mismo día.","conf":"alta","warn":["La zona está bien: es Higashiyama-ku, Kioto ciudad, cruce de Gojo con Higashioji, a 7 minutos a pie de Kiyomizu-Gojo y unos 10 en taxi desde la estación de Kioto. No hay error de prefectura.","Es una terraza abierta: cierra por lluvia o mal tiempo y el aviso sale el mismo día por Instagram. Nunca lo pongas como único plan de una noche.","Reservas con información contradictoria: Tabelog dice que solo se reserva el mismo día por teléfono, pero un blog de visita reservó con anticipación y otra fuente menciona reserva vía Tabelog. Conviene llamar al 075-323-7121. Con 40 lugares y fama entre extranjeros, un finde puede haber espera.","Después de las 17:00 se agrega 10% de cargo de servicio.","Abre a las 15:00 y en diciembre anochece temprano: para vista diurna de Higashiyama hay que ir apenas abre.","Funcionamiento del 29/12 al 3/1 SIN VERIFICAR. Es un bar de hotel, así que lo más probable es que abra, pero no encontré aviso de fin de año publicado. Chequear su Instagram o llamar al 075-323-7121 antes de contarlo en el itinerario.","En el mismo edificio hay dos opciones mejor puntuadas y más útiles para foodies: CICON BAKERY (Tabelog 3,51, 138 reseñas, 7:00/8:00-18:00, +50 panes, ¥1.000-1.999) para desayuno o merienda, y el restaurante CICON (Tabelog 3,57, 310 reseñas, italiano con horno Josper y verduras de Kioto, buffet de pan en el desayuno) para almuerzo o cena. Si el bar se cae por lluvia, el reemplazo está en la planta baja."],"refs":["https://tabelog.com/en/kyoto/A2601/A260301/26037085/","https://tabelog.com/en/kyoto/A2601/A260301/26037131/","https://tabelog.com/en/kyoto/A2601/A260301/26037084/","https://www.nohgahotel.com/kiyomizu/en/restaurant/","https://www.nohgahotel.com/kiyomizu/restaurant/","https://mothers-place.com/shop/cicon_rooftopbar/","https://yukonosuke.com/entry/kyoto_nohga_hotel"]},{"id":"u_g_1180424619502544092","n":"Pontocho Park","cat":"parque","hood":"Kioto","why":"Es una plazoleta de barrio de pocos metros metida en el callejón de Pontocho: unos juegos chicos y asientos —algunos bancos hechos con postes de luz que la ciudad retiró en la remodelación de 2021— en el punto donde la hilera de machiya se abre. El Kamo corre una cuadra al este: se siente el aire del río, no se lo ve. No es un destino: es el lugar donde parás cinco minutos si estás caminando Pontocho de todos modos. Como parada de un plan de comida tiene sentido (Pontocho es zona de cena, de izakaya barato a kaiseki caro, y este es el punto donde se puede esperar sentado sin consumir); como objetivo propio, no justifica ni una cuadra de desvío. En diciembre suma poco de día y de noche está oscuro y sin gracia: lo que se mira a esa hora son los faroles y las fachadas del callejón, no el parque.","addr":"","lat":35.006427699999996,"lng":135.7712162,"aprox":false,"gcid":"1180424619502544092","cost":0,"dur":0.2,"sub":"Kioto — Pontocho, Nakagyo-ku","typ":"Parque","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: Google no devolvió el nombre. Pin sin nombre y sin dirección; no hay ningún dato para clasificarlo, sólo que está en la zona de Kioto","src":"lista","gname":"Sin nombre","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Es un parque público de calle sin portón; las dos fuentes que leí lo dan abierto todo el año, así que no debería cerrar del 29/12 al 3/1. Lo que sí cambia en esas fechas es el entorno: buena parte de los restaurantes de Pontocho cierra o cambia horario por año nuevo, y eso hay que chequearlo local por local. El parque en sí, sin verificar por fuente municipal.","conf":"media","warn":["No es una atracción: es un parquecito de juegos de barrio. Sirve como parada de 5-10 minutos dentro de un paseo por Pontocho, no como punto de un itinerario.","La zona está bien asignada: las coordenadas de la ficha de Maps (35.0064, 135.7712) caen en Umenokicho, Nakagyo-ku, Kioto, dentro del callejón de Pontocho. No hay error de prefectura.","Horario y gratuidad salen de un sitio personal (pontochopark.org) y de Trip.com, no de una fuente municipal. Trip.com además sugiere 'visita de 2-3 horas', que para este lugar es un dato automático y absurdo.","Pontocho es barrio de geiko y maiko en actividad: no se les saca fotos sin permiso ni se las frena en la calle. La prohibición formal con multa aplica a los callejones privados de Gion, no acá, pero el criterio es el mismo.","En Kioto a fin de diciembre el sol se pone cerca de las 16:55 y a las 17:20 ya es noche cerrada. El parque no tiene iluminación propia; a esa hora el interés del callejón está en los restaurantes, no acá.","El nombre en inglés 'Pontocho Park' hace pensar en un parque urbano tipo destino. No lo es: en japonés es 先斗町公園, un 街区公園 (parque de manzana) de la ciudad."],"refs":["https://pontochopark.org/","https://www.trip.com/travel-guide/attraction/kyoto/pontocho-park-56066600/"]},{"id":"u_g_9906280376390768004","n":"Salón Bishamondo","cat":"arq","hood":"Kioto","why":"Templo Tendai en Yamashina, fundado en 703 y reconstruido en su sitio actual en 1665; es monzeki —uno de los cinco Tendai de Kioto— desde el ingreso del príncipe Kōben, hijo del emperador Go-Sai, y el Shinden, el Reiden y el Chokushi-mon son salas del Palacio Imperial trasladadas acá en 1693. Se lo conoce casi exclusivamente por dos cosas de otra estación: el shidare-zakura de abril y el túnel de arces sobre la cuesta del Chokushi-mon en noviembre, con la \"alfombra\" de hojas caídas. En diciembre y enero eso no existe: queda el interior, que es lo que realmente puede justificar la visita — los 116 fusuma de la escuela Kanō (rama Surugadai) en el Shinden, pintados en perspectiva invertida (una mesa que cambia de tamaño y orientación según desde dónde la mires) y el dragón del techo del Reiden, atribuido a Kanō Eishuku, que te sigue con la vista. Es un truco visual genuino, no un folleto, pero es media hora de contenido a 1.000 yenes por cabeza, más unos 20 minutos de subida a pie desde la estación de Yamashina, y adentro no se puede fotografiar. Si el viaje ya tiene templos de Kioto centro, este es descartable; entra solo si les interesa específicamente la pintura ilusionista o si están el 1-5 de enero y quieren un shōgatsu sin la multitud de Fushimi Inari — sabiendo que el 30 y el 31 de diciembre la recepción corta a las 12:00 y el interior no se visita.","addr":"18 Anshuinariyamacho, Yamashina Ward, Kyoto, 607-8003, Japón","lat":35.0013626,"lng":135.81925999999999,"aprox":false,"gcid":"9906280376390768004","cost":1000,"dur":1.5,"sub":"Templo Tendai (monzeki) con fusuma en perspectiva invertida","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Salón Bishamondo","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es de montaña ni estacional en el sentido de cierre: opera todo diciembre y enero con horario reducido. Lo estacional es el atractivo — el arce y el cerezo llorón, sus dos motivos de fama, no están en las fechas del viaje. · Año nuevo (29/12 al 3/1): Abierto y activo, PERO con un corte de fin de año que el templo publica todos los años: el 30 y el 31 de diciembre la recepción de visita y goshuin termina a las 12:00 y el recorrido se limita al recinto (Hondō, Benzaiten-dō, Kyōdō) — el interior del Shinden y el Reiden, único motivo de venir en invierno, NO se visita esos dos días (aviso oficial del 25/12/2025; el templo no publicó todavía el de este año, confirmar al 075-581-0328). El 31/12 tocan el campanario (joya no kane), sin horario publicado. Del 1 al 3 de enero se hace el shūshō-e con entrega de fukuzasa, y del 3 al 5 el Hatsutora-kai. No hay confirmación oficial de que el interior esté abierto durante el shōgatsu: preguntar antes de ir por los fusuma en esas fechas.","conf":"media","warn":["La zona está BIEN asignada: es Kioto ciudad, prefectura de Kioto. Pero Yamashina-ku queda del otro lado de la sierra de Higashiyama, no en el Kioto turístico: son 5 min de JR desde Kioto Station hasta Yamashina más unos 20 min de subida a pie. Puerta a puerta, 35-45 min desde el centro, y se combina mal con el resto: lo natural es encadenarlo con Daigo-ji, o con Zuishin-in/Kajū-ji del mismo barrio; a Nanzen-ji/Keage son pocas estaciones del subte Tōzai, pero es un desvío, no un camino.","El precio subió el 1 de marzo de 2026: de 700 a 1.000 yenes para adultos. Casi todas las guías y blogs siguen diciendo 700 u 800. Presupuestar 1.000.","En temporada de cerezo (fines de marzo–principios de abril) y de arce (mediados de noviembre–principios de diciembre) la entrada se cobra partida —300 yenes de jardín delantero en las puertas Niō-mon/Yakui-mon/estacionamiento + 700 de edificios—, pero el total es 1.000 igual. Fuera de esas fechas, incluidas las del viaje, se paga una entrada única de 1.000.","El corte de recepción es a las 15:30, no a las 16:00. Con oscurecer a las 16:30 en Kioto, esto es visita de mañana o primera tarde; llegar 15:20 es llegar tarde.","El Chokushi-zaka (la cuesta de los arces, la subida clásica) está CERRADO por caída de árboles desde agosto de 2026, sin fecha de reapertura, y prohibido caminarlo con poca luz. Se sube por la escalera del Niō-mon o por la pendiente de la calle. Verificar el aviso antes de ir: bishamon.or.jp/news/","Hatsutora-kai del 3 al 5 de enero: goma (護摩祈願) a las 11:00 y 14:00 los días 3 y 5; el 4 (día del tigre) hay sandan-shuhōku a las 11:00 y goma a las 14:00. La propia página advierte que puede haber cambios de último momento (急遽変更) — confirmar al 075-581-0328. Es cuando el templo se llena de gente local: si buscan tranquilidad, ir otro día; si buscan ver un rito de año nuevo sin turismo internacional, ese es el momento.","Adentro no se puede fotografiar ni filmar (solo en el jardín y el recinto); tampoco trípode ni palo de selfie. Lo de los fusuma se mira, no se lleva.","El interior (Shinden con los fusuma) es el único motivo real de venir en invierno. Verificar al llegar que el Shinden esté abierto: el propio aviso de suba de precios menciona obras de reparación en curso en el templo."],"refs":["https://www.bishamon.or.jp/visiting_and_transportation_information/","https://www.bishamon.or.jp/english/","https://www.bishamon.or.jp/annual_and_monthly_events/","https://www.bishamon.or.jp/news/general/6939/","https://www.bishamon.or.jp/news/update/6838/","https://www.bishamon.or.jp/news/update/7128/","https://www.bishamon.or.jp/about_bishamondo/","https://www.bishamon.or.jp/","https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=2476"]},{"id":"u_g_1954626161474132133","n":"Tsuke-men Yumenchu","cat":"comida","hood":"Kioto","why":"Tsukemen (fideos gruesos que se mojan en un caldo espeso aparte) en Yamashina, un barrio residencial al este de Kioto: 13 asientos, sin reserva, solo efectivo. Es la reencarnación de Menya Yumenchu, que había cerrado tres años por una lesión del dueño y reabrió acá en octubre de 2018. Tabelog le da 3,46 con 167 reseñas — bueno de verdad para el barrio, pero no lo suficiente como para justificar el viaje: está a 5-6 km del centro de Kioto, a 9-12 minutos a pie de la estación de Yamashina (673 m desde Keihan, ~900 m desde JR/subte), y el entorno inmediato es residencial — lo poco turístico de Yamashina (Bishamon-dō, Zuishin-in, el paseo del canal del lago Biwa) queda 15-25 min a pie en otra dirección. Solo entra si duermen cerca o si el día los cruza por Yamashina (JR Biwako/Tokaido, 5 min desde Kioto-eki; o subte Tozai si vienen del centro — la Tozai NO para en Kioto-eki; o de paso hacia Otsu / lago Biwa); si no, hay tsukemen y ramen mejor ubicados. Cierra los miércoles y el almuerzo termina 14:30, así que no es un plan flexible.","addr":"38-14 Misasaginakauchicho, Yamashina Ward, Kyoto, 607-8414, Japan","lat":34.9899367,"lng":135.80975619999998,"aprox":false,"gcid":"1954626161474132133","cost":1200,"dur":1,"sub":"Ramen / tsukemen","typ":"Ramen","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tsuke-men Yumenchu","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.46,"tip":"Tsukemen de tonkotsu-gyokai (cerdo + pescado), caldo espeso y muy sazonado, fideos caseros firmes y densos; vienen de serie chashu cortado fino a baja temperatura y medio huevo marinado. Casi lo único que hacen es tsukemen. Hay una guarnición de \"butter gohan\" (arroz con manteca y cerdo tostado). Tienen microondas en el salón para recalentar el caldo cuando se enfría — es lo normal en el género. SOLO EFECTIVO: no toman tarjeta, ni dinero electrónico, ni QR. NO se reserva. 13 asientos (7 en barra), así que es esperable hacer cola en horario pico. El precio base publicado en un blog de 2018 era ¥800; hoy Tabelog muestra dos cifras — el presupuesto declarado por el local es 〜¥999 y la banda calculada por reseñas es ¥1.000-1.999 — así que no tomes el ¥800 como vigente y contá ~¥1.000-1.300 con guarnición.","season":"","conf":"alta","warn":["Solo efectivo — no aceptan tarjeta, IC ni QR (verificado en Tabelog).","Sin reservas y 13 asientos: si llegan 13:00-14:00 esperan parados en la calle, y en diciembre hace frío.","Cierra los miércoles y el servicio de almuerzo termina 14:30; el domingo NO abre de noche.","La zona está bien rotulada (Yamashina SÍ es barrio de la ciudad de Kioto, prefectura de Kioto), pero engaña: está 5-6 km al este del centro, del otro lado de las colinas, a 9-12 min a pie de la estación (673 m desde Keihan Yamashina, ~900 m desde JR/subte Yamashina). Desde Kioto-eki se llega en JR Biwako/Tokaido en ~5 min; el subte Tozai sirve Yamashina pero NO pasa por Kioto-eki. No es caminable desde ningún punto turístico — es una salida dedicada de ida y vuelta.","Shogatsu SIN VERIFICAR: no encontré ninguna comunicación del local sobre el 29/12-3/1. Los ramen-ya chicos de barrio suelen cerrar varios días esas fechas. Hay que confirmarlo por teléfono (+81 80 3115 7222) o en el lugar antes de armar el día alrededor de esto.","Ojo con el homónimo: en Tabelog también figura 'Menya Yumenchu' (3,54) marcada como MUDADA — es el local anterior del mismo dueño, ya no existe. El puntaje que vale es el 3,46 de esta ficha."],"refs":["https://tabelog.com/en/kyoto/A2601/A260603/26031323/","https://tabelog.com/en/kyoto/A2601/A260603/26019806/","https://kyotoramen.themedia.jp/posts/5249232/"]},{"id":"u_g_18248322172010721040","n":"LATURE","cat":"comida","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps
