","cost":2000,"dur":1,"sub":"Atún / donburi","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Maguro Koya","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":3.07,"tip":"Donburi de atún: akami ¥1.300 el más barato, chūtoro ¥1.800, ōtoro ¥2.900, y un bol cargado de uni a ¥6.500 como tope; las versiones \"doble\" son de negitoro y chūtoro. Set de chūtoro teriyaki ¥1.800 (¥1.600 solo el plato). También karaage de atún y brochetas negima, que es lo que mejor acompaña con una cerveza o sake al final del día — pero ojo que cierra 19:00-20:00, no es izakaya de noche. Cierra antes si se acaba el atún, así que conviene ir a la apertura o cerca del mediodía. NO toma reservas (Tabelog lo marca explícito): es llegar y esperar. Acepta tarjeta, dinero electrónico y pago por QR — no es solo efectivo. Pedido por tablet con idiomas, no hace falta japonés.","season":"","conf":"media","warn":["La zona está BIEN: Higashimuki Kitamachi 21-1 es Nara ciudad, 182 m de la estación Kintetsu Nara. No hay que corregir prefectura.","Hay DOS fichas en Tabelog. La vieja (tabelog.com/en/nara/A2901/A290101/29000802/, dirección Hanashiba-cho 6) marca 3,31 pero está rotulada [Relocated] y es de antes de la mudanza y del cambio de dueño. La del local actual es 29014054 y da 3,07. No usar el 3,31.","Horarios en conflicto entre Tabelog (11:00-20:00, domingo cerrado) y el sitio oficial (11:00-19:00, sin día fijo). Verificar en el Instagram @magurokoya antes de ir.","Cierra cuando se acaba el atún: llegar tarde a la tarde es apostar.","Shōgatsu sin verificar. Ni el sitio oficial ni Tabelog publican el calendario del 29/12 al 3/1, y es un negocio familiar chico en galería comercial: la probabilidad de que cierre varios días es alta. Si Nara cae en esas fechas, chequear Instagram unos días antes.","No acepta reservas."],"refs":["https://tabelog.com/en/nara/A2901/A290101/29014054/","https://tabelog.com/en/nara/A2901/A290101/29000802/","https://magurokoyanara.com/","https://www.naralunch.com/fish/magurokoya.html","https://nara.goguynet.jp/2023/12/28/magurokoya/"]},{"id":"u_g_17911005107283377295","n":"Tōdai-ji","cat":"arq","hood":"Nara","why":"El Gran Buda de bronce de casi 15 m dentro del Daibutsuden, que el propio templo presenta como la mayor construcción de madera del mundo; es la razón por la que Nara entra a un viaje, no un templo más de la lista. Se recorre en 1,5-2 h con el Nandaimon, el Daibutsuden y la subida a Nigatsudō, todo dentro del parque de los ciervos. En invierno cierra a las 17:00 y el sol se pone alrededor de las 16:50, así que la última hora ya entra con poca luz: conviene llegar a la mañana o primera tarde, porque el interior es oscuro y sin luz natural el Buda se ve mucho peor. Abre durante todo el shōgatsu y tiene evento propio, pero el 1 de enero está desbordado.","addr":"406-1 Zoshicho, Nara, 630-8587, Japón","lat":34.6889851,"lng":135.8398158,"aprox":false,"gcid":"17911005107283377295","cost":800,"dur":2,"sub":"Templo budista · Patrimonio de la Humanidad","typ":"Templo","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Tōdai-ji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abierto y con evento propio, verificado en la página oficial de eventos anuales. 31/12 desde las 22:30 reparten números para tocar la campana (Joya no Kane, 108 toques desde las 0:00; unas 800 personas). El 1/1 de 0:00 a 8:00 se entra gratis por el Chūmon y se abre el 観相窓 (kansōmado), la ventana alta del Daibutsuden, para ver la cara del Buda iluminada desde afuera — pasa dos veces al año. Después de las 8:00 vuelve la entrada paga. El 7/1 a las 13:00 hay Shushō-e en el Daibutsuden. No verifiqué si el horario del 1/1 después de las 8:00 difiere del normal.","conf":"alta","warn":["Necesita luz de día: en invierno cierra 17:00 y el sol se pone ~16:50. Reservarle la mañana o el mediodía, no el final del día.","Shōgatsu: el 1/1 entre 0:00 y 8:00 la entrada es gratis y se abre el kansōmado, pero es el pico de hatsumōde en Nara — masivo, de noche y con frío. Si el objetivo es VER el templo, ir otro día.","Entrada al Daibutsuden ¥800 por persona (combinado Daibutsuden + museo ¥1.200). Hokkedō y Kaidandō se pagan aparte, ¥800 cada uno.","Hokkedō y Kaidandō cierran a las 16:00 todo el año, una hora antes que el Daibutsuden en invierno: si se quieren hacer, van primero.","El Kaidan-in Kaidandō estuvo años cerrado por restauración (se abría el Senjudō en su lugar) y las páginas oficiales EN y JP todavía no coinciden sobre cuál se visita hoy: confirmar en el sitio antes de pagar la entrada aparte.","Zona correcta: está en la ciudad de Nara, prefectura de Nara, a unos 20 min a pie de Kintetsu-Nara hasta el Nandaimon y 25 hasta el Daibutsuden. No hay error de rótulo.","Está dentro del parque de los ciervos: hay ciervos sueltos en todo el camino y en la explanada del Nandaimon."],"refs":["https://www.todaiji.or.jp/en/information/haikan/","https://www.todaiji.or.jp/information/haikan/","https://www.todaiji.or.jp/en/annual/event/","https://www.todaiji.or.jp/en/","https://naratrip.com/muryousanpai"]},{"id":"u_g_11086666170716574696","n":"Wakakusayama Rest Area","cat":"sinclasificar","hood":"Nara","why":"El monte Wakakusa está cerrado exactamente durante todo el viaje: la temporada oficial va del tercer sábado de marzo al segundo domingo de diciembre, y el cierre invernal arranca el lunes siguiente a ese domingo — o sea el 14 de diciembre de 2026, el día que llegan — hasta el viernes previo al tercer sábado de marzo (reabre el 20/3/2027). El \"Rest Area\" en sí no es un destino: la prefectura lo lista como 若草山休憩所, un refugio de descanso del parque de Nara asociado al monte, sin descripción, sin horario publicado y sin aclarar si tiene baños; los baños del monte figuran como entradas aparte en esa misma lista (falda norte, falda sur y cima). Con el monte cerrado no hay nada que hacer ahí salvo, en el mejor de los casos, pasar caminando entre Todai-ji y Kasuga Taisha. Descartalo como parada; lo del monte igual no era opción en estas fechas.","addr":"Kasuganocho, Nara, 630-8212, Japón","lat":34.6847212,"lng":135.8473412,"aprox":false,"gcid":"11086666170716574696","cost":0,"dur":0.25,"sub":"Refugio de descanso del parque de Nara asociado al monte Wakakusa","typ":"Área de descanso","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Área de descanso al pie de Wakakusayama (bancos, baños, kioscos). No sé si el punto guardado es la vista, un local de comida o solo un servicio del parque.","src":"lista","gname":"Wakakusayama Rest Area","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":0,"tip":"","season":"No opera en diciembre-enero. El sendero y el ingreso al monte cierran el 14/12/2026 y reabren recién el 3er sábado de marzo de 2027. Los 25 días del viaje caen íntegros adentro del cierre. · Año nuevo (29/12 al 3/1): sin verificar (no hay página con calendario de fin de año para esta instalación; el monte ya está cerrado por invierno todo ese período de cualquier modo)","conf":"media","warn":["CERRADO TODO EL VIAJE: el monte Wakakusa cierra el lunes posterior al 2º domingo de diciembre — en 2026 eso es el 14/12, el día de llegada — y reabre el 3er sábado de marzo de 2027.","El Yamayaki (quema del monte) 2027 es el sábado 23 de enero de 2027, más de dos semanas después de que se vuelven. No lo agenden.","Queda dentro del parque de Nara, sobre el paso a pie entre Todai-ji y Kasuga Taisha (~10-15 min desde el Todai-ji).","Único acceso a la vista panorámica en invierno: la cima por auto, vía el Shin-Wakakusayama Course del Nara Okuyama Driveway (el operador publica 5:00-23:00, aunque visitnara.jp indica 8:00-23:00 y 22:00 en invierno: confirmar en el peaje antes de subir). ¥700 auto común y ¥500 moto; la puerta de salida cierra a la 1:00. Mirador a 300 m del estacionamiento por una rampa apta cochecito/silla de ruedas, con baños y máquinas expendedoras en el estacionamiento. Requiere auto o taxi, y no verifiqué si el driveway opera del 29/12 al 3/1.","Si igual pasan por la zona: en Nara el sol se pone ~16:49 a mediados de diciembre y ~17:02 a principios de enero, y oscurece del todo cerca de las 17:20. El mirador de la cima funciona para el atardecer si llegan antes de las 16:40, o directamente como vista nocturna."],"refs":["https://www.visitnara.jp/venues/A00491/","http://narashikanko.or.jp/spot/detail_10108.html","https://yamatoji.nara-kankou.or.jp/02nature/01mountain/01north_area/wakakusayama/","https://www.pref.nara.lg.jp/site/park/1009.html","https://shinwaka.com/course1/"]},{"id":"u_g_2263195875244312305","n":"Wakakusayama Hill","cat":"parque","hood":"Nara","why":"Está cerrado durante todo el viaje: la temporada de montaña del Wakakusayama va del tercer sábado de marzo al segundo domingo de diciembre, y el segundo domingo de diciembre de 2026 cae el 13 — el día antes de que aterricen. Del 14/12 en adelante el cerro está fuera de temporada hasta mediados de marzo, con las porterías cerradas y sin cobro de entrada. Es la colina pelada de pasto detrás del Tōdai-ji, en pleno parque de Nara: en temporada se sube a pie en 30-50 minutos por la vista de la cuenca de Nara y se cruza ciervos todo el camino. Como está sobre la ruta obligada entre Tōdai-ji y Kasuga Taisha, la van a ver de costado igual, pero no hay nada que hacer ahí: no la agendes como parada.","addr":"Zoshicho, Nara, 630-8211, Japón","lat":34.6900079,"lng":135.85389419999998,"aprox":false,"gcid":"2263195875244312305","cost":0,"dur":1,"sub":"Colina / mirador, cerrado por temporada","typ":"Montaña","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Wakakusayama Hill","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":0,"tip":"","season":"Cerrado los 25 días del viaje. Cierre invernal de mediados de diciembre a mediados de marzo. La única forma de llegar a la cima en esas fechas es en auto o taxi por el Nara Okuyama Driveway (curso Shin-Wakakusayama): el operador publica 5:00-23:00 y 700 yenes de peaje por auto común, sin mencionar cierre invernal ni régimen de fin de año. · Año nuevo (29/12 al 3/1): Cerrado, igual que el resto del viaje — no por Shōgatsu sino porque la temporada terminó el 13/12/2026. El Driveway a la cima no publica su calendario de fin de año: si les interesa el mirador nocturno, hay que confirmarlo por teléfono.","conf":"alta","warn":["CERRADO todo el viaje: la temporada 2026 termina el domingo 13/12/2026 y ellos llegan el 14/12. Reabre el tercer sábado de marzo de 2027.","El Yamayaki (quema del cerro) NO cae dentro del viaje: es el cuarto sábado de enero, o sea el 23/1/2027, dieciséis días después de que se vuelven. La página oficial de la Asociación de Turismo de Nara todavía publica solo la edición 2026 (24/1/2026); la de 2027 no está anunciada. No armes nada alrededor de esto.","Durante el cierre invernal tampoco se sube caminando el día del Yamayaki: el cerro sigue vedado a los que escalan.","La zona está bien asignada: Zoshicho es Nara ciudad, prefectura de Nara, adentro del parque, a unos 10-15 minutos a pie del Tōdai-ji. No hay error de rótulo acá.","Discrepancia en el horario del Driveway: el sitio oficial del operador dice 5:00-23:00 con salida hasta la 1:00, mientras que listados de terceros (JAF) dan 8:00-23:00 y 8:00-22:00 entre el 1/12 y el 15/3. Si van a la cima de noche, confirmen con el operador, no con los agregadores.","Si en algún momento cae Nara en temporada: necesita luz de día y en Nara oscurece cerca de las 16:45 en diciembre, contra un cierre de porterías a las 17:00."],"refs":["https://www.pref.nara.lg.jp/site/park/2585.html","http://narashikanko.or.jp/spot/detail_10108.html","https://www.japan-guide.com/e/e4113.html","https://narashikanko.or.jp/event/detail_10236.html","https://shinwaka.com/access/","https://drive.jafnavi.jp/spots/291129X00031/"]},{"id":"u_g_17972930374069941334","n":"Parque de Nara","cat":"parque","hood":"Nara","why":"No es \"un parque\": son 660 hectáreas que envuelven Tōdai-ji, Kōfuku-ji, Kasuga Taisha y el Museo Nacional de Nara, con unos 1.300 ciervos sueltos, abierto 24 h y sin entrada — es el contenedor del día en Nara, no una parada más (las 3 h son el parque en sí; los templos de adentro van aparte). Los sitios de adentro cobran y cierran temprano; el parque en sí no. En diciembre-enero el pasto está seco y amarillo, pero es terreno llano y urbano: no hay cierre estacional. El límite real es la luz: el 25 de diciembre el sol se pone 16:52 en Nara y a las 17 ya casi no queda luz, así que el día de Nara arranca temprano o se pierde.","addr":"Nara, Japón","lat":34.685047,"lng":135.843012,"aprox":false,"gcid":"17972930374069941334","cost":0,"dur":3,"sub":"Nara / Nara","typ":"Parque","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Parque de Nara","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":0,"tip":"","season":"Opera normal en diciembre y enero. Es llano, urbano y a nivel del suelo: no hay cierres por nieve ni accesos de montaña involucrados (el sendero al bosque primario de Kasugayama sí es otra cosa y va aparte). · Año nuevo (29/12 al 3/1): El parque en sí no cierra ni cobra, así que del 29/12 al 3/1 se puede caminar igual. Lo que cambia es el entorno: Kasuga Taisha y Tōdai-ji concentran el hatsumōde y el parque se llena, y la Asociación de Turismo de Nara confirma que en fin de año se aplican restricciones de tránsito alrededor del parque y pide no venir en auto. Al 8/9/2026 la página oficial de fin de año publicada sigue siendo la de 2025-2026: las fechas y horas exactas de corte para 2026-2027 todavía no están anunciadas.","conf":"alta","warn":["La zona está bien rotulada: el parque está en la ciudad de Nara, prefectura de Nara. Desde Kioto son ~45 min por Kintetsu (Kintetsu-Nara queda a 8 min a pie del parque) y desde Osaka ~40 min. Es viable como excursión de un día desde cualquiera de las dos.","LUZ: puesta de sol en Nara 16:47 el 15/12, 16:52 el 25/12 y 16:56 el 31/12 (efemérides del Observatorio Astronómico Nacional de Japón). El parque no tiene iluminación de paseo: hay que estar adentro antes de las 15:30 para que rinda.","El 'shika-yose' (llamado a los ciervos con corno, gratis, 10:00 en Tobihino) en su edición invernal 2026 corrió del 10/1 al 28/2, solo sábados, domingos y feriados. Si 2027 repite el patrón, empieza DESPUÉS del 7/1 y se lo pierden. No está anunciado todavía.","Restricciones de tránsito alrededor del parque en fin de año / primeros días de enero: llegar en tren o bus, no en auto ni taxi hasta la puerta.","Los ciervos son animales salvajes declarados monumento natural, no mascotas: muerden y embisten por comida. Si comprás senbei, dalas todas rápido; caminar con el paquete a la vista termina mal. Tampoco les des otra cosa.","No hay tachos de basura en el parque — todo lo que entra, sale con vos. Relevante para dos que van comprando refrigerios."],"refs":["https://narashikanko.or.jp/en/spot/detail_10089.html","https://www.pref.nara.lg.jp/n113/1713.html","https://naradeer.com/event/shikayose.html","https://narashikanko.or.jp/feature/newyearinformation","https://eco.mtk.nao.ac.jp/koyomi/dni/2026/s3012.html.en","https://naradeer.com/"]},{"id":"u_g_4889967431853146006","n":"Yoshidaen","cat":"tienda","hood":"Nara","why":"Google lo rotula \"casa de té\" y no lo es: Yoshida En (吉田園) es una tienda de hojas de té —chaho— en Minamiichicho 5, a unos 450 m de la estación Kintetsu Nara, en pleno centro. Vende té de la prefectura (大和茶): kabusecha, sencha de alta gama y una hojicha llamada «Kasuga Kaori». Ni las reseñas de Tabelog ni la ficha mencionan salón, mesas ni matcha para tomar ahí: se entra, se compra y se sale. Para dos foodies que buscan 10 huecos de comida por día, esto no llena ninguno; es una parada de 15 minutos para llevarse té a casa, y hay competencia local con más pergamino en el mismo barrio (Tamura Seihoen, en Naramachi). Como Nara se hace de día y el sol se pone cerca de las 16:50 en diciembre, la ventana 9:00-17:00 se solapa entera con las horas útiles de templos: si entra, que sea de paso entre el Kofukuji y Naramachi, no como destino.","addr":"5 Minamiichicho, Nara, 630-8373, Japón","lat":34.6807796,"lng":135.8299484,"aprox":false,"gcid":"4889967431853146006","cost":1000,"dur":0.3,"sub":"Tienda de té (chaho) — hojas para llevar, no salón","typ":"Casa de té","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: 吉田園 en Naramachi figura en Tabelog cerca de Kintetsu Nara, así que es té/dulces, pero no confirmé si es salón para sentarse o solo tienda de té (sería arq).","src":"lista","gname":"Yoshidaen","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":3.03,"tip":"No se come acá. Lo que se compra: hojicha «Yamato Hojicha Kasuga Kaori» (300 g, ~1.050 ¥ según Tabelog) y kabusecha de Yamato (100 g, ~1.080 ¥); un reseñador cita también un sencha especial. Sin cola, sin reserva. Medios de pago no verificados: en un chaho chico de barrio conviene asumir efectivo.","season":"","conf":"media","warn":["Google lo clasifica como local de comida y no lo es: es una tienda de hojas de té, no un sitio donde se consume. Como parada gastronómica no sirve; como compra de souvenir, sí.","Google lo llama 'Casa de té' y eso induce a error: no hay evidencia de salón, mesas ni servicio de matcha en el local.","Tabelog 3,03 sobre solo 3 reseñas y en la categoría 'Otros' (no es un restaurante). El puntaje no es comparable con el de un local de comida.","Shōgatsu sin verificar: los chaho familiares suelen cerrar entre el 31/12 y el 3/1, pero no encontré fuente que lo confirme para este. Si el plan de Nara cae en esos días, no contar con que esté abierto.","Ojo con los homónimos: hay un 'お茶の吉田園' en Higashisumiyoshi (Osaka), un '吉田園茶舗' en Zoshigaya (Tokio) y un '株式会社吉田園' en Yame (Fukuoka). Ninguno es este. El puntaje y las hojas citadas son del local de Minamiichicho 5.","La zona 'Nara / Nara' es correcta: 630-8373 es centro de Nara, ~450 m de Kintetsu Nara, entre el Kofukuji y Naramachi."],"refs":["https://tabelog.com/en/nara/A2901/A290101/29012198/","https://tabelog.com/en/nara/A2901/A290101/29012198/dtlrvwlst/","https://tabelog.com/matome/23554/"]},{"id":"u_g_2088993683141410795","n":"Salon Naramachi cafe & Japanese tea","cat":"comida","hood":"Nara","why":"Casa de té 茶論 (Salon) en una machiya de unos 130 años en Naramachi, al lado del edificio Shikasarukitsune; la opera Nakagawa Masashichi Shoten, la tienda de diseño de Nara fundada en 1716. El zashiki era la vivienda de la familia fundadora y da a un patio interior. No es un café de pasada: se toma matcha preparado en el momento (usucha o koicha, el espeso de ceremonia que casi ningún café sirve) con un wagashi de estación, sentado en tatami o en horigotatsu. Tabelog 3,43 con 101 reseñas, que para un café japonés es alto. Sirve como parada de media tarde en Naramachi —abre hasta las 19:00, última orden 18:30, así que aguanta después del atardecer, que en Nara a fin de año cae cerca de las 16:50—, no como desayuno ni almuerzo.","addr":"31-1 Ganriincho, Nara, 630-8221, Japón","lat":34.6809107,"lng":135.82971609999998,"aprox":false,"gcid":"2088993683141410795","cost":1800,"dur":1,"sub":"casa de té / matcha y wagashi","typ":"Café","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Salon Naramachi cafe & Japanese tea","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":3.43,"tip":"El menú oficial (salon-tea.jp/cafe/) marca: usucha (matcha suave) 1.210-1.430 ¥, koicha (matcha espeso de ceremonia) 2.420 ¥, latte de koicha (caliente o frío) 1.210 ¥, hojicha 880 ¥, sencha 990 ¥, affogato de matcha 1.210 ¥. El wagashi va como set sobre el precio de la bebida: 季節の主菓子 (de Kashiya, casa de wagashi de Nara, cambia dos veces por mes) + 550 ¥. También hay kuzu-yaki dango +880 ¥ (otoño a primavera) y kakigori blanco +1.540 ¥ (verano, no aplica). Si quieren algo más que tomar el té, hay experiencias con turno: 自点て (batir tu propio matcha) 2.200 ¥, 茶カフキ (cata comparativa) 3.300 ¥, 茶事 (ceremonia) 3.630 ¥ — esas sí conviene reservarlas online. Acepta tarjeta (Visa, Mastercard) y dinero electrónico (Suica y otras IC, nanaco, WAON, iD, QUICPay): NO es solo efectivo. 28 asientos (18 normales + 10 de horigotatsu). Tabelog acepta reserva; las experiencias se reservan por la web.","season":"","conf":"alta","warn":["La zona está bien: es Naramachi, ciudad de Nara, prefectura de Nara. A 7-8 minutos a pie de Kintetsu Nara, no hay que desviarse.","Ninguna fuente oficial publica el calendario de fin de año. Si caen ahí entre el 29/12 y el 3/1, hay que confirmar por la web o por teléfono antes de ir: 0742-93-8833.","Una guía local de 2019 (narakko.jp) menciona cierre el segundo martes del mes; la web oficial, Tabelog, gnavi y JR Central Nara dicen 無休 (sin día fijo de cierre). Los segundos martes del período son el 8/12/2026 y el 12/1/2027: si el viaje toca alguno, conviene confirmar.","Caro para lo que es: matcha con dulce sale 1.760-1.980 ¥ por cabeza. El koicha a 2.420 ¥ es el plato distintivo, pero es té espeso y amargo, no un postre.","El jardín es un patio interior (tsuboniwa) que se mira desde el zashiki de tatami. El sol se pone cerca de las 16:50 y un patio cerrado se apaga antes: si el punto es el jardín, hay que estar sentados antes de las 16:00."],"refs":["https://tabelog.com/en/nara/A2901/A290101/29011108/","https://salon-tea.jp/cafe/","https://salon-tea.jp/shop/","https://www.visitnara.jp/venues/A02104/","https://www.nakagawa-masashichi.jp/staffblog/store/s000002/"]},{"id":"u_g_14561917136571056776","n":"Nakatanidou","cat":"comida","hood":"Nara","why":"Mochi de yomogi (artemisa) relleno de anko, hecho a la vista con el \"餅つき a alta velocidad\" que hizo famoso al local: dos tipos —uno con el mazo, otro dando vuelta la masa— golpean el mortero a un ritmo absurdo y se junta gente en la vereda a mirar. Tiene 3,72 en Tabelog con más de 2.600 reseñas y entró en el Tabelog 100 de wagashi de la zona oeste, así que no es solo show. Se llega saliendo por la salida 3 de la estación Kintetsu Nara y recorriendo la galería Higashimuki hasta el fondo: el local está en el extremo sur, donde la galería desemboca en Sanjo-dori, unos 5 minutos a pie. O sea, en el camino natural desde la estación hacia Nara-koen y el Todai-ji: no cuesta nada meterlo. Se come parado en 5 minutos y sirve como merienda o desayuno tardío de un día de Nara.","addr":"29 Hashimotocho, Nara, 630-8217, Japón","lat":34.681943,"lng":135.8288995,"aprox":false,"gcid":"14561917136571056776","cost":600,"dur":0.25,"sub":"Wagashi / mochi","typ":"Dulcería","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Nakatanidou","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":3.72,"tip":"Yomogi mochi recién golpeado, relleno de anko de poroto azuki de Tokachi (Hokkaido) y espolvoreado con kinako; la yomogi es de brotes de Uwajima y el arroz es hiyokumochi de Saga. Es lo único que importa acá: se come en el momento y el vencimiento es el mismo día (por eso no hacen envíos). Precio del sitio oficial: ¥600 los 3, ¥1.200 los 6, ¥2.000 los 10; la unidad suelta ronda ¥200 en el mostrador (el oficial ya no publica precio unitario, y el ¥130 que circula es de 2019). SOLO EFECTIVO — Tabelog confirma que no aceptan tarjeta, dinero electrónico ni códigos QR. No hace falta reservar: es mostrador a la calle y la cola avanza rápido. El golpeo de mochi no tiene horario fijo, lo hacen a medida que se va vendiendo (10-15 veces por día, hasta 30 en días de mucha gente); el propio sitio dice que la franja de más actividad es de después del mediodía hasta antes del anochecer. Puede cerrar antes si se agota.","season":"Año nuevo (29/12 al 3/1): Sin confirmar por la tienda: no publican calendario de fin de año y los francos salen únicamente por su Instagram (@nakatanidou.jp). La idea de que abre «los 365 días, incluidos Obon y Año Nuevo» viene de una guía local (enjoy-nara) fechada en marzo de 2019, anterior al aviso oficial de octubre de 2024 que instauró días de cierre anunciados por Instagram: hoy no sirve como respaldo. Lo único citable es cocolocala, que dice que en fin de año y año nuevo llegan a producir 3.000 unidades por día. Conclusión práctica: es probable que abra entre el 29/12 y el 3/1 y con cola, pero confirmalo en el Instagram del local uno o dos días antes y no cuelgues el plan del día de eso.","conf":"media","warn":["Solo efectivo: no aceptan tarjeta, ni IC, ni QR (confirmado en Tabelog).","Martes es el día de cierre más probable: el sitio oficial no fija franco y anuncia los cierres solo por Instagram, pero Tabelog y Rurubu listan martes. Chequealo antes de ir un martes.","Puede cerrar antes de las 19:00 si se agota el mochi del día; además dos guías listan cierre a las 18:00, así que no llegues después de las 17:30.","Para ver el golpeo conviene ir de tarde: el propio local dice que la franja de más actividad va de después del mediodía hasta antes del anochecer. En Nara a fin de diciembre oscurece cerca de las 16:50, así que encajalo a la vuelta del Todai-ji, entre las 15:00 y las 17:00."],"refs":["https://tabelog.com/en/nara/A2901/A290101/29000222/","https://nakatanidou.jp/","https://nakatanidou.jp/shop/","https://nakatanidou.jp/visit/","https://nakatanidou.jp/item/","https://nakatanidou.jp/news/%e5%ae%9a%e4%bc%91%e6%97%a5%e3%81%ae%e3%81%8a%e7%9f%a5%e3%82%89%e3%81%9b/","https://www.instagram.com/nakatanidou.jp/","https://rurubu.jp/andmore/spot/80031272","https://www.jalan.net/news/article/842301/","https://harimap.com/nakatanidou-yomogi-mochi-guide/","https://www.cocolocala.jp/spots/53455","https://enjoy-nara.com/nakatanido/ (guía de 2019, no usar para horarios ni precios)"]},{"id":"u_g_7726051953557838672","n":"Sushitetsu","cat":"comida","hood":"Kioto","why":"Sushi de barra barato en Pontochō, apenas bajando de Sanjō: nigiri a la pieza, dos piezas ¥216, con los itamae armando delante tuyo. No es sushi de autor ni omakase — es una de las opciones más accesibles de una calle donde casi todo lo demás es bastante más caro, y para dos que van a compartir y picar funciona bien como cena temprana antes de caminar Pontochō de noche (el sol se pone cerca de las 16:50, que es cuando la calle se pone linda). Tabelog 3,44 con 282 reseñas, y es el puntaje de este local (先斗町店), no de otra sucursal: sólido para el precio, no un destino en sí mismo. Local grande (52 lugares: barra de 18, cuatro hoyos de 6 y una mesa de 2), así que rara vez hay que hacer cola larga. Ojo con el cargo de mesa de ¥330 por persona.","addr":"Japón, 〒604-8002 Kyoto, Nakagyo Ward, 三条通ウィステリアコート先斗町 １F からふね屋 先斗町下ル","lat":35.0082234,"lng":135.7712893,"aprox":false,"gcid":"7726051953557838672","cost":4000,"dur":1.25,"sub":"Sushi de barra, económico","typ":"Sushi","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Sushitetsu","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.44,"tip":"Nigiri a la pieza, pedido de a poco en la barra. En la única reseña detallada que hay: toro, tsubugai, hirame y engawa, más tempura de anago (¥880) y de verdura. La casa se promociona como edomae con pescado de envío directo. Dos piezas ¥216. Hay curso de mariscos con 90 min de barra libre a ¥2.980 de lunes a viernes, y un curso premium de ¥6.000 (¥5.000 reservando para 4+). Ojo: cobran ¥330 por persona de cargo de mesa. Aceptan tarjetas (VISA/Master/JCB/AMEX/Diners) y pago con QR — no es solo efectivo. La barra es por orden de llegada; solo se reservan los tatamis desde 4 personas, así que para dos se cae y se espera.","season":"Año nuevo (29/12 al 3/1): Cierra el 31 de diciembre y el 1 de enero (年末年始), declarado tanto en Tabelog como en la web oficial. No declaran cierre del 2 al 3 de enero, así que en principio abren, pero eso no está confirmado explícitamente. Sumado a que el 30/12/2026 cae miércoles (su día de cierre), quedan tres días seguidos cerrado: 30, 31 de diciembre y 1 de enero.","conf":"alta","warn":["Días cerrados DENTRO del viaje (14/12/2026 al 7/1/2027): miércoles 16/12, 23/12 y 30/12; jueves 31/12; viernes 1/1; miércoles 6/1. El 2º martes de enero cae el 12, ya fuera del viaje.","El edificio no coincide entre fuentes: Google dice 'ウィステリアコート 1F' y la web oficial y Tabelog dicen 'からふね屋先斗町ビル 1F'. Ambas direcciones son 先斗町三条下ル石屋町 (una fuente pone 123-1, otra 133-1). Es el mismo local — buscar el cartel すしてつ sobre Pontochō, bajando desde Sanjō.","Barra sin reserva para dos personas: si van en fin de semana o el 2-3 de enero (post-hatsumōde, con todo el mundo comiendo afuera), pueden esperar. Cena temprana, 17:00-18:00, evita el problema."],"refs":["https://tabelog.com/en/kyoto/A2601/A260301/26002981/","https://sushitetsu.owst.jp/","https://www.kyotowalk-gourmet.com/entry/sushitetsu"]},{"id":"u_g_2397099946291010547","n":"Calle de utensilios de cocina Kappabashi","cat":"tienda","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"3 Chome-18-2 Matsugaya, Taito City, Tokyo 110-0036, Japón","lat":35.7105797,"lng":139.7879645,"aprox":false,"gcid":"2397099946291010547","cost":0,"dur":0,"sub":"-","typ":"Calle comercial","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: Google no devolvió el nombre. Dirección sin nombre dentro de Kappabashi (calle de utensilios de cocina); no pude identificar qué tienda es.","src":"lista","gname":"3 Chome-18-2 Matsugaya","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_4361833810701358572","n":"DEN+ KYOTO 伝プラス京都","cat":"tienda","hood":"Kioto","why":"No es un restaurante: es una tienda de vajilla (食器店). Google Maps la rotula «Restaurante» y por eso entro al catalogo como comida, pero Yahoo!Map la clasifica textualmente como 食器店 y el sitio oficial de la marca, Den Collection (dencollectionjapan.com), la lista como uno de sus dos locales de loza y utensilios de mesa en Kioto: el otro es 伝 ON THE TABLE (中之町537-1), en el mismo barrio 中之町, a un par de minutos a pie. Esta en la zona de arcades Shinkyogoku/Teramachi junto a Nishiki, a un minuto de la salida 9 de Hankyu Kyoto-Kawaramachi, asi que cae sola en cualquier caminata por el centro de Kioto: es una parada de 20 a 30 minutos para comprar platos y palillos, no algo por lo que se organice un dia. Al estar bajo arcade techado funciona igual de noche y con lluvia, y no depende de la luz de dia.","addr":"552 Nakanocho, Nakagyo Ward, Kyoto, 604-8042, Japón","lat":35.0042335,"lng":135.7669243,"aprox":false,"gcid":"4361833810701358572","cost":0,"dur":0.5,"sub":"Vajilla japonesa","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Pin sin nombre en Nakanocho 552, Nakagyo (zona Shinkyogoku/Teramachi); no pude identificar el local, asumo gastronomía por la zona","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"","conf":"media","warn":["OJO CATEGORIA: Google Maps dice «Restaurante» y es falso. Es una tienda de vajilla japonesa. No cuenta como opcion de desayuno, almuerzo ni cena: si quedo en la grilla de comida, sacala de ahi.","Ubicacion correcta: si esta en Kioto ciudad (Nakagyo-ku, arcade Shinkyogoku/Teramachi, 1 min de Kyoto-Kawaramachi). No hay error de prefectura aca.","Cuidado con los homonimos: «Den Kyoto» es un bar del hotel Dusit Thani cerca de la estacion de Kioto, y «Den» de Hasegawa es el restaurante de Tokio. Ninguno tiene que ver con este local.","Hay DOS locales de la misma marca Den Collection en el mismo barrio 中之町: 伝 ON THE TABLE (537-1, abre 11:00-19:00) y este, DEN+ KYOTO (552, abre 11:00-20:00). A un par de minutos a pie uno del otro: en la practica es una sola parada.","Cierre de fin de ano sin verificar. El sitio oficial avisa que los cierres y cambios de horario se publican mes a mes en el Instagram de cada local (@den_plus_kyoto): chequealo antes de ir en shogatsu y no dejes una compra importante para el 1 de enero.","No lei precios: cost queda en 0 a proposito. Comprar ceramica implica cargarla 25 dias o pagar envio."],"refs":["https://dencollectionjapan.com/pages/locations","https://dencollectionjapan.com/","https://nichijosahan.jp/shop/den_plus_kyoto","https://map.yahoo.co.jp/v3/place/1T4OdIOChFQ"]},{"id":"u_g_17159265092369514558","n":"KOMEHYO","cat":"tienda","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒104-0061 Tokyo, Chuo City, Ginza, 2 Chome−7−18 藤田ビル 1、2階","lat":35.673293,"lng":139.7675459,"aprox":false,"gcid":"17159265092369514558","cost":0,"dur":0,"sub":"-","typ":"Segunda mano","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: Google no devolvió el nombre. Sin nombre: Ginza 2-7-18, edificio Fujita, pisos 1 y 2. No identifico el local; podría ser tienda de Ginza.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_16405150437654111369","n":"Now on Cheese♪ (ナウオンチーズ) Hello,TokyoStation!","cat":"comida","hood":"Chiyoda","why":"Está en la lista «Japón» de Google Ma ,"gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_3719900226889661510","n":"NEWYORK PERFECT CHEESE Tokyo Station","cat":"comida","hood":"Chiyoda","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒100-0005 Tokyo, Chiyoda City, Marunouchi, 1 Chome−9−1 JR Tokyo Station, １Ｆ 南通路","lat":35.6803624,"lng":139.7666707,"aprox":false,"gcid":"3719900226889661510","cost":0,"dur":0,"sub":"-","typ":"Pastelería","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"NEWYORK PERFECT CHEESE Tokyo Station","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_9979308774657714368","n":"Ginza Itoya","cat":"tienda","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"2 Chome-7-15 Ginza, Chuo City, Tokyo 104-0061, Japón","lat":35.6731273,"lng":139.7672138,"aprox":false,"gcid":"9979308774657714368","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Ginza Itoya","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_15576708788006522373","n":"HAKUHINKAN TOY PARK","cat":"tienda","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"8 Chome-8-11 Ginza, Chuo City, Tokyo 104-8132, Japón","lat":35.6677564,"lng":139.76118169999998,"aprox":false,"gcid":"15576708788006522373","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"HAKUHINKAN TOY PARK","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17791424921607832930","n":"AKOMEYA TOKYO TOKYU PLAZA SHIBUYA","cat":"tienda","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"東急プラザ渋谷, ２階, 1 Chome-2-3 Dogenzaka, Shibuya, Tokyo 150-0043, Japón","lat":35.6576545,"lng":139.7003114,"aprox":false,"gcid":"17791424921607832930","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"AKOMEYA TOKYO TOKYU PLAZA SHIBUYA","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17937699759305060753","n":"Happo pond","cat":"parque","hood":"Nagano","why":"En diciembre y enero el lago Happo-ike es inalcanzable: está a 2.060 m sobre el filo del Happo-one, y el único acceso normal —la Happo Alpen Line (góndola Adam + dos telesillas) más 1 a 1,5 h de caminata— opera solo en temporada verde, del 6 de junio al 3 de noviembre de 2026 (más el fin de semana de pre-apertura del 30 y 31 de mayo). En invierno todo eso es una estación de esquí y lo que hay arriba es alta montaña con nieve: llegar al lago pasa a ser alpinismo invernal con crampones, piolet y riesgo de aludes, no un paseo. Encima el lago está congelado y enterrado bajo metros de nieve, así que ni siquiera se ve el reflejo de las Hakuba Sanzan que es toda la razón para ir. Se puede subir la góndola por la vista (¥2.600 ida y vuelta, adulto, tarifa de temporada 2026-27), pero eso es \"mirador de estación de esquí\", no este lugar, y con oscurecer cerca de 16:30 la ventana es corta. Descartar para este viaje.","addr":"Hokujo, Hakuba, Kitaazumi District, Nagano 399-9301, Japón","lat":36.6942149,"lng":137.78451379999998,"aprox":false,"gcid":"17937699759305060753","cost":2600,"dur":0,"sub":"-","typ":"Lago","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Happo pond","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"Cerrado de hecho en diciembre-enero. El sendero al lago es de temporada verde (jun-nov). En las fechas del viaje solo funciona la estación de esquí; el lago queda en zona invernal de alta montaña. · Año nuevo (29/12 al 3/1): La estación de esquí Happo-one está dentro de su temporada 1/12-5/5, así que en Shōgatsu opera (es de sus semanas más cargadas); horarios especiales de fin de año no publicados aún, sin verificar. El lago en sí sigue inaccesible igual, feriado o no.","conf":"alta","warn":["DESCARTAR para diciembre-enero: el sendero al lago solo existe en temporada verde (6/6 a 3/11/2026). En las fechas del viaje no se puede llegar sin equipo de montaña invernal.","ZONA MAL ROTULADA: Hakuba está en la prefectura de NAGANO, en el norte, no tiene relación con Tateyama ni Kurobe, que son prefectura de TOYAMA y otro macizo. La base de operaciones real sería la ciudad de Nagano (bus Alpico Nagano-Hakuba, unos 75 minutos hasta Hakuba Happo Bus Terminal, más 1,5 km a pie hasta la góndola Adam), no Toyama ni Kanazawa.","La Ruta Alpina Tateyama-Kurobe, que la etiqueta sugiere, opera 15/4 a 30/11/2026 y está CERRADA por nieve todo diciembre y enero. Si el interés era 'los Alpes japoneses en invierno', ninguno de los dos entra al viaje.","Si igual quieren Hakuba, es un viaje de esquí/nieve de al menos una noche desde Tokio o Nagano, no una excursión de día suelta dentro de un itinerario Tokio-Kioto-Osaka.","Aunque subieran la góndola por la vista: oscurece cerca de 16:30 y en la montaña antes por las cumbres. Todo tiene que pasar antes de las 15."],"refs":["https://www.happo-one.jp/news-green/38643/","https://www.happo-one.jp/en/ticket/","https://www.happo-one.jp/en/trekking/alpenline/","https://antenna-hakuba.com/en/introduce/happoike/","https://www.snowmonkeyresorts.com/activities/hakuba-happo-pond/","https://www.vill.hakuba.nagano.jp/recommendation/happotrekking/","https://www.alpen-route.com/en/transport/opening.html","https://www.happo-one.jp/en/winter/"]},{"id":"u_g_950431740640758574","n":"天狗原","cat":"parque","hood":"Nagano","why":"En diciembre y enero este lugar no es visitable: el ropeway que lo hace accesible cierra tras la temporada verde (en 2026, del 6 de junio al 25 de octubre) y vuelve recién con la «operación de primavera temprana», que en 2026 arrancó el 7 de marzo — las fechas de 2027 todavía no están publicadas. Entre medio no hay forma de subir salvo esquí de travesía desde la estación de esquí, con beacon y equipo de autorrescate exigidos por el operador y presentación del 登山届 (aviso de montaña) obligatoria por ordenanza de Nagano. 天狗原 (Tenguhara) no es un parque urbano ni un mirador: es un humedal de altura de 2.202 m sobre el Tsugaike Shizen-en, en la ruta de ascenso al Hakuba Norikura-dake, que en invierno queda bajo varios metros de nieve. Es terreno de alud: en enero de 2023 una avalancha en la ladera este del Hakuba Norikura mató a dos esquiadores, y en febrero de 2020 otra sepultó tres horas a un snowboarder profesional en la zona del Ura-Tengu, rescatado con vida. Para dos foodies sin equipo de travesía no hay nada que hacer acá: se descarta.","addr":"Chikuniko, Otari, Kitaazumi District, Nagano 399-9422, Japón","lat":36.7821162,"lng":137.8128231,"aprox":false,"gcid":"950431740640758574","cost":0,"dur":0,"sub":"Humedal alpino a 2.200 m sobre Tsugaike, Otari (valle de Hakuba) — inaccesible en diciembre-enero","typ":"Meseta alpina","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: Google no devolvió el nombre. Topónimo en Otari (Nagano); no sé si el pin es un lago, un humedal o solo el nombre del barrio rural.","src":"lista","gname":"Chikuniko","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"No opera en diciembre-enero. Ventana real: junio a octubre (temporada verde) y marzo a principios de mayo (esquí de travesía con el ropeway de primavera). Entre noviembre y principios de marzo solo se llega con equipo y experiencia de montaña invernal. · Año nuevo (29/12 al 3/1): No aplica como visita: el lugar no tiene apertura propia y su acceso (ropeway) está fuera de servicio todo el invierno, Año Nuevo incluido. La estación de esquí de Tsugaike sí opera en esas fechas —la web oficial da la temporada 2026-27 con ventanilla del 12 dic 2026 al 22 mar 2027 y pase de día a ¥9.800— pero sus remontes llegan a la pista, no a Tenguhara.","conf":"media","warn":["Zona mal rotulada: NO está en Tateyama/Kurobe (prefectura de Toyama). Está en Otari, distrito de Kitaazumi, prefectura de NAGANO — el valle de Hakuba, del otro lado de la cadena. Además la Ruta Alpina Tateyama-Kurobe cierra el 30 de noviembre y no reabre hasta mediados de abril, así que ninguna de las dos lecturas entra al viaje.","Muy lejos de todo lo demás: el bus Shinjuku – Tsugaike Kogen tarda unas 5 h 13 min (nocturno 7 h 23). Con 25 días y candidatas Tokio/Kioto/Nara/Osaka, esto es un desvío de dos días como mínimo.","Cerrado de hecho en las fechas del viaje: el ropeway de acceso no opera entre fines de octubre y el 7 de marzo.","Terreno de avalancha: en enero de 2023 una avalancha en la ladera este del Hakuba Norikura mató a dos esquiadores; en febrero de 2020 otra sepultó 3 h 1 min a un snowboarder profesional en la zona del Ura-Tengu, rescatado con vida. Fuera del área gestionada de la estación el operador exige beacon y equipo de rescate, y la ordenanza de Nagano obliga a presentar el 登山届 (aviso de montaña).","Aunque estuviera abierto, es un tramo de montaña de varias horas ida y vuelta desde la estación superior del ropeway, no un paseo: necesita luz de día y en diciembre oscurece antes de las 17:00."],"refs":["https://www.tsugaike.gr.jp/green/ropeway","https://info-otari.jp/2026/03/05/17247/","https://www.tsugaike.gr.jp/snow/price","https://www.tsugaike.gr.jp/green/access","https://sizenen.otarimura.com/about/","https://www.ikomaike-tozan.com/Northern_Alps/Tsugaike/Tenguhara.htm","https://www.yamakei-online.com/yama-ya/detail.php?id=2909","https://www.cbsnews.com/news/avalanche-in-japan-kyle-smaine-american-pro-reportedly-killed-ski-resort/","https://surfsnow.jp/guide/htm/r0144s.htm","https://www.alpico.co.jp/traffic/express/hakuba_shinjuku/","https://www.alpen-route.com/en/"]},{"id":"u_g_9700678467092191389","n":"Oide Park","cat":"parque","hood":"Nagano","why":"Es el mirador postal de Hakuba: un puente colgante de madera sobre el río Himekawa con una casa tradicional de techo de paja y los Hakuba Sanzan (los tres picos nevados) atrás. Parque público, gratis, sin portón ni horario, a 15 minutos a pie de la estación de Hakuba; en invierno funciona pero el sendero es nieve pisada y hielo, hace falta bota de nieve y los baños del predio están cerrados de fines de noviembre a principios de abril. Junto al puente hay una casa de té y una cafetería en el mirador que abre solo los fines de semana: si operan en pleno invierno no está verificado, no cuenten con ellas. Se ve en 30-45 minutos y hay que ir de mañana: la montaña está al oeste, así que el sol le da de frente temprano y a la tarde queda a contraluz y plana mucho antes del atardecer (en diciembre el sol se pone entre las 16:33 y las 16:45). El problema no es el parque, es llegar: desde Tokio son 1h40 de shinkansen a Nagano más 1h15-1h30 de bus, o sea un día entero de viaje por una foto — solo entra si duermen en Hakuba por otra razón (esquí, onsen, nieve), nunca como excursión desde ninguna de las ciudades candidatas.","addr":"Hokujo, Hakuba, Kitaazumi District, Nagano 399-9301, Japón","lat":36.6964439,"lng":137.8737366,"aprox":false,"gcid":"9700678467092191389","cost":0,"dur":0.75,"sub":"Mirador de los Alpes del Norte (Hakuba, Nagano)","typ":"Parque","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Oide Park","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"Opera en diciembre y enero: no es teleférico ni ruta de montaña, es un parque de fondo de valle a 700 m junto a la estación. Nieve profunda, sendero angosto de nieve compactada con tramos congelados, se recomienda bota de nieve o de goma. El estacionamiento queda reducido a 4-5 autos porque parte se usa como depósito de nieve. · Año nuevo (29/12 al 3/1): El parque no tiene portón, personal ni entrada, así que no hay nada que cierre por Año Nuevo: sigue accesible del 29/12 al 3/1. Los baños ya están cerrados por invierno de todos modos. No es sitio de hatsumōde, no se llena. Lo que sí cambia en esas fechas es el entorno: Hakuba está en pico de temporada de esquí, con alojamiento y buses caros y llenos.","conf":"alta","warn":["ZONA MAL ROTULADA: figura como \"Nagano / Tateyama / Kurobe\" pero está en la aldea de Hakuba, distrito Kitaazumi, prefectura de NAGANO — no en Toyama. De la ciudad de Nagano son 1h15-1h30 de bus Alpico (unos 50 km); de Toyama o Tateyama está del otro lado de la cordillera, sin conexión directa en invierno.","NO ESTÁ EN LA RUTA ALPINA TATEYAMA-KUROBE, y esa ruta está cerrada justo en las fechas del viaje: la temporada oficial 2026 terminó el 30/11/2026 y reabre recién en abril de 2027. Si Hakuba entró a la lista pensando en la ruta alpina, el razonamiento no se sostiene.","Baños del parque CERRADOS de fines de noviembre a principios de abril (fuente oficial del municipio). Ir con eso resuelto desde la estación.","Sendero con hielo. Zapatilla urbana no sirve: bota de nieve o de goma.","Luz: ir antes del mediodía. El sol se pone 16:33 y se esconde detrás de los Alpes bastante antes; a la tarde la vista queda a contraluz.","Costo real de llegar, no del lugar: el parque es gratis, pero el bus Nagano-Hakuba en la temporada invernal 2025-26 figura a 3.500 yenes por tramo por persona en la web de Alpico (3.800 a Tsugaike/Norikura). El horario y la tarifa del invierno 2026-27 todavía no estaban publicados al momento de esta ficha: Alpico no anuncia fecha de publicación y recomienda guiarse por el horario del invierno anterior.","Recomendación: descartarlo salvo que decidan dormir en Hakuba. Como parada suelta no justifica el desvío dentro de un viaje que ya tiene Tokio, Kioto, Nara y Osaka."],"refs":["https://www.vill.hakuba.lg.jp/gyosei/soshikikarasagasu/kensetsuka/4/1/1553.html","https://www.vill.hakuba.nagano.jp/spots/ooide-park/","https://www.vill.hakuba.nagano.jp/en/access/","https://blog.nagano-ken.jp/hokuan/other/20272.html","https://www.gltjp.com/en/directory/item/14439/","https://visit-nagano.alpico.co.jp/timetable/hakuba-nagano-winter","https://www.alpen-route.com/en/","https://sunrisesunset.io/jp/nagano-prefecture/hakuba/","https://www.snowmonkeyresorts.com/access/alpico-hakuba-express-bus-timetable/"]},{"id":"u_g_14998382429890884883","n":"Hakuba","cat":"barrio","hood":"Nagano","why":"Hakuba no cierra en invierno: al revés, del 14/12 al 7/1 está en plena temporada, con las 10 estaciones del valle operando (pase de un día para todas: ¥11.100 adulto; solo Goryu, ¥10.000 en ventanilla / ¥9.500 online). Pero es un pueblo-base de esquí, no un pueblo para caminar: si no van a esquiar o andar en snow, lo que queda es paisaje nevado, onsen y el estadio olímpico de saltos de 1998, y el sol se pone cerca de las 16:40. Pesa mucho en contra: 3,5-4 h desde Tokio en cada sentido (shinkansen a Nagano 100 min ¥8.000 + bus 60-90 min ¥3.500-3.800), mínimo 2 noches para que cierre, el alojamiento de Año Nuevo es el pico de precio del año y se agota con meses de anticipación, y la oferta gastronómica es la típica de estación de esquí —cara y orientada a extranjeros—, sin la densidad Tabelog que busca el viaje. Entra solo si de verdad van a esquiar; si no, se saca y ese tiempo va a Kioto/Kanazawa.","addr":"Distrito de Kitaazumi, Prefectura de Nagano, Japón","lat":36.6981614,"lng":137.8619333,"aprox":false,"gcid":"14998382429890884883","cost":11100,"dur":8,"sub":"Valle de esquí en los Alpes del Norte (distrito de Kitaazumi, Nagano)","typ":"Pueblo de montaña","book":"","free":"","closed":"","main":true,"costN":"⚠ categoría por confirmar: Pueblo-estación de esquí; si el interés es la montaña y no el pueblo, iría a parque.","src":"lista","gname":"Hakuba","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"Opera en diciembre-enero: son el pico de la temporada de esquí, no un período de cierre. Apertura 2026-27 proyectada alrededor del 4/12 (proyección, sin confirmación oficial); el grueso de la nieve cae en enero-febrero. Distinto es la Ruta Alpina Tateyama-Kurobe, que sí está cerrada: su sitio oficial da temporada 15/4 - 30/11/2026 y reabre recién en abril de 2027. · Año nuevo (29/12 al 3/1): Abierto y lleno. SamuraiSnow (operador con base en Hakuba) indica que durante Navidad y Año Nuevo las estaciones funcionan normalmente y que restaurantes, bares, comercios y el shuttle del valle están todos abiertos, con reserva muy recomendada para el 25/12 y el 31/12. Es el período más caro y más demandado del año: el alojamiento se vende con meses de anticipación. Verificado contra operador local, no contra comunicado oficial de cada estación.","conf":"alta","warn":["ZONA MAL ROTULADA: Hakuba está en la Prefectura de NAGANO (distrito de Kitaazumi), no en Toyama. Agruparlo con Tateyama/Kurobe induce a error: eso queda del otro lado de los Alpes del Norte y la Ruta Alpina que los une está cerrada del 1/12 a mediados de abril, así que en estas fechas no se combinan. Referencia real: Hakuba está a 60-90 min de bus de la ciudad de Nagano (¥3.500-3.800) y a 3-4 h de Tokio (shinkansen a Nagano 100 min ¥8.000 + bus).","No es un destino de un día desde Tokio: exige mínimo 2 noches para justificar el traslado.","Si no esquían, el contenido real del lugar es escaso y el sol se pone cerca de las 16:40. Decidir esto ANTES de reservar, porque el alojamiento hay que bloquearlo con muchísima anticipación.","Alojamiento de Año Nuevo: es el pico de precio del año y se agota con meses de antelación. A septiembre de 2026 ya es tarde-ish para tarifas buenas.","Choca con el eje foodie del viaje: Hakuba no tiene densidad Tabelog; es comida de resort de esquí a precio de resort.","Silla del estadio de saltos: ¥370 adulto (¥340 grupos de 15+), ¥220 primaria/secundaria, según la página oficial de la Prefectura de Nagano. Algunas fuentes secundarias dicen ¥460: están desactualizadas. Llevar efectivo igual.","El precio del pase de esquí es de la web oficial de Hakuba Valley y corresponde a la temporada 2026-27, pero las estaciones usan precio dinámico y la compra online suele ser más barata."],"refs":["https://www.hakubavalley.com/en/","https://www.hakubavalley.com/en/ticket_en/","https://www.hakubavalley.com/en/schedule/","https://www.hakubaescal.com/winter-en/tickets/lift/","https://www.happo-one.jp/en/winter/","https://www.pref.nagano.lg.jp/sports-ka/sport/taikai/hakubajump.html","https://www.alpen-route.com/en/","https://www.japan-guide.com/e/e6090.html","https://www.samuraisnow.com/hakuba-when-to-visit"]},{"id":"u_g_2514255568504983175","n":"Fuji Kawaguchiko Onsen Hotel Konansou","cat":"alojamiento","hood":"Fuji / Kawaguchiko","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"4020 Funatsu, Fujikawaguchiko, Minamitsuru District, Yamanashi 401-0301, Japón","lat":35.503606999999995,"lng":138.76839569999999,"aprox":false,"gcid":"2514255568504983175","cost":0,"dur":0,"sub":"-","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Fuji Kawaguchiko Onsen Hotel Konansou","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Fuji / Kawaguchiko","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_15733293726462568345","n":"Chureito Pagoda","cat":"arq","hood":"Fuji / Kawaguchiko","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"2-chome-4-1 Asama, Fujiyoshida, Yamanashi 403-0011, Japón","lat":35.5012626,"lng":138.8013852,"aprox":false,"gcid":"15733293726462568345","cost":0,"dur":0,"sub":"-","typ":"Pagoda","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Es la pagoda del santuario Arakura Sengen (arq), pero la gente va por la vista del Fuji: podría ir como mirador","src":"lista","gname":"Chureito Pagoda","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Fuji / Kawaguchiko","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_6661763332175585862","n":"Fujikawaguchiko","cat":"barrio","hood":"Prefectura de Yamanashi","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Distrito de Minamitsuru, Prefectura de Yamanashi, Japón","lat":35.4973138,"lng":138.75519939999998,"aprox":false,"gcid":"6661763332175585862","cost":0,"dur":0,"sub":"-","typ":"Barrio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Fujikawaguchiko","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Fuji / Kawaguchiko","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_16667716666314518901","n":"Yamazaki Whisky Museum","cat":"museo","hood":"Osaka","why":"Es la destilería de whisky más vieja de Japón (1923, Suntory) y lo que Thais marcó como \"museo\" es la Yamazaki Whisky Museum: un edificio de dos plantas con la exhibición sobre Suntory, su fundador y su historia, una biblioteca de muestras de destilados del propio lugar en la planta baja y un tasting lounge pago. La entrada al museo es gratis pero con reserva previa obligatoria: sin reserva no se entra ni al predio, ni siquiera para comprar en la tienda, y no hay walk-in ni reserva por teléfono o mail. El tour de producción con degustación guiada (¥3.000, o ¥10.000 la versión Prestige) es por sorteo y para diciembre 2026 la inscripción corre del 7 al 11 de octubre de 2026 — o aplican en esa ventana o solo les queda el museo. Para dos foodies que quieren probar, el lounge es lo interesante: whiskies raros del propio destilado desde ~¥500, máximo 3 copas por persona. No se pueden ingresar alimentos ni bebidas comprados fuera del lounge, y no está confirmado qué sirve además de whisky, así que no cuenten con que reemplace un almuerzo.","addr":"5 Chome-2-1 Yamazaki, Shimamoto, Mishima District, Osaka 618-0001, Japón","lat":34.8925152,"lng":135.6747133,"aprox":false,"gcid":"16667716666314518901","cost":0,"dur":2,"sub":"Shimamoto (Osaka), a 15 min en JR de Kioto","typ":"Museo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Yamazaki Whisky Museum","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es de montaña ni estacional: opera normal en diciembre y enero salvo el cierre de año nuevo. · Año nuevo (29/12 al 3/1): Cierra. La ficha oficial dice \"休業日: 年末年始\" / \"Closed over the New Year's holiday\" para todo el predio (museo, tienda y lounge incluidos). Las fechas exactas del cierre de fin de 2026 no estaban publicadas al 9/9/2026: hay que mirar la página de cierres antes de agendarlo.","conf":"media","warn":["ZONA MAL ROTULADA: está en la prefectura de OSAKA (Shimamoto-cho, distrito de Mishima), no en Kioto. Pero la etiqueta 'Kioto' funciona en la práctica: JR desde Kioto Station son 15 min y ¥240; desde Osaka Station, 30 min y ¥490. Más 10 min a pie desde la estación Yamazaki (JR) u Oyamazaki (Hankyu).","RESERVA OBLIGATORIA para todo, incluso para entrar solo a la tienda o al tasting lounge. No hay entrada sin reserva y no se reserva por teléfono ni por mail, solo web.","DEADLINE DURO Y CERCANO: el sorteo del tour pago de DICIEMBRE 2026 se inscribe del 7/10/2026 10:00 JST al 11/10/2026 16:29 JST; resultados el 17/10 y reserva del 17 al 21/10. Una sola inscripción por persona, hasta 5 fechas preferidas, pago solo con tarjeta y sin reembolso.","El museo gratis se reserva por orden de llegada: la ventana de noviembre 2026 abre el 17/9/2026 a las 10:00 JST. La de diciembre debería abrir a mediados de octubre, pero no está anunciada — hay que estar mirando.","Cierra por año nuevo (29/12–3/1 muy probablemente adentro del cierre) y las fechas exactas todavía no se publicaron.","Tasting lounge: NO acepta efectivo (solo tarjeta, dinero electrónico o pago con código), máximo 3 copas por persona. No se pueden ingresar alimentos ni bebidas comprados fuera del lounge. Piden documento con foto para verificar edad al comprar alcohol.","Última entrada 16:30 y en diciembre el sol se pone cerca de las 16:50: si van, es actividad de mañana o primera tarde, y el viaje de vuelta a Kioto ya es de noche.","No es visita de día entero: es media jornada desde Kioto. Y si no ganan el sorteo, se reduce a museo + degustación, sin ver la producción."],"refs":["https://www.suntory.co.jp/factory/yamazaki/","https://www.suntory.com/factory/yamazaki/news/detail/how_to_make_a_reservation.html","https://www.suntory.com/factory/yamazaki/news/detail/how_to_enter_and_about_the_shop.html","https://www.suntory.com/factory/yamazaki/news/detail/closing_dates.html","https://www.suntory.com/factory/yamazaki/news/detail/post_4.html","https://www.suntory.co.jp/factory/yamazaki/map/","https://www.suntory.co.jp/factory/yamazaki/news/detail/post_17.html","https://www.japan-guide.com/e/e3974.html","https://osaka-info.jp/en/spot/suntory-yamazaki-distillery/","https://www.kyoto-kankou.or.jp/info_search/3504"]},{"id":"u_g_11670717660837342493","n":"Suntory Yamazaki Distillery","cat":"comida","hood":"Osaka","why":"La destilería donde arrancó el whisky japonés en 1923, entre Kioto y Osaka, a 15 minutos y ¥240 de la estación de Kioto. El problema no es si vale: es que no se entra caminando. Todo requiere reserva previa —incluso el museo gratuito— y el tour guiado de 80 min (¥3.000) sale por sorteo online que se resuelve unos dos meses antes: el de diciembre 2026 se sortea del 7 al 11 de octubre de 2026, con resultados el 17. Si no se gana el sorteo, queda el plan B real: reservar el Yamazaki Whisky Museum (gratis), la barra de degustación con varias decenas de whiskies y la tienda con botellas exclusivas de la destilería. Cierra por Año Nuevo y a las 16:45 en punto, así que en este viaje es actividad de mañana, nunca de tarde.","addr":"5 Chome-2-1 Yamazaki, Shimamoto, Mishima District, Osaka 618-0001, Japón","lat":34.8924574,"lng":135.6744508,"aprox":false,"gcid":"11670717660837342493","cost":3000,"dur":3,"sub":"Destilería de whisky · museo y barra de degustación, todo con reserva previa","typ":"Destilería","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: La visita es tour con exhibición más degustación; si el punto es la cata/bar podría ir a comida","src":"lista","gname":"Suntory Yamazaki Distillery","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.24,"tip":"No es un restaurante: no hay comida, ni siquiera gaseosas o snacks, y no se puede entrar con nada de afuera. Lo que se toma es la barra de degustación del Yamazaki Whisky Museum: varias decenas de etiquetas, incluidos componentes exclusivos de la destilería, servidas en medidas chicas (15 o 30 ml según la etiqueta; el menú cambió en 2024), máximo 3 tragos por persona por pedido, desde alrededor de ¥500 el trago según japan-guide (los precios exactos por etiqueta no los pude verificar en fuente oficial). Lo que no se consigue afuera son esos componentes exclusivos —los destilados por tipo de barril, mizunara y sherry entre ellos— y las botellas de la tienda, que con las ediciones raras van por sorteo interno. Reserva obligatoria hasta para entrar al museo gratis. La reserva del museo NO es por sorteo (es por orden de llegada), pero según kanko-map hasta los cupos gratuitos se agotan 1 a 2 semanas antes: reservala apenas esté fijado el día, no la víspera. Pago: la barra de degustación es SOLO cashless. La página oficial de Suntory dice textual que no se acepta efectivo: van tarjeta de crédito (VISA/Master/JCB/AMEX/Diners), dinero electrónico y pagos por código QR. japan-guide dice «cash-only» pero está desactualizado — no lleven efectivo esperando pagar con eso. Nada de degustar antes del tour, no te dejan.","season":"Año nuevo (29/12 al 3/1): Cerrado. La ficha oficial dice explícitamente \"closed over the New Year's holiday\"; las fechas exactas para 2026-27 no están publicadas todavía. Sumado a eso, el sorteo de tours de enero 2027 recién se resuelve a principios de noviembre de 2026. No lo pongas entre el 29/12 y el 3/1.","conf":"alta","warn":["Zona mal rotulada a medias: la prefectura real es OSAKA (Shimamoto, distrito de Mishima), no Kioto. Operativamente la etiqueta funciona igual porque está pegado al límite: 15 min y ¥240 desde estación de Kioto por la línea JR Kioto (unos 20 km), contra 30 min y ¥490 desde estación de Osaka. Es day trip desde Kioto, no desde Osaka.","NO SE ENTRA SIN RESERVA. Ni al museo gratuito. Los walk-ins se rechazan.","El tour pago (¥3.000, 80 min; el Prestige ¥10.000, 2 h, solo martes y jueves) va por sorteo online ~2 meses antes y la mayoría no gana a la primera. Ventana para visitas de DICIEMBRE 2026: postulación 7-11 de octubre de 2026 hasta las 16:29 JST, resultados por mail el 17, reserva del 17 al 21. Hoy es 9 de septiembre de 2026: llegan a tiempo, pero hay que agendarlo ahora.","Pagado el tour no hay reembolso; la cancelación cierra al mediodía de dos días antes.","Cierra 16:45 con último ingreso 16:30 y en Kansai ya está atardeciendo (~16:50 en diciembre): es actividad de mañana o mediodía, no se puede encajar después de otra cosa.","El tour en inglés es una sola salida por día (japan-guide); las de japonés son varias. Si quieren entender lo que dicen, el cupo es todavía más chico.","Cierres de planta no programados con aviso: revisá la página de closing dates de Suntory antes de clavar el día en el itinerario.","La barra de degustación no toma efectivo: sin tarjeta, dinero electrónico o pago por QR no se puede consumir nada."],"refs":["https://tabelog.com/en/osaka/A2706/A270604/27014817/","https://www.japan-guide.com/e/e3974.html","https://www.suntory.com/factory/yamazaki/","https://www.suntory.com/factory/yamazaki/news/detail/how_to_make_a_reservation.html","https://www.suntory.com/factory/yamazaki/news/detail/closing_dates.html","https://www.suntory.co.jp/factory/yamazaki/news/detail/post_17.html","https://www.suntory.co.jp/factory/blog-d/000013.html","https://www.gltjp.com/en/directory/item/11985/","https://kanko-map.com/en/suntory-hakushu-yamazaki-tours/","https://japaneatinerary.com/yamazaki-distillery-tour/"]},{"id":"u_g_16779247379445878154","n":"Ghibli’s Grand Warehouse","cat":"museo","hood":"Nagakute","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"乙１５３３-１, Ibaragabasama, Nagakute, Aichi 480-1342, Japón","lat":35.1735499,"lng":137.0894456,"aprox":false,"gcid":"16779247379445878154","cost":0,"dur":0,"sub":"-","typ":"Museo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Ghibli’s Grand Warehouse","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nagoya","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_7130087716276175294","n":"Studio Ghibli clock","cat":"arq","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-6-6 Higashishinbashi, Mi
