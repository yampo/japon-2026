:"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Rāmenya Shima","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_9124525651654476405","n":"MEGA Don Quijote","cat":"tienda","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"28-6 Udagawacho, Shibuya, Tokyo 150-0042, Japón","lat":35.6603873,"lng":139.6978172,"aprox":false,"gcid":"9124525651654476405","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"MEGA Don Quijote","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_5573842255134121516","n":"The Royal Park Hotel Iconic Osaka-Midosuji","cat":"alojamiento","hood":"Osaka","why":"Hotel de la cadena Royal Park (grupo Mitsubishi Estate) en el edificio Obic Midosuji de Hiranomachi, Chuo-ku: abrió en marzo de 2020 como primer \"Iconic\" de la marca y tiene 352 habitaciones. Ocupa del piso 15 al 25 — en el 15 están el lobby, el restaurante y el bar, y las habitaciones van del 16 al 25, con dos pisos ejecutivos (48 habitaciones en el 24 y 25) y lounge propio. Es opción de dormida, no de visita: está a 3 minutos a pie de la salida 13 de Yodoyabashi (línea Midosuji), a 4 de la salida 2 de Honmachi y a tres paradas de Namba, pero la zona es distrito bancario y de noche queda vacía de gente y de locales. Para dos que van a comer todo el día esa es la contra concreta: se duerme céntrico y cómodo, y la vida gastronómica de Osaka pasa más al sur (Namba, Dotonbori, Shinsekai) o caminando hacia Kitahama y Kitashinchi. No se pudo verificar ninguna tarifa: el sitio oficial solo cotiza contra fechas, y del 29/12 al 3/1 los precios de hotel en Japón suben, así que hay que cotizar antes de decidir.","addr":"Japón, 〒541-0046 Osaka, Chuo Ward, Hiranomachi, 4 Chome−2−3 15F","lat":34.6871315,"lng":135.5002261,"aprox":false,"gcid":"5573842255134121516","cost":0,"dur":0,"sub":"Hotel","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"The Royal Park Hotel Iconic Osaka-Midosuji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"El hotel tiene desayuno buffet en La Belle Assiette (7:00-10:00) y afternoon tea en THE BAR, ambos en el piso 15. No se pudieron verificar precios de ningún menú: el sitio oficial no los publica y remite al teléfono. Como base para comer, lo que más vale no es el desayuno del hotel sino la ubicación: Kitahama y Kitashinchi a pie, Namba a tres paradas de metro.","season":"","conf":"alta","warn":["La zona del catálogo es correcta: Hiranomachi 4-2-3, Chuo-ku, ciudad de Osaka, prefectura de Osaka. No hay error de asignación.","Precio no verificado: el sitio oficial no publica tarifas, solo cotiza contra fechas. Cost queda en 0 a propósito. Fin de año y shogatsu es temporada alta en Japón: cotizar antes de reservar.","Comportamiento del hotel del 29/12 al 3/1 sin verificar. Un hotel opera igual, pero no se pudo confirmar si La Belle Assiette y THE BAR cierran o cambian horario esos días; la página de novedades del hotel devolvió error 500. Preguntar al 06-4707-1118 (10:30-18:00) antes de contar con el desayuno del hotel.","Barrio de oficinas: de noche y en shogatsu casi todo lo de alrededor está cerrado. Si se elige este hotel, la cena hay que planificarla fuera de la zona.","352 habitaciones (200 doubles, 150 twins, 2 suites). Abrió el 16 de marzo de 2020, primer hotel de la línea premium \"Iconic\" de Royal Park Hotels (Mitsubishi Estate)."],"refs":["https://www.royalparkhotels.co.jp/ic/osakamidosuji/","https://www.royalparkhotels.co.jp/ic/osakamidosuji/access/","https://www.royalparkhotels.co.jp/ic/osakamidosuji/stay/","https://www.royalparkhotels.co.jp/ic/osakamidosuji/restaurant/","https://www.royalparkhotels.co.jp/ic/osakamidosuji/dining/la-belle-assiette/","https://www.royalparkhotels.co.jp/ic/osakamidosuji/about/faq/","https://www.royalparkhotels.co.jp/en/ic/osakamidosuji/","https://www.royalparkhotels.co.jp/"]},{"id":"u_g_10228050530913903125","n":"Kanazawa","cat":"barrio","hood":"Prefectura de Ishikawa","why":"Capital de Ishikawa y la candidata de Juan que mejor aguanta el desvío: 2h28 de shinkansen Kagayaki desde Tokio (tiempo confirmado por JR West) y ~2h desde Kioto con trasbordo en Tsuruga, con el casco compacto —Kenrokuen, el parque del castillo, Higashi Chaya, el mercado Ōmichō y el Museo del Siglo XXI— caminable en dos días. Para dos foodies el argumento duro es la fecha: la kōbako-gani (hembra de la zuwai, la que se come entera con las huevas) tiene veda el 29/12/2026, así que solo la agarran si llegan ANTES de esa fecha; el macho (kanō-gani, con etiqueta azul) sigue hasta el 20/3/2027 pero cuesta mucho más y sube de precio justo en fin de año. La contra es el invierno del lado del Mar de Japón: precipitación casi diaria, cielo tapado, nieve a partir de fines de diciembre y puesta de sol cerca de las 16:45, o sea poco menos de 10 horas de luz y una tarde corta. No es para un pantallazo: con menos de dos noches el viaje de ida y vuelta se come el día, y si van, conviene meterlo antes del 29/12 para esquivar el cierre de museos y comercios de shōgatsu.","addr":"Prefectura de Ishikawa, Japón","lat":36.5597341,"lng":136.6520376,"aprox":false,"gcid":"10228050530913903125","cost":0,"dur":8,"sub":"Prefectura de Ishikawa","typ":"Barrio","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Kanazawa","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kanazawa","rate":0,"tip":"","season":"Opera todo el año, no es montaña ni depende de teleféricos ni de rutas que cierren. Pero el invierno pesa: nieve desde fines de diciembre, precipitación casi todos los días en diciembre y enero, cielo cubierto y los \"buri-okoshi\" (truenos con granizo que pasa a nieve). El yukitsuri —los conos de sogas que sostienen las ramas en Kenrokuen— se arma desde el 1/11 y queda hasta mediados de marzo, así que en el viaje lo ven puesto. Recomiendan calzado impermeable: la calle queda mojada y resbalosa aun con el sistema de deshielo bajo el asfalto. En el centro de informes de la estación de Kanazawa prestan botas de goma gratis. · Año nuevo (29/12 al 3/1): Verificado, con una parte que hay que reconfirmar. Museo del Siglo XXI: cerrado del 29/12/2026 al 1/1/2027, dato publicado por el propio museo con esas fechas exactas. Ōmichō: abre hasta el 31/12 (los puestos de fresco cierran a medida que se les acaba la mercadería, la mayoría de los restaurantes solo hasta el almuerzo) y del 1 al 4/1 opera al mínimo —unos 10 locales el 1/1, subiendo a 24-42 hacia el 4/1—; la apertura completa es el hatsu-uri, en general el 5/1, sujeto a la fecha de la primera subasta del mercado central. O sea, después de que ellos se vuelvan. Templo Myōryūji (el \"ninja\"): cerrado 1 y 2/1. Casa Nomura de Nagamachi: cerrada 26 y 27/12 y 1 y 2/1 (ojo con las fechas de diciembre). Ambos datos salen del listado de fin de año 2025-26 de la asociación de turismo: el patrón se repite todos los años, reconfirmar cuando publiquen el de 2026-27. Kenrokuen es lo que va al revés: la página japonesa de la asociación de turismo dice que todos los años hay entrada gratis del 31/12 al 3/1 (8:00-17:00) y apertura toda la noche del 31/12 hasta las 8:00 del 1/1; OJO que la versión inglesa de esa misma ficha está rotulada 【suspension】 sin explicar el año ni el motivo — reconfirmar en noviembre de 2026 antes de planificar la noche del 31.","conf":"media","warn":["La zona está BIEN asignada: Kanazawa es la capital de la prefectura de Ishikawa, no un lugar mal rotulado. Lo que sí hay que decidir es el desvío: 2h28 desde Tokio en Kagayaki (tiempo confirmado por JR West; la tarifa ronda los ¥14.000-15.000 ida, confirmar en eki-net al reservar) y ~2h desde Kioto vía trasbordo en Tsuruga; hay un Hokuriku One-way Ticket para visitantes extranjeros a ¥6.500 (¥3.250 menores) que hay que pedir explícitamente — el pasaje común sale más. Menos de dos noches no cierra.","VENTANA DE CANGREJO: la kōbako-gani (hembra) termina el 29/12/2026 por veda de la prefectura, verificado para la temporada 2026-27 (apertura 6/11/2026). Si Kanazawa cae después del 29/12 pierden justo el plato por el que muchos van. El macho kanō-gani sigue hasta el 20/3/2027.","El Museo del Siglo XXI cierra del 29/12/2026 al 1/1/2027 (fechas publicadas por el museo, no una estimación). Además cierra por reformas de mayo 2027 a marzo 2028, lo cual no afecta este viaje pero sí cualquier plan posterior.","Ōmichō, el mercado que es LA parada foodie, está prácticamente cerrado del 1 al 4/1 y la apertura completa es el 5/1. Para dos que van a comer, Kanazawa entre el 1 y el 4 de enero es media ciudad.","La iluminación de Shirakawa-go 2027 es el 11, 17, 24 y 31 de enero (fechas confirmadas por Nohi Bus) — TODAS después del 7/1. No entra en este viaje: si querían Kanazawa como base para eso, no da. El pueblo se puede visitar igual en bus (~75 min desde la estación de Kanazawa) pero sin light-up.","OJO CON EL AÑO en las iluminaciones urbanas: las fechas que publica la oficina de turismo (Kinpaku Kirara en Ōmichō 17/10/2025-15/2/2026, Kōrinbō Tree Fantasy 1/11/2025-15/2/2026, Katamachi 3/11/2025-15/2/2026) son de la edición 2025-26. La edición 2026-27 todavía no está anunciada; el patrón sugiere que estarán activas en diciembre-enero pero no lo den por hecho.","El sol se pone cerca de las 16:45 y Kenrokuen deja de dar entrada 16:30 (cierra 17:00), así que jardín y castillo son de mañana/mediodía sí o sí. Lo de la noche es la iluminación gratuita del castillo/Gyokusen'inmaru — pero solo sábados y fechas designadas, no todas las noches.","El Kagayaki    La medida es el DESVÍO —cuánto se alarga el trayecto si paso por ahí,

   distintas: el Puente de Brooklyn está a 800 m de DUMBO y cuesta CERO metros

   corredor no existe (no pasás por el medio) y solo valen las puntas. */
const PASO_DESVIO = R.pasoDesvio;    /* m de desvío que se tolera en un tramo caminable */

const PASO_CERCA = R.pasoCerca;

  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));

  const aca = {}, tomadoAca = {};

    const hora = parseInt(String(b.t).slice(0, 2), 10);
    cand.forEach(q => {
      if (!esDesvioPosible(q, hora)) return;
      const dist = hav(a, [q.lat, q.lng]);

    aca[k].sort((x, y) => x.dist - y.dist);
    aca[k] = aca[k].slice(0, ACA_TOP);
  });
  const yaEnAca = {};
  Object.values(aca).flat().forEach(x => { yaEnAca[x.p.id] = 1; });

  /* Qué candidatos tiene cada tramo, ordenados por lo que cuesta pasar. */
  const tramos = [];
  for (let i = 0; i < paradas.length - 1; i++){
    const A = paradas[i].p, B = paradas[i+1].p;
    const a = [A.lat, A.lng], b = [B.lat, B.lng], dab = hav(a, b);
    const hora = parseInt(String(paradas[i+1].b.t).slice(0, 2), 10);   /* a qué hora se pasa */

     a la vuelta— no mostraba nada.

const BARRIO_TOP = R.barrioTop;
function enElBarrio(pb){
  if (!pb || pb.cat !== 'barrio' || !pb.lat) return [];
  const usados = {};
  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));
  const c = [pb.lat, pb.lng];
  return PLACES
    .filter(p => p.lat && p.id !== pb.id && !usados[p.id] && !PASO_FUERA[p.cat]
                 && VIDS.some(v => (p[v] || 0) > 0))
    .map(p => ({p, d: hav(c, [p.lat, p.lng])}))
    .filter(x => x.d <= BARRIO_RADIO || x.p.hood === pb.hood)
    .sort((x, y) => x.d - y.d)
    .slice(0, BARRIO_TOP);
}
/* Los mismos lugares, planos, para pintarlos en el mapa del día. */
function dePasoPlano(d){
  const r = dePasoDelDia(d);
  return Object.values(r.paso).flat()
    .concat(Object.values(r.aca).flat().map(x => ({p: x.p, desvio: x.dist})));
}
/* Las paradas de un día, en orden, sin repetir la misma dos bloques seguidos
   (el hotel al salir y al volver son dos paradas distintas; el mismo lugar en
   bloques pegados, una sola). */
function paradasDe(d){
  const out = [];
  d.blocks.forEach(b => {
    const p = b.pid ? PBY[b.pid] : null;
    /* ⚠ SIN COORDENADAS NO ES UNA PARADA para la geometría del día.
       amPunto() solo necesita un NOMBRE —le alcanza para armar un link de
       navegación— así que un lugar sin lat/lng entraba igual acá y después
       hav() lo comparaba contra todo el catálogo: distancia NaN, y como
       `NaN > ACA_RADIO` es false, se llevaba cuatro lugares de cualquier punto
       de la ciudad como «acá cerca» a NaN metros, robándoselos a las paradas
       reales. Con el catálogo editable desde la app, un lugar sin ubicación es
       un estado normal, así que esto pasó de hipótesis a certeza. */
    if (!tieneUbic(p)) return;
    if (!amPunto(p)) return;
    if (out.length && out[out.length - 1].p.id === p.id) return;
    out.push({b, p});
  });
  return out;
}
/* Un costo que no es número pintaba «$undefined» en nueve puntos. */
const money = n => { const v = +n; return !Number.isFinite(v) ? '—' : v === 0 ? 'gratis' : plata(v); };
/* El «por qué» recortado y escapado. p.why.slice reventaba en 4 puntos, y uno
   de ellos es el que arma el texto al agendar un lugar en un día. */
const why = (p, max) => { const w = String((p && p.why) || '');
  return w.length > max ? esc(w.slice(0, max)) + '…' : esc(w); };
/* El texto con el que un lugar entra a un día. Sin why, el nombre solo. */
const txtBloque = p => String(p.n || '') + (p.why ? ' — ' + String(p.why).slice(0, 120) : '');
const DIAS = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
/* Horario del lugar para un día de la semana (0=lunes). Devuelve null si no hay dato. */
function horario(p, wd){
  if (!p.hrs) return null;
  const w = p.hrs[wd];
  return w ? `${w[0]}–${w[1]}` : 'CERRADO';
}
/* Texto compacto de la semana entera, agrupando días con el mismo horario. */
function horarioSemana(p){
  if (!p.hrs) return '';
  const out = []; let ini = 0;
  for (let i = 1; i <= 6; i++){
    const a = JSON.stringify(p.hrs[i]), b = JSON.stringify(p.hrs[i-1]);
    if (a !== b){ out.push([ini, i-1]); ini = i; }
  }
  out.push([ini, 6]);
  return out.map(([a,b]) => {
    const w = p.hrs[a], r = a === b ? DIAS[a] : `${DIAS[a]} a ${DIAS[b]}`;
    return `${r}: ${w ? w[0]+'–'+w[1] : 'cerrado'}`;
  }).join(' · ');
}
/* ── El reloj ─────────────────────────────────────────────────────────────────
   `new Date().toISOString()` es UTC: en Nueva York (UTC-4) a partir de las 20:00
   locales devolvía el día SIGUIENTE, o sea que todas las noches del viaje —Birdland,
   el Vanguard, Café Wha— la app creía que ya era mañana. Va en hora local.
   `window.__NOW` existe solo para poder probar el "ahora" desde Playwright. */
function NOW(){ return window.__NOW ? new Date(window.__NOW) : new Date(); }
function hoyStr(){ const d = NOW();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
let TODAY = hoyStr();
const minOf = t => /^\d{1,2}:\d{2}$/.test(String(t)) ? (+String(t).slice(0,2))*60 + (+String(t).slice(3,5)) : null;
const minsNow = () => { const d = NOW(); return d.getHours()*60 + d.getMinutes(); };
const hhmmNow = () => { const d = NOW();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const enMin = m => m < 60 ? m + ' min' : Math.floor(m/60) + ' h' + (m%60 ? ' ' + (m%60) + ' min' : '');

/* ── leadOf: jerarquía, no tijera ─────────────────────────────────────────────
   Los textos del catálogo ya vienen con una estructura: ★ al principio para lo
   destacado, y un separador temprano —" — ", ". " o ": "— entre el QUÉ y el
   POR QUÉ. Se parte ahí. El resto NO se pierde: se muestra entero al desplegar.
   El ":" se exige precedido de algo que no sea dígito para no cortar en "125 St: 12". */
function leadOf(txt){
  let t = String(txt == null ? '' : txt).trim(), star = 0;
  const m = t.match(/^([★☆]+)\s*/);
  if (m){ star = m[1].length; t = t.slice(m[0].length); }
  const cands = [];
  const cab = t.slice(0, 100);
  const e = cab.search(/\s[—–]\s/);       if (e > 6)  cands.push([e, 3]);
  const p = cab.search(/\.\s/);           if (p > 10) cands.push([p, 2]);
  const c = cab.search(/[^\d]:\s/);       if (c > 10) cands.push([c + 1, 2]);
  cands.sort((a, b) => a[0] - b[0]);
  let head, rest;
  if (cands.length){ head = t.slice(0, cands[0][0]).trim(); rest = t.slice(cands[0][0] + cands[0][1]).trim(); }
  else if (t.length > 92){ const sp = t.lastIndexOf(' ', 92);
    head = t.slice(0, sp > 20 ? sp : 92).trim() + '…'; rest = t; }
  else { head = t; rest = ''; }
  return {star, head, rest, full: t};
}
/* El catálogo escribe en MAYÚSCULAS dos cosas distintas: advertencias
   ("CIERRA LOS SÁBADOS", "RESERVA NO MODIFICABLE") y énfasis o nombres propios
   ("el MET", "SUMMIT", "JOSHUA REDMAN"). Marcar cualquier mayúscula encendía el ⚠
   en 51 de 143 bloques y dejaba de significar algo. Con este vocabulario quedan 28,
   y los 28 son advertencias de verdad: si el ⚠ aparece, hay que abrir el bloque. */
const RX_AVISO = /\b(NO|OJO|CIERRA|CERRAD[AO]S?|S[ÁA]BADOS?|DOMINGOS?|LUNES|MARTES|MI[ÉE]RCOLES|JUEVES|VIERNES|RESERVAR?|RESERVAD[AO]S?|MODIFICABLE|OBLIGAD[AO]S?|LLEGAR|SALIR|SALIDA|[ÚU]LTIM[AO]S?|M[ÁA]XIMO|M[ÍI]NIMO|TIMED|TICKET|AGOTAD[AO]S?|PEDIR|COMPRAR|EVITAR|CUIDADO|IMPRESCINDIBLE|PREINSCRIPCI[ÓO]N|HORARIO|ASIGNADO|PUNTUAL|CONFIRMAR|VERIFICAR|ANTES|EXACT[AO]S?|CUPO|FILA|COLA)\b/;
const tieneAviso = rest => RX_AVISO.test(String(rest || ''));

/* Índice del bloque que toca AHORA en un día: el último cuya hora ya pasó.
   Devuelve -1 si el día no es hoy o si todavía no arrancó. */
function idxAhora(d){
  if (!d || d.date !== TODAY) return -1;
  const m = minsNow(); let idx = -1;
  d.blocks.forEach((b, i) => { const t = minOf(b.t); if (t != null && t <= m) idx = i; });
  return idx;
}

function setStat(){

/* NO se importa a ciegas. Una lista de Google no trae categoría ni barrio —que

function revisarLista(filas){

    <p class="sm muted" style="margin:0 0 10px"><b>${nuevas.length}</b> lugar${nuevas.length !== 1 ? 'es' : ''} nuevo${nuevas.length !== 1 ? 's' : ''} ·
      <b>${conUbic}</b> con ubicación${repetidas ? ` · ${repetidas} ya se habían mirado` : ''}.

    <div class="flex" style="gap:7px;margin-bottom:9px">
      <label class="fl" style="flex:1;margin:0">Categoría para todos
        <select class="search" id="liCat">${Object.entries(CAT).map(([k, v]) =>
          `<option value="${k}"${k==='comida'?' selected':''}>${esc(v.n)}</option>`).join('')}</select></label>
      <label class="fl" style="flex:1;margin:0">Barrio o ciudad
        <input class="search" id="liHood" placeholder="se puede editar después"></label>
    </div>
    <div id="liLista" style="max-height:38vh;overflow-y:auto;border:1px solid var(--line);
      border-radius:11px;padding:7px">
      ${nuevas.map((x, i) => `<label style="display:flex;gap:8px;align-items:flex-start;
        padding:6px 4px;border-bottom:1px solid var(--line)">
        <input type="checkbox" data-i="${i}"${dups[i] ? '' : ' checked'} style="margin-top:3px">
        <span style="flex:1;min-width:0">
          <b style="font-size:13.5px">${esc(x.n)}</b>
          <span class="xs muted" style="display:block">
            ${tieneUbic(x) ? '📍 con ubicación' : 'sin ubicación'}${x.gcid ? ' · abre exacto en Maps' : ''}
            ${dups[i] ? ' · <b style="color:var(--accent)">' + esc(dups[i]) + '</b>' : ''}</span>
          ${x.why ? `<span class="xs muted" style="display:block;font-style:italic">${esc(x.why.slice(0,110))}</span>` : ''}
        </span></label>`).join('')}
    </div>
    <div class="flex" style="margin-top:12px;justify-content:flex-end">
      <button class="btn ghost sm" id="liNada" style="margin-right:auto">No importar ninguno</button>
      <button class="btn ghost" id="liCancel">Cancelar</button>
      <button class="btn" id="liOk">Importar</button></div>`);

  const marcados = () => [...document.querySelectorAll('#liLista input:checked')]
    .map(e => nuevas[+e.dataset.i]);
  $('#liCancel').onclick = closeSheet;
  /* «No importar ninguno» NO es cancelar: marca las filas como vistas, así la
     próxima reconciliación no vuelve a ofrecerlas. Es la respuesta a «esta lista
     no me sirve» sin tener que destildar cien casillas cada vez. */
  $('#liNada').onclick = () => guardarLista(filas, []);
  $('#liOk').onclick = () => guardarLista(filas, marcados());
}

/* ══════════ IMPORTAR UNA LISTA DE GOOGLE MAPS ══════════════════════════════
   PEGAR EL LINK DE UNA LISTA NO SE PUEDE, y no es falta de ingenio: son tres
   paredes independientes y con una sola alcanzaba.
     1 · CORS. Ni google.com/maps/* ni maps.app.goo.gl mandan
         access-control-allow-origin: el navegador bloquea el fetch antes de
         recibir un byte. Y x-frame-options cierra el truco del iframe.
     2 · La lista no está en el HTML. Google manda un cascarón de SPA y los
         lugares los pinta JavaScript.
     3 · La app corre offline. Aunque lo anterior no existiera, no hay red.

   Lo que SÍ funciona, y cubre el caso entero: el archivo que Google te da.
     · Takeout → CSV de una lista guardada (Title, Note, URL…)
     · Takeout → Saved Places.json (GeoJSON)
     · Mis Mapas → KML
     · O una pila de links de Google Maps, uno por línea

   De todos sale nombre, ubicación, el cid —que es lo que abre la ficha exacta—
   y TU NOTA, que es lo más valioso porque es el «por qué». */

/* CSV a mano. Las notas son texto libre del usuario: traen comas, comillas
   escapadas como "" y hasta saltos de línea adentro de la celda. Un split(',')
   pierde filas enteras. */
function csvFilas(s){
  const out = []; let f = [], c = '', q = false;
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if (q){ if (ch === '"'){ if (s[i+1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { f.push(c); c = ''; }
    else if (ch === '\n'){ f.push(c); out.push(f); f = []; c = ''; }
    else if (ch !== '\r') c += ch;
  }
  if (c !== '' || f.length){ f.push(c); out.push(f); }
  return out.filter(r => r.some(x => x.trim()));
}

/* El CSV de Takeout tiene al menos dos encabezados vivos —con y sin «Tags»— así
   que se mapea por NOMBRE de columna, nunca por posición. */
function deCSV(txt){
  const filas = csvFilas(txt);
  if (filas.length < 2) return null;
  const h = filas[0].map(x => x.trim().toLowerCase().replace(/^\uFEFF/, ''));
  const I = n => h.indexOf(n);
  const iT = I('title'), iU = I('url'), iN = I('note'), iC = I('comment'), iA = I('address');
  if (iT < 0) return null;
  return filas.slice(1).map(r => {
    /* Las URLs de Google llevan comas adentro (@35.71,139.79,17z). Google las
       entrecomilla como manda el CSV, pero un archivo editado a mano o pasado
       por otra herramienta puede llegar partido en varias columnas. Rearmando
       la fila con comas se recupera la URL entera, y datosDeLink busca el
       patrón en todo el texto: sirve para las dos formas. */
    let d = datosDeLink(iU >= 0 ? (r[iU] || '').trim() : '');
    if (d.lat == null && !d.cid) d = datosDeLink(r.join(','));
    return {n: (r[iT] || d.nombre || '').trim(),
            why: [iN >= 0 ? r[iN] : '', iC >= 0 ? r[iC] : '']
                   .map(x => (x || '').trim()).filter(Boolean).join(' · '),
            addr: iA >= 0 ? (r[iA] || '').trim() : '',
            lat: d.lat, lng: d.lng, gcid: d.cid};
  }).filter(x => x.n);
}

/* KML de Mis Mapas. ⚠ EN KML LAS COORDENADAS VAN lng,lat,alt — al revés que en
   toda esta app. Invertirlas manda Nueva York al desierto de Xinjiang. */
function deKML(txt){
  let doc;
  try { doc = new DOMParser().parseFromString(txt, 'text/xml'); } catch(e){ return null; }
  if (!doc || doc.getElementsByTagName('parsererror').length) return null;
  const pms = [...doc.getElementsByTagName('Placemark')];
  if (!pms.length) return null;
  return pms.map(pm => {
    const tx = t => { const e = pm.getElementsByTagName(t)[0]; return e ? e.textContent.trim() : ''; };
    const [lng, lat] = (tx('coordinates').split(/\s+/)[0] || '').split(',').map(Number);
    const ed = {};
    [...pm.getElementsByTagName('Data')].forEach(dd => {
      const v = dd.getElementsByTagName('value')[0];
      ed[(dd.getAttribute('name') || '').toLowerCase()] = v ? v.textContent.trim() : '';
    });
    const desc = tx('description').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    return {n: tx('name') || ed.name || '', why: ed.note || ed.comment || desc,
            addr: ed.address || '',
            lat: Number.isFinite(lat) ? lat : null, lng: Number.isFinite(lng) ? lng : null,
            gcid: datosDeLink(desc + ' ' + (ed.url || '')).cid};
  }).filter(x => x.n && !(x.lat === 0 && x.lng === 0));
}

/* Saved Places.json. Google cambió el esquema y las DOS versiones circulan: la
   vieja con claves capitalizadas, la nueva en minúscula. Y el [0,0] es un bug
   conocido de Google —el golfo de Guinea—, no un lugar: va como «sin ubicación». */
function deGeoJSON(o){
  if (!o || o.type !== 'FeatureCollection' || !Array.isArray(o.features)) return null;
  return o.features.map(f => {
    const p = f.properties || {}, g = f.geometry || {};
    const L = p.Location || p.location || {};
    const cc = (g.type === 'Point' && Array.isArray(g.coordinates)) ? g.coordinates : [];
    const lng = +cc[0], lat = +cc[1];
    const cero = !(lat || lng);
    return {n: p.Title || p.title || L['Business Name'] || L.name || L.Address || L.address || '',
            addr: L.Address || L.address || '',
            why: L.Comment || p.Comment || p.comment || '',
            lat: cero ? null : (Number.isFinite(lat) ? lat : null),
            lng: cero ? null : (Number.isFinite(lng) ? lng : null),
            gcid: datosDeLink(p['Google Maps URL'] || p.google_maps_url || '').cid};
  }).filter(x => x.n);
}

/* Un solo punto de entrada. null = «esto no es ninguno de los cuatro». */
function leerListaGoogle(txt){
  const s = String(txt || '').replace(/^\uFEFF/, '').trim();
  if (!s) return null;
  if (s[0] === '{' || s[0] === '['){
    try { return deGeoJSON(JSON.parse(s)); } catch(e){ return null; }
  }
  if (/^(<\?xml|<kml)/i.test(s)) return deKML(s);
  const porCSV = deCSV(s);
  if (porCSV && porCSV.length) return porCSV;
  const links = s.split('\n').map(x => x.trim())
                 .filter(x => /google\.[a-z.]+\/maps|maps\.app\.goo\.gl|[?&]cid=/.test(x));
  if (links.length) return links.map((u, i) => {
    const d = datosDeLink(u);
    /* Un link corto trae el cid pero no el nombre. Se le pone uno provisorio en
       vez de dejarlo anónimo: sin nombre no pasa la validación del catálogo, y
       un lugar que se pierde en silencio es peor que uno mal nombrado. */
    return {n: d.nombre || ('Sin nombre (link ' + (i + 1) + ')'), why: '', addr: '',
            lat: d.lat, lng: d.lng, gcid: d.cid};
  }).filter(x => x.n || x.gcid);
  return null;
}

/* ¿Este lugar de la lista ya está en el viaje? El cid es la identidad fuerte;
   el nombre normalizado, la débil. Se devuelve el motivo, para poder mostrarlo. */
const normNom = x => String(x || '').normalize('NFKD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function yaEsta(x){
  if (x.gcid){
    const p = PLACES.find(q => q.gcid && String(q.gcid) === String(x.gcid));
    if (p) return 'ya está: ' + p.n;
  }
  const n = normNom(x.n);
  if (!n) return '';
  const p = PLACES.find(q => normNom(q.n) === n);
  return p ? 'mismo nombre que «' + p.n + '»' : '';
}

/* ── LAS FECHAS DEL VIAJE ────────────────────────────────────────────────────
   Se elige cuándo ARRANCA y todos los días se corren en bloque, conservando la
   duración. No se pueden agregar ni sacar días desde acá, y no es capricho: un
   día no es una fecha. Es también el título, el POR QUÉ del día, dónde se
   duerme y quiénes van — y la app no tiene cómo escribir nada de eso.

   ⚠ DOS TRAMPAS, las dos verificadas en el navegador:

   1. `new Date('2026-12-26')` se parsea como UTC. En Bogotá (UTC-5) devuelve el
      día ANTERIOR: getDay() da viernes para un sábado. Es el mismo bug que este
      archivo ya documenta para toISOString(). Siempre con 'T12:00:00'.

   2. `Date.getDay()` cuenta 0=DOMINGO, pero DOW_IDX y los horarios del catálogo
      cuentan 0=LUNES. La conversión es (getDay()+6)%7. Equivocarse acá corre
      TODOS los horarios de apertura un día — y no se rompe nada visible: la app
      muestra el horario del martes en un miércoles y uno se entera parado
      frente a la puerta cerrada. */
/* ⚠ `+null` es 0 y `Number.isFinite(0)` es true: chequear la latitud así deja
   pasar un lugar SIN ubicación como si estuviera en 0,0 — el golfo de Guinea.
   Es el mismo bug que Google tiene en sus exports y que este código copió sin
   querer. Un lugar sin ubicación tiene que quedar afuera del mapa y de toda
   cuenta de distancia, no plantado en el Atlántico. */
function tieneUbic(p){
  if (!p) return false;
  const la = p.lat, lo = p.lng;
  if (la == null || lo == null || la === '' || lo === '') return false;
  return Number.isFinite(+la) && Number.isFinite(+lo) && !(+la === 0 && +lo === 0);
}

const DIAS_SEM = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const fechaLocal = f => new Date(String(f) + 'T12:00:00');
const dowDe = f => DIAS_SEM[(fechaLocal(f).getDay() + 6) % 7];
function sumarDias(f, n){
  const d = fechaLocal(f); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}

/* Corre el itinerario para que el día 1 caiga en `arranque`. Idempotente: se
   calcula siempre contra las fechas del BUILD, no contra las ya corridas, así
   aplicarlo dos veces no acumula. */
function aplicarArranque(s){
  const a = s && s.arranque;
  if (!a || !/^\d{4}-\d{2}-\d{2}$/.test(a) || !Array.isArray(s.itin) || !s.itin.length) return false;
  const base = (BASE_ITIN[0] || {}).date;
  if (!base || base === a) return false;
  const off = Math.round((fechaLocal(a) - fechaLocal(base)) / 864e5);
  if (!off) return false;
  s.itin.forEach((d, i) => {
    const orig = (BASE_ITIN[i] || {}).date || d.date;
    d.date = sumarDias(orig, off);
    d.dow = dowDe(d.date);        /* el horario de apertura depende de esto */
  });
  return true;
}

function elegirFechas(){
  const d1 = S.itin[0], dn = S.itin[S.itin.length - 1];
  const base = (BASE_ITIN[0] || {}).date || d1.date;
  sheet(`<h2 style="font-size:17px;margin-bottom:5px">Fechas del viaje</h2>
    <p class="sm muted" style="margin:0 0 12px">Elegí cuándo arranca y los
      ${S.itin.length} días se corren en bloque. La duración no cambia: agregar o
      sacar días se hace en el itinerario, no acá.</p>
    <label class="fl">Primer día
      <input class="search" type="date" id="fArr" value="${esc(d1.date)}"></label>
    <div class="sm muted" id="fPrev" style="margin:2px 0 12px"></div>
    <div class="flex" style="justify-content:flex-end">
      ${S.arranque ? '<button class="btn ghost sm" id="fReset" style="margin-right:auto">Volver a las del plan</button>' : ''}
      <button class="btn ghost" id="fCancel">Cancelar</button>
      <button class="btn" id="fOk">Guardar</button></div>`);
  const prev = () => {
    const v = $('#fArr').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)){ $('#fPrev').textContent = ''; return; }
    const fin = sumarDias(v, S.itin.length - 1);
    $('#fPrev').innerHTML = `${dowDe(v)} ${v.slice(8)}/${v.slice(5,7)} → ` +
      `${dowDe(fin)} ${fin.slice(8)}/${fin.slice(5,7)}` +
      (v === base ? '' : ` · <b>corre ${Math.round((fechaLocal(v)-fechaLocal(base))/864e5)} días</b>`) +
      `<br>Los horarios de apertura se recalculan: cambia el día de la semana.`;
  };
  prev(); $('#fArr').oninput = prev;
  $('#fCancel').onclick = closeSheet;
  if ($('#fReset')) $('#fReset').onclick = () => { S.arranque = ''; guardarFechas(); };
  $('#fOk').onclick = () => {
    const v = $('#fArr').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast('Elegí una fecha'); return; }
    S.arranque = v; guardarFechas();
  };
}

function guardarFechas(){
  /* Se rearma desde el itinerario del build para no acumular corrimientos, y se
     conserva lo que el usuario haya hecho: tildes, notas y bloques propios. */
  const suyo = {};
  S.itin.forEach(d => d.blocks.forEach(b => {
    if (b.done || b.mynote || String(b.id).startsWith('x')) suyo[d.n] = (suyo[d.n]||[]).concat([b]);
  }));
  S.itin.forEach((d, i) => { const o = BASE_ITIN[i]; if (o){ d.date = o.date; d.dow = o.dow; } });
  aplicarArranque(S);
  TODAY = hoyStr();
  save(); closeSheet(); rTodo();
  toast(S.arranque ? 'Fechas actualizadas' : 'Vuelve a las fechas del plan');
}

/* ── EN QUÉ MONEDA SE VE LA PLATA ────────────────────────────────────────────
   Los costos NO se tocan: siguen guardados en la moneda del viaje. Esto cambia
   solo cómo se pintan, y solo en este dispositivo.

   La fecha de la cotización se muestra SIEMPRE. Una de hace tres meses sirve
   igual para saber si algo es caro o barato; lo que no se puede es fingir que
   es de hoy. Por eso además todo lo convertido lleva «~». */
function elegirMoneda(){
  const act = monedaVista();
  sheet(`<h2 style="font-size:17px;margin-bottom:5px">Ver la plata en…</h2>
    <p class="sm muted" style="margin:0 0 11px">Los precios están cargados en
      ${esc(SIMB[MONBASE] || MONBASE)} <b>${esc(MONBASE)}</b>, la moneda del viaje.
      Lo demás es una conversión y se marca con «~».</p>
    ${MONEDAS_VER.map(c => {
      const t = tasa(c), mio = S.fxMio && S.fxMio[c];
      const det = c === MONBASE ? 'la moneda del viaje — los números reales'
        : t ? `1 ${MONBASE} = ${new Intl.NumberFormat('es-CO',{maximumSignificantDigits:4}).format(t)} ${c}`
              + (mio ? ' · corregida por vos' : (FX && FX.fecha ? ` · cotización del ${FX.fecha}` : ''))
        : 'sin cotización disponible';
      return `<button class="opt" data-mon="${c}"${c===act?' style="border-color:var(--navy);border-width:2px"':''}>
        ${esc(SIMB[c] || c)} ${esc(c)}<b>${esc(det)}</b></button>`;
    }).join('')}
    ${MONEDAS_VER.length > 1 ? `<button class="btn ghost sm" id="fxMano" style="margin-top:9px">
      Corregir una cotización a mano</button>
      <p class="sm muted" style="margin:7px 0 0">La tasa del cajero no es la del mercado,
        y la del aeropuerto menos. Poné la que te cobraron de verdad.</p>` : ''}`);
  $('#sheet').onclick = e => {
    const b = e.target.closest('[data-mon]');
    if (b){ S.moneda = b.dataset.mon; save(); closeSheet(); rTodo(); return; }
    if (e.target.id === 'fxMano') corregirTasa();
  };
}

function corregirTasa(){
  const otras = MONEDAS_VER.filter(c => c !== MONBASE);
  planSheet('Corregir una cotización',
    `Escribí cuántos <b>${esc(otras[0])}</b> te dan por 1 ${esc(MONBASE)}. ` +
    `Vacío vuelve a la del build${FX && FX.fecha ? ' (' + esc(FX.fecha) + ')' : ''}.`,
    String((S.fxMio && S.fxMio[otras[0]]) || (tasa(otras[0]) || '')),
    [{t: 'Guardar', f: txt => {
      const v = parseFloat(String(txt).replace(',', '.'));
      if (!S.fxMio) S.fxMio = {};
      if (Number.isFinite(v) && v > 0) S.fxMio[otras[0]] = v; else delete S.fxMio[otras[0]];
      save(); document.getElementById('planSheet').remove(); closeSheet(); rTodo();
      toast(Number.isFinite(v) && v > 0 ? 'Cotización corregida' : 'Vuelve a la del build'); }}], true);
}

/* ═══════════ EL CATÁLOGO EDITABLE ═══════════════════════════════════════════
   Crear, editar y borrar lugares desde la app. Lo que se hace acá vive en este
   navegador hasta que se exporta y alguien lo baja al catálogo compartido con
   merge_export.py — igual que los intereses y las marcas.

   POR QUÉ HACE FALTA SABER QUIÉN SOS: cuando varias personas cargan lugares,
   cada una desde su celular, quien consolida tiene que poder ver de quién vino
   cada aporte para resolver los duplicados. Se pregunta UNA vez. */

/* Un id que no puede chocar: prefijo reservado (el build prohíbe 'u_' en el
   catálogo), la marca de quién lo creó, y una cola al azar. Dos personas
   offline pueden generar la misma cola, pero no con el mismo autor. */
function nuevoId(){
  const rnd = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  return 'u_' + (S.yo || 'x') + '_' + rnd;
}

function pedirQuienSoy(luego){
  if (S.yo && VBY[S.yo]) { luego(); return; }
  if (NV === 1){ S.yo = VIDS[0]; save(); luego(); return; }
  sheet(`<h2 style="font-size:17px;margin-bottom:5px">¿Quién sos?</h2>
    <p class="sm muted" style="margin:0 0 11px">Para saber de quién vino cada lugar cuando
      se junten los aportes de todos. Se pregunta una sola vez.</p>
    ${VS.map(v => `<button class="opt" data-yo="${v.id}">${esc(v.nombre)}</button>`).join('')}`);
  $('#sheet').onclick = e => { const b = e.target.closest('[data-yo]'); if (!b) return;
    S.yo = b.dataset.yo; save(); closeSheet(); luego(); };
}

/* ── El formulario ───────────────────────────────────────────────────────────
   Cuatro campos son obligatorios y el resto no: nombre, categoría, barrio y el
   «por qué». Los tres primeros porque sin ellos hay vistas que no saben qué
   dibujar; el «por qué» porque es LO ÚNICO que se lee para decidir si ir, y un
   lugar sin eso es una fila muerta en una lista de trescientas. */
const CAMPOS_LIBRES = [
  ['n', 'Nombre', 'texto', true],
  ['cat', 'Categoría', 'cat', true],
  ['hood', 'Barrio', 'texto', true],
  ['why', 'Por qué vale la pena', 'largo', true],
  ['addr', 'Dirección', 'texto', false],
  ['cost', 'Costo por persona', 'num', false],
  ['dur', 'Cuántas horas lleva', 'num', false],
  ['sub', null, 'texto', false],          // el rótulo sale de TPT.nombre
  ['typ', 'Tipo (subcategoría)', 'texto', false],
  ['book', 'Reserva que necesita', 'texto', false],
  ['free', 'Ventana gratis', 'texto', false],
  ['closed', 'Día que cierra', 'texto', false],
];

function editarLugar(pid){
  pedirQuienSoy(() => formLugar(pid));
}

function formLugar(pid){
  const orig = pid ? PBY[pid] : null;
  const esNuevo = !pid;
  const propio = orig && S.nuevos[orig.id];
  const v = k => esc(String((orig && orig[k] != null ? orig[k] : '')));
  const zonas = Object.keys(TRIP.zonas || {});
  sheet(`<h2 style="font-size:17px;margin-bottom:3px">${esNuevo ? 'Lugar nuevo' : 'Editar lugar'}</h2>
    <p class="sm muted" style="margin:0 0 12px">${esNuevo
      ? 'Queda en este dispositivo hasta que exportes el plan y se junte con el de los demás.'
      : 'Lo que cambies pisa al catálogo solo en tu pantalla, hasta que se consolide.'}</p>
    <div id="frm">
      ${CAMPOS_LIBRES.map(([k, lab, tipo, req]) => {
        const rotulo = lab || TPT.nombre;
        if (tipo === 'cat') return `<label class="fl">${rotulo}${req?' *':''}
          <select class="search" data-k="cat">${Object.entries(CAT).map(([ck, cv]) =>
            `<option value="${ck}"${orig && orig.cat===ck?' selected':''}>${esc(cv.n)}</option>`).join('')}</select></label>`;
        if (tipo === 'largo') return `<label class="fl">${rotulo}${req?' *':''}
          <textarea class="bnote" data-k="${k}" style="min-height:74px;width:100%"
            placeholder="Qué tiene de bueno. Es lo que se lee para decidir.">${v(k)}</textarea></label>`;
        return `<label class="fl">${rotulo}${req?' *':''}
          <input class="search" data-k="${k}" ${tipo==='num'?'inputmode="decimal"':''}
            value="${v(k)}" placeholder="${tipo==='num'?'0':''}"></label>`;
      }).join('')}
      ${zonas.length ? `<label class="fl">Zona
        <select class="search" data-k="boro">${['', ...zonas].map(z =>
          `<option value="${esc(z)}"${orig && orig.boro===z?' selected':''}>${esc(z || '—')}</option>`).join('')}</select></label>` : ''}
    </div>
    <div class="fl" style="margin-top:2px"><b style="font-size:12px">Ubicación</b>
      <div id="ubic" class="sm muted" style="margin:4px 0 7px">${orig && orig.lat
        ? '📍 ' + (+orig.lat).toFixed(5) + ', ' + (+orig.lng).toFixed(5)
        : 'sin ubicación — el lugar funciona igual, pero no sale en el mapa'}</div>
      <div class="flex">
        <button class="btn ghost sm" id="ubGps">Estoy acá</button>
        <button class="btn ghost sm" id="ubLink">Pegar link de Maps</button>
        ${orig && orig.lat ? '<button class="btn ghost sm" id="ubBorrar">Quitar</button>' : ''}
      </div></div>
    <div class="flex" style="margin-top:14px;justify-content:flex-end">
      ${!esNuevo && propio ? '<button class="btn ghost sm" id="lgBorrar" style="margin-right:auto;color:var(--red)">Borrar lugar</button>' : ''}
      ${!esNuevo && !propio ? '<button class="btn ghost sm" id="lgOcultar" style="margin-right:auto">Sacarlo del viaje</button>' : ''}
      <button class="btn ghost" id="lgCancel">Cancelar</button>
      <button class="btn" id="lgOk">${esNuevo ? 'Crear' : 'Guardar'}</button></div>`);

  let coord = orig && orig.lat ? {lat: +orig.lat, lng: +orig.lng, aprox: !!(orig && orig.aprox)} : null;
  let gcid = (orig && orig.gcid) || '';
  const pintaUbic = () => { $('#ubic').innerHTML = (coord
    ? '📍 ' + coord.lat.toFixed(5) + ', ' + coord.lng.toFixed(5) + (coord.aprox ? ' <b>(aproximada)</b>' : '')
    : 'sin ubicación — el lugar funciona igual, pero no sale en el mapa')
    + (gcid ? '<br><b style="color:var(--green)">✓ identificado en Google Maps: abre la ficha exacta</b>' : ''); };

  $('#ubGps').onclick = () => {
    if (!navigator.geolocation){ toast('Este navegador no da ubicación'); return; }
    $('#ubic').textContent = 'buscando…';
    navigator.geolocation.getCurrentPosition(
      pos => { /* Arriba de ~60 m el GPS ya mueve resultados: los radios de «acá
                  cerca» son de 350 m. Se marca aproximada, como los pines del
                  catálogo que no se pudieron verificar. */
        coord = {lat: pos.coords.latitude, lng: pos.coords.longitude,
                 aprox: (pos.coords.accuracy || 0) > 60};
        /* El GPS da un punto, no un negocio: si venía identificado de un link,
           esa identidad ya no corresponde a estas coordenadas. */
        gcid = '';
        pintaUbic(); },
      err => { $('#ubic').textContent = 'no se pudo: ' + err.message; },
      {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
  };

  $('#ubLink').onclick = () => {
    planSheet('Pegar un link de Google Maps',
      'De la <b>barra de direcciones</b> en la compu, o «Compartir → Copiar vínculo» y después abrirlo. ' +
      'Los links cortos (maps.app.goo.gl) <b>no traen coordenadas</b> y no se pueden resolver sin internet.',
      '', [{t:'Usar', f: txt => {
        const d = datosDeLink(txt);
        if (d.lat == null && !d.cid){ toast('No encontré el lugar en ese link'); return; }
        if (d.lat != null) coord = {lat: d.lat, lng: d.lng, aprox: false};
        gcid = d.cid || gcid;
        /* Si el campo Nombre está vacío, el que viene en el link sirve. */
        const campoN = $('#frm').querySelector('[data-k="n"]');
        if (campoN && !campoN.value.trim() && d.nombre) campoN.value = d.nombre;
        pintaUbic();
        document.getElementById('planSheet').remove(); }}], true);
  };
  if ($('#ubBorrar')) $('#ubBorrar').onclick = () => { coord = null; gcid = ''; pintaUbic(); };

  $('#lgCancel').onclick = closeSheet;
  if ($('#lgBorrar')) $('#lgBorrar').onclick = () => borrarLugar(orig.id, true);
  if ($('#lgOcultar')) $('#lgOcultar').onclick = () => borrarLugar(orig.id, false);

  $('#lgOk').onclick = () => {
    const datos = {};
    $('#frm').querySelectorAll('[data-k]').forEach(el => { datos[el.dataset.k] = el.value.trim(); });
    const faltan = CAMPOS_LIBRES.filter(([k,,, req]) => req && !datos[k]).map(([, lab]) => lab);
    if (faltan.length){ toast('Falta ' + faltan.join(', ')); return; }
    ['cost', 'dur'].forEach(k => { const x = parseFloat(String(datos[k]).replace(',', '.'));
      datos[k] = Number.isFinite(x) ? x : 0; });
    if (coord){ datos.lat = coord.lat; datos.lng = coord.lng; datos.aprox = coord.aprox; }
    else { datos.lat = null; datos.lng = null; }
    datos.gcid = gcid || '';
    if (!datos.sub) datos.sub = '-';
    if (!datos.typ) datos.typ = 'Agregado a mano';

    if (esNuevo){
      const id = nuevoId();
      S.nuevos[id] = Object.assign({id, src: 'propuesta', main: false, tags: ['agregado-en-la-app'],
                                    costN: '', gname: '', must: 0, autor: S.yo,
                                    cuando: hoyStr()}, datos);
      VIDS.forEach(v => { if (S.nuevos[id][v] == null) S.nuevos[id][v] = 1; });
      /* Quien lo carga ya dijo que quiere ir: por eso arranca en 2 para él y en
         «quizás» para el resto. Nadie más opinó todavía. */
      S.nuevos[id][S.yo] = 2;
    } else if (propio){
      Object.assign(S.nuevos[orig.id], datos);
    } else {
      /* De un lugar del build se guarda SOLO lo que cambió: si el catálogo se
         corrige después, lo no tocado sigue el catálogo nuevo. */
      const d = S.edits[orig.id] = S.edits[orig.id] || {};
      const base = BASE_PLACES.find(x => x.id === orig.id) || {};
      Object.keys(datos).forEach(k => {
        if (String(base[k] == null ? '' : base[k]) !== String(datos[k] == null ? '' : datos[k]))
          d[k] = datos[k]; else delete d[k];
      });
      d.autor = S.yo; d.cuando = hoyStr();
      if (Object.keys(d).length <= 2) delete S.edits[orig.id];
    }
    save(); rebuildCatalog(); closeSheet();
    if (S.tab === 'places') rPlaces(); else if (S.tab === 'itin') rItin();
    toast(esNuevo ? 'Lugar creado' : 'Lugar actualizado');
  };
}

/* Borrar el propio / sacar del viaje uno del catálogo. Un lugar agendado no se
   va sin avisar: el bloque quedaría apuntando a un pid que ya no existe. */
function borrarLugar(pid, esPropio){
  const dd = (DAYMAP[pid] || []);
  const aviso = dd.length
    ? `Está agendado en el día ${dd.map(d => d.n).join(', ')}. Se va a sacar también de ahí.`
    : '';
  sheet(`<h2 style="font-size:17px;margin-bottom:5px">${esPropio ? '¿Borrar el lugar?' : '¿Sacarlo del viaje?'}</h2>
    <p class="sm muted">${esc(PBY[pid] ? PBY[pid].n : pid)}. ${esc(aviso)}
      ${esPropio ? '' : 'El lugar sigue en el catálogo compartido; solo deja de aparecer acá.'}</p>
    <div class="flex" style="margin-top:13px;justify-content:flex-end">
      <button class="btn ghost" id="noBorrar">No</button>
      <button class="btn" id="siBorrar" style="background:var(--red)">${esPropio ? 'Borrar' : 'Sacar'}</button></div>`);
  $('#noBorrar').onclick = closeSheet;
  $('#siBorrar').onclick = () => {
    S.itin.forEach(d => { d.blocks = d.blocks.filter(b => b.pid !== pid); });
    if (esPropio) delete S.nuevos[pid]; else S.bajas[pid] = 1;
    delete S.edits[pid];
    save(); rebuildCatalog(); buildDayMap(); closeSheet();
    rItin(); if (S.tab === 'places') rPlaces();
    toast(esPropio ? 'Lugar borrado' : 'Sacado del viaje');
  };
}

/* ── LEER UN LINK DE GOOGLE MAPS ─────────────────────────────────────────────
   Devuelve {lat, lng, nombre, cid} con lo que se haya podido sacar.

   EL ORDEN NO ES EL OBVIO Y ESTO COSTÓ UN BUG REAL. Una URL larga de Google
   trae un blob `data=` con varios pares !3d<lat>!4d<lng>, uno por cada entidad
   que Maps arrastra en el contexto. En este link de ejemplo hay dos:

     …!2sNew+York,+NY,+USA!3b1!8m2!3d40.7127753!4d-74.0059728…   ← LA CIUDAD
     …!1s0x89c25bdf…!8m2!3d40.7104854!4d-73.9635124!16s/g/…      ← EL LUGAR

   La primera versión tomaba el PRIMERO y guardaba el centro de Manhattan para
   una pizzería de Williamsburg. El del lugar buscado es el ÚLTIMO: Maps apila
   el contexto primero y la entidad al final.

   Y `@lat,lng` es el centro del viewport, no el lugar: si alguien movió el mapa
   antes de copiar, apunta a otro lado. Va de último recurso.

   El `cid` sale de la segunda mitad del ftid (!1s0x<algo>:0x<cid>) y es lo que
   permite abrir EXACTAMENTE ese negocio en vez de buscar por nombre — que con
   tres «Motorino Pizza» en Nueva York devuelve los tres. */
function datosDeLink(txt){
  const t = String(txt || '');
  const N = '(-?\\d+\\.\\d+)';
  const out = {lat: null, lng: null, nombre: '', cid: ''};

  /* 1 · el ÚLTIMO !3d!4d — el del lugar, no el del contexto */
  const pares = [...t.matchAll(new RegExp('!3d' + N + '!4d' + N, 'g'))];
  if (pares.length){
    const m = pares[pares.length - 1];
    out.lat = +m[1]; out.lng = +m[2];
  }
  /* 2 · query= / ll= con coordenadas, o coordenadas pegadas a mano */
  if (out.lat == null){
    const m = t.match(new RegExp('[?&](?:query|q|ll|daddr|center)=' + N + '(?:%2C|,)\\s*' + N, 'i'))
           || t.match(new RegExp('^\\s*' + N + '\\s*,\\s*' + N + '\\s*$'));
    if (m){ out.lat = +m[1]; out.lng = +m[2]; }
  }
  /* 3 · último recurso: el centro del mapa */
  if (out.lat == null){
    const m = t.match(new RegExp('@' + N + ',' + N));
    if (m){ out.lat = +m[1]; out.lng = +m[2]; }
  }
  if (out.lat != null && !(Math.abs(out.lat) <= 90 && Math.abs(out.lng) <= 180)){
    out.lat = out.lng = null;
  }

  /* El identificador del negocio, para poder abrirlo exacto después. */
  const ft = [...t.matchAll(/!1s0x[0-9a-f]+:0x([0-9a-f]+)/gi)];
  if (ft.length){
    try { out.cid = BigInt('0x' + ft[ft.length - 1][1]).toString(); } catch(e){}
  }
  /* La forma corta: maps.google.com/?cid=<decimal>. Es la que usan los exports
     de Google —Takeout la escribe así— y la que genera esta misma app. El ftid
     de arriba viene en hexadecimal; este ya está en decimal. */
  if (!out.cid){
    const c = t.match(/[?&]cid=(\d{5,25})\b/);
    if (c) out.cid = c[1];
  }
  /* Y el nombre, que va en el path: /place/<Nombre>/ */
  const nm = t.match(/\/maps\/place\/([^/@?]+)/);
  if (nm){
    try { out.nombre = decodeURIComponent(nm[1].replace(/\+/g, ' ')).trim(); } catch(e){}
  }
  return out;
}
/* Compatibilidad: lo que el formulario usaba antes. */
function coordsDeLink(txt){
  const d = datosDeLink(txt);
  return d.lat == null ? null : {lat: d.lat, lng: d.lng, aprox: false, cid: d.cid};
}

const TABS = [['itin','Itinerario'],['places','Lugares'],['map','Mapa'],
              ['costs','Costos'],['trans','Transporte'],['res','Reservas']];
$('#tabs').innerHTML = TABS.map(([k,l]) =>
  `<button class="tab${k===S.tab?' on':''}" data-t="${k}">${l}</button>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) go(b.dataset.t); };
/* Redibuja la vista que se está mirando. Se usa cuando cambia algo transversal
   —la moneda, una cotización— que toca todas las pantallas por igual. */
function rTodo(){
  ({itin: rItin, places: rPlaces, map: rMap, costs: rCosts, trans: rTrans, res: rRes}
    [S.tab] || rItin)();
}

function go(t){
  S.tab = t; save();
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + t));
  /* En Itinerario la barra inferior es de calle: progreso del día + saltar a "ahora".
     Exportar y el botón de guardado son de planificación y viven en ⋯ → Datos. */
  const it = t === 'itin';
  $('#bAhora').style.display = it ? '' : 'none';
  $('#bExp').style.display   = it ? 'none' : '';
  $('#bSave').style.display  = it ? 'none' : '';
  window.scrollTo({top:0});
  ({itin:rItin, places:rPlaces, map:rMap, costs:rCosts, trans:rTrans, res:rRes})[t]();
}

/* ═══════════ VISTA: ITINERARIO ═══════════ */
const OPEN_NOTES = new Set();   // estado de UI transitorio, no se persiste
const OPEN_HOODS = new Set();   // idem: qué barrios están desplegados
/* Qué bloques están desplegados. A propósito NO va al estado guardado: es UI
   transitoria, y agregar una clave al estado es exactamente lo que rompió la app
   una vez (migrate() no corre si el itinerario no cambió). Cero claves nuevas. */
const OPEN_BLK = new Set();

/* ── La tarjeta AHORA ─────────────────────────────────────────────────────────
   La app tenía el reloj y tenía el itinerario y nunca los cruzaba. Esto es ese
   cruce, y es lo primero que se ve al abrir. Tres estados honestos: antes del
   viaje (cuánto falta), durante (qué toca y qué sigue), después. */
function ahoraHTML(){
  const hoy = S.itin.find(x => x.date === TODAY);
  if (!hoy){
    const d0 = S.itin[0], dl = S.itin[S.itin.length - 1];
    if (TODAY < d0.date){
      const dias = Math.round((new Date(d0.date + 'T12:00:00') - new Date(TODAY + 'T12:00:00')) / 864e5);
      const b0 = d0.blocks[0], L0 = leadOf(b0 ? b0.txt : '');
      return `<div class="ahora pre">
        <div class="ahlb"><span>faltan ${dias} día${dias === 1 ? '' : 's'}</span><span class="sp"></span>
          <span style="letter-spacing:.04em">${esc(hhmmNow())}</span></div>
        <div class="ahmain">
          <div class="aht">arranca ${esc(d0.dow.toLowerCase())} ${+d0.date.slice(8)}/${d0.date.slice(5,7)} · ${esc(b0 ? b0.t : '')}</div>
          <div class="ahn">${esc(L0.head)}</div>
          <div class="ahd">${esc(d0.title)}</div>
        </div></div>`;
    }
    if (TODAY > dl.date)
      return `<div class="ahora fin"><div class="ahmain">
        <div class="ahn">El viaje terminó.</div>
        <div class="ahd">Quedan las tildes, las notas y los nueve días enteros.</div></div></div>`;
    return '';
  }
  const i = idxAhora(hoy);
  const cur = i >= 0 ? hoy.blocks[i] : null;
  const nx = hoy.blocks.slice(i + 1).find(b => minOf(b.t) != null) || null;
  const L = cur ? leadOf(cur.txt) : null;
  const p = cur && cur.pid ? PBY[cur.pid] : null;
  const falta = nx ? minOf(nx.t) - minsNow() : null;
  /* Si el bloque de ahora es un traslado (no tiene lugar), lo que sirve en la mano
     es la ruta al lugar que viene: es literalmente adonde estás yendo. */
  const pNav = p || (nx && nx.pid ? PBY[nx.pid] : null);
  const nb = pNav && !p ? amNombre(pNav) : '';
  const navLb = p ? '→ Llegar' : pNav ? '→ Llegar a ' + esc(nb.length > 26 ? nb.slice(0, 25).trim() + '…' : nb) : '';
  const fin = cur ? (hoy.blocks.slice(i + 1).find(b => minOf(b.t) != null) || {}).t : '';
  return `<div class="ahora">
    <div class="ahlb"><span>${cur ? 'ahora' : 'hoy'} · ${esc(hhmmNow())}</span><span class="sp"></span>
      ${S.day !== hoy.n ? `<button class="ahhoy" id="ahHoy">ir a hoy →</button>`
                        : `<span style="opacity:.6">día ${hoy.n}</span>`}</div>
    <div class="ahmain">
      ${cur ? `<div class="aht">${esc(cur.t)}${fin ? ' → ' + esc(fin) : ''}${cur.done ? ' · ✓ hecho' : ''}</div>
               <div class="ahn">${L.star ? '★ ' : ''}${esc(L.head)}</div>
               ${L.rest ? `<div class="ahd">${esc(L.rest.slice(0, 160))}${L.rest.length > 160 ? '…' : ''}</div>` : ''}`
            : `<div class="aht">el día todavía no arrancó</div>
               <div class="ahn">${esc(hoy.title)}</div>`}
    </div>
    ${nx ? `<div class="ahnext"><b>${esc(nx.t)}</b>${falta != null && falta >= 0 ? ' · en ' + enMin(falta) : ''} — ${esc(leadOf(nx.txt).head)}</div>` : ''}
    <div class="ahacts">
      ${pNav ? `<a class="ahbtn" href="${amRuta([pNav], 'walking')}" target="_blank" rel="noopener">${navLb}</a>` : ''}
      ${cur ? `<button class="ahbtn g2" id="ahDone" data-b="${esc(cur.id)}">${cur.done ? '✓ hecho' : '✓ marcar hecho'}</button>` : ''}
      <button class="ahbtn g2" id="ahVer">Ver en el día</button>
    </div></div>`;
}
/* Repinta SOLO la tarjeta: el tick de cada 30 s no puede re-renderizar el día
   entero (se perdería el foco de una nota a medio escribir). */
function pintarAhora(){
  const box = document.getElementById('ahora'); if (!box) return;
  box.innerHTML = ahoraHTML();
  const h = document.getElementById('ahHoy');
  if (h) h.onclick = () => { const t = S.itin.find(x => x.date === TODAY);
    if (t){ S.day = t.n; save(); rItin(); } };
  const dn = document.getElementById('ahDone');
  if (dn) dn.onclick = () => {
    const hy = S.itin.find(x => x.date === TODAY);
    const b = hy && hy.blocks.find(z => z.id === dn.dataset.b);
    if (b){ b.done = !b.done; save(); rItin(); } };
  const v = document.getElementById('ahVer');
  if (v) v.onclick = irAhora;
}
/* Saltar al bloque que toca. Si estabas mirando otro día, primero te lleva a hoy. */
function irAhora(){
  const hy = S.itin.find(x => x.date === TODAY);
  if (!hy){ toast('Hoy no es un día del viaje: te muestro el día que estás mirando.'); }
  else if (S.day !== hy.n){ S.day = hy.n; save(); }
  if (S.tab !== 'itin') go('itin'); else rItin();
  setTimeout(() => {
    const el = document.querySelector('.blk.itb.now') || document.querySelector('.blk.itb');
    if (!el) return;
    el.scrollIntoView({block:'center', behavior:'smooth'});
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400);
  }, 80);
}

function rItin(){
  const d = S.itin.find(x => x.n === S.day) || S.itin[0], d2 = d;
  const days = S.itin.map(x => {
    const dd = +x.date.slice(8) + '/' + x.date.slice(5,7);
    return `<button class="dbtn${x.n===S.day?' on':''}${x.date===TODAY?' today':''}" data-d="${x.n}">
      ${x.date===TODAY?'<span class="hoylb">hoy</span>':''}
      <div class="dd">${dd}</div>
      <div class="dw">${esc(x.dow.slice(0,3).toLowerCase())} · día ${x.n}</div></button>`;
  }).join('');

  /* 'all' todo · 'both' solo lo que hacen todos juntos · un id: todo lo que esa
     persona hace, sola o acompañada. Antes se comparaba el string entero, así que
     filtrar por alguien escondía los bloques donde estaba con otro. */
  const vis = b => S.whoF === 'all' || (S.whoF === 'both' ? esDeTodos(b.who) : hace(b.who, S.whoF));
  /* Quiénes NO participan del día pero sí tienen bloques adentro. Antes esto
     era una sola cuenta de bloques de 'th'; ahora sale por diferencia, así que
     funciona con cualquier cantidad de viajeros y con cualquier subconjunto. */
  const ausentes = VIDS.filter(v => !hace(d.who, v))
    .map(v => ({v, n: d.blocks.filter(b => hace(b.who, v)).length}))
    .filter(x => x.n);
  // hora fin = inicio del bloque siguiente (se recalcula sola al reordenar o editar horas)
  const ends = d.blocks.map((_, i) => {
    const nx = d.blocks[i + 1];
    return nx && /^\d{1,2}:\d{2}$/.test(nx.t) ? nx.t : '';
  });
  const _dp = dePasoDelDia(d), PASO = _dp.paso, ACA = _dp.aca;
  const iNow = idxAhora(d);

  const blocks = d.blocks.map((b,i) => {
    if (!vis(b)) return '';
    const p = b.pid ? PBY[b.pid] : null;
    const paso = PASO[b.id] || [], aca = ACA[b.id] || [];
    // Bloque de alguien que no participa de este día: se atenúa.
    const ajeno = !esDeTodos(b.who) && whoArr(b.who).some(v => !hace(d.who, v));
    const L = leadOf(b.txt);
    const open = OPEN_BLK.has(b.id);
    const hh = p && p.hrs ? horario(p, DOW_IDX[d.dow]) : null;
    const logi = b.kind === 'logistica' && !p;           // pegamento entre paradas
    const est = iNow < 0 ? '' : i === iNow ? ' now' : i < iNow ? ' past' : '';

    /* Una sola línea de datos duros. Es lo que se lee de un vistazo caminando:
       dónde, cuánto sale, si está abierto, si hay una advertencia adentro. */
    const facts = [];
    if (b.who !== 'both')
      facts.push(`<b style="color:${whoColor(b.who)}">${whoLabel(b.who)}</b>`);
    if (p) facts.push(esc(p.hood));
    if (p && p.cost) facts.push(money(p.cost));
    if (hh === 'CERRADO') facts.push('<b class="cerr">cerrado hoy</b>');
    if (tieneAviso(L.rest)) facts.push('<b class="ojo">⚠ ojo</b>');
    if (hh && hh !== 'CERRADO') facts.push('🕐 ' + esc(hh));
    if (b.note) facts.push('<b class="ojo">⚠ nota</b>');
    if (b.mynote) facts.push('nota tuya');
    if (aca.length) facts.push(aca.length + ' cerca');

    /* Todo lo que la v1 mostraba SIEMPRE vive acá: nada se borró, se plegó. */
    const detalle = !open ? '' : `<div class="bdet">
      ${L.rest ? `<div class="btxt">${esc(L.rest)}</div>` : ''}
      <div class="bmeta">
        ${!esDeTodos(b.who) ? `<span class="chip" style="background:${whoColor(b.who)}1a;color:${whoColor(b.who)}">${whoLabel(b.who)}</span>` : ''}
        ${p ? `<span class="chip" style="background:${cat(p).c}1a;color:${cat(p).c}"
                data-act="info">${esc(p.n)}</span>` : ''}
        ${p ? `<a class="chip b" href="${gmaps(p)}" target="_blank" rel="noopener">↗ Maps</a>` : ''}
        ${p ? `<a class="chip g" data-nav="apple" href="${amRuta([p],'walking')}" target="_blank" rel="noopener"
                title="Ir hasta acá con Apple Maps, desde donde estés — el Watch la toma sola">→ Apple</a>` : ''}
        ${p ? `<a class="chip g" data-nav="google" href="${gmRuta([p],'walking')}" target="_blank" rel="noopener"
                title="Lo mismo con Google Maps, por si Apple no responde">→ Google</a>` : ''}
        ${p && p.cost ? `<span class="chip">${money(p.cost)}</span>` : ''}
        ${hh ? `<span class="chip ${hh==='CERRADO'?'r':'b'}">🕐 ${hh}</span>` : ''}
        ${b.note ? `<span class="chip wrap">${esc(b.note)}</span>` : ''}
      </div>
      ${paso.length ? `<div class="paso" style="padding:7px 0 0;border:0;background:none">
        <span class="pasolb">de camino hasta acá</span>
        ${paso.map(({p:q, desvio}) => `<a class="chip paso1" data-paso="${q.id}"
            style="color:${cat(q).c}" title="${esc(q.typ + ' · ' + q.hood + ' · ' + money(q.cost))} — desvío +${Math.round(desvio)} m">${esc(q.n)}<i>+${desvio < 950 ? Math.round(desvio/10)*10 + ' m' : (desvio/1000).toFixed(1) + ' km'}</i></a>`).join('')}
      </div>` : ''}
      ${aca.length ? `<div class="aca">
        <span class="acalb">acá cerca</span>
        ${aca.map(({p:q, dist}) => `<a class="chip paso1" data-paso="${q.id}"
            style="color:${cat(q).c}" title="${esc(q.typ + ' · ' + money(q.cost))} — a ${Math.round(dist)} m">${esc(q.n)}<i>${dist < 95 ? Math.round(dist/5)*5 : Math.round(dist/10)*10} m</i></a>`).join('')}
      </div>` : ''}
      ${(b.mynote || OPEN_NOTES.has(b.id))
        ? `<textarea class="bnote" data-act="note" placeholder="mis notas…">${esc(b.mynote||'')}</textarea>`
        : `<button class="notebtn" data-act="opennote">＋ nota</button>`}
      ${(() => {                       /* caminar un barrio: qué hay adentro */
        if (!p || p.cat !== 'barrio') return '';
        const enb = enElBarrio(p);
        if (!enb.length) return '';
        if (!OPEN_HOODS.has(b.id))
          return `<button class="notebtn" data-act="openhood">＋ ${enb.length} lugar${enb.length>1?'es':''} en ${esc(p.hood)}</button>`;
        return `<div class="hood">
          <div class="hoodlb">En ${esc(p.hood)}, mientras caminan
            <button class="notebtn" data-act="closehood" style="margin-left:6px;padding:1px 7px">ocultar</button></div>
          ${enb.map(({p:q, d}) => `<div class="hoodit">
            <div class="hoodn"><b data-paso="${q.id}">${esc(q.n)}</b>
              <span class="chip" style="background:${cat(q).c}1a;color:${cat(q).c}">${esc(q.typ)}</span>
              <span class="chip">${money(q.cost)}</span>
              <span class="hoodd">a ${d < 950 ? Math.round(d/10)*10 + ' m' : (d/1000).toFixed(1) + ' km'}</span></div>
            <div class="hoodw">${why(q,150)}</div>
            <div class="bmeta">
              <a class="chip b" href="${gmaps(q)}" target="_blank" rel="noopener">↗ Maps</a>
              <a class="chip g" data-nav="apple" href="${amRuta([q],'walking')}" target="_blank" rel="noopener">→ Apple</a>
              <a class="chip g" data-nav="google" href="${gmRuta([q],'walking')}" target="_blank" rel="noopener">→ Google</a>
              ${q.hrs ? (()=>{ const h2 = horario(q, DOW_IDX[d2.dow]);
                return `<span class="chip ${h2==='CERRADO'?'r':'b'}">🕐 ${h2}</span>`; })() : ''}
            </div></div>`).join('')}
        </div>`;
      })()}
      <div class="bedit">
        <span class="lb">mover o quitar</span>
        <button class="mini" data-act="up" title="subir">▲</button>
        <button class="mini" data-act="down" title="bajar">▼</button>
        <button class="mini del" data-act="del" title="quitar del día">✕ quitar</button>
      </div>
      <button class="plegar" data-act="toggle">▲ plegar</button></div>`;

    return `${b.trav ? `<div class="trav">↓ ${esc(b.trav)}</div>` : ''}
      <div class="blk itb${b.kind==='destacado'?' hi':''}${L.star?' star':''}${b.done?' done':''}${ajeno?' ajeno':''}${logi?' logi':''}${open?' on':''}${est}" data-b="${b.id}">
      <div class="tmw">
        ${open ? `<input class="tm" value="${esc(b.t)}" data-act="time" aria-label="hora">`
               : `<div class="tm">${esc(b.t)}</div>`}
        ${(open || est===' now') && ends[i] ? `<div class="tmend">→ ${esc(ends[i])}</div>` : ''}
      </div>
      <div class="bbody">
        <div class="btog" data-act="toggle" role="button" tabindex="0"
             aria-expanded="${open?'true':'false'}">
          <div class="bhead">
            ${logi ? '' : `<span class="cdot" style="background:${p?cat(p).c:'#c3bcaf'}"></span>`}
            <span class="bttl">${L.star?'<span class="stx">★</span> ':''}${esc(L.head)}</span>
          </div>
          ${!open && !logi && L.rest
            ? `<div class="bsub">${esc(L.rest)}${facts.length?'':' <span class="mas">▾</span>'}</div>` : ''}
          ${!open && facts.length ? `<div class="bfacts">${facts.join(' · ')} <span class="mas">▾</span></div>` : ''}
        </div>
        ${detalle}
      </div>
      <div class="bact">
        <button class="ck${b.done?' on':''}" data-act="done" title="marcar hecho">✓</button>
        ${!open && p ? `<a class="goto" data-nav="apple" href="${amRuta([p],'walking')}"
             target="_blank" rel="noopener" title="Ir hasta acá — Apple Maps desde donde estés">→</a>` : ''}
      </div></div>`;
  }).join('');

  $('#v-itin').innerHTML = `
    ${MIGRATED ? `<div class="banner ok"><b>Plan actualizado a la última versión.</b>
      Tus tildes, notas, intereses y bloques agregados se conservaron.</div>` : ''}
    <div id="ahora"></div>
    <div class="days">${days}</div>
    <div class="dhead">
      <h2>${esc(d.title)}</h2>
      <div class="dchips">
        <span class="chip b">día ${d.n} · ${esc(d.dow.toLowerCase())} ${+d.date.slice(8)}/${d.date.slice(5,7)}</span>
        <span class="chip">base: ${esc(d.base)}</span>
        <span class="chip" style="background:${whoColor(d.who)}1a;color:${whoColor(d.who)}">${whoLabel(d.who)}</span>
        ${ausentes.map(x => `<span class="chip" style="background:${VBY[x.v].color}1a;color:${VBY[x.v].color}">${esc(VBY[x.v].corto)} no participa (${x.n} bloque${x.n>1?'s':''} suyo${x.n>1?'s':''})</span>`).join('')}
      </div>
      <details class="dporque"><summary>Por qué este día${d.alt ? ' · alternativas' : ''}</summary>
        <div class="dbody"><p>${esc(d.note)}</p>
        ${d.alt ? `<p><b style="color:#8a5a08">⚠ Alternativa / ojo:</b> ${esc(d.alt)}</p>` : ''}</div></details>
    </div>
    <div class="card">${blocks || '<div class="pad muted sm">Sin bloques para este filtro.</div>'}</div>
    <p class="hint">Tocá un bloque para ver todo · deslizá ← → para cambiar de día</p>

      <button class="btn ghost sm" id="addBlk">+ Agregar lugar a este día</button>
      <button class="btn ghost sm" id="addFree">+ Agregar nota libre</button>
      <button class="btn ghost sm" id="mapDay">Ver este día en el mapa</button>
      <button class="btn ghost sm" id="rutaDia">→ Ruta del día completa</button>
    </div>`;

  $('#v-itin').querySelector('.days').onclick = e => {
    const b = e.target.closest('.dbtn'); if (!b) return;
    S.day = +b.dataset.d; save(); rItin(); window.scrollTo({top:0});

/* Delegación ÚNICA: los contenedores nunca se reemplazan, solo su innerHTML.
   Registrarla dentro de las funciones de render acumularía un listener por render
   y cada click se dispararía N veces. */
$('#v-itin').addEventListener('click', e => {
  const pa = e.target.closest('[data-paso]');          /* referencia de paso → su ficha */
  if (pa){ showPlace(pa.dataset.paso); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = e.target.closest('.blk')?.dataset.b; if (!id) return;
  const act = el.dataset.act;
  const day = S.itin.find(x => x.n === S.day), i = day.blocks.findIndex(b => b.id === id);
  if (i < 0) return; const b = day.blocks[i];
  if (act === 'toggle'){
    if (OPEN_BLK.has(b.id)) OPEN_BLK.delete(b.id); else OPEN_BLK.add(b.id);
    rItin();
    const el2 = document.querySelector(`.blk[data-b="${b.id}"]`);
    if (el2) el2.scrollIntoView({block:'nearest'});
    return;
  }
  if (act === 'done'){ b.done = !b.done; save(); rItin(); }
  if (act === 'del'){ day.blocks.splice(i,1); save(); rItin(); }
  if (act === 'up' && i > 0){ day.blocks.splice(i-1,0,day.blocks.splice(i,1)[0]); save(); rItin(); }
  if (act === 'down' && i < day.blocks.length-1){ day.blocks.splice(i+1,0,day.blocks.splice(i,1)[0]); save(); rItin(); }
  if (act === 'info' && b.pid) showPlace(b.pid);
  if (act === 'openhood'){ OPEN_HOODS.add(b.id); rItin(); return; }
  if (act === 'closehood'){ OPEN_HOODS.delete(b.id); rItin(); return; }
  if (act === 'opennote'){ OPEN_NOTES.add(b.id); rItin();
    const ta = document.querySelector(`.blk[data-b="${b.id}"] .bnote`); if (ta) ta.focus(); }
});
$('#v-itin').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-act="toggle"]'); if (!el) return;

});
$('#v-itin').addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = e.target.closest('.blk')?.dataset.b; if (!id) return;
  const b = S.itin.find(x => x.n === S.day)?.blocks.find(z => z.id === id); if (!b) return;
  if (el.dataset.act === 'time') b.t = el.value;
  if (el.dataset.act === 'note') b.mynote = el.value;

});
$('#v-places').addEventListener('click', e => {
  const ib = e.target.closest('.ib');
  if (ib && ib.dataset.p){ setInterest(ib.dataset.p, ib.dataset.w,
      (interest(ib.dataset.p)[ib.dataset.w] + 1) % 3); rPlaces(); return; }

      (DAYMAP[b.pid] = DAYMAP[b.pid] || []).push(d);

/* ═══════════ VISTA: MAPA ═══════════ */
let MAP = null, LAYER = null, BASE = null;
/* ── EL FONDO DEL MAPA ────────────────────────────────────────────────────────
   Acá había `setView([40.735,-73.96], 11)` y un tileLayer de OpenStreetMap
   escritos a mano: las coordenadas de Nueva York y el basemap de Nueva York,
   adentro del motor. La regla del proyecto dice que si algo cambia entre un
   viaje y otro no va acá, y esto cambia: los tiles de OSM rotulan en el idioma
   LOCAL, así que en Tokio el mapa dice 道玄坂二丁目 y no «Dōgenzaka».

   Ahora las capas las declara el viaje en `capasMapa`. La primera se dibuja; si
   hay más de una, se arma un selector. Va SIN colapsar a propósito: un plan B
   enterrado no es un plan B — ya pasó con el botón de Google, que quedaba a
   1025px de un viewport de 844 y Juan reportó que no lo veía. */
function centroInicial(){
  if (TRIP.centro) return [TRIP.centro[0], TRIP.centro[1]];
  /* Sin centro declarado se saca del catálogo, que es lo que dice el contrato.
     La MEDIANA y no el promedio: un solo lugar a 800 km —un onsen en los Alpes,
     el hotel de Branchburg— corre el promedio y deja la ciudad fuera de cuadro.
     Igual es solo el encuadre del primer cuadro: drawMap() hace fitBounds. */
  const la = [], ln = [];
  PLACES.forEach(p => { if (tieneUbic(p)){ la.push(p.lat); ln.push(p.lng); } });
  if (!la.length) return [0, 0];
  const med = a => { const b = a.slice().sort((x, y) => x - y); return b[b.length >> 1]; };
  return [med(la), med(ln)];
}
function montarCapas(){
  const capas = (TRIP.capasMapa || []).filter(c => c && c.url);
  if (!capas.length) return;
  const hechas = {};
  capas.forEach((c, i) => {
    const t = L.tileLayer(c.url, {attribution: c.atribucion || '', maxZoom: c.maxZoom || 19});
    hechas[c.nombre || ('Capa ' + (i + 1))] = t;
    if (i === 0){ t.addTo(MAP); BASE = t; }
  });
  if (capas.length > 1) L.control.layers(hechas, null, {collapsed:false}).addTo(MAP);
  /* Si el proveedor elegido se cae, la app se cambia sola a la ÚLTIMA capa de
     la lista —por convención, el OSM estándar, que nunca se apaga—. Hasta ahora
     mapFallback() solo saltaba si Leaflet no cargaba: con los tiles muertos el
     mapa quedaba gris y en silencio, que es el peor modo de falla.

     OJO CON LO QUE ESTO **NO** CUIDA: el modo CARTO. Cuando un proveedor
     empieza a estampar «API KEY REQUIRED» adentro del PNG, eso llega como HTTP
     200 con una imagen válida y no dispara `tileerror`. Ningún código lo
     detecta. Eso se caza mirando el mapa con los ojos antes de publicar. */
  const ultima = capas[capas.length - 1];
  if (capas.length > 1 && BASE){
    let rotos = 0;
    BASE.on('tileerror', () => {
      if (++rotos < 8 || !BASE) return;                  /* uno suelto no es una caída */
      const b = BASE; BASE = null;                       /* que no se dispare dos veces */
      MAP.removeLayer(b);
      L.tileLayer(ultima.url, {attribution: ultima.atribucion || '',
                               maxZoom: ultima.maxZoom || 19}).addTo(MAP);
      toast('«' + (capas[0].nombre || 'El mapa') + '» no responde. Cambié a «' +
            (ultima.nombre || 'OpenStreetMap') + '».');
    });
  }
}

          ${Object.entries(CAT).map(([k,v]) => `<option value="c:${k}">${v.n}</option>`).join('')}
