"Nagano","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_13351759146110920975","n":"Matsumoto City Alps Park","cat":"parque","hood":"Matsumoto","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"2455-11 Arigasaki, Matsumoto, Nagano 390-0861, Japón","lat":36.264200699999996,"lng":137.9544574,"aprox":false,"gcid":"13351759146110920975","cost":0,"dur":0,"sub":"-","typ":"Parque","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Matsumoto City Alps Park","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Matsumoto","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_14667499640951197149","n":"Matsumoto","cat":"barrio","hood":"Nagano","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Prefectura de Nagano, Japón","lat":36.238043399999995,"lng":137.9719897,"aprox":false,"gcid":"14667499640951197149","cost":0,"dur":0,"sub":"-","typ":"Ciudad","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Matsumoto","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Matsumoto","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_14341444200467673055","n":"Monte Takao","cat":"parque","hood":"Hachiōji","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Takaomachi, Hachiōji, Tokio 193-0844, Japón","lat":35.6254126,"lng":139.2437385,"aprox":false,"gcid":"14341444200467673055","cost":0,"dur":0,"sub":"-","typ":"Montaña","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Monte Takao","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Otras zonas","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_92482203388546198","n":"Kibune River","cat":"parque","hood":"Prefectura de Kioto","why":"El Kibune-gawa es el arroyo de montaña que atraviesa el pueblito de Kibune, en Sakyō-ku, al norte de Kioto: no es un destino en sí, es el paisaje sobre el que se apoya el santuario Kifune y la calle de ryokan. En diciembre-enero está abierto y accesible, pero las dos cosas por las que la gente va al río no están: el kawadoko —las tarimas de comer suspendidas sobre el agua, el gran atractivo gastronómico del lugar— va de junio a septiembre y en invierno no se monta, y la iluminación de nieve del santuario Kifune arranca recién a mediados de enero (edición 2026: 17/1 al 28/2, solo sábados y domingos, solo si hay nieve acumulada, de la puesta de sol a las 20:30 y con aviso a las 15:00 del mismo día). Sin esas dos, queda una caminata linda de una hora entre cedros y farolitos rojos que exige medio día completo de ida y vuelta desde el centro; con el sol poniéndose cerca de las 16:50 —y antes todavía en el fondo del valle, encajonado entre laderas— hay que salir antes del mediodía sí o sí. Para dos foodies con 25 días es un descarte razonable salvo que quieran un día de montaña, y en ese caso el plan real es Kurama + Kibune, no \"el río\".","addr":"Sakyō-ku, Kioto, Prefectura de Kioto, Japón","lat":35.1207992,"lng":135.7632877,"aprox":false,"gcid":"92482203388546198","cost":0,"dur":4.5,"sub":"Río de montaña / pueblo de Kibune (Sakyō-ku)","typ":"Río","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kibune River","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Opera en diciembre-enero: no es una ruta alpina que cierre por nieve, el tren Eizan y el bus a Kibune suben todo el año. Lo que no opera es el kawadoko (las tarimas sobre el río se montan de junio a septiembre) ni la iluminación de nieve, que en la edición 2026 empezó el 17 de enero — después de que ellos ya se fueron. Puede haber nieve y hielo en la escalera de piedra del santuario: calzado con agarre. · Año nuevo (29/12 al 3/1): El santuario Kifune está abierto: el sitio oficial dice \"abierto todo el año\" y aclara que durante los tres primeros días de enero se atiende hasta las 20:00, o sea que hay hatsumōde. Es exactamente el peor momento para ir: Kibune es una calle angosta de montaña con un bus de baja frecuencia como único acceso y el 1-3 de enero se satura. Los horarios del 29 al 31 de diciembre y los de los restaurantes y ryokan del pueblo en esas fechas: sin verificar.","conf":"media","warn":["La zona está bien asignada (Kibune, Sakyō-ku, ciudad y prefectura de Kioto), pero NO es \"Kioto ciudad\" en sentido práctico: está en la montaña al norte. Son 30 min de tren Eizan desde Demachiyanagi hasta Kibuneguchi (¥470), más 5 min de bus (¥200) o 20-30 min de subida a pie hasta el santuario. Sumando el traslado hasta Demachiyanagi, puerta a puerta desde el centro es cerca de 1 hora por tramo: es medio día, no una parada.","LA ILUMINACIÓN DE NIEVE NO ENTRA EN EL VIAJE. La edición verificada es la de 2026: 17 de enero al 28 de febrero, solo fines de semana, solo con nieve acumulada y con confirmación a las 15:00 del día vía redes del santuario. Vuelven el 7 de enero. La edición 2027 todavía no está anunciada, y aunque repita el patrón arrancaría después de que se hayan ido.","El kawadoko —comer sobre el río, que es la razón gastronómica de venir a Kibune— se monta de junio a septiembre. En diciembre no existe. Si el lugar entró a la lista por las fotos de las tarimas sobre el agua, entró por algo que no van a poder hacer.","Necesita luz de día: el sol se pone cerca de las 16:50 y en el fondo del valle, encajonado entre laderas, oscurece bastante antes. Salir del centro antes del mediodía o no ir.","El bus de Kyoto Bus desde Kibuneguchi hasta Kibune tarda 5 min (¥200) y sale coordinado con la llegada de los trenes; aun así, chequeá la hora del último de vuelta antes de subir, no después. La alternativa es bajar caminando 20-30 min por la ruta.","No verifiqué qué restaurantes ni ryokan de Kibune abren en diciembre-enero. Varios del pueblo trabajan en temporada; ir asumiendo que se come ahí es un riesgo real.","Si finalmente van, el día tiene sentido como Kurama + Kibune o como Kifune Jinja, no como \"ver el río\". El sendero de montaña entre ambos figura como abierto: desde Kibune es cerca de 1 hora de subida hasta el hondō de Kurama-dera y otros 30 min de bajada hasta el pueblo de Kurama, con ¥500 de aisanhi que se pagan al empezar el sendero. Con nieve o hielo, preguntar en el lugar antes de encararlo: no verifiqué el estado invernal del tramo."],"refs":["https://kifunejinja.jp/","https://kifunejinja.jp/en/news/1567/","https://www.discoverkyoto.com/places-go/kifune-shrine/","https://jatrabridge.com/2026/01/09/14167/2026-latest-edition-kyoto-kifune-shrine-complete-guide-access-riverside-dining-illuminations-seasonal-highlights/","https://www.japan-guide.com/e/e3967.html"]},{"id":"u_g_14582688286317482484","n":"Monte Kurama","cat":"parque","hood":"Kioto","why":"Opera en diciembre y enero: el Kurama-dera abre todo el año 9:00-16:15 y el funicular sigue andando, así que la caminata clásica Kurama→Kibune (4-4,5 km, ~260 m de subida, unas 2 h) se puede hacer en invierno; lo que cambia es el piso, escalones de piedra y el tramo de raíces (kinone-michi) con nieve o hielo. Es una montaña boscosa a 30 minutos de tren del centro de Kioto: subís por el sendero de peregrinación entre cedros, pasás el templo y bajás del otro lado al pueblito de Kibune. Vale como el medio día \"de naturaleza\" del viaje en Kioto, no como otro templo más: la razón de ir es el bosque, y el museo de tesoros (Reihōden) está cerrado del 12 de diciembre a fin de febrero, o sea todo el viaje. Con el último funicular de bajada a las 16:25 y el sol poniéndose cerca de las 16:50 —antes dentro del bosque—, esto es plan de mañana y no admite arrancar después del mediodía.","addr":"Kuramahonmachi, Sakyō-ku, Kioto, Prefectura de Kioto 601-1111, Japón","lat":35.123872,"lng":135.7715748,"aprox":false,"gcid":"14582688286317482484","cost":1440,"dur":5,"sub":"montaña con templo — caminata Kurama→Kibune","typ":"Montaña","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Monte Kurama","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Opera en diciembre-enero. Templo y funicular funcionan todo el año; el sendero no tiene cierre estacional anunciado, pero con nieve o hielo se pone resbaloso y no hallé una fuente oficial que informe el estado del camino día a día. El Reihōden sí cierra: 12 de diciembre a fin de febrero. · Año nuevo (29/12 al 3/1): Abierto y con gente: el templo hace shimenouchi-mairi (visita de año nuevo) del 1 al 15 de enero, y en enero cae el Hatsu-tora Taisai, su fiesta grande a Bishamonten, el primer día del Tigre del año. No verifiqué si hay horario especial ni corte de acceso entre el 29 y el 31 de diciembre: eso hay que confirmarlo por teléfono (075-741-2003).","conf":"alta","warn":["La zona está bien asignada: Kurama es Sakyō-ku, ciudad de Kioto, prefectura de Kioto. Pero es el extremo norte de la ciudad, no el centro: ~30 min de tren en la línea Eizan desde Demachiyanagi (470 ¥) más el traslado hasta Demachiyanagi.","Luz: el Honden cierra 16:15 y el último funicular baja 16:25; el sol se pone cerca de las 16:50 y en el bosque oscurece antes. Salir del centro antes de las 10:00 o el plan no cierra.","Calzado: escalones de piedra, raíces expuestas y tierra; con nieve o hielo el tramo Kurama→Kibune es el problema, no la distancia. Verificar el pronóstico el día antes.","El museo Reihōden está cerrado del 12 de diciembre a fin de febrero: no hay visita posible en estas fechas.","El funicular no es un servicio comercial sino una donación, y el propio templo publica suspensiones por avería y mañanas de mantenimiento. No lo des por garantizado: la alternativa es subir a pie el zigzag desde el Niōmon, unos 30 minutos empinados.","Kurama Onsen (el baño clásico para después de la caminata) no lo pude verificar: su dominio oficial ya no resuelve al onsen, el certificado apunta a otro sitio. No armes el día contando con ese baño sin confirmarlo aparte.","No verifiqué qué come uno en Kibune en invierno: los restaurantes sobre el río son de temporada de verano. Requiere ficha propia antes de planificar el almuerzo ahí."],"refs":["https://kuramadera.or.jp/nyuzan.html","https://kuramadera.or.jp/access.html","https://kuramadera.or.jp/","https://kuramadera.or.jp/gyouji.html","https://kuramadera.or.jp/oshirase/","https://kuramadera.or.jp/annai.html","https://eizandensha.co.jp/en/","https://www.hikemasterjapan.com/kurama","https://www.snowmonkeyresorts.com/activities/kurama-dera-temple/"]},{"id":"u_g_15134224251499317861","n":"Hill of the Buddha","cat":"arq","hood":"Sapporo","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"2 Takino, Minami Ward, Sapporo, Hokkaido 005-0862, Japón","lat":42.920567399999996,"lng":141.3627884,"aprox":false,"gcid":"15134224251499317861","cost":0,"dur":0,"sub":"-","typ":"Edificio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Hill of the Buddha","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Sapporo","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_13159134450370243740","n":"Nishiki Market","cat":"comida","hood":"Kioto","why":"Pasaje comercial techado de 390 m en pleno centro de Kioto (Nakagyo-ku), con más de cien puestos y locales, casi todos de comida: encurtidos kioteños, pescado seco, mariscos, sushi, dulces japoneses y brochetas para comer en el lugar. Para dos foodies es la parada más eficiente de la ciudad — media mañana de picar de puesto en puesto sin sentarse — y cae al lado de Teramachi/Shinkyogoku, una cuadra al norte de Shijo. No es un restaurante: no tiene ficha propia en Tabelog y la calidad depende del puesto que elijas. La mayoría de los puestos cierra hacia las 18 (japan-guide: 10:00–18:00 típico, varía por local) y varios antes, así que va de mañana o mediodía; en diciembre a esa hora en Kioto ya está oscureciendo igual.","addr":"Nakagyo Ward, Kyoto, 604-8055, Japón","lat":35.0050258,"lng":135.764723,"aprox":false,"gcid":"13159134450370243740","cost":0,"dur":1.5,"sub":"Mercado de comida callejera","typ":"Mercado","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Nishiki Market","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"Picada de puestos, no una comida sentada: brochetas y mariscos a la plancha, tsukemono (encurtidos de Kioto), sushi, pescado seco y wagashi. Los locales del mercado mejor puntuados en Tabelog son Karikari Hakase Nishiki-ichiba (3.45), Konna Monja (3.44), Nishiki Ichiba Shokudo Takakuraya Shoten (3.32) y Nishiki Katsuzushi (3.30) — todos en la banda 3,3-3,45, que en Tabelog es correcto sin ser destacado (3,5 es donde empieza lo notable). Muchos puestos son solo efectivo: llevá monedas y billetes chicos. No hay reserva ni cola formal; la cola es de gente en el pasillo. Comer caminando está mal visto y varios puestos lo tienen cartelado: se come parado al lado del local.","season":"Pasaje techado, opera todo el año; no depende del clima ni de la nieve. · Año nuevo (29/12 al 3/1): Verificado en el sitio oficial: en fin de año y Año Nuevo la aglomeración es tal que «cuesta avanzar» (前に進めないほどの人), y lo describen como un clásico de Kioto (京の風物詩). El sitio no da fechas ni horarios de esos días. Qué abre del 1 al 3 de enero: sin verificar. Cada puesto decide su propio cierre y el mercado no publica un calendario; asumí que buena parte baja la persiana esos tres días y no armes un plan que dependa de esto.","conf":"media","warn":["La zona está bien rotulada: es Nakagyo-ku, centro de Kioto, a pasos de Shijo-Karasuma y de la galería Teramachi. No hay error de prefectura.","No tiene ficha propia en Tabelog porque no es un local: el puntaje hay que mirarlo puesto por puesto (los mejores del mercado están entre 3,26 y 3,45).","En fin de año y Año Nuevo el mercado se llena hasta el punto de que «cuesta avanzar» (sitio oficial); del 1 al 3 de enero, cuántos puestos abren quedó sin verificar.","Los puestos cierran típicamente hacia las 18 y varios antes: no sirve como plan de cena ni de tarde-noche.","Muchos puestos son solo efectivo.","Comer caminando está mal visto y cartelado en varios locales."],"refs":["https://www.japan-guide.com/e/e3931.html","https://www.kyoto-nishiki.or.jp/about/","https://www.kyoto-nishiki.or.jp/","https://www.kyoto-nishiki.or.jp/en/","https://tabelog.com/en/kyoto/A2601/A260201/rstLst/?SrtT=rt&sw=%E9%8C%A6%E5%B8%82%E5%A0%B4"]},{"id":"u_g_6959033030999210364","n":"Templo Chion-in","cat":"arq","hood":"Kioto","why":"Templo cabeza de la escuela Jōdo (budismo de la Tierra Pura), en el borde norte de Higashiyama, a diez minutos a pie de Gion. Lo que vale la pena es la escala de la madera: el Sanmon de 24 m es el portón de dos pisos más grande de Japón y el Miedo (44,8 × 34,5 m) es Tesoro Nacional, más la campana de 1636 de unas 70 toneladas que hacen falta 17 monjes para tocar. Entrar al recinto es gratis y se recorre en una hora; los dos jardines se pagan aparte (500 ¥ el combinado) y suman media hora más. No es un lugar para organizar un día entero: es la parada fuerte de un circuito Higashiyama, y hay que hacerla temprano porque el portón cierra a las 16:00, antes de que oscurezca.","addr":"400 Rinkacho, Higashiyama Ward, Kyoto, 605-8686, Japón","lat":35.005198799999995,"lng":135.7833827,"aprox":false,"gcid":"6959033030999210364","cost":500,"dur":1.5,"sub":"templo budista (sede del Jōdo-shū)","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Templo Chion-in","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Sigue abierto: no cierra por Año Nuevo. El 1 de enero adelanta la apertura a las 5:30 para el 修正会 (ceremonia de Año Nuevo, de acceso público) y esos días se llena de hatsumōde junto con toda la zona de Higashiyama. La noche del 31 se toca el 除夜の鐘 con la campana grande; en 2025 la vista pasó a ser con entrada paga (ver alertas). Los horarios de recepción de los jardines para el 29/12–3/1 no están publicados: el sitio no anuncia cierres, pero tampoco los confirma.","conf":"alta","warn":["Cierra 16:00, y a mediados de diciembre en Kioto el sol se pone cerca de las 16:45. Hay que entrar a más tardar 14:30 si se quieren ver los dos jardines: la venta de la entrada combinada de 500 ¥ termina a las 15:20 y la última recepción del jardín del Hōjō es 15:50.","Joya no kane del 31/12: en 2025 dejó de ser de acceso libre. Aviso oficial del 4/12/2025: 拝観券 a 3.000 ¥ por persona, 400 lugares en 4 turnos, venta SOLO presencial en la recepción de Yūzen-en del 8 al 24 de diciembre de 9:00 a 16:00, solo efectivo, sin reservas por teléfono ni mail. La edición 2026-2027 todavía NO está anunciada: el aviso del año pasado salió recién el 4 de diciembre, así que hay que revisar chion-in.or.jp/topics a principios de diciembre.","Obra en curso: desde el 17/8/2026 y por tiempo indeterminado está cortado el paso del jardín del Hōjō al 山亭コース por la restauración del Seishi-dō; se sale por donde se entró. Los dos jardines siguen abiertos con normalidad.","El interior del Sanmon no se visita siempre: solo abre en 特別拝観 puntuales (el anunciado para 2026 fue en agosto). No contar con subir en diciembre salvo que aparezca un aviso.","Chion-in ilumina en primavera y en otoño, nunca a fin de año: el calendario anual no lista ninguna iluminación para fines de diciembre ni enero. Ojo si el viaje toca los primeros días de diciembre: la edición de otoño 2025 corrió del 19/11 al 7/12 de 17:30 a 21:30 (Sanmon, Miedo, Yūzen-en y campanario). Las fechas 2026 se anuncian en chion-in.or.jp/special/lightup_aut/."],"refs":["https://www.chion-in.or.jp/guide/","https://www.chion-in.or.jp/en/","https://www.chion-in.or.jp/","https://www.chion-in.or.jp/event/annual_event/","https://www.chion-in.or.jp/news/6475/","https://www.chion-in.or.jp/news/6797/","https://www.chion-in.or.jp/date/2025/12/","https://ja.wikipedia.org/wiki/%E7%9F%A5%E6%81%A9%E9%99%A2"]},{"id":"u_g_10883646955444237028","n":"Kenroku-en","cat":"parque","hood":"Kanazawa","why":"Opera normal todo el invierno, sin cierre estacional: 8:00-17:00 del 16/10 al último día de febrero. Es el jardín del clan Maeda, uno de los \"tres grandes\" de Japón, 11 hectáreas pegadas al castillo de Kanazawa, y diciembre-enero es cuando mejor se ve: el yukitsuri —los conos de sogas que sostienen las ramas de los pinos contra la nieve del Hokuriku— arranca el 1 de noviembre con el pino Karasaki, se termina de armar a mediados de diciembre y queda puesto hasta mediados de marzo. Se recorre en 1 a 1,5 h caminando; con el castillo al lado y el museo del siglo XXI a cinco minutos, es la mañana entera. La pregunta real no es si vale Kenroku-en sino si vale Kanazawa: son 2h30-3h de Hokuriku Shinkansen desde Tokio y no funciona como excursión de un día desde ninguna de las otras candidatas.","addr":"1 Kenrokumachi, Kanazawa, Ishikawa 920-0936, Japón","lat":36.5621278,"lng":136.66265149999998,"aprox":false,"gcid":"10883646955444237028","cost":320,"dur":1.5,"sub":"Jardín paisajista Edo","typ":"Jardín","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Kenroku-en","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kanazawa","rate":0,"tip":"","season":"Opera todo diciembre y enero, no tiene cierre estacional ni depende de rutas de montaña. Ojo con la iluminación nocturna: el \"Kanazawa-jō / Kenroku-en Shiki Monogatari — fuyu no dan\" de esta temporada está anunciado para el 6 al 10, 13, 20 y 27 de febrero de 2027, o sea DESPUÉS del viaje. No hay iluminación de invierno en las fechas de Juan y Thais. · Año nuevo (29/12 al 3/1): No cierra. El 29 y 30/12 funciona normal (8:00-17:00, pago). Del 31/12 al 3/1 la entrada es GRATIS, y según el sitio oficial de turismo de Ishikawa el 31/12 queda abierto toda la noche hasta la mañana del 1/1 (終夜開園). Esos días se llena: cae en la ruta de hatsumode de Kanazawa, con el santuario Ishiura enfrente de la entrada Hirosaka, el Kanazawa Jinja dentro del predio y el Oyama Jinja a unos 15 min a pie cruzando el parque del castillo. Reconfirmar el horario nocturno en diciembre 2026, la página no publica todavía el detalle del año.","conf":"alta","warn":["La zona está bien asignada: Kenroku-en está efectivamente en Kanazawa, prefectura de Ishikawa. Pero Kanazawa no es excursión de un día desde ninguna otra candidata: 2h30-3h de Hokuriku Shinkansen desde Tokio, y desde Kioto/Osaka hay trasbordo en Tsuruga. Entra al viaje solo si duermen al menos 2 noches ahí.","Necesita luz de día y cierra a las 17:00 con última entrada 16:30. En Kanazawa a fin de diciembre el sol se pone cerca de las 16:45, así que la última entrada cae casi con el atardecer: es visita de mañana o primera tarde, nunca de cierre.","La iluminación de invierno cae en febrero de 2027, fuera de las fechas del viaje. Si alguien la vio anunciada, no cuenta para este viaje.","Del 31/12 al 3/1 es gratis y se llena de gente que va al hatsumode de los santuarios vecinos. Si quieren el jardín vacío, la ventana es del 14 al 28 de diciembre, o la apertura gratuita de la mañana: abre a las 6:00, pero en diciembre-enero amanece recién cerca de las 7:05, así que la franja con luz es de 7:00 a 7:45 (última entrada 7:30) y hay que salir 15 min antes de la apertura paga de las 8:00.","Es el lado del Mar de Japón: nieve, aguanieve y senderos de piedra mojada son lo normal en enero. Calzado con agarre y paraguas."],"refs":["https://kenrokuen.or.jp/information/","https://kenrokuen.or.jp/illumination/","https://www.hot-ishikawa.jp/event/detail_10867.html","https://www.hot-ishikawa.jp/event/detail_22457.html","https://www.kanazawa-kankoukyoukai.or.jp/spot/detail_10106.html"]},{"id":"u_g_2588648239146089671","n":"Jardín Mōri","cat":"parque","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"6 Chome-10-1 Roppongi, Minato City, Tokyo 106-6108, Japón","lat":35.6603225,"lng":139.7304934,"aprox":false,"gcid":"2588648239146089671","cost":0,"dur":0,"sub":"-","typ":"Jardín","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Jardín Mōri","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_6628738211295053826","n":"Roppongi Hills","cat":"tienda","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"6 Chome-10-1 Roppongi, Minato City, Tokyo 106-6108, Japón","lat":35.6607397,"lng":139.7292319,"aprox":false,"gcid":"6628738211295053826","cost":0,"dur":0,"sub":"-","typ":"Centro comercial","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: El pin es el complejo entero. Si lo guardaron por Tokyo City View sería mirador; si fue por el Mori Art Museum, museo.","src":"lista","gname":"Roppongi Hills","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_16114120031656484864","n":"Avenida de Árboles Ginkgo del Jingu Gaien","cat":"barrio","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"2 Chome-7-付近 Kita-Aoyama, Minato City, Tokyo 107-0061, Japón","lat":35.6727172,"lng":139.7205745,"aprox":false,"gcid":"16114120031656484864","cost":0,"d 7 minutos a pie de la estación Shijō (línea Karasuma), en pleno centro de Kioto. En Tabelog figura como 招楽 (Shōraku) con 3,28 sobre 77 reseñas: bueno para el estándar japonés, no un destino en sí mismo — es el almuerzo correcto si ya estás en la zona Karasuma/Shijō, no algo por lo que cruzar la ciudad. El gancho es el dashi kiotense y el nabeyaki udon, que en diciembre-enero es exactamente lo que pide el cuerpo. La trampa es la agenda: abre SOLO al mediodía y cierra viernes y domingo, así que solo entra en un día que ya tenga el almuerzo libre en el centro.","addr":"Japón, 〒600-8474 Kyoto, Shimogyo Ward, Ayanishitoincho, 758-2","lat":35.001347599999995,"lng":135.75527979999998,"aprox":false,"gcid":"2283886825910327410","cost":1500,"dur":1,"sub":"Udon y soba","typ":"Udon","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Handmade Udon & Soba Shōraku","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.28,"tip":"Nabeyaki udon (el olla caliente, el más mencionado en las reseñas) o el curry udon; también hay sets de udon con donburi o kayaku gohan. No toma reservas: se hace cola en la puerta, entre 10 y 20 minutos según las reseñas, con lleno alrededor de las 11:30 y otra vez cerca de las 13:00. Conviene caer 11:00-11:15. Acepta tarjeta (AMEX listada), no acepta dinero electrónico ni pagos con QR; llevá efectivo igual. 22 asientos, no fumadores. Ticket de ¥1.000-1.999 por persona.","season":"","conf":"alta","warn":["Solo abre al mediodía (11:00-14:30). No sirve para cenar: cierra a las 14:30 y no vuelve a abrir.","Cierra VIERNES y DOMINGO, no el lunes como la mayoría. Si el día que cae en Kioto es viernes o domingo, está descartado sin más.","No toma reservas y hay cola real de 10-20 minutos al mediodía. Llegar 11:00-11:15.","Shōgatsu (29/12-3/1) sin verificar: los locales chicos de barrio en Kioto suelen cerrar toda esa semana. Hay que llamar al 075-351-8123 antes de contarlo como opción de almuerzo esos días.","El nombre real es 招楽, no 匠楽: Google lo rotula 'Handmade Udon & Soba Shōraku'. Misma dirección (綾西洞院町758-2), es el mismo local. La zona asignada es correcta: Shimogyo-ku, ciudad de Kioto."],"refs":["https://tabelog.com/en/kyoto/A2601/A260201/26019019/","https://tabelog.com/en/kyoto/A2601/A260201/26019019/dtlrvwlst/","https://tabelog.com/en/kyoto/A2601/rstLst/?sw=Shoraku"]},{"id":"u_g_804106674468053604","n":"Yayoiken Shijo Karasuma","cat":"comida","hood":"Kioto","why":"Es una sucursal de Yayoiken, la cadena nacional de teishoku de Plenus: unos 379 locales en Japón, bandeja con plato principal, arroz, sopa y encurtidos por 890-990 yenes, pedido por máquina y arroz con repetición gratis. La comida es exactamente la misma que en cualquier otra sucursal, así que como destino gastronómico no existe: Tabelog le da 3.07 sobre 5 con 92 reseñas, que es el techo natural de una cadena. Lo único que la hace anotable para este viaje son dos datos duros de la ficha oficial: abre las 24 horas los 7 días y sirve desayuno de 5:00 a 11:00 (desde 440 yenes), en Shijo entre Nishinotoin y Aburanokoji, a unos 400 m del cruce Shijo-Karasuma. O sea: red de seguridad para una llegada tarde, un desayuno antes de un tren temprano, o los días de shogatsu cuando media Kioto baja la persiana — no una parada que se planifique.","addr":"Japón, 〒600-8314 Kyoto, Shimogyo Ward, Shinkamanzacho, 716-1 ２","lat":35.0035527,"lng":135.75611519999998,"aprox":false,"gcid":"804106674468053604","cost":900,"dur":0.5,"sub":"teishoku (cadena nacional)","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Yayoiken Shijo Karasuma","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":3.07,"tip":"Teishoku (bandeja completa) con arroz de repetición libre. De la carta de la prefectura de Kioto: shogayaki teishoku (cerdo salteado con jengibre, el más vendido) 890 yenes, chicken nanban 990, niku-yasai itame (salteado de carne y cinco verduras) 990, el \"kiwami\" shogayaki de cerdo sangenton 1.190. Desayunos de 5:00 a 11:00: básico 440, shirasu-oroshi 460, mini sukiyaki 540, huevo y salchicha 550, salmón a la sal 580, caballa a la sal 600. Guarniciones aparte: huevo crudo 70, natto 110, sopa de miso 100, tonjiru 290. No toma reservas y no hace falta: se pide en máquina o por mobile order. La ficha oficial lista efectivo, VISA/Mastercard/JCB/Amex/Diners/Discover, IC de transporte (no PiTaPa) y QR (PayPay, d-barai, auPAY, Rakuten Pay, Merpay).","season":"","conf":"alta","warn":["La zona está bien asignada: es Kioto de verdad. Direccion oficial 京都市下京区四条通西洞院東入新釜座町716-1-2, edificio Shijo Hirano, sobre Shijo-dori entre Nishinotoin y Aburanokoji (35.0036, 135.7561), unos 400 m al oeste del cruce Shijo-Karasuma y 5-6 minutos a pie de las estaciones Shijo (linea Karasuma) o Karasuma (Hankyu). No hay error de prefectura.","Es cadena, no un local. El 3.07 de Tabelog corresponde a ESTA sucursal, pero la carta y la cocina son idénticas en las casi 380 sucursales del país: no justifica desviar un solo paso del itinerario. Va al catálogo como recurso de emergencia, no como opción de comida elegida.","Shogatsu sin confirmar. La ficha oficial declara 24 h los 7 días y no lista excepción de fin de año, pero el aviso de cierre de shogatsu se publica recién en diciembre. Si se la piensa usar como plan B entre el 29/12 y el 3/1, hay que revisar store.yayoiken.com/b/yayoiken/info/2050/ en diciembre de 2026.","Contradicción entre fuentes en el pago: Tabelog dice que no acepta tarjetas de crédito, la ficha oficial de la sucursal sí las lista. La oficial es más reciente y más autorizada, pero llevar efectivo cuesta cero.","El desayuno barato (440-600 yenes) solo se sirve de 5:00 a 11:00. Fuera de esa franja se paga la carta completa."],"refs":["https://tabelog.com/en/kyoto/A2601/A260201/26011748/","https://store.yayoiken.com/b/yayoiken/info/2050/","https://www.yayoiken.com/menu_list/index/26","https://store.yayoiken.com/b/yayoiken/attr/?search=freeword&q=%E5%9B%9B%E6%9D%A1%E7%83%8F%E4%B8%B8","https://www.yayoiken.com/"]},{"id":"u_g_14370462383902072547","n":"UNIQLO Harajuku","cat":"tienda","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒150-8010 Tokyo, Shibuya, Jingumae, 1 Chome−14−30 地下１階～１階","lat":35.670604,"lng":139.70320759999998,"aprox":false,"gcid":"14370462383902072547","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"UNIQLO Harajuku","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_16395963577284327986","n":"On Store Tokyo Cat Street","cat":"tienda","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"5 Chome-17-27 Jingumae, Shibuya, Tokyo 150-0001, Japón","lat":35.6661636,"lng":139.7057893,"aprox":false,"gcid":"16395963577284327986","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"On Store Tokyo Cat Street","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_8567568301111815145","n":"Tokyu Plaza Harajuku “Harakado”","cat":"tienda","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒150-0001 Tokyo, Shibuya, Jingumae, 6 Chome−31−21 原宿スクエア内 東急プラザ 原宿「ハラカド」","lat":35.668425899999995,"lng":139.7049858,"aprox":false,"gcid":"8567568301111815145","cost":0,"dur":0,"sub":"-","typ":"Centro comercial","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Es Tokyu Plaza Harajuku «Harakado». Sin nombre no sé si el pin es el edificio/tiendas o algún local puntual adentro (café o la terraza).","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_8067212359343678579","n":"Shibuya SKY","cat":"mirador","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒150-6145 Tokyo, Shibuya, 2 Chome−24−12 スクランブルスクエア 14階・45階 46階・屋上","lat":35.6586719,"lng":139.7019848,"aprox":false,"gcid":"8067212359343678579","cost":0,"dur":0,"sub":"-","typ":"Observatorio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Japón","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_16137221265514556561","n":"Tsukimura","cat":"comida","hood":"Nasushiobara","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"2-19 Higashiyamatocho, Nasushiobara, Tochigi 325-0041, Japón","lat":36.9771718,"lng":140.0481652,"aprox":false,"gcid":"16137221265514556561","cost":0,"dur":0,"sub":"-","typ":"Unagi","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tsukimura","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Otras zonas","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_12395939561965691870","n":"Iga-ryu Ninja Museum","cat":"museo","hood":"Iga","why":"Museo chico sobre la escuela ninja de Iga: una casa con paredes giratorias y escondites que se recorre con guía, dos salas de herramientas y armas, un show de ninjutsu con armas reales (en japonés) y tiro de shuriken. Está bien hecho y los carteles tienen inglés, pero el problema no es el museo: está en la prefectura de Mie, no en Nara, y llegar cuesta ~1h30 desde Nara, 1h40-2h desde Osaka y 2h desde Kioto con dos o tres transbordos y una sola conexión por hora. Eso convierte 1h30 de visita en un día entero fuera del itinerario, y en diciembre el museo cierra a las 16:00 los días de semana, así que ni siquiera se estira. Salvo que el ninjutsu sea un tema personal fuerte, para 25 días con Tokio-Kioto-Nara-Osaka sobre la mesa esto se descarta: no es un viaje de foodies ni de arquitectura, es un desvío temático de 6 horas de tren ida y vuelta.","addr":"内, 117 Uenomarunouchi, Iga, Mie 518-0873, Japón","lat":34.771836,"lng":136.129113,"aprox":false,"gcid":"12395939561965691870","cost":1600,"dur":1.5,"sub":"Museo temático: casa ninja con trampas + sala de armas + show","typ":"Museo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Iga-ryu Ninja Museum","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":0,"tip":"","season":"No es de montaña ni estacional: opera todo el invierno salvo el cierre de año nuevo. Lo único que cambia es que en día de semana cierra 16:00, o sea que hay que salir temprano. · Año nuevo (29/12 al 3/1): Cerrado del 29/12 al 1/1 según el sitio oficial. El 2 y 3 de enero de 2027 (sábado y domingo) debería abrir con horario de fin de semana, 10:00-16:30, pero eso no está confirmado como excepción explícita: conviene chequear el sitio en diciembre.","conf":"alta","warn":["ZONA MAL ASIGNADA: no está en Nara. Iga está en la prefectura de MIE, a ~30 km en línea recta / ~52 km por ruta de la estación de Nara. En tren son ~1h30 con transbordo por Kamo; ~1h40-2h desde Osaka (Tennoji, ~1.620 yen) y 2h desde Kioto (1.450 yen, vía Kusatsu y Tsuge). No es una salida desde Nara: es un día entero.","Solo hay ~una conexión por hora en el tramo JR: perder un transbordo cuesta una hora parado en Tsuge o Kamo.","Cerrado 29/12 al 1/1 (pleno shōgatsu).","El show de ninjutsu (600 yen aparte) tiene días sin función (休演日) marcados en el calendario oficial; el calendario de diciembre 2026 todavía no está publicado (al día de hoy en /showsche/ solo figura septiembre 2026). Sin función, el costo real es 1.000 yen y el museo pierde bastante. El tiro de shuriken son 300 yen más por 6 tiros, aparte.","Los precios que circulan en guías en inglés (800 yen entrada / 500 el show) están desactualizados. El oficial dice 1.000 + 600.","Desde la estación Ueno-shi son ~10 minutos a pie (~700 m) hasta el museo, dentro del parque Ueno. El tramo Iga-Ueno → Ueno-shi es del Iga Railway: 280 yen NO cubiertos por el JR Pass."],"refs":["https://www.iganinja.jp/","https://www.iganinja.jp/about/index.html","https://www.iganinja.jp/showsche/","https://www.japan-guide.com/e/e4351.html","https://www.japan-guide.com/e/e4353.html"]},{"id":"u_g_6292079773791905075","n":"Shinkansen (Bullet Train) Museum","cat":"museo","hood":"Tokio","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-46-8 Hikaricho, Kokubunji, Tokyo 185-0034, Japón","lat":35.7027652,"lng":139.4444787,"aprox":false,"gcid":"6292079773791905075","cost":0,"dur":0,"sub":"-","typ":"Museo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Shinkansen (Bullet Train) Museum","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_4127506311404377875","n":"Museo de Ciencias de Nagoya","cat":"museo","hood":"Nagoya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒460-0008 Aichi, Nagoya, Naka Ward, Sakae, 2 Chome−17−1 芸術と科学の杜・白川公園内","lat":35.1650768,"lng":136.89970259999998,"aprox":false,"gcid":"4127506311404377875","cost":0,"dur":0,"sub":"-","typ":"Museo de ciencias","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Sin nombre. Por dirección (Sakae 2-17-1, dentro del parque Shirakawa) es el Museo de Ciencias de Nagoya, pero el Museo de Arte de Nagoya está en el mismo parque a metros.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nagoya","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_1033610131147447210","n":"Cup Noodles Museum Osaka Ikeda","cat":"museo","hood":"Osaka","why":"Es el museo original de Nissin (abrió en 1999 como Instant Ramen Invention Museum, インスタントラーメン発明記念館) en Ikeda, un suburbio al norte de Osaka: la casa de Momofuku Ando, la réplica del cobertizo donde inventó el ramen instantáneo en 1958 y el túnel con ~800 paquetes de fideos. La entrada es gratis y lo verificamos en la web oficial. Lo que realmente se hace es la My CUPNOODLES Factory: 500 yenes por vaso, lo decorás, elegís 1 de 4 caldos y 4 de 12 toppings, y te lo envuelven en film retráctil y lo metés en una bolsa que inflás vos con aire; 45 minutos, sin reserva, se sacan números por orden de llegada el mismo día. La versión seria es la Chicken Ramen Factory (1.200 yenes adultos, 70 minutos, amasás y freís los fideos vos), y esa sí necesita reserva online, se abre hasta 3 meses antes. Para dos foodies el atractivo es la Chicken Ramen Factory, no la del vasito, que es más manualidad que comida. El costo real no es el dinero sino el horario: cierra 16:30 con última entrada 15:30, así que ocupa el bloque de luz de la mañana o la primera tarde, que en diciembre es el recurso escaso del día. Sumado a los ~40 minutos puerta a puerta desde el centro de Osaka, es media mañana entera para un museo chico. Vale si ya vas a la zona norte (Minoo, Takarazuka, aeropuerto de Itami) o si les copa la historia del producto; si no, no compite contra un día en Osaka.","addr":"8-25 Masumicho, Ikeda, Osaka 563-0041, Japón","lat":34.8178846,"lng":135.4266442,"aprox":false,"gcid":"1033610131147447210","cost":500,"dur":1.5,"sub":"Museo de marca / taller de comida","typ":"Museo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Cup Noodles Museum Osaka Ikeda","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Cierra por año nuevo, pero las fechas de la edición 2026-2027 todavía no están anunciadas (la sección de novedades, revisada en agosto de 2026, no las tiene). El precedente verificado es el aviso del 22/10/2025: en 2025-2026 cerró del lunes 29/12/2025 al viernes 2/1/2026 y reabrió el sábado 3/1/2026. Ojo con el otro cierre: ese mismo aviso agregaba mantenimiento del 6 al 9 de enero de 2026. Si repiten el patrón, del 29/12/2026 al 2/1/2027 está cerrado y el 6 y 7 de enero de 2027 también podrían estarlo — justo los últimos días del viaje. Hay que reconfirmar en la web oficial a partir de octubre de 2026.","conf":"alta","warn":["La zona no está mal rotulada pero sí es engañosa: Ikeda es ciudad propia dentro de la prefectura de Osaka, no el centro de Osaka. Son ~20 minutos en expreso de la línea Hankyu Takarazuka desde Hankyu Osaka-Umeda hasta estación Ikeda, más 5 minutos a pie desde la salida Masumi-cho: ~40 minutos puerta a puerta desde el centro, ida y vuelta.","Fechas de cierre de fin de año 2026-2027 SIN CONFIRMAR. Las que figuran en la ficha son las de 2025-2026 (29/12 al 2/1) citadas como precedente, no como dato del viaje. Reconfirmar en la web oficial desde octubre de 2026.","Riesgo extra en enero: en 2026 hubo cierre por mantenimiento del 6 al 9 de enero, además del de año nuevo. Si se repite, el 6 y el 7 de enero de 2027 quedan afuera.","Última entrada 15:30 y cierre 16:30: es un plan de mañana o primera tarde obligado, y en diciembre eso choca con las pocas horas de luz útiles.","La Chicken Ramen Factory (1.200 yenes por adulto, 70 minutos, turnos 9:40 / 10:50 / 12:00 / 14:00 / 15:10) exige reserva online, se abre hasta 3 meses antes y en temporada se llena. Si es lo que quieren hacer, hay que reservar; sin reserva solo queda la My CUPNOODLES Factory.","La My CUPNOODLES Factory no toma reservas: se retiran números por orden de llegada el mismo día y la máquina de vasos puede dejar de vender antes de hora si hay mucha gente. La web oficial no aclara si esa máquina acepta tarjeta — asumir efectivo y llevar monedas.","Estacionamiento: 23 lugares a 300 yenes cada 20 minutos, sin tope ni descuento. Ir en tren.","No confundir con el Cup Noodles Museum de Yokohama, que es otro edificio y más grande. Este, el de Ikeda, es el original y tiene entrada gratis (verificado en la web oficial)."],"refs":["https://www.cupnoodles-museum.jp/en/osaka_ikeda/","https://www.cupnoodles-museum.jp/en/osaka_ikeda/guide/admission/","https://www.cupnoodles-museum.jp/en/osaka_ikeda/guide/access/","https://www.cupnoodles-museum.jp/en/osaka_ikeda/attractions/mc-factory/","https://www.cupnoodles-museum.jp/en/osaka_ikeda/attractions/cr-factory/","https://www.cupnoodles-museum.jp/en/osaka_ikeda/news/","https://www.cupnoodles-museum.jp/ja/osaka_ikeda/","https://www.cupnoodles-museum.jp/ja/osaka_ikeda/guide/admission/"]},{"id":"u_g_7918542870314997282","n":"Teamlabs Planet","cat":"museo","hood":"Kōtō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"6 Chome-1-16 Toyosu, Koto City, Tokyo 135-0061, Japón","lat":35.6490795,"lng":139.7898157,"aprox":false,"gcid":"7918542870314997282","cost":0,"dur":0,"sub":"-","typ":"Museo de arte","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Teamlabs Planet","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_10888609339907168331","n":"Spa LaQua","cat":"sinclasificar","hood":"Bunkyō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒112-0003 Tokyo, Bunkyo City, Kasuga, 1 Chome−1−1 ラクーアビル 6F","lat :0,"sub":"-","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Uzukino Honten","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_5195404337863602837","n":"Harajuku","cat":"barrio","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Jingumae, Shibuya, Tokio 150-0001, Japón","lat":35.6699682,"lng":139.70900799999998,"aprox":false,"gcid":"5195404337863602837","cost":0,"dur":0,"sub":"-","typ":"Barrio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Harajuku","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_5403995955937224226","n":"Nara","cat":"barrio","hood":"Nara","why":"No es un lugar: es la ciudad entera, y funciona como excursión de un día desde Kioto u Osaka (menos de una hora en tren, sin necesidad de mover valijas). El núcleo — Nara Park con los ciervos sueltos, Todaiji y su Gran Buda, Kofukuji, el camino de linternas de piedra hasta Kasuga Taisha — es un circuito a pie de unas 4-5 horas, casi todo al aire libre y gratis salvo Todaiji (¥800). Eso lo vuelve uno de los mejores candidatos para meter dentro de shōgatsu: cuando los museos y comercios cierran del 28/12 al 3/1, un parque con templos sigue funcionando (más lleno, eso sí, por el hatsumōde). El costo es que en diciembre el sol se pone cerca de las 16:50 y el Daibutsuden cierra a las 17:00: hay que salir temprano, y la ciudad se apaga después de esa hora, así que la cena vuelve a Kioto u Osaka.","addr":"Prefectura de Nara, Japón","lat":34.685109,"lng":135.8048019,"aprox":false,"gcid":"5403995955937224226","cost":800,"dur":8,"sub":"-","typ":"Ciudad","book":"","free":"","closed":"","main":true,"costN":"⚠ categoría por confirmar: Es la prefectura/ciudad entera, no un punto concreto; entra como zona a falta de categoría mejor.","src":"lista","gname":"Nara","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Verificado en parte. El parque y los ciervos no cierran nunca. Todaiji: el 1 de enero de 2027 abre el Chūmon del Daibutsuden de 00:00 a 08:00 con entrada gratis y el 観相窓 abierto (se ve la cara del Buda desde afuera); desde las 23:00 del 31/12 encienden fogatas sobre el camino de acceso. Confirmado con fecha 2027 en la agenda oficial de turismo de la ciudad. Museo Nacional de Nara: cerrado del 28/12 al 1/1. Kasuga Taisha: el aviso oficial (edición Reiwa 6, o sea enero 2024 — la de 2026-27 todavía no está publicada) suspende el特別参拝 al honden del 21/12 al 8/1 y extiende el horario del recinto: 31/12 desde las 23:45, 1/1 hasta las 20:00, 2 y 3/1 de 7:00 a 19:00. Tomarlo como patrón esperable, no como dato confirmado para este año.","conf":"alta","warn":["La zona está bien: Nara ciudad es la capital de la prefectura de Nara, no un caso de rótulo equivocado. Pero es una ciudad aparte: ~40 min de Kioto y ~45 min de Osaka en tren. Entra al viaje como excursión de un día, no como base para dormir.","Luz: en diciembre el sol se pone cerca de las 16:50 y el Daibutsuden cierra a las 17:00. Si se sale de Kioto/Osaka después de las 10:00, se pierde medio circuito. Salida antes de las 9:00.","Nara de noche no da: los locales del área de los templos cierran temprano y la ciudad queda vacía. Planificar la cena en Kioto u Osaka, no acá. Naramachi tiene algo de bares, pero no justifica quedarse.","El特別参拝 al honden de Kasuga Taisha estuvo suspendido del 21/12 al 8/1 en la edición 2023-24. Si el viaje cae en esa ventana, probablemente no se pueda entrar al recinto interior (el resto del santuario sí).","El Museo Nacional de Nara cierra 28/12-1/1 y los lunes: si el día de Nara cae ahí, el museo se descarta y queda solo el circuito exterior.","Del 31/12 al 3/1 el hatsumōde llena Todaiji y Kasuga Taisha. La madrugada del 1/1 en el Daibutsuden es gratis pero con multitud real.","Los ciervos son animales sueltos, no una atracción domesticada: apenas ven las galletas (se venden en puestos del parque, unos pocos cientos de yenes) empujan y muerden bolsas, mapas y abrigos colgando. Guardar todo antes de comprarlas."],"refs":["https://www.todaiji.or.jp/en/","https://www.todaiji.or.jp/en/information/haikan/","https://narashikanko.or.jp/en/spot/detail_10001.html","https://narashikanko.or.jp/event/detail_10275.html","https://narashikanko.or.jp/en/spot/detail_10058.html","https://narashikanko.or.jp/en/spot/detail_10043.html","https://www.kasugataisha.or.jp/news/2023/13403/","https://www.kasugataisha.or.jp/"]},{"id":"u_g_13877311421361626429","n":"Kioto","cat":"barrio","hood":"Prefectura de Kioto","why":"No es un lugar: es la ciudad entera, así que esto funciona como voto por Kioto como base y no como parada de un día. Vale las 4-5 noches: los cinco frentes (Higashiyama con Kiyomizudera y Gion, Arashiyama al oeste, Kinkakuji y Ryoanji al norte, Fushimi Inari al sur, el centro con Nishiki y Nijo) no se hacen desde Osaka sin perder dos horas de tren por día, y Nara queda a menos de una hora. En diciembre-enero la ventaja es que el turismo cae respecto de la temporada de otoño; la contra es que el sol se pone temprano (el 28/12 en Kioto sale 07:02 y se pone 16:54, hora local) y los jardines y templos cierran cerca de esa hora — Kiyomizudera, por ejemplo, abre 6:00-18:00 todos los días del año, ¥500. Si el viaje pasa el Año Nuevo en algún lado, Kioto funciona bien: Fushimi Inari, Yasaka y Chion-in concentran hatsumōde a distancia caminable o de un tren corto.","addr":"Prefectura de Kioto, Japón","lat":35.011564,"lng":135.7681489,"aprox":false,"gcid":"13877311421361626429","cost":0,"dur":96,"sub":"Ciudad base — región de Kansai","typ":"Ciudad","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Kioto","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es un destino estacional ni de montaña: opera todo el año, sin rutas cerradas. Es invierno frío con nieve ocasional que no interrumpe el transporte urbano. · Año nuevo (29/12 al 3/1): Verificado a medias: la regla general del país es que del 1 al 3 de enero cierra la mayoría de los comercios, y los templos/santuarios trabajan al revés (hatsumōde, multitudes). Kiyomizudera figura como \"sin días de cierre\", así que sigue abierto. Los horarios exactos de Año Nuevo de Fushimi Inari, Yasaka (Okera Mairi la noche del 31) y Nishiki Market NO están publicados en las páginas oficiales que se pudieron leer: hay que reverificarlos uno por uno cuando se arme el itinerario. Sí está verificado que los Nozomi del Tokaido Shinkansen pasan a ser 100% reservados durante Año Nuevo y se agotan con varios días de anticipación.","conf":"alta","warn":["El pin no es un lugar visitable: apunta a 'Prefectura de Kioto, Japón'. Tratarlo como ciudad base del viaje, no como parada de itinerario — no le asignes horas de un día.","La zona rotulada es correcta (Prefectura de Kioto / Kioto), no hay error de asignación. Distancias reales: Osaka ~30 min en tren, Nara menos de 1 hora, Tokio ~2 h en Shinkansen.","Del 1 al 3 de enero cierran comercios, museos y muchos restaurantes; los santuarios se llenan de hatsumōde. Si Kioto es la base de esos días, el plan tiene que ser de templos y calle, no de museos.","Nozomi (Tokio-Kioto) queda 100% reservado del 25/12/2026 al 5/1/2027: en ese lapso no hay asientos libres y se agota días antes. Si el tramo cae ahí, reservar apenas abra la venta (1 mes antes, 10:00 JST). Fuente: https://en.traicy.com/posts/2026052135784/","Oscurece 16:54 el 28/12 (amanece 07:02). Todo lo que necesite luz —Arashiyama, jardines, caminatas de Higashiyama— entra antes de las 16:00.","Impuesto de alojamiento de la ciudad de Kioto, vigente desde el 1/3/2026, por persona y por noche, según tarifa de la habitación: menos de ¥6.000 → ¥200 · ¥6.000-19.999 → ¥400 · ¥20.000-49.999 → ¥1.000 · ¥50.000-99.999 → ¥4.000 · ¥100.000 o más → ¥10.000. Menores de 12 exentos. Se cobra en el hotel, aparte de la tarifa."],"refs":["https://kyoto.travel/en","https://www.japan-guide.com/e/e2158.html","https://www.japan-guide.com/e/e2064.html","https://www.japan-guide.com/e/e3901.html","https://www.japan-guide.com/e/e2018.html","https://www.japan-guide.com/e/e2165.html","https://inari.jp/en/","https://www.kyoto-nishiki.or.jp/en/","https://www.yasaka-jinja.or.jp/en/","https://api.sunrise-sunset.org/json?lat=35.0116&lng=135.7681&date=2026-12-28&formatted=0","https://en.traicy.com/posts/2026052135784/"]},{"id":"u_g_2370410330085837161","n":"Shibuya Crossing","cat":"barrio","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Shibuya, Tokyo, Japón","lat":35.659482,"lng":139.7005596,"aprox":false,"gcid":"2370410330085837161","cost":0,"dur":0,"sub":"-","typ":"Cruce peatonal","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Landmark urbano puntual, no un barrio; se fuerza a arq por «calles notables». Podría ir en barrio si se toma como la zona de Shibuya.","src":"lista","gname":"Shibuya Crossing","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_11704332758705177180","n":"Fish Market Tsukiji Outer Market","cat":"comida","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒104-0045 Tokyo, Chuo City, Tsukiji, 4 Chome および６丁目一部","lat":35.6647703,"lng":139.7702515,"aprox":false,"gcid":"11704332758705177180","cost":0,"dur":0,"sub":"-","typ":"Mercado","book":"","free": costN":"","src":"lista","gname":"Castillo de Himeji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Himeji","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17702968699573940841","n":"Koka Ninja House","cat":"museo","hood":"Koka","why":"La casa real de la familia Mochizuki, construida en la era Genroku (1688-1704), con puertas giratorias, trampillas y pasadizos originales: no es un parque temático sino la vivienda que sobrevivió. El problema no es el lugar, es la logística: está en Kōka, prefectura de Shiga, a unos 55 km al sudeste de Kioto, y llegar son dos trenes (Biwako Line hasta Kusatsu, Kusatsu Line hasta Konan) más 20 minutos a pie; con una visita de una hora, se come el día entero para muy poco. Encima cierra del 27/12 al 3/1 y todos los miércoles y el 4º jueves, lo que en el tramo del viaje voltea el 16, 23 y 24 de diciembre y el 6 de enero. Con 25 días y Kioto entera por ver, la recomendación es descartarlo salvo que el ninja sea un tema propio y no una curiosidad.","addr":"2331 Konancho Ryuboshi, Koka, Shiga 520-3311, Japón","lat":34.918412499999995,"lng":136.16740719999999,"aprox":false,"gcid":"17702968699573940841","cost":800,"dur":1,"sub":"casa-museo ninja","typ":"Casa-museo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Koka Ninja House","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es un lugar de montaña ni estacional: opera en diciembre con el horario normal. Además del cierre de fin de año tiene un cierre invernal de dos semanas en la segunda mitad de enero (en 2026 fue del 19 al 30/1), que cae fuera de las fechas del viaje. · Año nuevo (29/12 al 3/1): Cerrado. La página de información del sitio oficial declara el cierre de fin de año como norma anual (\"12.27 - next year 01.03, 8 días\") y el aviso del 1/12/2025 confirmó ese rango para 2025-26. El calendario 2026-27 todavía no está publicado: lo sacan recién en diciembre.","conf":"alta","warn":["ZONA MAL ROTULADA: no es Kioto. Está en Kōka, prefectura de SHIGA, a unos 55 km al sudeste de Kioto ciudad. Acceso desde Kioto: JR Biwako Line hasta Kusatsu, trasbordo a la Kusatsu Line hasta la estación Konan, y de ahí 20 minutos a pie (o 5 en taxi). Calculá hora y media larga por tramo, o sea medio día ida y vuelta como piso.","SHŌGATSU: cerrado del 27/12 al 3/1 según la norma que publica el propio sitio. Si el viaje pasa por Kioto en esos días, este lugar no existe.","Cierra todos los miércoles y el 4º jueves del mes. En las fechas del viaje eso deja afuera el miércoles 16/12, el miércoles 23/12, el jueves 24/12 (4º jueves) y el miércoles 6/1/2027.","NO CONFUNDIR con el Kōka Ninja Village (甲賀の里忍術村), que es un parque temático en otro punto de Kōka, ni con el Kōka-ryū Real Ninja Museum (甲賀流リアル忍者館, gratis, 10:00-16:00, también cerrado del 29/12 al 3/1), que queda a unas cuadras en el mismo barrio de Ryūhōshi.","El calendario específico de diciembre lo publican recién en diciembre y suele haber cierres temporales sueltos. Si se decide ir, confirmar por teléfono al 0748-86-2179 antes de tomarse dos trenes.","El sitio oficial es kouka-ninjya.com. Google Maps no lo linkea de forma obvia y varias variantes del dominio que aparecen citadas por ahí no existen."],"refs":["https://www.kouka-ninjya.com/info/","https://www.kouka-ninjya.com/la_en/info/","https://www.kouka-ninjya.com/%e6%9c%aa%e5%88%86%e9%a1%9e/%e5%b9%b4%e6%9c%ab%e5%b9%b4%e5%a7%8b%e5%8f%8a%e3%81%b3%e5%86%ac%e6%9c%9f%e4%bc%91%e9%a4%a8%e3%81%ae%e3%81%8a%e7%9f%a5%e3%82%89%e3%81%9b-3/","https://www.kouka-ninjya.com/%e6%9c%aa%e5%88%86%e9%a1%9e/%e9%96%8b%e9%a4%a8%e6%99%82%e9%96%93%e5%a4%89%e6%9b%b4%e3%81%ae%e3%81%8a%e7%9f%a5%e3%82%89%e3%81%9b%ef%bc%884%e6%9c%881%e6%97%a5%e3%82%88%e3%82%8a%ef%bc%89/","https://www.kouka-ninjya.com/","https://ja.wikipedia.org/wiki/%E7%94%B2%E8%B3%80%E6%B5%81%E5%BF%8D%E8%A1%93%E5%B1%8B%E6%95%B7","https://www.real-ninjakan.com/"]},{"id":"u_g_7111013964196361402","n":"Kiyomizu-dera","cat":"arq","hood":"Kioto","why":"Uno de los templos más visitados de Kioto: la terraza de madera sobre pilotes del Hondo, la cascada Otowa y la subida por Sannenzaka/Ninenzaka, que en la práctica es la mitad del paseo. Vale, pero por la multitud: abre a las 6:00 —de los poquísimos lugares de Kioto abiertos al amanecer— y entre las 10 y las 16 la subida es un embudo de gente. En diciembre-enero cierra a las 18:00 sin apertura nocturna (la iluminación de otoño 2026 fue del 21 al 30 de noviembre, termina antes de que lleguen), y como el sol se pone cerca de las 16:47, la ventana útil real es de 6:45 a 16:30. Entrada ¥500 por persona, solo efectivo. Del 1 al 3 de enero funciona igual pero se suma el hatsumōde encima del turismo normal.","addr":"1 Chome-294 Kiyomizu, Higashiyama Ward, Kyoto, 605-0862, Japón","lat":34.9946662,"lng":135.784661,"aprox":false,"gcid":"7111013964196361402","cost":500,"dur":2,"sub":"Templo budista · Higashiyama","typ":"Templo","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Kiyomizu-dera","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abierto y sin cierre: no hay ningún día cerrado en la tabla oficial. 31/12 joya no kane (108 campanadas desde la noche del 31): la web oficial solo dice que el toque de campana es con reserva (予約制) y NO publica procedimiento ni cupos; las fuentes de terceros se contradicen (unas dicen 整理券 desde el 25/12, otras que lo tocan solo los monjes). Sin verificar: no lo planifiquen como evento hasta confirmarlo por teléfono (075-551-1234). El 31/12 tampoco hay apertura nocturna de pago. 1–7 de enero, shusho-e. Del 1 al 3 es hatsumōde: el 1/1 abre 6:00 y es de los templos que más gente concentra en Kioto, con horario normal 6:00–18:00.","conf":"alta","warn":["Entrada ¥500 por adulto (¥200 primaria/secundaria; +¥100 el Tainai-meguri del Zuigu-do). Solo EFECTIVO: no aceptan tarjeta, IC ni QR. Tarifa vigente desde abril 2024.","En diciembre y enero no hay apertura nocturna. La iluminación de otoño 2026 fue del 21 al 30 de noviembre y termina antes de que lleguen (14/12). Cierra 18:00 y el sol se pone ~16:47: lo visual se acaba cerca de las 16:30.","1 al 3 de enero: hatsumōde. Multitud fuerte en el templo y en toda la subida de Higashiyama. Si van esos días, que sea a las 6:30-7:00 o se descarta.","La jugada es entrar entre 6:45 y 8:00 (amanece cerca de las 7 a fin de diciembre). A las 6:00 todavía está oscuro. Después de las 9:30 la subida por Sannenzaka es un embudo de gente.","Se llega solo cuesta arriba por calles de adoquín empinadas. Con lluvia o hielo resbalan. No hay bajada de auto en la puerta: el taxi te deja al pie de la cuesta.","Joya no kane del 31/12: la web oficial solo dice «con reserva» y no publica cómo anotarse; las fuentes de terceros se contradicen. Sin verificar — si les interesa, hay que llamar al 075-551-1234. No lo den por hecho como plan de fin de año."],"refs":["https://www.kiyomizudera.or.jp/access.php","https://www.kiyomizudera.or.jp/news/open-hour.php","https://www.kiyomizudera.or.jp/en/visit/","https://www.kiyomizudera.or.jp/event/","https://www.kiyomizudera.or.jp/en/faq/","https://www.kiyomizudera.or.jp/event/joya.php"]},{"id":"u_g_14364157197469847729","n":"Higashiyama-ku","cat":"barrio","hood":"Prefectura de Kioto","why":"No es un \"lugar\" sino uno de los once distritos de la ciudad de Kioto (7,48 km² entre el río Kamo y las montañas Higashiyama, de la calle Sanjō al norte a Jūjō al sur), y adentro tiene la mayor concentración de lo que la gente va a ver a Kioto: Kiyomizu-dera, las cuestas Ninenzaka y Sannenzaka, Kōdai-ji, Yasaka Jinja, Gion, Kennin-ji, Sanjūsangen-dō y Tōfuku-ji. Es zona de caminata: se hace a pie encadenando templos, y por eso justifica un día entero (o dos) en el itinerario. En diciembre-enero el problema es la luz: el sol se pone entre las 16:45 y las 16:55 y a las 17:15 ya es de noche, así que arrancar 8:00-9:00 y dejar Gion para el atardecer es lo razonable. Las dos iluminaciones nocturnas grandes caen justo antes de que lleguen: la de Kiyomizu fue del 21 al 30 de noviembre de 2026 y la de Kōdai-ji del 23 de octubre al 13 de diciembre de 2026 — llegan el 14, un día tarde.","addr":"Kioto, Prefectura de Kioto, Japón","lat":34.9926102,"lng":135.7748632,"aprox":false,"gcid":"14364157197469847729","cost":0,"dur":5,"sub":"Kioto / Higashiyama","typ":"Barrio","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Higashiyama-ku","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Al revés que el resto de Japón: el barrio es el epicentro del hatsumōde de Kioto y está a full. Verificado en la web oficial de Yasaka Jinja: 28/12 4:00 ceremonia del fuego (鑽火式), no pública — no se puede presenciar; 31/12 19:00 Okera Mairi (se lleva fuego sagrado de las linternas a casa), 1/1 5:00 Okera-sai, 3/1 con ceremonia a las 8:00, teatro Noh a las 9:00 y juego de cartas a las 13:00, y 9-10/1 el Ebisu de Gion. Kiyomizu-dera toca las 108 campanadas el 31/12 y hace la ceremonia Shushōe del 1 al 7 de enero. Museos y comercios cierran, los templos y santuarios de acá no: se llenan.","conf":"alta","warn":["La zona está bien asignada: Higashiyama-ku ES un distrito de la ciudad de Kioto, prefectura de Kioto. No hay error de rotulado.","Necesita luz de día. A fin de diciembre en Kioto el sol se pone cerca de las 16:50: las cuestas Sannenzaka/Ninenzaka y el mirador de Kiyomizu conviene hacerlos antes de las 15:30.","La iluminación nocturna de Kōdai-ji 2026 termina el 13 de diciembre (fecha de la web oficial del templo) y llegan el 14. La de Kiyomizu fue 21-30 de noviembre de 2026. Ninguna de las dos les toca.","Entre el 31/12 a la noche y el 3/1 la zona está desbordada por el hatsumōde: Yasaka, Kiyomizu y Chion-in con colas largas y buses colapsados. Si van esos días, ir muy temprano o asumir la multitud como parte del plan.","No verifiqué precios de entrada de ningún templo ni los horarios especiales de Nochevieja de Kiyomizu y Chion-in (a qué hora abren esa noche): hay que confirmarlo antes de armar el día.","No verifiqué qué comercios de Ninenzaka/Sannenzaka abren del 29/12 al 3/1. Es zona turística y suele abrir, pero no lo confirmé en fuente."],"refs":["https://en.wikipedia.org/wiki/Higashiyama-ku,_Kyoto","https://www.kiyomizudera.or.jp/news/open-hour.php","https://www.kiyomizudera.or.jp/event/","https://www.yasaka-jinja.or.jp/event/","https://www.yasaka-jinja.or.jp/en/","https://www.chion-in.or.jp/","https://www.kodaiji.com/"]},{"id":"u_g_8870624639634301673","n":"Fushimi Inari-taisha","cat":"arq","hood":"Kioto","why":"Santuario principal de los ~30.000 santuarios Inari de Japón, fundado en 711, en Fushimi-ku (Kioto). Lo que se visita no es un edificio sino un sendero de unos 10.000 torii donados que trepa el monte Inari (233 m): hasta el cruce de Yotsutsuji, mitad de camino, son 30-45 minutos de subida (1 a 1,5 h ida y vuelta); la vuelta completa a la cumbre son 2-3 h. Abierto las 24 horas todos los días y sin entrada, lo que en diciembre importa mucho: es de los pocos lugares de Kioto que sigue disponible después de las 16:30, cuando los templos con horario ya cerraron y el sol está por ponerse (atardecer ~16:50 a fines de diciembre). La contra es la multitud: es el atractivo turístico mejor rankeado de Japón entre visitantes extranjeros (TripAdvisor, 1º de 2014 a 2019) y en enero es el santuario con más hatsumōde de todo Kansai, así que la franja del 1 al 3 de enero es prácticamente intransitable.","addr":"68 Fukakusa Yabunouchicho, Fushimi Ward, Kyoto, 612-0882, Japón","lat":34.9676945,"lng":135.7791876,"aprox":false,"gcid":"8870624639634301673","cost":0,"dur":2.5,"sub":"Santuario shintoísta · sendero de montaña","typ":"Santuario","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Fushimi Inari-taisha","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es un sitio alpino ni estacional: opera normal en diciembre y enero. El sendero es escalonado y de piedra; con lluvia o helada resbala, y arriba del senbon torii la iluminación es escasa, así que la subida a la cumbre conviene hacerla con luz de día (antes de las 15:30 para bajar sin linterna). · Año nuevo (29/12 al 3/1): Abierto y en pleno funcionamiento, pero es el escenario de hatsumōde más concurrido de Kansai y estaba 4º de Japón en cantidad de visitantes (dato 2010, Wikipedia JP). Ritos confirmados en el calendario oficial: 大祓式 el 31/12, 歳旦祭 el 1/1 a las 6:00 en el honden, 大山祭 el 5/1 (12:00 en el honden y 13:30 en el Goshintani), 御弓始神事 el 12/1 a las 14:00. NO verifiqué cortes de tránsito, control de acceso al sendero ni horario ampliado del 授与所 para el 1-3 de enero: el sitio oficial no publica aviso de año nuevo.","conf":"media","warn":["La zona asignada es CORRECTA: está en Fushimi-ku, prefectura de Kioto, dentro de la ciudad. A 5 minutos de tren desde la estación de Kioto (JR Nara Line hasta Inari, 150 yenes) o a 5 minutos a pie desde Fushimi-inari en la Keihan.","Del 1 al 3 de enero es de los puntos más congestionados de Japón. Si el itinerario pasa por Kioto en Shōgatsu, o se va de madrugada o se va otro día.","Multitud fuera de año nuevo también: el tramo del senbon torii es el más fotografiado de Kioto. La densidad cae fuerte pasado Yotsutsuji y en las primeras horas del día o después del atardecer.","Está abierto de noche, pero el sendero de montaña no está pensado para caminarlo a oscuras: pasado el tramo inicial la iluminación es escasa. De noche, limitarse a la zona baja.","No ir en auto: el sitio oficial pide expresamente usar transporte público porque los estacionamientos del entorno se saturan.","Kioto publica un mapa de congestión en vivo (ja.kyoto.travel/comfort/fushimi) con cámara cerca del santuario y predicción por franja horaria de 06:00 a 23:00. Sirve para elegir el momento el mismo día."],"refs":["https://inari.jp/en/","https://inari.jp/en/access/","https://inari.jp/en/faq/","https://inari.jp/about/faq/","https://inari.jp/rite/?month=1%E6%9C%88","https://www.japan-guide.com/e/e3915.html","https://ja.wikipedia.org/wiki/%E4%BC%8F%E8%A6%8B%E7%A8%B2%E8%8D%B7%E5%A4%A7%E7%A4%BE","https://ja.kyoto.travel/comfort/fushimi/"]},{"id":"u_g_5208850037818213808","n":"Arashiyama Nakaoshitacho","cat":"barrio","hood":"Kioto","why":"No es un lugar: es un chō administrativo de Nishikyō-ku (嵐山中尾下町), el polígono que Google devuelve para la manzana en ladera de la orilla sur del río Katsura, apenas cruzando el puente Togetsukyō. Lo único que hay adentro es la entrada del Monkey Park Iwatayama —la dirección oficial del parque es literalmente \"61 Arashiyama Nakaoshitachō\"— más el santuario Ichitani Munakata al pie del sendero; Hōrin-ji queda pegado pero ya es otro chō (Kokūzōyamachō). Como entrada de catálogo no aporta nada que no cubran «Arashiyama» y «Monkey Park Iwatayama» por separado: yo la bajaría o la fusionaría. Si alguien igual va, el dato de diciembre es que la subida son 20 minutos de cuesta y el parque cierra a las 16:00 en invierno (9:00-16:00 del 1/10 al 14/3), con el sol poniéndose 16:49-16:55 en Kioto a fin de diciembre: es cosa de la mañana o del mediodía, nunca de última hora.","addr":"Nishikyō-ku, Kioto, Prefectura de Kioto 616-0004, Japón","lat":35.0102696,"lng":135.6784141,"aprox":false,"gcid":"5208850037818213808","cost":0,"dur":0.5,"sub":"-","typ":"Barrio","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Es un nombre de barrio en Arashiyama, no un punto concreto; el pin podría apuntar a un local o alojamiento sin identificar","src":"lista","gname":"Arashiyama Nakaoshitacho","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es ruta de montaña ni teleférico: el chō es urbano y transitable todo el año. El Monkey Park que contiene opera en invierno con horario reducido: 9:00-16:00 del 1/10 al 14/3 (Wikipedia EN). japan-guide publica 9:00-16:30 con último ingreso 16:00, pero sin distinguir estación — es el horario de verano, así que para diciembre vale el cierre a las 16:00. japan-guide agrega que cierra los días de lluvia o nieve fuerte, cosa perfectamente posible en diciembre-enero. El sitio oficial no se puede abrir (SSL vencido), así que conviene reconfirmar en el lugar. · Año nuevo (29/12 al 3/1): Sin verificar. El sitio oficial del Monkey Park (monkeypark.jp) tiene el certificado SSL vencido y no se pudo abrir, así que no hay forma de confirmar si cierra en año nuevo. Como barrio en sí no cierra: se camina siempre. Ojo con el contexto: Arashiyama entero se llena en hatsumōde (Hōrin-ji está a la vuelta y Matsuo Taisha cerca), así que del 1 al 3 de enero esta orilla es un embudo de gente hacia el puente.","conf":"media","warn":["La zona está BIEN asignada: Nishikyō-ku es Kioto ciudad, prefectura de Kioto. No es un caso de rótulo equivocado — está a unos 30-40 min de la estación de Kioto (JR Sagano hasta Saga-Arashiyama, o Hankyū hasta Arashiyama).","Es un nombre de barrio, no un destino. Duplica a 'Arashiyama' y a 'Monkey Park Iwatayama'. Candidato a baja o a fusión.","Los 800 ¥ que aparecen son la entrada del Monkey Park (japan-guide), NO del barrio; caminar la zona es gratis. Ese costo va en la ficha del parque, no acá.","Sitio oficial del parque (monkeypark.jp) inaccesible: certificado SSL vencido en ambas variantes (con y sin www). Para diciembre el horario que vale es 9:00-16:00 (Wikipedia EN); el 9:00-16:30 de japan-guide es el de verano. La tarifa viene de fuente secundaria — reverificar antes de clavarla en el itinerario.","Luz: en Kioto a fin de diciembre el sol se pone entre las 16:49 y las 16:55. La subida al parque son ~20 min de cuesta desde la entrada, y el parque cierra a las 16:00. Si lo hacen, es antes de las 14:30."],"refs":["https://ja.wikipedia.org/wiki/%E5%B5%90%E5%B1%B1","https://ja.wikipedia.org/wiki/%E5%B5%90%E5%B1%B1%E3%83%A2%E3%83%B3%E3%82%AD%E3%83%BC%E3%83%91%E3%83%BC%E3%82%AF%E3%81%84%E3%82%8F%E3%81%9F%E3%82%84%E3%81%BE","https://en.wikipedia.org/wiki/Iwatayama_Monkey_Park","https://www.japan-guide.com/e/e3912.html","https://ja.wikipedia.org/wiki/%E6%AB%9F%E8%B0%B7%E5%AE%97%E5%83%8F%E7%A5%9E%E7%A4%BE","https://eco.mtk.nao.ac.jp/koyomi/dni/2025/s2712.html"]},{"id":"u_g_14492410891351376641","n":"Itsukushima","cat":"barrio","hood":"Miyajima","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Miyajima, Hatsukaichi, Prefectura de Hiroshima 739-0588, Japón","lat":34.2732114,"lng":132.3052488,"aprox":false,"gcid":"14492410891351376641","cost":0,"dur":0,"sub":"-","typ":"Isla","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Es la isla entera (Miyajima); si lo guardaron por el Monte Misen y la naturaleza iría a parque","src":"lista","gname":"Itsukushima","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Miyajima","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_3851185676178806160","n":"Santuario Itsukushima","cat":"arq","hood":"Miyajima","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1-1 Miyajimacho, Hatsukaichi, Hiroshima 739-0588, Japón","lat":34.2959896,"lng":132.3198285,"aprox":false,"gcid":"3851185676178806160","cost":0,"dur":0,"sub":"-","typ":"Santuario","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Santuario Itsukushima","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Miyajima","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17747995036593542687","n":"Parque de monos Jigokudani","cat":"parque","hood":"Nagano","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"6845 Hirao, Yamanouchi, Shimotakai District, Nagano 381-0401, Japón","lat":36.732685599999996,"lng":138.4621364,"aprox":false,"gcid":"17747995036593542687","cost":0,"dur":0,"sub":"-","typ":"Reserva natural","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Parque de monos Jigokudani","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nagano","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_8189163570396404367","n":"Shinjuku Golden-Gai","cat":"comida","hood":"Shinjuku","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒160-0021 Tokyo, Shinjuku City, Kabukicho, 1 Chome−1−6 あかるい花園 五番街","lat":35.6941118,"lng":139.70476109999998,"aprox":false,"gcid":"8189163570396404367","cost":0,"dur":0,"sub":"-","typ":"Callejón de bares","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Laberinto de bares diminutos: se clasifica por la bebida, pero también es una zona para caminar (barrio).","src":"lista","gname":"Shinjuku Golden-Gai","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_4568243479013817769","n":"Tateyama Kurobe Alpine Route - Transportation Division","cat":"transporte","hood":"Tateyama / Kurobe","why":"Está cerrada durante todo el viaje: la temporada 2026 va del 15 de abril al 30 de noviembre de 2026 y el corredor entero —cable car de Tateyama, bus de altura a Murodo, bus eléctrico del túnel de Tateyama, teleférico a Kurobedaira, cable car a la presa de Kurobe y bus del túnel Kanden hasta Ōgizawa— se clausura por nieve de diciembre a mediados de abril. No hay ningún tramo abierto en diciembre ni en enero, ni siquiera parcial: Murodo está a 2.450 m y queda inaccesible. La ficha además no es un lugar visitable sino la \"Transportation Division\", la oficina de la operadora (Tateyama Kurobe Kanko) en el pueblo de Tateyama. Si Toyama entra al viaje, tiene que entrar por otra cosa: esta ruta es de temporada abril-noviembre y el muro de nieve de Yuki-no-Otani se ve en primavera (en 2026 fue del 15/4 al 25/6), no en invierno.","addr":"Tateyama, Nakaniikawa District, Toyama 930-1414, Japón","lat":36.5828521,"lng":137.4457123,"aprox":false,"gcid":"4568243479013817769","cost":0,"dur":0,"sub":"Ruta alpina de montaña (cerrada en las fechas del viaje)","typ":"Ruta de transporte","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tateyama Kurobe Alpine Route - Transportation Division","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tateyama / Kurobe","rate":0,"tip":"","season":"No opera en diciembre ni enero. Cierre invernal total de todos los tramos; reapertura recién a mediados de abril. · Año nuevo (29/12 al 3/1): Cerrado. El cierre invernal cubre el 29/12–3/1 completo, igual que todo diciembre y enero.","conf":"alta","warn":["DESCARTAR: cerrado en las 25 fechas del viaje (14/12/2026 – 7/1/2027). La temporada 2026 termina el 30/11/2026.","No es un punto turístico: la entrada de Google es la oficina de la división de transporte de la operadora, no una atracción ni una estación con acceso.","Zona: la prefectura del rótulo está bien (Toyama, distrito de Nakaniikawa), pero no está en la ciudad de Toyama: la estación de Tateyama queda a ~65 minutos de tren desde Dentetsu Toyama (1.420 yenes por tramo). Es una excursión de día completo desde Toyama, no algo para encajar entre otras cosas.","Si en algún momento se piensa como reemplazo, el Kurobe Gorge Railway del mismo grupo también es de temporada y no opera en invierno, y arrastra tramos cortados por daños: verificarlo aparte y con fuente propia antes de meterlo al plan.","Tarifas leídas solo como referencia futura (~14.000 yenes la travesía completa Dentetsu-Toyama–Shinano-Ōmachi, sumando los tramos que lista japan-guide): no aplican a este viaje porque no se puede hacer."],"refs":["https://www.alpen-route.com/en/","https://www.alpen-route.com/_wp/information/135317","https://www.japan-guide.com/e/e7550.html","https://www.info-toyama.com/stories/alpen-route-lp"]},{"id":"u_g_5562991926242078184","n":"Ryokan Asakusa Shigetsu","cat":"alojamiento","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-31-11 Asakusa, Taito City, Tokyo 111-0032, Japón","lat":35.712425599999996,"lng":139.7959582,"aprox":false,"gcid":"5562991926242078184","cost":0,"dur":0,"sub":"-","typ":"Ryokan","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Ryokan Asakusa Shigetsu","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_7785923974874169613","n":"Sensō-ji","cat":"arq","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"2 Chome-3-1 Asakusa, Taito City, Tokyo 111-0032, Japón","lat":35.7147651,"lng":139.7966553,"aprox":false,"gcid":"7785923974874169613","cost":0,"dur":0,"sub":"-","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Sensō-ji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_5195627782660688349","n":"Torre de Tokio","cat":"mirador","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"4 Chome-2-8 Shibakoen, Minato City, Tokyo 105-0011, Japón","lat":3
