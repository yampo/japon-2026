          ${Object.keys(CAT).filter(c => SUBS[c] && SUBS[c].length).map(c =>
            `<optgroup label="${CAT[c].n} — por tipo">` + SUBS[c].map(s =>
              `<option value="s:${esc(s)}">${esc(s)}</option>`).join('') + `</optgroup>`).join('')}
        </select>
        <button class="tg" id="mfree">Solo gratis</button>
      </div>
      <div id="map"></div>
      <div class="flex" style="margin-top:11px" id="mleg"></div>
      <p class="xs muted" style="margin-top:11px">Las coordenadas de los pines son aproximadas (±50–100 m).
      Para navegar, usá el botón <b>“Abrir en Google Maps”</b> del popup: busca por nombre y dirección exactos.
      El mapa necesita conexión a internet.${TRIP.contactoMapa
        ? ` Dudas o errores del mapa: <a href="mailto:${esc(TRIP.contactoMapa)}">${esc(TRIP.contactoMapa)}</a>.`
        : ''}</p>`;
    el.dataset.built = '1';
    $('#mday').onchange = e => {
      const v = e.target.value;
      S.mapDay = v === 'todos' ? 'todos' : (v ? +v : null);
      SOLO_DIA = null; drawMap(); };
    $('#mcat').onchange = drawMap;
    $('#mleg').addEventListener('click', e => {
      const b = e.target.closest('[data-dia]'); if (!b) return;
      const n = +b.dataset.dia;
      SOLO_DIA = SOLO_DIA === n ? null : n;   /* tocar el mismo vuelve a los nueve */
      drawMap();
    });
    $('#mfree').onclick = e => { e.target.classList.toggle('on'); drawMap(); };
  }
  if (S.mapDay) $('#mday').value = S.mapDay;
  setTimeout(() => {
    if (typeof L === 'undefined'){ mapFallback(); return; }   // sin internet: Leaflet no cargó
    try {
      if (!MAP){
        MAP = L.map('map', {scrollWheelZoom:false}).setView(centroInicial(), TRIP.centro ? TRIP.centro[2] : 11);
        montarCapas();
      }
      MAP.invalidateSize(); drawMap();
    } catch(e){ console.warn(e); mapFallback(); }
  }, 60);
}
/* Sin conexión el mapa no puede dibujarse. En vez de romperse, listamos los lugares
   con su link a Google Maps, que es lo único que hace falta para navegar. */
function svgMap(items, conRuta){
  const pts = items.filter(x => x.p.lat && x.p.lng);
  if (pts.length < 2) return '';
  const la = pts.map(x => x.p.lat), lo = pts.map(x => x.p.lng);
  const la0 = (Math.min(...la) + Math.max(...la)) / 2;
  const k = Math.cos(la0 * Math.PI / 180);                 // 1° de longitud mide menos que uno de latitud
  const X = x => x.p.lng * k, Y = x => -x.p.lat;
  const xs = pts.map(X), ys = pts.map(Y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = 1000, pad = 46;
  const span = Math.max(x1 - x0, y1 - y0, 1e-4);           // cuadrado: no deforma distancias
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  x0 = cx - span / 2; y0 = cy - span / 2;
  const sc = (W - pad * 2) / span;
  const px = x => pad + (X(x) - x0) * sc, py = x => pad + (Y(x) - y0) * sc;
  // escala: cuánto mide en pantalla 1 km real
  const kmPx = sc * (1 / 111.32) * 1;                      // 1 km en grados de latitud → px
  const kmRot = Math.max(1, Math.round(span * 111.32 / 4)); // barra de referencia redondeada
  const ruta = conRuta && pts.length > 1
    ? `<polyline points="${pts.map(x => px(x).toFixed(1) + ',' + py(x).toFixed(1)).join(' ')}"
        fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"
        stroke-dasharray="7 5" opacity=".55"/>` : '';
  const marcas = pts.map((x, i) => {
    const c = CAT[x.p.cat].c, X0 = px(x).toFixed(1), Y0 = py(x).toFixed(1);
    return `<g><title>${esc((x.t ? x.t + ' · ' : '') + x.p.n + ' — ' + x.p.hood)}</title>
      <circle cx="${X0}" cy="${Y0}" r="${conRuta ? 13 : 6.5}" fill="${c}" fill-opacity="${conRuta ? 1 : .8}"
        stroke="#fff" stroke-width="${conRuta ? 2.5 : 1.5}"/>
      ${conRuta ? `<text x="${X0}" y="${Y0}" text-anchor="middle" dominant-baseline="central"
        font-size="12" font-weight="700" fill="#fff">${i + 1}</text>` : ''}</g>`;
  }).join('');
  const etiquetas = conRuta ? pts.map((x, i) => {
    const X0 = +px(x), Y0 = +py(x);
    return `<text x="${(X0 + 17).toFixed(1)}" y="${(Y0 + 4).toFixed(1)}" font-size="12.5"
      fill="var(--ink)" style="paint-order:stroke;stroke:var(--card);stroke-width:3.5px">${esc(x.p.n.slice(0, 30))}</text>`;
  }).join('') : '';
  return `<div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px">
    <svg viewBox="0 0 ${W} ${W}" width="100%" style="display:block;max-height:74vh" role="img"
      aria-label="Esquema de posiciones relativas de los lugares">
      <defs><pattern id="gr" width="50" height="50" patternUnits="userSpaceOnUse">
        <path d="M50 0H0V50" fill="none" stroke="var(--line)" stroke-width="1" opacity=".55"/></pattern></defs>
      <rect width="${W}" height="${W}" fill="url(#gr)"/>
      ${ruta}${marcas}${etiquetas}
      <g transform="translate(${pad},${W - 22})">
        <line x1="0" y1="0" x2="${(kmPx * kmRot).toFixed(1)}" y2="0" stroke="var(--ink)" stroke-width="2"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="var(--ink)" stroke-width="2"/>
        <line x1="${(kmPx * kmRot).toFixed(1)}" y1="-5" x2="${(kmPx * kmRot).toFixed(1)}" y2="5" stroke="var(--ink)" stroke-width="2"/>
        <text x="${(kmPx * kmRot / 2).toFixed(1)}" y="-9" text-anchor="middle" font-size="13" fill="var(--ink)">${kmRot} km</text>
      </g>
      <text x="${W - pad}" y="${pad - 16}" text-anchor="end" font-size="13" fill="var(--mut)">↑ norte</text>
    </svg></div>`;
}
function mapFallback(){
  const dsel = $('#mday')?.value, csel = $('#mcat')?.value;
  let items;
  const matchSel = p => !csel || (csel.startsWith('c:') ? p.cat === csel.slice(2) : p.typ === csel.slice(2));
  if (dsel){ const d = S.itin.find(x => x.n === +dsel);
    items = d.blocks.filter(b => b.pid && PBY[b.pid]).map(b => ({p:PBY[b.pid], t:b.t})); }
  else items = PLACES.filter(matchSel).map(p => ({p, t:''}));
  $('#map').outerHTML = `<div id="map" style="height:auto;padding:0;background:transparent">
    ${svgMap(items, !!dsel)}
    <div class="banner warn" style="margin:12px 0">Este es un <b>esquema de posiciones reales</b>
      (norte arriba, con escala), no un mapa de calles: acá el mapa callejero no puede cargarse.
      ${dsel ? 'Los números siguen el orden del día.' : 'Elegí un día arriba para ver el recorrido numerado.'}
      Para navegar, cada lugar tiene su <b>link a Google Maps</b>.</div>
    ${items.map(({p,t}) => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div class="b">${t ? t + ' · ' : ''}${esc(p.n)}</div>
      <div class="xs muted">${esc(p.typ)} · ${esc(p.hood)} · ${money(p.cost)} · ${TPT.icono} ${esc(p.sub)}</div>
      <a class="chip b" style="margin-top:5px" href="${gmaps(p)}" target="_blank" rel="noopener">↗ Google Maps</a>
    </div>`).join('')}</div>`;
  const s = $('#mday'); if (s) s.onchange = e => { S.mapDay = e.target.value ? +e.target.value : null; mapFallback(); };
  const c = $('#mcat'); if (c) c.onchange = mapFallback;
}
function drawMap(){
  if (!MAP || typeof L === 'undefined') return;
  if (LAYER) MAP.removeLayer(LAYER);
  LAYER = L.layerGroup().addTo(MAP);
  const dsel = $('#mday')?.value, csel = $('#mcat')?.value, fsel = $('#mfree')?.classList.contains('on');
  // csel viene como "c:<categoría>" o "s:<tipo>"
  const matchSel = p => !csel || (csel.startsWith('c:') ? p.cat === csel.slice(2) : p.typ === csel.slice(2));
  let items = [];
  /* ── Vista de conjunto: los 9 recorridos a la vez ───────────────────────── */
  if (dsel === 'todos'){
    /* La leyenda pasa a ser de DÍAS y es el control de aislamiento: tocar uno
       lo deja solo. Es la salida real cuando dos colores se parecen — y con
       nueve series siempre hay dos que se parecen. */
    const leg = $('#mleg');
    if (leg) leg.innerHTML = `<span class="xs muted" style="width:100%;margin-bottom:2px">
        El número de cada punto es el <b>orden de la parada dentro de su día</b>; el color dice qué día es.
        Tocá un día para verlo solo${SOLO_DIA ? ' · <b>tocá de nuevo para volver a los nueve</b>' : ''}.
        ${TRIP.zonasFuera.length ? 'No se dibuja lo que queda fuera de la ciudad (' + esc(TRIP.zonasFuera.join(', ')) + '), que deformaba el mapa.' : ''}</span>` +
      S.itin.map((d, i) => { const c = DIA_COLOR[i % DIA_COLOR.length];
        const on = !SOLO_DIA || SOLO_DIA === d.n;
        return `<button class="chip mdchip" data-dia="${d.n}" style="background:${c}${on?'22':'0d'};
          color:${on?c:'var(--mut)'};border:1.5px solid ${SOLO_DIA===d.n?c:'transparent'}">
          <b style="display:inline-block;width:15px;height:15px;border-radius:50%;background:${on?c:'var(--line)'};
          color:#fff;font-size:9.5px;line-height:15px;text-align:center;margin-right:4px">${d.n}</b>${d.dow.slice(0,3)} ${d.date.slice(8)}/${d.date.slice(5,7)}</button>`;
      }).join('');
    const pts = [];
    S.itin.forEach((d, di) => {
      if (SOLO_DIA && d.n !== SOLO_DIA) return;
      const col = DIA_COLOR[di % DIA_COLOR.length];
      const ruta = [], vistos = {}; let orden = 0;
      d.blocks.forEach(b => {
        const p = b.pid ? PBY[b.pid] : null;
        if (!p || !p.lat || vistos[p.id]) return;
        /* Fuera de la ciudad no entra: en NYC el hotel de Branchburg estaba a
           60 km y deformaba el encuadre — Manhattan quedaba apretado en una
           esquina y el recorrido, ilegible. Cada viaje declara sus zonasFuera. */
        if (TRIP.zonasFuera.includes(p.boro)) return;
        vistos[p.id] = 1; orden++;
        ruta.push([p.lat, p.lng]); pts.push([p.lat, p.lng]);
        /* El número es el ORDEN DE LA PARADA dentro del día, para poder seguir la
           secuencia; el color dice de qué día es. Ojo con el costo: con los nueve
           días juntos la identidad del día queda SOLO en el color, que con nueve
           series no alcanza — por eso el popup nombra el día y la leyenda aísla. */
        L.marker([p.lat, p.lng], {icon: L.divIcon({className:'',
            html:`<div class="mdia" style="background:${col}">${orden}</div>`,
            iconSize:[22,22], iconAnchor:[11,11]})})
          .addTo(LAYER)
          .bindPopup(`<h4>${esc(b.t)} · ${esc(p.n)}</h4>
            <div style="color:${col};font-weight:700;font-size:12px;margin-bottom:5px">
              Parada ${orden} del día ${d.n} · ${esc(d.dow)} ${d.date.slice(8)}/${d.date.slice(5,7)}</div>
            <div style="color:#66707d;font-size:12px">${esc(p.typ)} · ${esc(p.hood)}</div>`);
      });
      if (ruta.length > 1)
        L.polyline(ruta, {color: col, weight: SOLO_DIA ? 4 : 2.5,
                          opacity: SOLO_DIA ? .95 : .6}).addTo(LAYER);
    });
    if (pts.length) MAP.fitBounds(pts, {padding:[36,36], maxZoom: SOLO_DIA ? 14 : 12});
    return;
  }
  if (dsel){
    const d = S.itin.find(x => x.n === +dsel);
    d.blocks.forEach(b => { if (b.pid && PBY[b.pid]) items.push({p:PBY[b.pid], num:items.length+1, t:b.t}); });
    /* Los de paso van SIN número y no entran en la línea del recorrido: son
       referencia, no paradas. Se marcan con `paso` para pintarlos distinto. */
    dePasoPlano(d).forEach(({p, desvio}) => items.push({p, num:null, paso:desvio}));
  } else {
    items = PLACES.filter(p => matchSel(p) && (!fsel || p.cost === 0 || p.free)).map(p => ({p, num:null}));
  }
  const leg = $('#mleg');
  if (leg) leg.innerHTML = Object.entries(CAT).map(([k,v]) =>
    `<span class="chip" style="background:${v.c}1a;color:${v.c}">● ${v.n}</span>`).join('');
  const pts = [], ruta = [];
  items.forEach(({p,num,t,paso}) => {
    if (!p.lat) return;
    pts.push([p.lat, p.lng]);
    if (num) ruta.push([p.lat, p.lng]);      /* la línea une las paradas, no las referencias */
    const c = cat(p).c;
    const icon = num
      ? L.divIcon({className:'', html:`<div class="mnum" style="background:${c};width:27px;height:27px">${num}</div>`,
                   iconSize:[27,27], iconAnchor:[13,13]})
      : paso != null
      ? L.divIcon({className:'', html:`<div class="mk mkpaso" style="border-color:${c}"></div>`,
                   iconSize:[15,15], iconAnchor:[8,8]})
      : L.divIcon({className:'', html:`<div class="mk" style="background:${c};width:13px;height:13px"></div>`,
                   iconSize:[13,13], iconAnchor:[7,7]});
    L.marker([p.lat,p.lng], {icon}).addTo(LAYER).bindPopup(
      `<h4>${t ? t + ' · ' : ''}${esc(p.n)}</h4>
       ${paso != null ? `<div style="font-size:11.5px;color:#8a7f6d;margin-bottom:6px">
         De paso · no está en el itinerario · desvío +${paso < 950 ? Math.round(paso/10)*10 + ' m' : (paso/1000).toFixed(1) + ' km'}</div>` : ''}
       <div style="color:#66707d;font-size:12px;margin-bottom:6px"><b style="color:${cat(p).c}">${esc(p.typ)}</b> · ${esc(p.hood)} · ${money(p.cost)}</div>
       <div style="margin-bottom:8px">${why(p,190)}</div>
       <div style="font-size:11.5px;color:#66707d;margin-bottom:8px">${TPT.icono} ${esc(p.sub)}</div>
       <a href="${gmaps(p)}" target="_blank" rel="noopener"
          style="display:inline-block;background:#14293d;color:#fff;padding:7px 11px;border-radius:9px;
          text-decoration:none;font-weight:650;font-size:12px">Abrir en Google Maps ↗</a>`);
  });
  if (dsel && ruta.length > 1)
    L.polyline(ruta, {color:'#14293d', weight:2.5, opacity:.45, dashArray:'6,7'}).addTo(LAYER);
  if (pts.length) MAP.fitBounds(pts, {padding:[36,36], maxZoom: dsel ? 14 : 12});
}

/* ═══════════ BLOQUES GENÉRICOS ══════════════════════════════════════════════
   Las pestañas Costos y Transporte se dibujan con estos bloques, que el viaje
   declara en extras.py. Antes había una función de render por cada cosa —una
   para el aeropuerto de Newark, otra para el tren de New Jersey— y eso ataba la
   app a ese viaje: para el siguiente había que reescribir la vista entera.
   Los tipos están documentados en engine/lib/bloques.py. */

/* Convención de las tablas: ✅ en la primera celda resalta la fila, ❌ o 🚫 la
   atenúa. Sirve para que la recomendación se lea de un vistazo sin repetirla. */
const filaClase = f => /✅/.test(String(f[0])) ? 'hl' : (/❌|🚫/.test(String(f[0])) ? 'bad' : '');

function rBloque(b){
  switch (b.tipo){
    case 'banner':
      return `<div class="banner ${b.estilo}">${b.titulo ? `<b>${esc(b.titulo)}</b> ` : ''}${esc(b.texto)}</div>`;

    case 'tabla': {
      const num = new Set(b.num || []);
      return `<div class="tw"><table>
        <thead><tr>${b.cols.map((c,i) => `<th${num.has(i)?' style="text-align:right"':''}>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${b.filas.map(f => `<tr class="${filaClase(f)}">${f.map((c,i) =>
          `<td class="${i===0?'b':(num.has(i)?'n':'sm')}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>${b.nota ? `<div class="hint" style="text-align:left">${esc(b.nota)}</div>` : ''}`;
    }

    case 'kv':
      return `<div class="card pad"><dl class="kv">${b.filas.map(([k,v]) =>
        `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;

    case 'fichas':
      return b.fichas.map(f => `<div class="card pad" style="margin-bottom:9px">
        <div class="b" style="font-size:14.5px;margin-bottom:6px">${esc(f.titulo)}</div>
        ${(f.campos||[]).map(([k,v]) => `<div class="sm" style="margin-bottom:5px">
          <span class="muted">${esc(k)}:</span> ${esc(v)}</div>`).join('')}
        ${f.veredicto ? `<div class="banner ${f.estilo} sm" style="margin:0">${esc(f.veredicto)}</div>` : ''}
      </div>`).join('');

    case 'detalle':
      return `<details><summary>${esc(b.titulo)}</summary><div class="dbody">
        ${b.filas.map(([k,v],i) => `<p class="sm"${i===b.filas.length-1?' style="margin-bottom:0"':''}>
          <b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div></details>`;

    case 'lista':
      return b.items.map((x,i) => `<div class="card pad sm" style="margin-bottom:8px">${
        b.numerada ? `<b style="color:var(--accent)">${i+1}.</b> ` : '▸ '}${esc(x)}</div>`).join('');

    case 'texto':
      return `<p class="sm">${esc(b.texto)}</p>`;

    default:
      return '';
  }
}

const rSeccion = s => `<div class="sect">${esc(s.titulo)}</div>` + s.bloques.map(rBloque).join('');

/* ═══════════ VISTA: COSTOS ═══════════ */
function rCosts(){
  /* La primera fila NO es un dato fijo: se recalcula con lo que esté marcado
     como "sí" en Lugares, así mover un 1 a un 2 se ve en el total al instante.
     Comida y Música quedan fuera porque tienen sus propias filas en extras.py:
     sumar el cover del Vanguard dos veces era el error de la primera versión. */
  const acum = {}; VIDS.forEach(v => acum[v] = 0);
  PLACES.forEach(p => { if (p.cat === 'comida' || p.cat === 'musica') return;
    const i = interest(p.id);
    VIDS.forEach(v => { if (i[v] === 2) acum[v] += (+p.cost || 0); }); });
  /* Cada fila es [concepto, {id: monto}, base]. Un viajero que no figura en una
     fila vale 0 acá, pero el build de extras.py CORTA si falta: un cero implícito
     falsea el total del viaje sin un solo mensaje. */
  const mto = (m, v) => Number.isFinite(+(m || {})[v]) ? +m[v] : 0;
  const rows = [{c:'Entradas de atracciones marcadas “sí”', m:acum,
    base:'Suma de los lugares con interés 2, excluyendo Comida y Música (que van en sus propias filas).'},
    ...(EX.costos.fijos || [])];
  const tot = {}; VIDS.forEach(v => tot[v] = rows.reduce((a,r) => a + mto(r.m, v), 0));
  const granTotal = VIDS.reduce((a,v) => a + tot[v], 0);
  const P = EX.pases;

  $('#v-costs').innerHTML =
    (P ? `<div class="banner ok"><b>Veredicto sobre los pases:</b> ${esc(P.veredicto)}</div>` : '') + `
    <div class="sect">Estimación de costos</div>
    <div class="tw"><table>
      <thead><tr><th>Concepto</th>${VS.map(v => `<th style="text-align:right">${esc(v.corto)}</th>`).join('')}
        ${NV > 1 ? '<th style="text-align:right">Total</th>' : ''}<th>Base del cálculo</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="b">${esc(r.c)}</td>
        ${VIDS.map(v => `<td class="n">${money0(mto(r.m, v))}</td>`).join('')}
        ${NV > 1 ? `<td class="n">${money0(VIDS.reduce((a,v) => a + mto(r.m, v), 0))}</td>` : ''}
        <td class="sm muted">${esc(r.base)}</td></tr>`).join('')}
      <tr class="hl"><td class="b">TOTAL (sin alojamiento ni vuelos)</td>
        ${VIDS.map(v => `<td class="n b">${money0(tot[v])}</td>`).join('')}
        ${NV > 1 ? `<td class="n b">${money0(granTotal)}</td>` : ''}
        <td class="sm muted">${esc(EX.costos.nota || 'Cambiá los 0/1/2 en la pestaña Lugares y esto se recalcula solo.')}</td></tr>
      </tbody></table></div>`
    + (P ? (P.secciones || []).map(rSeccion).join('') : '')
    + (EX.decisiones.length ? `<div class="sect">Decisiones abiertas</div>` +
        EX.decisiones.map(d => `<details><summary>${esc(d.t)}</summary><div class="dbody">
          <p class="sm">${esc(d.d)}</p>
          <p class="sm"><b>Los números:</b> ${esc(d.num)}</p>
          <p class="sm" style="margin-bottom:0"><b>Recomendación:</b> ${esc(d.req)}</p></div></details>`).join('')
      : '');
}

/* ═══════════ VISTA: TRANSPORTE ═══════════ */
function rTrans(){
  const T = EX.transporte || [];
  $('#v-trans').innerHTML = T.length ? T.map(rSeccion).join('')
    : `<div class="banner info">Todavía no hay nada cargado en Transporte para este viaje.</div>`;
}

/* ═══════════ VISTA: RESERVAS ═══════════ */
function rRes(){
  /* Las que ya estan compradas (x.hecho, viene del catalogo) bajan al final y cuentan como hechas
     para todos, no solo para el navegador donde se tildo. */
  const R = [...EX.reservas].sort((a,b) => (a.hecho?1:0) - (b.hecho?1:0) || b.urg - a.urg);
  const listo = (x,i) => !!(x.hecho || S.res[i]);
  const dn = R.filter((x,i) => listo(x,i)).length;

/* ¿El servidor tiene una versión más nueva que la que este navegador cargó?
   Solo funciona servido por http(s); con archivo local devuelve null. */
async function hayVersionNueva(){
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'reload'});
    if (!r.ok) return null;
    const t = await r.text();
    const m = t.match(/"verId":"([a-f0-9]{6})"/);
    return m ? m[1] !== VERID : null;
  } catch(e){ return null; }
}
/* Al abrir, avisa una sola vez si quedó una versión vieja cacheada. */
async function avisarSiHayVersionNueva(){
  if (location.protocol === 'file:') return;
  if (await hayVersionNueva() === true)
    toast('Hay una versión más nueva del plan. Recargá la página para verla.');
}
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 4200);
}
const HOSTED = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const puedeBajar = () => !HOSTED || !!DLNS;
let DLNS;   // namespace de descargas del visor (solo existe en el sitio publicado)
(async () => { try { DLNS = window.claude && await window.claude.use('downloads'); } catch(e){} })();
async function dl(name, text, type){
  if (DLNS){                                   // sitio publicado: lo guarda el visor, con confirmación
    try { await DLNS.save({ filename: name, data: new TextEncoder().encode(text) }); return true; }
    catch(e){
      if (e && e.code === 'declined') return false;
      toast('No se pudo descargar' + (e && e.code ? ' (' + e.code + ')' : '') + '. Copiá el plan a mano o abrí el archivo en la compu.');
      return false;
    }
  }
  const b = new Blob([text], {type}); const u = URL.createObjectURL(b);   // archivo local
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
  return true;
}

    <div class="flex" style="margin-top:11px;justify-content:flex-end">
      ${acciones.map((a, i) => `<button class="btn" data-a="${i}">${esc(a.t)}</button>`).join('')}
      <button class="btn" data-a="x">Cerrar</button></div></div>`;
  document.body.appendChild(w);
  w.querySelector('.psBack').onclick = () => w.remove();
  w.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'x') { w.remove(); return; }
    acciones[+b.dataset.a].f(document.getElementById('planTxt').value); };
  if (alPegar) setTimeout(() => document.getElementById('planTxt').focus(), 50);
}
function doCsv(){
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g,'""') + '"';
  const head = ['Lugar','Categoria','Tipo','Barrio','Zona',...VS.map(v => v.corto),'Costo','Horas','Turistico',
                'Cierra','Gratis/PWYW','Reserva',TPT.nombre,'PorQue','Direccion'];
  const rows = PLACES.map(p => { const i = interest(p.id);
    return [p.n, cat(p).n, p.typ, p.hood, p.boro, ...VIDS.map(v => i[v]), p.cost, p.dur,
            p.main?'SI':'no', p.closed, p.free, p.book, p.sub, p.why, p.addr].map(q).join(','); });
  const csv = head.map(q).join(',') + '\n' + rows.join('\n');
  closeSheet();
  if (puedeBajar()){ dl(TRIP.slug + '-lugares.csv', '\ufeff' + csv, 'text/csv;charset=utf-8'); return; }
  planSheet('Lugares en CSV',
    'Copiá este texto y pegalo en una hoja de cálculo: Excel y Google Sheets separan las columnas solos.',
    csv, [{t:'Copiar', f: async () => {
      try { await navigator.clipboard.writeText(csv); toast('CSV copiado'); }
      catch(e){ const a = document.getElementById('planTxt'); a.select(); document.execCommand('copy'); toast('CSV copiado'); } }}]);
}

$('#bAhora').onclick = irAhora;

/* ── Cambiar de día deslizando ────────────────────────────────────────────────
   Cambiar de día es lo que más se hace, y la tira de días está arriba de todo:
   con una mano y el celular grande, no se llega. El gesto tiene que ser claramente
   horizontal (más del doble que el vertical) para no comerse el scroll, y no cuenta
   si arrancó adentro de algo que ya scrollea solo. */
(function(){
  let x0 = null, y0 = null, ok = false;
  const v = $('#v-itin');
  v.addEventListener('touchstart', e => {
    if (e.touches.length !== 1){ ok = false; return; }
    const t = e.target;
    ok = !t.closest('.days, .tw, .tools, input, textarea, select, .leaflet-container, .bmeta, .aca, .paso, .hood');
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  v.addEventListener('touchend', e => {
    if (!ok || x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 2.2) return;
    const i = S.itin.findIndex(z => z.n === S.day);
    const j = dx < 0 ? i + 1 : i - 1;
    if (j < 0 || j >= S.itin.length){ toast(dx < 0 ? 'Es el último día.' : 'Es el primer día.'); return; }
    S.day = S.itin[j].n; save(); rItin(); window.scrollTo({top:0});
  }, {passive:true});
})();

/* ── El reloj corre ──────────────────────────────────────────────────────────
   Cada 30 s se repinta SOLO la tarjeta "Ahora". El día entero se re-renderiza
   nada más cuando cambia el bloque actual, y nunca mientras alguien escribe. */
let ULT_I = null;
setInterval(() => {
  const t = hoyStr(), cambioDia = t !== TODAY;
  TODAY = t;
  if (S.tab !== 'itin') return;
  pintarAhora();
  const d = S.itin.find(x => x.n === S.day);
  const i = idxAhora(d);
  const escribiendo = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
  if ((i !== ULT_I || cambioDia) && !escribiendo){ ULT_I = i; rItin(); }
  else ULT_I = i;
}, 30000);

/* ═══════════ ARRANQUE ═══════════ */
(function(){
  $('#hbrand').textContent = TRIP.titulo;
  const t = S.itin.find(d => d.date === TODAY);
  if (t) { S.day = t.n; $('#hsub').textContent = 'hoy · día ' + t.n + ' · ' + t.dow.toLowerCase() + ' ' + (+t.date.slice(8)) + '/' + t.date.slice(5,7); }
  else   { $('#hsub').textContent = TRIP.subtitulo; }
  ULT_I = idxAhora(S.itin.find(x => x.n === S.day));
  go(S.tab || 'itin'); setStat();
  $('#hsub').title = 'Versión del plan: ' + VER + ' · ' + VERID;
  setTimeout(avisarSiHayVersionNueva, 2500);   // aviso si el navegador cargó una versión cacheada
})();
