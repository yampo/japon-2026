.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}

	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

}

	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}

	visibility: hidden;
	}

	visibility: inherit;
	}

.leaflet-control {

	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}

	float: left;
	clear: both;
	}

	margin-top: 10px;

	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}

.leaflet-interactive {
	cursor: pointer;
	}

	}

.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {

	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;

.leaflet-touch .leaflet-bar a:first-child {

	border-bottom-right-radius: 2px;

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}

/* ── modal ── */
.ov{position:fixed;inset:0;background:rgba(16,26,36,.55);z-index:1200;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:620px;
  max-height:86vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px;max-height:82vh}}
.grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.opt{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:7px;font-size:14px;background:#fff}
.opt:hover{background:#f7f5f1}
.opt b{display:block;font-size:12px;color:var(--mut);font-weight:650;margin-top:2px}

/* ── bottom bar ── */
.bar{position:fixed;bottom:0;left:0;width:100vw;max-width:100vw;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:950;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.barin{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;min-width:0}
.barin>.stat{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin>.spacer{flex:0 1 auto}
.barin .btn{flex:0 0 auto}
@media(max-width:420px){.barin{gap:6px}.barin .btn{padding:9px 11px;font-size:12.5px}}
.btn{padding:9px 14px;border-radius:11px;font-size:13px;font-weight:650;
  background:var(--navy);color:#fff}
.btn.ghost{background:#eee9e1;color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12px}
.stat{font-size:11.5px;color:var(--mut);line-height:1.35}

/* La estacionalidad de un lugar: cuándo NO opera. Es un bloque y no un chip
   porque el texto tiene varias líneas —«cierra por nieve de fin de noviembre a
   mediados de abril», con el porqué— y el border-radius de píldora del chip
   sobre seis renglones dibuja un óvalo. Se vio en pantalla, no se dedujo. */
.temporada{margin:10px 0 0;padding:8px 11px;border-radius:9px;
           background:#fdf0e3;border:1px solid #f0c9a0;color:#8a4b12;
           font-size:12.5px;font-weight:600;line-height:1.45}
/* Los avisos operativos de un lugar: la zona está mal, hay dos sucursales y
   esta no es la buena, el lugar cerró. No son decoración — son lo que evita
   cruzar una ciudad al pedo — así que van arriba, antes de los datos. */
.avisos{margin:10px 0 0;padding:9px 12px 9px 26px;border-radius:9px;
        background:#fff6e8;border:1px solid #f0d6a8;font-size:13px;line-height:1.5}
.avisos li{margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{font-weight:700;color:var(--navy);white-space:nowrap}
.kv dd{margin:0}
details{border:1px solid var(--line);border-radius:12px;background:var(--card);
  margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
summary{padding:13px 15px;font-weight:680;font-size:14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--accent);font-weight:800}
details[open] summary::before{content:"▾ "}
details .dbody{padding:0 15px 15px}

/* ══════════════════════════════════════════════════════════════════════════
   V2 · rediseño para el uso real: parado en la calle, una mano, 10 segundos.
   Todo lo de abajo pisa a lo de arriba a propósito (misma especificidad,
   más tarde en el archivo), así el CSS original queda como referencia.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── cromo superior: header + pestañas en UN solo sticky ──────────────────
   Antes los dos eran sticky top:0 y el header tapaba las pestañas al
   scrollear: cambiar de pestaña obligaba a volver arriba de todo. */
.topbar{position:sticky;top:0;z-index:900;box-shadow:0 2px 16px rgba(20,41,61,.16)}
header{position:static;z-index:auto;box-shadow:none;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.brand{font-size:15.5px;font-weight:750;display:flex;align-items:baseline;gap:8px;
  min-width:0;overflow:hidden}
.brand small{display:inline;font-size:11.5px;font-weight:500;opacity:.75;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.iconbtn{width:33px;height:33px;font-size:14px;border-radius:9px}
nav.tabs{position:static;z-index:auto;border-bottom:1px solid var(--line)}
.tab{padding:11px 12px 9px;font-size:13px}

main{padding-top:12px}

/* ── tira de días: más baja, y hoy se ve ─────────────────────────────────── */
.days{gap:6px;padding-bottom:11px}
.dbtn{min-width:0;padding:7px 11px;border-radius:11px}
.dbtn .dd{font-size:14px;font-weight:750;margin:0;letter-spacing:-.01em}
.dbtn .dw{font-size:10.5px;font-weight:600;color:var(--mut);margin-top:1px}
.dbtn.on .dw{color:rgba(255,255,255,.8)}
.dbtn.today{outline:2px solid var(--gold);outline-offset:1px}
.dbtn .hoylb{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;
  color:var(--gold);text-transform:uppercase}

/* ── AHORA: la respuesta a "¿qué toca?" ──────────────────────────────────── */
.ahora{margin:0 0 13px;border-radius:15px;overflow:hidden;background:var(--navy);
  color:#fff;box-shadow:0 4px 20px rgba(20,41,61,.22)}
.ahlb{display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:rgba(255,255,255,.09);font-size:10.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.ahlb .sp{flex:1}
.ahhoy{font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:none;
  background:rgba(255,255,255,.16);color:#fff;padding:4px 10px;border-radius:8px}
.ahmain{padding:12px 14px 12px}
.aht{font-size:12px;font-weight:750;color:#7fd4ae;letter-spacing:.03em}
.ahn{font-size:19px;font-weight:700;line-height:1.24;margin:3px 0 5px;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ahd{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.74)}
.ahnext{padding:10px 14px;border-top:1px solid rgba(255,255,255,.14);
  font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.78)}
.ahnext b{color:#fff}
.ahacts{display:flex;gap:7px;padding:11px 14px calc(13px);flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.14)}
.ahbtn{background:var(--accent);color:#fff;padding:10px 15px;border-radius:11px;
  font-size:13.5px;font-weight:750;text-decoration:none;display:inline-block;
  flex:0 1 auto;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center}
.ahbtn.g2{background:rgba(255,255,255,.15);color:#fff}
.ahora.pre{background:#1d3a52}
.ahora.fin{background:#3a3630}

/* ── cabecera del día: el título manda, el porqué se despliega ───────────── */
.dhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:13px 14px;margin-bottom:12px}
.dhead h2{font-size:18px;font-weight:700;line-height:1.25;margin-bottom:7px}
.dhead .dchips{display:flex;gap:6px;flex-wrap:wrap}
/* El «base:» del día 5 es una frase entera ("JGStay SoHo → New Jersey (la ÚNICA
   noche…"): con `white-space:nowrap` el chip medía 359 px dentro de 317 y el texto
   quedaba cortado — invisible, porque `overflow-x:clip` lo tapa sin avisar. Envuelve. */
.dhead .dchips .chip{white-space:normal;text-align:left;line-height:1.4;max-width:100%}
.dporque{margin-top:10px;border:0;box-shadow:none;background:none;border-radius:0}
.dporque summary{padding:0;font-size:12px;font-weight:700;color:var(--accent)}
.dporque .dbody{padding:9px 0 0}
.dporque p{margin:0 0 8px;font-size:13px;line-height:1.55;color:var(--mut)}
.dporque p:last-child{margin-bottom:0}

/* ── el bloque de itinerario ─────────────────────────────────────────────
   `.itb` es la clase nueva: `.blk` a secas la sigue usando Reservas y no se
   toca. Plegado por defecto — el texto completo está a un toque, no borrado. */
.blk.itb{display:flex;gap:9px;padding:10px 12px;align-items:flex-start;
  border-bottom:1px solid var(--line)}
.itb .tmw{flex:0 0 46px;padding-top:1px}
.itb .tm{font-size:13.5px;font-weight:800;color:var(--navy);letter-spacing:-.02em;
  padding:0;background:none;border:0;width:100%;text-align:left}
.itb input.tm{border:1px solid var(--line);border-radius:7px;padding:3px 4px;
  background:#fff;font-weight:700;font-size:13px}
.itb.on .tmw{flex:0 0 56px}
.itb .tmend{font-size:10px;color:var(--mut);margin-top:1px}
.itb .btog{cursor:pointer;-webkit-tap-highlight-color:rgba(193,68,14,.07)}
.bhead{display:flex;gap:7px;align-items:flex-start}
.cdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;
  box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.bttl{font-size:14.5px;font-weight:650;line-height:1.34;letter-spacing:-.008em;
  color:var(--ink);flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.itb.hi .bttl,.itb.star .bttl{font-size:15.5px;font-weight:700}
.bsub{font-size:12.5px;line-height:1.45;color:var(--mut);margin:2px 0 0 15px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.bfacts{font-size:11px;color:#78818f;margin:3px 0 0 15px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bfacts .mas{color:#a8a49d;font-weight:800}
.stx{color:var(--gold)}
.bfacts .ojo{color:#8a5a08;font-weight:750}
.bfacts .cerr{color:var(--red);font-weight:750}
/* logística: es pegamento entre paradas, no plan. Una línea y gris. */
.itb.logi{padding:7px 12px;background:#fbfaf7}
.itb.logi .bttl{font-size:12.5px;font-weight:500;color:#67707c;-webkit-line-clamp:2}
.itb.logi .tm{font-size:12px;font-weight:700;color:#7c8593}
.itb.done .bttl{text-decoration:line-through}
.itb.on{background:#fffcf5}
.itb.on .bttl{-webkit-line-clamp:unset;display:block}
/* estado respecto del reloj (solo cuando el día que mirás es hoy) */
.itb.past{opacity:.62}
.itb.past.done{opacity:.4}
.itb.now{background:#fff7e7;box-shadow:inset 3.5px 0 0 var(--gold)}
.itb.now .bttl{font-weight:750}
.itb.flash{animation:fl 1.3s ease}
@keyframes fl{0%,100%{background:#fff7e7}30%{background:#ffe9b8}}
@media(prefers-reduced-motion:reduce){.itb.flash{animation:none}}
/* detalle desplegado: acá vuelve TODO lo que la v1 mostraba siempre */
.bdet{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.bdet .btxt{font-size:13.5px;line-height:1.55}
.bedit{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  display:flex;gap:6px;align-items:center}
.bedit .mini{font-size:13px;opacity:.55;border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;background:#fff}
.bedit .lb{font-size:10.5px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;flex:1}
.bedit .del{color:var(--red);border-color:#f0cdd2;margin-left:auto}
/* columna de acción: plegado, SOLO lo que se usa caminando */
.itb .bact{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:center;
  padding-top:1px}
.itb .ck{width:26px;height:26px;border-radius:8px;font-size:13px}
.goto{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:#e6f3ea;color:#1e6b41;font-weight:800;font-size:14px;text-decoration:none;
  border:1px solid #bfdfcb}
.plegar{margin-top:9px;font-size:11px;font-weight:700;color:var(--mut);
  border:1px dashed var(--line);border-radius:8px;padding:4px 10px}
.itb.logi .bact .ck{width:22px;height:22px;font-size:11px}
/* traslado entre paradas: se queda, es info de calle pura */
.trav{padding:5px 12px 5px 57px;font-size:11.5px}

/* ── barra inferior ──────────────────────────────────────────────────────── */
.bar .stat{font-size:11.5px}
#bAhora{background:var(--accent);padding:10px 16px;font-size:13.5px;font-weight:750}

.hint{font-size:11px;color:var(--mut);margin:2px 0 10px;text-align:center}

@media print{header,nav.tabs,.bar,.tools,.days,.bact,.addbtn{display:none!important}
  .itb .bttl,.itb.on .bttl{-webkit-line-clamp:unset;display:block}.bsub,.bfacts{display:block!important}
  .view{display:block!important}body{padding:0;background:#fff}}
</style>
</head>
<body>

<div class="topbar">
<header>
 <div class="hrow">
  <div class="brand"><span id="hbrand"></span><small id="hsub"></small></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="bWho" title="Filtrar por persona">👥</button>
  <button class="iconbtn" id="bMenu" title="Datos">⋯</button>
 </div>
</header>

<nav class="tabs"><div class="tabsin" id="tabs"></div></nav>
</div>

<main>
 <section class="view on" id="v-itin"></section>
 <section class="view" id="v-places"></section>
 <section class="view" id="v-map"></section>
 <section class="view" id="v-costs"></section>
 <section class="view" id="v-trans"></section>
 <section class="view" id="v-res"></section>
</main>

<div class="bar"><div class="barin">
  <div class="stat" id="stat"></div>
  <div class="spacer"></div>
  <button class="btn sm" id="bAhora" title="Saltar al bloque que toca ahora">Ahora</button>
  <button class="btn ghost sm" id="bExp">Exportar</button>
  <button class="btn sm" id="bSave">Guardado ✓</button>
</div></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

":"th","nombre":"Thais","corto":"Thais","color":"#5b3690"}],"radios":{"pasoDesvio":500,"pasoCerca":350,"pasoCorredor":2500,"pasoPunta":400,"pasoTop":4,"acaRadio":350,"acaTop":4,"barrioRadio":700,"barrioTop":6},"musica":{"cover":3000,"desde":18},"clave":"viaje.japon-2026.v1"},"places":[{"id":"ejemplo","n":"Borrame y cargá el primero","cat":"museo","hood":"—","cost":0,"dur":1,"jp":1,"th":1,"why":"Este lugar está acá para que la app funcione desde el primer minuto. Borralo cuando cargues uno de verdad, o editalo desde la propia app.","boro":"Tokio","sub":"—","costN":"","closed":"","free":"","book":"","main":false,"tags":[],"src":"propuesta","addr":"","aprox":false,"gname":"","must":0,"rate":0,"tip":"","season":"","warn":[],"refs":[],"conf":"","typ":"Sin clasificar todavía"},{"id":"u_g_8931947896790353941","n":"Ryuguden","cat":"alojamiento","hood":"Hakone","why":"Ryokan de 24 habitaciones sobre la orilla este del lago Ashi, del grupo Prince (Seibu). El edificio es lo interesante: se construyó en 1938 en la isla Benten del lago Hamana como \"Hamana-ko Hotel\", copiando el Byōdō-in Hōō-dō de Uji, se desarmó y se remontó en Hakone en 1957, y en 2017 quedó registrado como bien cultural tangible nacional y reabrió como baño termal de día. Ahí está la jugada real para ustedes: no hace falta dormir acá — el 日帰り温泉 (baño de día) cuesta ¥2.300 entre semana, se entra el mismo día sin reserva, y el rotenburo mira al lago y al Fuji, que en diciembre y enero es cuando mejor se ve porque el aire seco de invierno lo deja despejado y con nieve. Dos condiciones antes de subirse al bus: el local prohíbe terminantemente la entrada a personas con tatuajes (política publicada, y si lo ven adentro te hacen salir) — si eso los toca, este lugar no va. Y es una vista, así que necesita luz: en diciembre el sol se pone cerca de las 16:35, o sea que entrando tarde pagás por mirar un lago negro. Entrá antes de las 14:00.","addr":"139 Motohakone, Hakone, Ashigarashimo District, Kanagawa 250-0522, Japón","lat":35.211711199999996,"lng":139.0111977,"aprox":false,"gcid":"8931947896790353941","cost":2300,"dur":3,"sub":"Ryokan / onsen con vista al Fuji","typ":"Ryokan","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Ryuguden","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Hakone","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abre. Está listado como 無休 (sin día de cierre) por la asociación de turismo de Hakone y el sitio oficial no publica ningún cierre de fin de año, así que el baño de día opera del 29/12 al 3/1. Lo que cambia es el precio: la tarifa de año nuevo del período anterior (27/12/2025 al 04/01/2026) fue adulto ¥3.000, socio SEIBU PRINCE CLUB ¥2.600, niño ¥1.600, infante ¥800, y del 30/12 al 03/01 no aplica ningún cupón ni descuento. Esa página oficial hoy da 404 y todavía no publicaron la del período 2026-27, así que tomá esos números como referencia (presupuestá ¥3.000 por cabeza) y confirmá por teléfono al 0460-83-1121 unos días antes.","conf":"alta","warn":["Tatuajes: prohibición terminante, no es \"consultá\". Las notas del local en la asociación de turismo de Hakone dicen que se rechaza el uso a personas con 刺青/タトゥ (y a miembros de organizaciones criminales), y si lo descubren adentro te hacen salir en el acto. Si a alguno le toca, este lugar no va: son 1h20 de bus para quedarse en la puerta.","La ficha de Google dice 'Ryokan', pero en el mismo 139 Motohakone conviven DOS negocios con entradas separadas en Maps: el hospedaje y el baño de día 龍宮殿本館. Los horarios y precios de arriba son los del baño de día, que es lo que van a usar. El sitio oficial y la asociación de turismo publican un solo teléfono, 0460-83-1121; el 0460-83-1126 aparece como línea del baño de día en directorios turísticos, no en el sitio oficial.","Es de Prince Hotels / Seibu, o sea una cadena. El edificio es único, la operación no: esperá servicio de hotel grande, no de ryokan familiar.","La dirección dice 'Motohakone' pero NO está en el pueblo de Motohakone-ko: está en Hakone-en, orilla este del lago, a 5 min a pie del teleférico Komagatake. Hay un bus gratuito que circula entre Motohakone y el Ryuguden Honkan.","Hakone no es una escapada de media tarde desde Tokio: son ~50 min en shuttle solo desde Odawara (y el shuttle es exclusivo para huéspedes y con reserva previa), o ~1h20 en bus Izuhakone desde Odawara / unos 50 min a 1 hora desde Hakone-Yumoto. Esto se come un día entero.","Si duermen acá: Rakuten Travel lista de ¥10.500 por persona (plan simple, 5 personas en la habitación) hasta ¥246.700 por persona (habitación con onsen privado, uso individual). Para dos personas en temporada alta de fin de año, el número real está muy arriba de eso — no lo pude verificar y no lo inventé.","El Ekiden de Hakone (la maratón universitaria de relevos) cae el 2 y 3 de enero de 2027 en su 103ª edición, con meta y largada en el estacionamiento del lago Ashi — o sea, justo acá. Satura rutas, buses y hoteles de toda la zona esos dos días."],"refs":["https://www.princehotels.com/ryuguden/","https://www.princehotels.com/ryuguden/about-us/","https://www.princehotels.co.jp/ryuguden/honkan/","https://www.princehotels.co.jp/ryuguden/honkan_jikan_ryokin/","https://www.princehotels.co.jp/ryuguden/honkan_history/","https://www.princehotels.co.jp/ryuguden/access/","https://www.princehotels.co.jp/ryuguden/informations/","https://www.princehotels.co.jp/ryuguden/plan/all/","https://www.hakone.or.jp/3630","https://hotel.travel.rakuten.co.jp/hotelinfo/plan/54621"]},{"id":"u_g_16541483671354480303","n":"Takumino Yado Yoshimatsu","cat":"alojamiento","hood":"Hakone","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"521 Hakone, Ashigarashimo District, Kanagawa 250-0521, Japón","lat":35.1897393,"lng":139.02862819999999,"aprox":false,"gcid":"16541483671354480303","cost":0,"dur":0,"sub":"-","typ":"Ryokan","book":"","free":"","closed":"","main":f "","src":"lista","gname":"Shiraitono Falls","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Fuji / Kawaguchiko","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_16551940223285880941","n":"Kosaku Kawaguchiko Hoto Noodles","cat":"comida","hood":"Fuji / Kawaguchiko","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1638-1 Funatsu, Fujikawaguchiko, Minamitsuru District, Yamanashi 401-0301, Japón","lat":35.4957481,"lng":138.7568631,"aprox":false,"gcid":"16551940223285880941","cost":0,"dur":0,"sub":"-","typ":"Hoto","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kosaku Kawaguchiko Hoto Noodles","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Fuji / Kawaguchiko","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_12735891183652920291","n":"Carp Rental Bicycle","cat":"transporte","hood":"Fuji / Kawaguchiko","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"4025 Funatsu, Fujikawaguchiko, Minamitsuru District, Yamanashi 401-0301, Japón","lat":35.5034555,"lng":138.7686718,"aprox":false,"gcid":"12735891183652920291","cost":0,"dur":0,"sub":"-","typ":"Alquiler de bicicletas","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Carp Rental Bicycle","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Fuji / Kawaguchiko","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_4943631788302700642","n":"Sagano Scenic Railway trolley train","cat":"mirador","hood":"Kioto","why":"Opera solo la primera mitad del viaje: el calendario oficial 2026 termina el martes 29/12 y desde el 30/12 entra en parada invernal, así que del 30 de diciembre al 7 de enero está cerrado. Es un tren turístico de 25 minutos que va de Torokko Saga (Arashiyama) a Kameoka bordeando el desfiladero del río Hozu, 880 yenes por persona por tramo; la vuelta se suele hacer en la línea JR Sagano desde Umahori (7 minutos, 200 yenes), a cinco minutos a pie de Torokko Kameoka. En diciembre el gancho no es el follaje —ya no queda— sino el barranco pelado con el río abajo, y con el sol poniéndose cerca de las 16:50 conviene tomarlo a la mañana o a primera hora de la tarde. Detalle no menor: los vagones actuales cumplen 35 años y se retiran el 29/12/2026 para ser reemplazados en la primavera de 2027, así que las últimas semanas de diciembre van a tener demanda alta.","addr":"Sagamizuohatogasu, Ukyo Ward, Kyoto, 610-0000, Japón","lat":35.0278596,"lng":135.64941109999998,"aprox":false,"gcid":"4943631788302700642","cost":880,"dur":2,"sub":"-","typ":"Tren panorámico","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Sagano Scenic Railway trolley train","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Estacional y verificado: opera del 14 al 29 de diciembre de 2026 (salvo el miércoles 16) y cierra a partir del 30/12. No vuelve a abrir dentro de las fechas del viaje. · Año nuevo (29/12 al 3/1): Cerrado. La parada invernal arranca el 30/12/2026 y también cierran las tiendas y el Diorama Kyoto JAPAN. En el ciclo anterior la suspensión fue del 30/12/2025 al 28/02/2026 y reabrió el 1/3; para 2027 el reemplazo de los vagones está anunciado para la primavera, así que no hay ninguna razón para esperar que abra entre el 30/12 y el 7/1.","conf":"alta","warn":["Cerrado desde el 30/12/2026: el calendario oficial 2026 marca el 30 y 31 de diciembre como parada invernal, y esa parada se extiende todos los años hasta fines de febrero (en 2026 fue del 1/1 al 28/2). El calendario 2027 todavía no está publicado, pero con el reemplazo de los vagones anunciado para la primavera de 2027 no hay ninguna chance de que abra entre el 30/12 y el 7/1. Si el tramo de Kioto cae después de Año Nuevo, este lugar no existe para el viaje.","También cerrado el miércoles 16 de diciembre de 2026, según el calendario oficial.","El 29/12/2026 es el último día de los vagones actuales antes de su retiro (se reemplazan en la primavera de 2027). Esperar demanda alta y agotamiento anticipado en las últimas semanas de diciembre.","Los pasajes salen a la venta un mes antes por la web oficial; las ventanillas solo venden del día y se agotan. No contar con comprarlo en el momento.","La dirección de la ficha de Google (Sagamizuo, Ukyo-ku) cae en el desfiladero, no en el andén. Se sube en la estación Torokko Saga, pegada a la estación JR Saga-Arashiyama.","Necesita luz de día: a fin de diciembre en Kioto el sol se pone cerca de las 16:50 y el último servicio regular sale de Torokko Saga a las 16:02. Tomarlo a la mañana o a primera hora de la tarde. (Los días 26 y 27 de diciembre hay un tren extra a las 17:10, pero ya de noche: sin vista del desfiladero.)","La zona 'Kioto' está bien —es prefectura de Kioto— pero la punta del recorrido, Kameoka, queda a unos 20 km del centro. La vuelta se hace en la línea JR Sagano desde la estación Umahori, a cinco minutos a pie de Torokko Kameoka.","No es motivo para organizar un día: encaja como tramo de una jornada en Arashiyama, no como destino propio."],"refs":["https://www.sagano-kanko.co.jp/en/news/1581/","https://www.sagano-kanko.co.jp/news/3756/","https://www.sagano-kanko.co.jp/cms/wp-content/uploads/2026/03/2026%E5%B9%B4%E9%81%8B%E8%BB%A2%E8%A8%88%E7%94%BB%E3%82%AB%E3%83%AC%E3%83%B3%E3%83%80%E3%83%BC4%E6%9C%8811%E6%97%A5%E8%87%A8%E6%99%82%E5%88%97%E8%BB%8A%E8%BF%BD%E5%8A%A0%E6%97%A5%E6%9C%AC%E8%AA%9E-1.pdf","https://www.sagano-kanko.co.jp/en/wp-content/uploads/sites/2/2026/01/260120_00_%E3%80%90%E7%A2%BA%E5%AE%9A%E3%80%912026%E5%B9%B4%E9%81%8B%E8%A1%8C%E3%82%B9%E3%82%B1%E3%82%B8%E3%83%A5%E3%83%BC%E3%83%AB%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6%EF%BC%88HP%EF%BC%89.pdf","https://www.sagano-kanko.co.jp/en/ticket/","https://ja.kyoto.travel/event/single.php?event_id=4079","https://tetsudou-tabi.com/sagano-trolley-train/","https://www.japan-guide.com/e/e3965.html","https://ogktravel.com/sagano-torokko-new-train-test-run-2026/"]},{"id":"u_g_806559085317412531","n":"Fukutaro","cat":"comida","hood":"Osaka","why":"Okonomiyaki y sobre todo negiyaki en Sennichimae, a cinco cuadras de Namba. 3,72 en Tabelog con 2.735 reseñas es un puntaje alto para la categoría: no es un lugar de folleto con buena foto, es de los okonomiyaki serios de Osaka y justifica gastarle una comida. La contra es operativa: no toma reservas y se hace cola, así que hay que llegar cuando abre: 12:00 clavadas fin de semana o feriado, 17:00 entre semana. Diciembre no le cambia nada (es un local a la calle, sin vista ni luz que importe), pero enero sí: cierra en Año Nuevo.","addr":"2 Chome-3-17 Sennichimae, Chuo Ward, Osaka, 542-0074, Japón","lat":34.6655261,"lng":135.5044991,"aprox":false,"gcid":"806559085317412531","cost":2500,"dur":2,"sub":"Okonomiyaki","typ":"Okonomiyaki","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: Google no devolvió el nombre. Solo hay dirección, sin nombre. Sennichimae (Namba) es zona densa de restaurantes y bares, pero no sé qué local es ni si es comida.","src":"lista","gname":"2 Chome-3-17 Sennichimae","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.72,"tip":"Suji negiyaki (¥1.580), el plato de la casa: negiyaki de tendón de wagyū negro, masa fina con montaña de cebolla de verdeo y tare de soja en vez de la salsa dulce del okonomiyaki común — es lo que lo distingue de cualquier otro local. Para compartir el segundo, Triple okonomiyaki (¥1.580: panceta, calamar y dos langostinos), que es el okonomiyaki más pedido. NO toma reservas (\"現在ご予約は承っておりません\"), se hace fila en la puerta. Sí acepta tarjeta (Visa/Master/JCB/Amex), Suica, PayPay: no es solo efectivo. 76 asientos, 26 de barra frente a la plancha.","season":"Año nuevo (29/12 al 3/1): CIERRA, pero sin fechas publicadas. El sitio oficial dice textual 年中無休（正月期間をのぞく）: abre todo el año excepto el período de Año Nuevo, y no aclara qué días. Si están en Osaka entre el 29/12 y el 3/1 hay que llamar al 06-6634-2951 antes de ir; no lo den por abierto.","conf":"alta","warn":["Es una cadena chica de 3 locales (Honten Sennichimae, Umeda/Grand Front y Namba Dining Maison en Takashimaya). El 3,72 es SOLO del Honten: las otras dos tienen ficha y puntaje propios, más bajos. La dirección del catálogo (2-3-17 Sennichimae) es la del Honten, así que el pin está bien — pero si en Google alguien clickea 'Fukutaro' cerca de Umeda, no es este.","Cierra en Año Nuevo sin fechas publicadas: verificar por teléfono si el itinerario mete Osaka entre el 29/12 y el 3/1.","Hot Pepper publica otro horario para este local (17:00–24:00 entre semana y 17:00–23:00 fines de semana y feriados, 48 asientos) que no coincide ni con Tabelog ni con el sitio oficial: no registra la apertura de 12:00 del fin de semana, que es el dato operativo que importa. Vale el oficial: 17:00 entre semana, 12:00 fines de semana y feriados.","Google lo rotula 'Okonomiyaki' pero la especialidad real es negiyaki. La categoría 'comida' está bien; el sub debería leerse como okonomiyaki/negiyaki.","No acepta reservas de ningún tipo: no se puede asegurar la mesa desde Argentina."],"refs":["https://tabelog.com/en/osaka/A2701/A270202/27002665/","https://tabelog.com/en/osaka/A2701/A270202/27002665/dtlmenu/","https://2951.jp/","https://2951.jp/shop/","https://www.hotpepper.jp/strJ000109997/"]},{"id":"u_g_11050747874980278285","n":"Toyo","cat":"comida","hood":"Osaka","why":"Puesto de pie al aire libre bajo las vías del JR en Kyobashi (Osaka ciudad, la zona está bien asignada), abierto por Toyoji Chikumoto en 1992 y famoso mundialmente desde que salió en Street Food de Netflix por el cachete de atún que se soplatea y se gira con la mano desnuda sobre las brasas. Ojo: Time Out dice que Toyo-san se retiró hace poco y que sus sucesores no cambiaron nada — el plato sigue, el personaje de la serie ya no está detrás de la parrilla. Tabelog 3,53 (de este local, Higashinodamachi 3-2-26) y entró en el Tabelog 100 de tachinomi 2025, así que no es solo el show. La trampa para el plan es el horario: abre al mediodía o a la primera tarde y cierra entre las 17:00 y las 19:00 según la fuente, cerrado domingos, lunes, jueves y feriados — es almuerzo tardío y, con suerte, cena muy temprana. En diciembre suma un problema propio: son 15-20 personas paradas al aire libre, sin paredes ni calefacción, con Osaka en 9-12 °C de máxima y bastante menos al caer el sol.","addr":"3 Chome-2-26 Higashinodamachi, Miyakojima Ward, Osaka, 534-0024, Japón","lat":34.697203,"lng":135.5351173,"aprox":false,"gcid":"11050747874980278285","cost":2500,"dur":1.5,"sub":"Izakaya de pie / pescado","typ":"Izakaya","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Toyo","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.53,"tip":"El aburi maguro hoho-niku (cachete de atún soplateado) a ¥450 la media orden es lo que hay que pedir sí o sí. Después el set de toro a ¥3.200 (toro, uni, ikura, vieira y cangrejo con vinagre), el sashimi de maguro, a precio variable según el día, y el roll de anguila y pepino (una-q maki) ¥600 — precios leídos en explore.osaka, no en carta oficial, tomalos como orden de magnitud. SOLO EFECTIVO: Tabelog confirma que no toma tarjeta, ni dinero electrónico, ni QR. NO se reserva por ningún medio, es walk-in puro. La cola se arma 15-20 minutos antes de abrir (explore.osaka); conviene llegar temprano porque los platos populares, sobre todo el set de toro, se agotan antes del cierre. Sábado es el peor día: las tardes de semana son más tranquilas. Las bebidas son self-service y se paga todo junto al final.","season":"No es estacional ni de montaña, opera todo el año. Pero es 100% al aire libre y de pie, sin local cerrado: en diciembre-enero con Osaka entre 9 y 12 °C de máxima y bastante menos al caer el sol, la cola parado más una hora comiendo a la intemperie es una decisión, no un detalle. · Año nuevo (29/12 al 3/1): Parcialmente verificado. No hay aviso publicado de cierre de 年末年始 en ninguna de las fuentes que leí: Tabelog y HotPepper listan solo los días fijos de cierre (月・木・日・祝日) y nada de fin de año. Aplicando su regla de días de cierre al calendario 2026-27: 31/12 cae jueves (cerrado), 1/1 es feriado nacional (cerrado por regla de 祝日) y 3/1 cae domingo (cerrado). Quedarían en teoría el 29/12 (martes), 30/12 (miércoles) y 2/1 (sábado), pero es muy probable que también cierre esos días por el receso de año nuevo. Hay que llamar al 06-6882-5768 antes de ir en esa ventana.","conf":"alta","warn":["NO ES UNA CENA NORMAL. Cierra entre las 17:00 y las 19:00 según la fuente: es almuerzo tardío o, en el mejor caso, cena muy temprana, y hay que armar el día alrededor de eso.","Solo abre martes, miércoles, viernes y sábado. Domingo, lunes, jueves y feriados nacionales está cerrado — eso liquida el 1 de enero y probablemente varios días del shogatsu.","Efectivo únicamente. Ni tarjeta, ni IC, ni QR.","No se reserva por ningún medio. Hay que hacer cola: 15-20 minutos antes de abrir como mínimo, y conviene llegar antes.","Es al aire libre, de pie, bajo las vías del JR, con capacidad para 15-20 personas. En diciembre hace frío de verdad y no hay dónde sentarse.","Discrepancia de horarios entre fuentes fetcheadas (Tabelog EN 13-17 vs HotPepper/Time Out 13-19). Confirmar por teléfono si el plan del día depende del cierre.","A 1 minuto a pie de la estación Kyobashi (JR Loop, Keihan, metro), barrio Miyakojima."],"refs":["https://tabelog.com/en/osaka/A2701/A270107/27002949/","https://www.hotpepper.jp/strJ000109554/","https://www.timeout.com/osaka/bars-and-pubs/izakaya-toyo","https://explore.osaka/food/izakaya-toyo-osaka-kyobashi/","https://maido-bob.osaka/en/spot/izakaya-toyo/"]},{"id":"u_g_7280300759603731432","n":"Tasogare Coffee Stand","cat":"comida","hood":"Osaka","why":"Café de especialidad en Horie (Nishi-ku, Osaka), a 3 minutos a pie de la salida 6 de la estación Yotsubashi (Osaka Metro, línea Yotsubashi) y a 6 de JR Namba. Tabelog le da 3,41 sobre 5 con 132 reseñas. Tiene 80 asientos en dos plantas, no toma reservas y abre a las 9:00 sábados, domingos y feriados, así que sirve para el desayuno o el café de media mañana. En diciembre no depende de la luz: es interior y cierra 19:00 entre semana, 18:00 el fin de semana. Ojo: cierra en días irregulares, sin día fijo.","addr":"Japón, 〒550-0015 Osaka, 大阪市西区Nishi Ward, Minamihorie, 1 Chome−16−11 RE-008 1F","lat":34.6706151,"lng":135.4949856,"aprox":false,"gcid":"7280300759603731432","cost":1200,"dur":0.75,"sub":"café de especialidad","typ":"Café","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tasogare Coffee Stand","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.41,"tip":"Café de especialidad: en la carta figuran drip y latte (latte ~750 yenes), y el personal explica los orígenes para que elijas. Para comer: papas fritas, muffins y affogato. También venden granos para llevar. No acepta reservas. Acepta tarjeta, dinero electrónico y pagos por QR — no es solo efectivo. Presupuesto de Tabelog: 1.000-1.999 yenes por persona.","season":"Año nuevo (29/12 al 3/1): sin verificar. No hay calendario de fin de año publicado en ninguna fuente y el local cierra en días irregulares, así que del 29/12 al 3/1 puede estar abierto o no. El dominio oficial está caído: el día anterior, mirar los horarios especiales en la ficha de Google Maps del local, o buscar \"TASOGARE COFFEE 南堀江\" en Instagram.","conf":"alta","warn":["Hay DOS fichas de Tabelog con nombre casi igual y NO son el mismo local: la de 3,12 (tabelog.com/en/osaka/A2701/A270201/27094391/) es el Tasogare Coffee Stand viejo de Minamisenba, marcado como mudado. El de esta dirección (Minamihorie 1-16-11 RE-008 1F) es la ficha 27143720, con 3,41. Abrió el 18 de julio de 2024.","Cierre irregular sin día fijo: no lo pongas como única parada de un tramo del día. Confirmar en Google Maps el día anterior.","Shogatsu sin confirmar: ver campo shogatsu.","El sitio oficial que citan varios directorios (tasogarecoffeestand.com) ya no resuelve DNS — verificado: sin registros A ni NS. Tampoco hay cuenta de Instagram publicada en Tabelog ni en Retty. Para confirmar que está abierto, la ficha de Google Maps del local es lo más confiable."],"refs":["https://tabelog.com/en/osaka/A2701/A270201/27143720/","https://tabelog.com/en/osaka/A2701/A270201/27094391/","https://retty.me/area/PRE27/ARE94/SUB9402/100001755759/","https://city.living.jp/citymate/citymate353/mate_gourmet/1617680/","https://map.yahoo.co.jp/v3/place/c0ZeWZSENCM/menu"]},{"id":"u_g_6072642636345787938","n":"Curry Bondy","cat":"comida","hood":"Chiyoda","why":"Se lo considera el creador del \"curry europeo\" en Japón: abrió en 1973 en el segundo piso del edificio Kanda Kosho Center, en pleno barrio de librerías de viejo de Jimbocho. Salsa espesa a la francesa con verduras, frutas y manteca, más una mezcla de especias propia — no se parece nada al curry de cadena. Tabelog 3.68 y Top 100 de curry de Tokio varios años seguidos, o sea que la fila es real: 50 asientos, sin reservas, cash only. Está a 78 metros de la estación Jimbocho, no necesita luz de día y abre hasta la noche, así que entra bien como almuerzo tardío o cena en un día corto de diciembre. En invierno agregan curry de ostras, que no está el resto del año.","addr":"神田古書センタービル, ２階, 2 Chome-3 Kanda Jinbocho, Chiyoda City, Tokyo 101-0051, Japón","lat":35.6955738,"lng":139.7573664,"aprox":false,"gcid":"6072642636345787938","cost":1800,"dur":1.25,"sub":"Curry","typ":"Curry","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Curry Bondy","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":3.68,"tip":"Beef curry ¥1.800 (el plato de la casa desde 1973), y en diciembre está el oyster curry de temporada ¥1.950. Elegís el picante: dulce, medio o picante. Antes del curry traen dos papas al vapor: una se come sola con la manteca especial, la otra se pisa dentro del curry. Papa extra ¥200, arroz extra ¥400. NO se reserva y NO toman tarjeta ni dinero electrónico: solo efectivo. Hay fila casi siempre, sobre todo mediodía y fin de semana.","season":"Año nuevo (29/12 al 3/1): Cierra. Tabelog lista el 定休日 como \"年末年始\" (fin de año y año nuevo) y Visit Chiyoda también marca año nuevo como único cierre. Las fechas exactas del 2026-27 no están publicadas todavía: se anuncian sobre la fecha en el Instagram del local (@curryrestaurant_bondy_official). Asumir cerrado del 29/12 al 3/1 y confirmar en diciembre. Además Jimbocho es barrio de librerías de viejo y oficinas: en esos días queda vacío, no es zona para ir a probar suerte.","conf":"media","warn":["Tiene 4 sucursales de curry (Kanda Ogawamachi, Otemachi, Akihabara, Shibaura) — la dirección de esta ficha (Kanda Kosho Center 2F) es la del honten, que es la que puntúa 3.68. La de Kanda Ogawamachi puntúa 3.59: no confundirlas.","Solo efectivo, sin tarjeta ni IC. Llevar yenes.","No se reserva: es fila o nada.","Casi seguro cerrado en shōgatsu (29/12-3/1): no ponerlo en esos días sin confirmar antes.","Está en un 2do piso dentro de un edificio de librerías, la entrada no se ve desde la calle."],"refs":["https://tabelog.com/en/tokyo/A1310/A131003/13000439/","https://tabelog.com/en/tokyo/A1310/A131003/13000439/dtlmenu/","https://tabelog.com/en/tokyo/A1310/A131002/13038044/","https://bondy.co.jp/web/contents/shoplist.html","https://visit-chiyoda.tokyo/app/spot/detail/376","https://www.sbcurry.com/special/bondy/"]},{"id":"u_g_3184394917603328826","n":"OTHER SPACE Hotel Asakusa","cat":"alojamiento","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"3 Chome-4-10 Asakusa, Taito City, Tokyo 111-0032, Japón","lat":35.716396599999996,"lng":139.7974198,"aprox":false,"gcid":"3184394917603328826","cost":0,"dur":0,"sub":"-","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: El pin no tiene nombre («Japón»), solo la dirección Asakusa 3-4-10. Zona mixta de restaurantes y comercios al norte de Sensoji: falta el nombre real del local.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_5056390973891085264","n":"Cat St","cat":"tienda","hood":"Shibuya","why":"No es un lugar, es un kilómetro de vereda peatonal entre Miyashita Park (Shibuya) y Omotesando: el cauce tapado del río Shibuya/Onden convertido en paseo en 1964, año de las Olimpiadas, y calle del distrito de Shibuya (区道) desde 1996. Sirve para ir caminando de Shibuya a Harajuku en vez de tomar el tren, con vintage (RAGTAG), cafés de especialidad y también flagships de marca grande (Coach, Nike), pero no justifica un slot propio en un viaje de 25 días con 334 candidatos: si van a Harajuku, esta caminata la hacen sin planearla. Los cuatro comercios que lista la guía abren a las 11 y cierran entre 19 y 20, así que es cosa de media tarde; no depende de luz natural, y de noche cruza la iluminación de Omotesando. OJO CON LA FECHA: la edición 2026-2027 de esa iluminación no está anunciada todavía; lo único publicado es la edición 2025 (1 al 28 de diciembre de 2025, del atardecer a las 22:00, con los arbustos bajos encendidos hasta el 5/1/2026). Si el argumento para venir es la iluminación, hay que confirmar las fechas del año del viaje en omotesando.or.jp/illumi/ antes de salir. Verde, cero.","addr":"Shibuya, Tokio, Japón","lat":35.6670292,"lng":139.7063518,"aprox":false,"gcid":"5056390973891085264","cost":0,"dur":1,"sub":"Calle comercial","typ":"Calle comercial","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Cat St","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): La calle no cierra nunca porque es vía pública. Los comercios uno por uno: sin verificar. La fuente fetcheada de livejapan habla de tiendas departamentales y malls —casi todo cerrado el 1/1 y hatsu-uri recién el 2 o el 3 de enero—, no de boutiques independientes como las de esta calle: que entre el 31/12 y el 2/1 haya muchas persianas bajas es una inferencia, no un dato confirmado. De la iluminación de Omotesando solo está publicada la edición 2025 (terminó el 28/12/2025, con los arbustos bajos encendidos hasta el 5/1/2026); las fechas del año del viaje no están anunciadas.","conf":"media","warn":["No es un punto: el pin de Google cae en algún lugar de una calle de 1 km. Como parada del itinerario no significa nada; cargala como tramo a pie entre Shibuya y Harajuku, no como destino.","Se superpone casi entera con otras entradas probables del catálogo (Harajuku, Omotesando, Miyashita Park, Ura-Harajuku). Revisar duplicados antes de que ocupe cuatro casilleros distintos.","La categoría 'tienda' es lo menos malo que hay, pero es un corredor comercial, no un comercio. Ninguna ficha de horario ni de precio aplica al conjunto.","Shōgatsu verificado solo a nivel ciudad, no local por local: entre el 29/12 y el 3/1 puede haber la mitad de las cortinas bajas y no hay forma de saberlo de antemano."],"refs":["https://ja.wikipedia.org/wiki/%E6%97%A7%E6%B8%8B%E8%B0%B7%E5%B7%9D%E9%81%8A%E6%AD%A9%E9%81%93%E8%B7%AF","https://www.magical-trip.com/media/what-is-shibuya-cat-street-introducing-the-highlights-2/","https://omotesando.or.jp/illumi/","https://livejapan.com/en/in-tokyo/in-pref-tokyo/in-shinjuku/article-a0005419/"]},{"id":"u_g_6906870575870610827","n":"Menchirashi","cat":"comida","hood":"Shibuya","why":"Udon sanuki hecho en el local (amasado, cortado y hervido en el día) en un callejón al este de Meiji-dori, cerca del cruce de Jingumae con Cat Street (Jingumae 6-13-7), abierto en 2018. Tabelog 3.57 con más de 1.400 reseñas. El costo real no es la plata sino la cola: los relatos verificados van de 15 a 60 minutos, parados en la calle, y en diciembre el peor caso es una hora al aire libre a 8 grados. Si van, van a la apertura (11:30) o a media tarde, nunca al mediodía de sábado. No necesita luz de día: sirve hasta la noche, así que sirve para llenar el hueco después de las 16:30 cuando ya es de noche y no queda mucho para ver.","addr":"Japón, 〒150-0001 Tokyo, Shibuya, Jingumae, 6 Chome−13−7 1F","lat":35.6664994,"lng":139.7050912,"aprox":false,"gcid":"6906870575870610827","cost":1500,"dur":1.5,"sub":"Udon","typ":"Udon","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Menchirashi","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":3.57,"tip":"La carbonara kamatama udon (カルボナーラ釜たまうどん), ¥950, unas 300 por día: fideo recién hervido con yema, panceta, queso y manteca. Pidan además un bukkake frío o una tempura para compartir y contrastar con algo que sea udon en serio, no el hit de Instagram. El 大盛り (porción grande) es gratis. NO toman reservas: se hace fila y toman el pedido mientras esperás. Y ojo con esto: desde el 1 de junio de 2026 no aceptan efectivo — solo tarjeta, Suica/IC, iD o QUICPay. Los pagos por código QR (PayPay y similares) NO se aceptan: el que solo lleve QR se queda sin forma de pagar.","season":"","conf":"alta","warn":["Cashless desde el 1/6/2026: NO aceptan efectivo, solo tarjeta / Suica / iD / QUICPay. Tampoco aceptan QR (PayPay y similares)","Sin reservas y con cola de 15 a 60 minutos, parados en la calle: en diciembre eso pesa","Cierre irregular (不定休), sin día fijo de descanso. El 'martes hasta las 16:30' sale del sitio oficial congelado en 2021 y de un artículo viejo; desde 2024 los martes abren normal. Chequear antes de cruzar Tokio","Shogatsu sin verificar: no hay dato del 29/12 al 3/1 en ninguna fuente. Su Instagram (@menchirashi_one) es donde publican los cierres — chequear en diciembre","Local único en Jingumae, no es cadena. Google lo llama 'Udon' y está bien clasificado"],"refs":["https://tabelog.com/en/tokyo/A1306/A130601/13225567/","https://tabelog.com/en/tokyo/A1306/A130601/13225567/dtlrvwlst/","https://tabidan.tokyo/menchirashi/"]},{"id":"u_g_13297358857572887164","n":"Maguro-to-Shari Asakusa","cat":"comida","hood":"Taitō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒111-0032 Tokyo, Taito City, Asakusa, 1 Chome−42−4 ヒューリック浅草1丁目ビル 1階","lat":35.7133301,"lng":139.79359689999998,"aprox":false,"gcid":"13297358857572887164","cost":0,"dur":0,"sub":"-","typ":"Sushi","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Maguro-to-Shari Asakusa","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_12819761384697507953","n":"Hotel Toranomon Hills - The Unbound Collection by Hyatt","cat":"alojamiento","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒105-0001 Tokyo, Minato City, Toranomon, 2 Chome−6−4 虎ノ門ヒルズステーションタワー 1階","lat":35.6675784,"lng":139.7471366,"aprox":false,"gcid":"12819761384697507953","cost":0,"dur":0,"sub":"-","typ":"Hotel","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Hotel Toranomon Hills - The Unbound Collection by Hyatt","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_1723895270730
