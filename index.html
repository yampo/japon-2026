,"free":"","closed":"","main":false,"costN":"⚠ sin clasificar: no encaja en ninguna categoría. No hay categoría de parque de diversiones; entra en parque por descarte","src":"lista","gname":"Tokyo Disney Resort","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_16490271119724106699","n":"Tokyo Disneyland","cat":"evento","hood":"Urayasu","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1-1 Maihama, Urayasu, Chiba 279-0031, Japón","lat":35.6328964,"lng":139.8803943,"aprox":false,"gcid":"16490271119724106699","cost":0,"dur":0,"sub":"-","typ":"Parque temático","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: no encaja en ninguna categoría. No hay categoría de parque de diversiones; entra en parque por descarte","src":"lista","gname":"Tokyo Disneyland","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_5170383595001406343","n":"Kuchu Teien Observatory","cat":"mirador","hood":"Osaka","why":"El mirador del Umeda Sky Building: dos torres unidas arriba por un anillo abierto a 173 m, con la azotea al aire libre. Es el mirador con más carácter de Osaka —el edificio en sí es la atracción, no solo la vista— y compite con Abeno Harukas, que es más alto (300 m) y también tiene un piso al aire libre, pero sin ese gesto arquitectónico. Para diciembre y enero juega a favor que cierra 22:30 (última entrada 22:00): con el sol yéndose cerca de las 17, se puede ir de noche sin quemar horas de luz, que es el recurso escaso del viaje. En contra: ¥2.000 por cabeza, o sea ¥4.000 los dos, y la terraza abierta a esa altura en pleno invierno es viento y frío de verdad —abrigo real, no campera de ciudad.","addr":"Japón, 〒531-6039 Osaka, Kita Ward, Oyodonaka, 1 Chome−1−88 梅田スカイビル","lat":34.705437499999995,"lng":135.49032789999998,"aprox":false,"gcid":"5170383595001406343","cost":2000,"dur":1.5,"sub":"Umeda / Kita-ku","typ":"Observatorio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kuchu Teien Observatory","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Parcialmente verificado. En la web oficial no figura ningún día de cierre anual y el 1 de enero hay operación especial, así que no es de los lugares que bajan la persiana en shōgatsu; pero el horario exacto del 29/12 al 3/1 de 2026-2027 todavía no está publicado. Lo que sí está documentado es la edición pasada: el 1/1/2026 abrieron de 6:00 a 8:00 para ver el primer amanecer del año (hatsuhinode), ¥6.000 por persona, 250 lugares, venta web desde el 12/12/2025 al mediodía, y se agotó. La edición del 1/1/2027 no está anunciada todavía.","conf":"alta","warn":["La zona está bien asignada: Umeda está en Kita-ku, pleno centro de Osaka. No hay error de prefectura.","Está a 10-15 minutos a pie de las estaciones de Umeda según cuál: JR Osaka ~15 min, Hankyu Osaka-umeda ~10-12, Metro Umeda ~12-15. Todos los caminos pasan por un pasaje subterráneo de 40 m bajo las vías. No es 'saliendo de la estación'.","La azotea abierta puede cerrarse con lluvia fuerte, y en diciembre a 173 m el viento pega en serio: abrigo de verdad.","¥2.000 por persona, ¥4.000 los dos. Si van a hacer varias atracciones de Osaka en un mismo día, mirar si el Osaka Amazing Pass conviene: cubre la entrada gratis hasta las 15:00.","Si les tienta el hatsuhinode del 1/1: en la edición anterior la venta abrió el 12 de diciembre al mediodía, eran 250 lugares y se agotó. Hay que estar encima el día que salga la de 2027.","El horario específico del 29/12 al 3/1 de 2026-2027 no está publicado todavía: revisar skybldg.co.jp en diciembre antes de agendarlo."],"refs":["https://www.skybldg.co.jp/en/observatory/","https://www.skybldg.co.jp/en/","https://www.skybldg.co.jp/en/access/","https://www.skybldg.co.jp/event/","https://www.skybldg.co.jp/new/2419.html","https://www.skybldg.co.jp/"]},{"id":"u_g_1081374622389182017","n":"Castillo Osaka","cat":"arq","hood":"Osaka","why":"El tenshukaku (la torre) es una reconstrucción de hormigón de 1931 con ascensor: por dentro es un museo de Hideyoshi y del sitio de Osaka, no un castillo original — lo que sí es del período Edo son las murallas ciclópeas, los fosos y las torretas del parque, que se recorren gratis. Vale como el ancla de una mañana en Osaka si el viaje pasa por la ciudad, pero el interior es correcto y nada más; el argumento fuerte está afuera, en la escala de las piedras y la vista del foso. Lo decisivo para estas fechas: la torre cierra del 28 de diciembre al 1 de enero, o sea toda la primera mitad del shōgatsu, y reabre el 2/1. En diciembre conviene ir de mañana: la última entrada es 17:30 pero a las 17:00 ya está oscuro y el mirador del piso 8 no muestra nada.","addr":"1-1 Osakajo, Chuo Ward, Osaka, 540-0002, Japón","lat":34.6872571,"lng":135.5258546,"aprox":false,"gcid":"1081374622389182017","cost":1200,"dur":2,"sub":"Castillo / museo","typ":"Castillo","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Castillo Osaka","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"No es de montaña ni estacional: opera todo el año salvo el cierre del 28/12 al 1/1. En diciembre-enero el parque está pelado — nada en flor, ni cerezos ni ciruelos — así que la visita es por la arquitectura y las murallas, no por el paisaje. · Año nuevo (29/12 al 3/1): Cerrado del 28/12 al 1/1 inclusive, según la web oficial. Reabre el 2/1 con horario normal 9:00–18:00. El parque, los fosos y las murallas son de acceso libre y no dependen de ese horario, pero no verifiqué si el parque tiene algún cierre propio de fin de año.","conf":"alta","warn":["CIERRE DE SHŌGATSU: la torre no abre del 28/12 al 1/1. Si el tramo en Osaka cae ahí, esto es solo un paseo por el parque; para subir hay que planificarlo desde el 2/1 o antes del 28/12.","La zona del catálogo está bien: 1-1 Osakajo, Chuo-ku, es Osaka ciudad, prefectura de Osaka. No hay error de asignación acá.","Los 1.200 ¥ son solo por subir a la torre. El parque, los fosos, las murallas y las torretas se ven gratis; el Jardín Nishinomaru cobra aparte y no verifiqué su horario ni su precio.","Necesita luz de día: en diciembre oscurece cerca de las 17:00 en Osaka y el mirador pierde todo el sentido. Ir de mañana.","Es de los lugares más visitados de Osaka: esperá cola en la boletería y en el ascensor. Hay venta anticipada online desde la web oficial.","Del 2 al 3 de enero el entorno va a estar cargado: es fin de semana de hatsumōde y la primera reapertura del año."],"refs":["https://www.osakacastle.net/guide/","https://www.osakacastle.net/english/"]},{"id":"u_g_9066800158489327401","n":"Parque Marino de Odaiba","cat":"parque","hood":"Minato","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-4-4 Daiba, Minato City, Tokyo 135-0091, Japón","lat":35.6300488,"lng":139.77569119999998,"aprox":false,"gcid":"9066800158489327401","cost":0,"dur":0,"sub":"-","typ":"Parque","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Parque Marino de Odaiba","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_12402117845945925953","n":"Kuromon Market","cat":"comida","hood":"Osaka","why":"Galería techada de unos 150 locales en Nipponbashi (Chuo-ku, Osaka), pegada a la estación Nippombashi: mitad pescaderías, más frutería, encurtidos y puestos de picoteo. Es el mercado más turístico de Osaka —la Wikipedia japonesa registra que en 2017 entre el 50% y el 80% de los visitantes eran extranjeros, y desde 2023 documenta la crítica local por precios inflados: 4 patas de cangrejo a 30.000 yenes, una brocheta de Kobe a 4.000— y los puntajes de Tabelog de los locales de adentro lo confirman: los que pude listar van de 3,00 a 3,37, ninguno notable. Para dos que van a compartir platos sirve como parada corta de una hora camino a Namba, no como destino de comida seria. En diciembre pesa un dato concreto: en la última semana del año pasan más de 150.000 personas por día comprando osechi, contra unos 18.000 de un día hábil normal.","addr":"2 Chome-21 Nipponbashi, Chuo Ward, Osaka, 542-0073, Japón","lat":34.665351099999995,"lng":135.5062417,"aprox":false,"gcid":"12402117845945925953","cost":0,"dur":1,"sub":"Mercado cubierto de picoteo","typ":"Mercado","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kuromon Market","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"Picoteo de puesto en puesto: ostras y vieiras a la parrilla, atún, brochetas de wagyu, fruta cortada de estación, oshizushi y encurtidos; también hay fugu, que el mercado empezó a ofrecer todo el año recién en 2016 —Shimonoseki como proveedor— empujado por la demanda de turistas asiáticos, no por tradición local. Se come parado al lado del puesto y nada se reserva. El único local que verifiqué entero es Menya 7.5Hz Kuromon Ichiba-ten (ramen, Tabelog 3,37, 1.000-1.999 yenes, 9 asientos de barra, sin reserva, acepta tarjeta y QR, cierra los jueves y el 2do y 4to miércoles). Para los puestos sueltos no verifiqué medio de pago: llevá efectivo por las dudas.","season":"Año nuevo (29/12 al 3/1): Parcialmente verificado. La última semana de diciembre es el pico anual: Osaka-info y la Wikipedia japonesa coinciden en más de 150.000 visitantes por día a fin de año (contra unos 18.000 de un día hábil normal), por las compras de osechi; ninguna de las dos publica fechas exactas, hablan de 年末 / \"end of the year\". Qué abre del 1 al 3 de enero NO lo pude verificar: el sitio oficial kuromon.com devuelve 403 a todo intento de lectura, y ni Osaka-info ni Time Out publican calendario de año nuevo, solo \"varía según cada local\".","conf":"media","warn":["La zona del catálogo es correcta: Nipponbashi 2-chome, Chuo-ku, ciudad de Osaka, prefectura de Osaka. La entrada sur del mercado da directo a la estación Nippombashi (Osaka Metro, líneas Sennichimae y Sakaisuji) y también sirve Kintetsu-Nipponbashi; la galería mide unos 580 m de largo, así que la salida norte queda a ~10 minutos de Dotonbori. No hay error de asignación acá.","Horario general del mercado: 9:00 a 18:00, con variación local por local (Jalan / Rurubu / JR Odekake; el sitio oficial kuromon.com devuelve HTTP 403 y no se pudo leer directo). Sirve para planificar la franja, no para dar por abierto un puesto puntual: las guías dicen textualmente que horarios y días de cierre varían según cada local.","Es un mercado diurno: los puestos de pescado y fruta cierran a la tarde, no a la noche. En Osaka a fin de diciembre oscurece cerca de las 17:00, así que esto va antes del almuerzo o a la salida del almuerzo, nunca como plan de cena.","En la última semana del año hay multitud real (150.000 personas por día). Si el itinerario pone Osaka en esas fechas, esta parada es de las primeras a sacar.","No tiene ficha propia en Tabelog: es un mercado, no un local. El campo va vacío a propósito. Los locales de adentro que pude listar van de 3,00 a 3,37 — para dos foodies con 25 días hay mejores usos de un almuerzo en Osaka.","Precios de turista documentados: la ja.wikipedia (citando a Shueisha Online, 2023) lista 4 patas de cangrejo a 30.000 yenes, 1 langostino a 3.500, 1 ostra cruda a 1.300 y 1 brocheta de carne de Kobe a 4.000. La propia asociación del mercado repartió volantes pidiendo «vender a precio justo». Preguntá el precio ANTES de que te lo cocinen."],"refs":["https://www.osaka-info.jp/en/spot/kuromon-market/","https://www.osaka-info.jp/spot/kuromon-market/","https://ja.wikipedia.org/wiki/%E9%BB%92%E9%96%80%E5%B8%82%E5%A0%B4","https://tabelog.com/en/rstLst/?sw=%E9%BB%92%E9%96%80%E5%B8%82%E5%A0%B4","https://tabelog.com/en/osaka/A2701/A270202/27132835/","https://www.timeout.com/osaka/things-to-do/kuromon-market"]},{"id":"u_g_16558556426972448087","n":"Tsūtenkaku","cat":"mirador","hood":"Osaka","why":"Torre de 1956 de 108 m en Shinsekai, el barrio retro de Osaka: el mirador cerrado está a ~87 m y la terraza exterior \"Tenbo Paradise\" a 94,5 m, ambos en el mismo ticket. La vista no compite con Umeda Sky Building ni con Abeno Harukas —está rodeada de edificios bajos y mira un barrio, no una panorámica— así que lo que se paga es la torre en sí, el Billiken y el ambiente Shōwa de abajo. Para dos foodies el valor real está a pie de calle: Shinsekai es la zona de kushikatsu de Osaka y caminarla no cuesta nada. Abre hasta las 21:45, o sea que la oscuridad de las 16:30 no molesta: de noche la torre iluminada y los carteles de neón del barrio son mejores que de día.","addr":"1 Chome-18-6 Ebisuhigashi, Naniwa Ward, Osaka, 556-0002, Japón","lat":34.6524992,"lng":135.5063058,"aprox":false,"gcid":"16558556426972448087","cost":1500,"dur":1,"sub":"Shinsekai","typ":"Torre","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tsūtenkaku","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"No es estacional ni de montaña, opera todo el invierno. Pero la terraza exterior (Tenbo Paradise) cierra sin aviso previo por lluvia, viento fuerte o niebla, y en diciembre-enero eso pasa: si el día está feo, se paga el ticket completo y se sube solo al mirador cerrado. El TOWER SLIDER además puede cerrar por temperatura baja o condensación.","conf":"alta","warn":["Se necesita reservar franja horaria de ingreso; la web oficial recomienda comprar online y avisa que a la tarde-noche las entradas se pueden agotar. No es un lugar al que se llega y se sube.","Sin reingreso y sin reembolso una vez comprada la entrada.","La home oficial tiene un aviso de 2026 sobre cambio de horarios y tarifas: los números de esta ficha son los que figuran hoy en 営業案内, reconfirmar cerca del viaje.","Shōgatsu SIN VERIFICAR: no encontré ningún aviso oficial de 年末年始. La torre probablemente abra, pero los kushikatsu de Shinsekai —que son el motivo real para ir— suelen cerrar entre el 1 y el 3 de enero. Si el día cae ahí, chequear los locales antes de cruzar la ciudad.","Terraza exterior sujeta a clima: puede estar cerrada sin aviso.","TOWER SLIDER con restricciones duras: prohibido a menores de 7 y a partir de 66 años, bajo 120 cm, 120 kg o más, embarazadas y problemas cardíacos o de movilidad.","Si el objetivo es una vista panorámica de Osaka y no el barrio, Umeda Sky Building (¥2.000, hasta 22:30) o Abeno Harukas dan mucho más altura. Tsutenkaku se disfruta más desde abajo que desde arriba, y desde abajo es gratis."],"refs":["https://www.tsutenkaku.co.jp/annai/index.html","https://www.tsutenkaku.co.jp/tour/tenbo-paradise.html","https://www.tsutenkaku.co.jp/tour/tower-slider.html","https://www.tsutenkaku.co.jp/","https://www.tsutenkaku.co.jp/news/","https://www.tsutenkaku.co.jp/other/index.html"]},{"id":"u_g_535807412135534887","n":"Abeno Harukas","cat":"mirador","hood":"Osaka","why":"Mirador en los pisos 58-60 de la torre de 300 m que corona la estación de Tennōji, en el sur de Osaka: galería de vidrio con vista de 360° en el 60, tienda en el 59 y terraza de madera al aire libre con café en el 58. El ascensor sube del piso 16 al 60 en 50 segundos. Fue el rascacielos más alto de Japón hasta que lo pasó la Mori JP Tower de Azabudai Hills en 2023, y sigue siendo el punto más alto de Osaka, sin torres vecinas que tapen: con día claro se ven Kioto, Kobe y los montes Rokko. En diciembre-enero el horario 9:00-22:00 juega a favor: como oscurece cerca de las 16:50, se puede entrar tipo 16:00 y ver día, atardecer y ciudad iluminada en la misma visita, sin gastar luz diurna que en esta época es escasa. Contra: ¥2.200 por cabeza en ventanilla (¥1.980 comprando anticipado en la web oficial hasta el día anterior), sin reembolso y sin reingreso con la entrada estándar, así que es una parada de una hora y solo vale si el día está despejado.","addr":"1 Chome-1-43 Abenosuji, Abeno Ward, Osaka, 545-6016, Japón","lat":34.6460706,"lng":135.5134771,"aprox":false,"gcid":"535807412135534887","cost":2200,"dur":1,"sub":"Tennōji / Abeno","typ":"Torre","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Abeno Harukas","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abre. La página oficial declara operación todo el año y el observatorio funciona del 29/12 al 3/1 (los grandes almacenes del mismo edificio sí cierran el 1/1; el observatorio no). El 1/1 hay 'operativo especial de primer amanecer', que es anual: en 2026 fue 6:00-8:30 con entrada anticipada obligatoria puesta a la venta el 2/12/2025 en la web oficial, y la operación normal arrancó a las 8:30 en vez de las 9:00. La edición del 1/1/2027 todavía no está anunciada (verificado en septiembre 2026): mirar la web oficial a fines de noviembre, y si les interesa el hatsuhinode comprar el mismo día que abra la venta — se agota.","conf":"alta","warn":["Anochece cerca de las 16:50 en Osaka a fin de diciembre: entrar tipo 16:00 para agarrar día + atardecer + ciudad encendida en la misma entrada.","Sin reingreso con la entrada estándar y ticket no reembolsable: si el día está nublado o con neblina, no vale la plata — mirar el cielo antes de subir.","Comprá la entrada anticipada en la web oficial: ¥1.980 por adulto (10% menos que en ventanilla) hasta el día anterior, y se entra con QR. Si van sin comprar, la venta del mismo día es únicamente en el mostrador del piso 16 (no en el 58), por orden de llegada, y en horas pico dan número. Ninguna entrada se reembolsa.","La iluminación 'Tenkū no Illumination' 2025 corrió del 31/10/2025 al 28/02/2026; la edición 2026-2027 todavía no está anunciada (verificado en septiembre 2026). No cuenten con ella hasta que salga el aviso.","El 1 de enero el horario es distinto por el operativo de primer amanecer: la edición 2027 no está anunciada todavía, chequear la web oficial a fines de noviembre.","Zona correcta: está en Abeno-ku, ciudad de Osaka, sobre la estación de Tennōji. No hay error de prefectura."],"refs":["https://www.abenoharukas-300.jp/en/observatory/","https://www.abenoharukas-300.jp/en/observatory/ticket.html","https://www.abenoharukas-300.jp/observatory/","https://www.abenoharukas-300.jp/news/","https://www.abenoharukas-300.jp/en/observatory/guide.html"]},{"id":"u_g_16601440635060896041","n":"Ginkakujicho","cat":"barrio","hood":"Kioto","why":"\"Ginkakujicho\" no es un barrio para recorrer: es el chō (manzana) donde está el Ginkaku-ji, el Pabellón de Plata, y el pin de Google cae prácticamente sobre el templo. Lo que hay alrededor son unos 200 m de calle de acceso con tiendas y puestos entre la parada de bus y la puerta, y el arranque norte del Camino del Filósofo, que baja 1,5-2 km por el canal hasta la zona de Nanzen-ji. El templo sí vale: jardín seco con el cono de arena, el jardín de musgo y un circuito que termina con vista alta sobre Kioto; el recorrido en sí son 30-45 minutos, y con la caminata al sur, media mañana entera. En diciembre-enero cierra 16:30 y el canal está pelado (sin cerezos ni hojas), así que es una salida de mañana o primera tarde, no de las 15:00.","addr":"Sakyō-ku, Kioto, Prefectura de Kioto 606-8402, Japón","lat":35.0273003,"lng":135.7968383,"aprox":false,"gcid":"16601440635060896041","cost":1000,"dur":1.5,"sub":"Higashiyama norte — el chō del Ginkaku-ji","typ":"Barrio","book":"","free":"","closed":"","main":true,"costN":"⚠ categoría por confirmar: Es el barrio del Ginkaku-ji (arranque del Camino del Filósofo); podría estar duplicando el pin del templo, que iría como arq","src":"lista","gname":"Ginkakujicho","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Opera todo el año, sin cierre invernal. No es montaña. Lo único estacional es el paisaje: el Camino del Filósofo en diciembre-enero es un canal sin follaje. · Año nuevo (29/12 al 3/1): Abierto: el Ginkaku-ji no tiene días de cierre y opera también del 29/12 al 3/1 con el horario de invierno 9:00-16:30. No es destino clásico de hatsumōde (la multitud de Año Nuevo va a Yasaka, Fushimi Inari, Heian), pero del 1 al 3 de enero se llena igual y se desbordan la calle de acceso y las paradas de bus; del 29 al 31 de diciembre está tranquilo. Los comercios de la calle de acceso sí pueden cerrar 1-3 de enero: eso no lo verifiqué.","conf":"alta","warn":["El nombre engaña: no es un barrio caminable como Gion o Pontochō. Ginkakujicho es la manzana del Ginkaku-ji; si en el itinerario aparece como 'barrio' aparte del templo, es el mismo punto duplicado.","La entrada subió el 1/4/2026: ¥1.000 adultos (antes ¥500) y ¥500 escolares. Verificado en el aviso oficial del Shōkoku-ji publicado el 18/1/2026. Cualquier guía que diga ¥500 está vieja.","Horario de invierno 9:00-16:30 (1 dic a fin de feb) y en Kioto el sol se pone cerca de las 16:50: se cierra prácticamente con la última luz, no queda margen para meterlo al final del día. Última entrada práctica, media tarde.","La zona está bien rotulada: Sakyō-ku, ciudad de Kioto, prefectura de Kioto. Está a ~5 km del centro (Kawaramachi), se llega en bus (paradas 銀閣寺前 / 銀閣寺道) y son 6-10 minutos a pie desde ahí. No hay estación de tren cerca.","El interior del Pabellón de Plata (Kannon-den) no se visita: se ve desde el jardín."],"refs":["https://www.shokoku-ji.jp/ginkakuji/","https://www.shokoku-ji.jp/ginkakuji/news/%e3%80%90%e9%87%8d%e8%a6%81%e3%80%91%e3%80%80%e5%8f%82%e6%8b%9d%e5%bf%97%e7%b4%8d%e6%96%99%e6%94%b9%e5%ae%9a%e3%81%ae%e3%81%8a%e7%9f%a5%e3%82%89%e3%81%9b2026%e5%b9%b44%e6%9c%881%e6%97%a5%e3%82%88/","https://www.japan-guide.com/e/e3907.html","https://www.japan-guide.com/e/e3906.html","https://ja.wikipedia.org/wiki/%E9%8A%80%E9%96%A3%E5%AF%BA","https://ja.wikipedia.org/wiki/%E5%93%B2%E5%AD%A6%E3%81%AE%E9%81%93"]},{"id":"u_g_1073025677330113631","n":"Pabellon Dorado","cat":"arq","hood":"Kioto","why":"Kinkaku-ji (Rokuon-ji), el pabellón cubierto en pan de oro sobre el estanque Kyōko-chi, en el noroeste de Kioto. El recorrido es un circuito de sentido único de 40-50 minutos: se mira desde afuera, no se entra al pabellón. Vale por lo que es —con sol de invierno y el estanque quieto el reflejo es el motivo por el que va todo el mundo—, pero no da para más que una parada corta; el día se arma encadenándolo con Ryōan-ji y Ninna-ji, que quedan sobre la misma línea de bus (la 59). Abre 9:00-17:00 todo el año, sin día de descanso, así que entra sin problema en Shōgatsu. Conviene ir temprano: en diciembre-enero el sol se pone entre las 16:45 y las 17:00, no hay iluminación nocturna, y las 9:00 en punto es la única ventana con poca gente.","addr":"1 Kinkakujicho, Kita Ward, Kyoto, 603-8361, Japón","lat":35.03937,"lng":135.7292431,"aprox":false,"gcid":"1073025677330113631","cost":500,"dur":1,"sub":"Templo","typ":"Templo","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Pabellon Dorado","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abre. El sitio oficial declara 年中無休 (sin días de cierre en todo el año) con horario 9:00-17:00, así que opera del 29/12 al 3/1. No es un destino clásico de hatsumōde —para eso la gente va a Fushimi Inari o Yasaka—, pero el 1 al 3 de enero Kioto está lleno igual y esto es de lo poco grande que no cierra: esperá cola en la boletería y el circuito a paso de manada.","conf":"alta","warn":["La zona está bien asignada: es Kioto ciudad, Kita-ku, a unos 20-30 min en bus desde la estación de Kioto. No hay estación de metro ni tren cerca: se llega en bus (líneas 12, 59, 205, M1, parada Kinkakuji-michi) o taxi, y esos buses van llenos.","Cierra a las 17:00 y en diciembre-enero el sol se pone entre las 16:45 y las 17:00: entrando pasadas las 16:00 el circuito queda con luz muy baja. Ir a la mañana, idealmente a las 9:00 en punto, que es además la única ventana con poca gente.","Sin iluminación nocturna: no sirve como plan de tarde-noche.","Es una parada de 40-50 minutos, no un destino de medio día por sí sola. Encadenala con Ryōan-ji y Ninna-ji (los tres sobre la línea 59 de bus) o queda un hueco grande en el día.","No verifiqué si la boletería toma tarjeta. Llevá efectivo para los 500 yenes por las dudas."],"refs":["https://www.shokoku-ji.jp/kinkakuji/access/","https://www.shokoku-ji.jp/en/kinkakuji/access/","https://www.shokoku-ji.jp/kinkakuji/","https://www.shokoku-ji.jp/en/kinkakuji/","https://www.shokoku-ji.jp/kinkakuji/faq/"]},{"id":"u_g_18131488233213033693","n":"Bosque de Bambú de Arashiyama","cat":"parque","hood":"Kioto","why":"Es un sendero público de unos 400 metros entre el santuario Nonomiya y la puerta norte de Tenryū-ji, en Saga-Arashiyama (Ukyo-ku, Kioto): no tiene puerta, ni boletería, ni horario publicado — se camina y listo, 15 a 20 minutos de punta a punta. El bambú es perenne, así que en diciembre y enero se ve igual que en abril, y encima hay menos gente que en la temporada de arces; el problema no es la estación sino la hora: de media mañana a media tarde es una fila de gente caminando en fila india, y sacar una foto sin nadie adentro es ilusión. Necesita luz de día y no está iluminado de noche —la iluminación de diciembre de la zona, el Hanatouro, se discontinuó en 2021—, así que después de la puesta del sol (cerca de las 16:50 a fines de diciembre en Kioto) deja de tener sentido. No alcanza para armarle un día: lo que justifica el día es Arashiyama entera — Tenryū-ji, el río Katsura, Ōkōchi Sansō, la comida del barrio — y el bambú es un tramo de veinte minutos adentro de eso.","addr":"Sagaogurayama Tabuchiyamacho, Ukyo Ward, Kyoto, 616-8394, Japón","lat":35.0168187,"lng":135.67130129999998,"aprox":false,"gcid":"18131488233213033693","cost":0,"dur":0.5,"sub":"Saga-Arashiyama, Ukyo-ku, Kioto","typ":"Bosque","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Bosque de Bambú de Arashiyama","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"No es ruta de montaña ni instalación estacional: es un sendero urbano llano, sin cierre invernal. El bambú es perenne, diciembre-enero no cambia lo que se ve. Ojo con lo que sí es estacional en la MISMA zona: el tren panorámico Sagano (Romantic Train) corre en 2026 del 1 de marzo al 29 de diciembre y ahí para — ese día se retiran los coches actuales y los nuevos entran recién en primavera de 2027. O sea: sirve como plan hasta el 29/12 inclusive, y del 30/12 en adelante no existe. · Año nuevo (29/12 al 3/1): sin verificar. El sendero no tiene puerta ni horario publicado, con lo cual lo esperable es que se pueda caminar los 365 días, pero no lo confirmé en fuente oficial. Lo que sí verifiqué del vecino inmediato: Tenryū-ji abre 8:30-17:00 (última entrada 16:50) y sus edificios (Daihōjō, Shoin, Tahōden) están cerrados el 2 de enero de 2027; su página no aclara cierre de fin de año para el jardín. El santuario Nonomiya, en la boca sur del sendero, tiene recinto de acceso libre y gratuito (la oficina de amuletos, 9:00-17:00) y es punto de hatsumōde: entre el 1 y el 3 de enero esperar la zona mucho más cargada, no más vacía.","conf":"media","warn":["Hora del día, no día del año: entre las 10 y las 15 el sendero va lleno. Si van, va primera hora de la mañana; es lo único que cambia la experiencia.","Necesita luz natural y no tiene iluminación permanente. En Kioto a fines de diciembre el sol se pone cerca de las 16:50: después de eso el sendero está a oscuras.","No hay iluminación nocturna en Arashiyama en diciembre. El Kyoto Arashiyama Hanatouro, la iluminación de diciembre de esta zona, se discontinuó: la edición de diciembre de 2021 fue la última de sus 17 años. No existe desde entonces y no vuelve en 2026.","Tenryū-ji, pegado al extremo norte del sendero, se paga aparte: jardín 500 yenes por persona, +300 por los edificios (Daihōjō, Shoin, Tahōden; cierran 16:45, última entrada 16:30), +500 por el Unryūzu — pero el Unryūzu abre solo sábados, domingos y feriados fuera de las temporadas especiales de primavera y otoño, de 9:00 a 16:30. El jardín cierra a las 17:00 (última entrada 16:50). Verificado en su sitio oficial.","El sendero en sí no tiene horario ni tarifa publicados por ninguna fuente oficial que haya podido leer. El 0 de costo es 'no hay boletería', no 'lo leí en una tarifa'."],"refs":["https://ja.kyoto.travel/area/area09.php","https://www.tenryuji.com/visit/","https://www.tenryuji.com/","https://www.sagano-kanko.co.jp/en/train-info"]},{"id":"u_g_2705196751698570185","n":"Ginkaku-ji","cat":"arq","hood":"Kioto","why":"Templo zen de 1482 (el \"Pabellón de Plata\" que nunca se recubrió de plata), con dos edificios originales del siglo XV y un jardín de arena rastrillada más un sendero de musgo que sube a un mirador sobre Kioto. Es visita de una hora en circuito de sentido único: se ve, no se entra a los pabellones. En invierno abre 9:00-16:30 y en diciembre-enero el sol se pone poco antes de las 17:00, así que conviene ir de mañana o a primera hora de la tarde; el sendero del mirador es tierra y escalones, con lluvia o escarcha resbala. Ojo con el precio: desde el 1 de abril de 2026 la entrada pasó de 500 a 1.000 yenes por adulto, el doble de lo que dice cualquier guía vieja. Vale por el conjunto edificio+jardín y porque queda en el arranque del Camino del Filósofo, que se hace a pie hasta Nanzen-ji: como parada suelta rinde menos que encadenada a esa caminata.","addr":"2 Ginkakujicho, Sakyo Ward, Kyoto, 606-8402, Japón","lat":35.0270213,"lng":135.7982058,"aprox":false,"gcid":"2705196751698570185","cost":1000,"dur":1,"sub":"Templo zen (Rinzai, rama Shōkoku-ji) con jardín seco y de musgo","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Ginkaku-ji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abre normal. La web oficial declara 年中無休 (sin días de cierre en todo el año) y no publica excepción de fin de año ni de shōgatsu; el horario del 29/12 al 3/1 es el de invierno, 9:00-16:30. Es templo zen, no santuario, así que no recibe la avalancha de hatsumōde de Fushimi Inari o Yasaka, pero el este de Kioto entero está cargado en esos días.","conf":"alta","warn":["Entrada 1.000 yenes por adulto desde el 1/4/2026 (antes 500). Escolares 500, preescolar gratis, personas con discapacidad 100. Cualquier guía o blog que diga 500 está desactualizado.","Cierra 16:30 en diciembre y enero, y con el sol poniéndose cerca de las 16:50 la última media hora ya es luz baja: el jardín y el mirador se disfrutan mucho mejor antes de las 15:00.","Se llega en bus (líneas 5, 7, 32, 102, 105, 203, 204, EX100, paradas Ginkakuji-michi o Ginkakuji-mae) y después hay unos 5-10 minutos a pie cuesta arriba por una calle de tiendas. No hay estación de tren al lado.","El recorrido es circuito de sentido único con escalones de tierra hasta el mirador: con nieve, escarcha o lluvia resbala.","No se entra a los pabellones, se ven desde afuera. Si esperan interiores, no es esto."],"refs":["https://www.shokoku-ji.jp/ginkakuji/","https://www.shokoku-ji.jp/ginkakuji/access/","https://www.shokoku-ji.jp/ginkakuji/news/"]},{"id":"u_g_2090262746651448459","n":"Kifune Shrine","cat":"arq","hood":"Kioto","why":"Santuario del agua en Kibune, al fondo del valle al norte de Kioto: la foto conocida es la escalinata de piedra con los farolillos rojos a los costados, y con nieve es cuando mejor se ve. Se recorre en tres partes (honmiya, el yui-no-yashiro de los vínculos y el okumiya, unos 700 m de subida en total), es gratis y en diciembre está muy vacío comparado con el otoño. La contra es logística: está a 18 km del centro, 1 h 15 a 1 h 30 puerta a puerta desde la estación de Kioto con Eizan Railway más bus (unos 50 min si salen de Demachiyanagi), así que no es una parada que se encaje entre otras cosas — es medio día. Y la luz se va temprano: el sol se pone cerca de las 16:50, pero el valle es angosto y a las 16:30 ya está en sombra. Hay que salir a la mañana.","addr":"180 Kuramakibunecho, Sakyo Ward, Kyoto, 601-1112, Japón","lat":35.122090899999996,"lng":135.7629101,"aprox":false,"gcid":"2090262746651448459","cost":0,"dur":2.5,"sub":"Santuario","typ":"Santuario","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Kifune Shrine","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Opera en diciembre y enero: no es teleférico ni ruta alpina, es un santuario de valle con tren y bus que funcionan todo el año. Lo que sí cambia es el piso: la escalinata y el sendero al okumiya son de piedra y pueden estar con nieve o hielo, y el paso de montaña Kurama→Kibune (2 km) no lo pude verificar para invierno. Calzado con agarre. · Año nuevo (29/12 al 3/1): Abre y además es de los lugares que se activan: 31/12 a las 16:00 大祓式・除夜祭, 1/1 a las 8:00 歳旦祭, y horario extendido hasta las 20:00 los días 1, 2 y 3 (todo del calendario oficial). O sea, funciona al revés que los museos: del 29/12 al 3/1 está abierto pero con gentío de hatsumōde y transporte saturado en un valle que tiene un solo camino de entrada.","conf":"media","warn":["Zona bien asignada pero engañosa: Kibune ES ciudad de Kioto (Sakyo-ku, prefectura de Kioto), no otra prefectura, pero está 18 km al norte del centro — unos 40 min en auto y 1 h 15 a 1 h 30 en transporte desde la estación de Kioto. No es una parada urbana, es una excursión de medio día.","Horario de invierno: 6:00–18:00 (1/12–30/4). Con el sol poniéndose cerca de las 16:50 y el valle en sombra antes, el cierre a las 18:00 no es la restricción real: la luz sí. Ir de mañana.","El sol se pone cerca de las 16:50, pero el valle es angosto y a las 16:30 ya está en sombra: la escalinata y el camino al okumiya no tienen iluminación permanente fuera de eventos.","Acceso: Eizan Railway desde Demachiyanagi hasta Kibuneguchi (470 yenes adulto), y desde ahí bus 33 de Kyoto Bus unos minutos o 25–30 min a pie cuesta arriba. La frecuencia del 33 se refuerza en temporada alta; en invierno hay que mirar el horario del día o contar con caminar.","Del 29/12 al 3/1 hay hatsumōde: mucha gente en un valle con una sola vía de acceso. Si van esos días, temprano y con margen de espera para el bus.","El santuario no tiene iluminación programada en diciembre. Su iluminación de invierno es el 積雪日限定ライトアップ (solo días con nieve, solo fines de semana): en 2026 corrió del 17/1 al 28/2, del atardecer a las 20:30, y el sí/no se anuncia el mismo día a las 15:00 por sus redes. Cae después del viaje. Las otras iluminaciones publicadas son la de Tanabata (1/7–15/8) y la de otoño (7–24/11).","El kawadoko (comer sobre el río) de los restaurantes de Kibune es solo de verano. En invierno la oferta gastronómica del valle se achica mucho y varios lugares van solo con reserva: no verificado, pero no vayan asumiendo que almuerzan ahí sin chequear antes."],"refs":["https://kifunejinja.jp/","https://kifunejinja.jp/info/","https://kifunejinja.jp/access/","https://kifunejinja.jp/event/","https://kifunejinja.jp/news/","https://kifunejinja.jp/en/","https://kifunejinja.jp/en/news/1567/","https://souda-kyoto.jp/","https://eizandensha.co.jp/en/","https://www.kyotobus.jp/"]},{"id":"u_g_2739803857702320934","n":"Hakone","cat":"barrio","hood":"Prefectura de Kanagawa","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Distrito de Ashigarashimo, Prefectura de Kanagawa, Japón","lat":35.233769099999996,"lng":139.1088454,"aprox":false,"gcid":"2739803857702320934","cost":0,"dur":0,"sub":"-","typ":"Barrio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Hakone","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Hakone","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_6269138749601293570","n":"Kamakura","cat":"barrio","hood":"Prefectura de Kanagawa","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Prefectura de Kanagawa, Japón","lat":35.319212799999995,"lng":139.5466731,"aprox":false,"gcid":"6269138749601293570","cost":0,"dur":0,"sub":"-","typ":"Barrio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kamakura","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kamakura","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17896363678445115723","n":"Byōdō-ji (Inaba-dō) Temple","cat":"arq","hood":"Kioto","why":"Templo de barrio en pleno centro de Kioto (Shimogyo, a 5 minutos a pie al sur de la estación Gojo del subte Karasuma y 5 minutos al norte de Hankyu Karasuma), fundado en 1003 por Tachibana no Yukihira. Su honzon es un Yakushi Nyorai de pie de época Heian, Bien Cultural Importante y contado entre los «tres grandes Nyorai de Japón» — pero es hibutsu: normalmente no se exhibe, así que lo que se ve es el hondō, no la imagen. Es un recinto chico, sin jardín ni nada que justifique un desvío: entrás, mirás el hondō, salís en quince minutos. Su gracia real es el mercado de artesanos del día 8 de cada mes (9:00-16:00, llueva o no) y las dos fechas de ese mercado caen justo afuera del viaje: el 8 de diciembre de 2026 es antes de que lleguen y el 8 de enero de 2027 —el 初薬師, el primero del año— es un día después de que se vayan. Sirve como parada de dos minutos si están caminando por Karasuma rumbo a otra cosa, no como plan.","addr":"Japón, 〒600-8415 Kyoto, Shimogyo Ward, Inabadocho, 728","lat":34.9994955,"lng":135.7603019,"aprox":false,"gcid":"17896363678445115723","cost":0,"dur":0.3,"sub":"Templo de barrio, parada de paso","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Byōdō-ji (Inaba-dō) Temple","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kioto","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abierto. El calendario oficial marca el 31 de diciembre como día de preparativos \"sin cerrar a los visitantes\" y el 1 de enero a las 00:00 el 元朝護摩 (Genchō Goma), ritual de fuego de medianoche. El 8 de enero es el 初薬師, el primer mercado del año, pero cae un día después de que Juan y Thais se vayan. La página no publica horarios especiales de año nuevo distintos del 6:00-17:00 habitual.","conf":"alta","warn":["La zona está bien: Shimogyo-ku es Kioto centro de verdad, a 5 min a pie de la estación Gojo (línea Karasuma) y 5 min de Hankyu Karasuma. No hay error de prefectura acá.","El Yakushi Nyorai es hibutsu: normalmente NO se exhibe (通常非公開, Kyoto City Official Travel Guide). Si van por la imagen, no la van a ver: se visita el hondō.","El mercado del día 8 —lo único que lo vuelve un destino— no cae dentro del viaje: el de diciembre es el 8/12/2026 (antes de llegar) y el siguiente el 8/1/2027 (un día después de irse).","Cierra a las 17:00 y en Kioto el sol se pone cerca de las 16:50 en esas fechas: si van, tiene que ser de día. Un templo chico sin iluminación a las 16:45 no es nada.","Está prohibido comer, beber y fumar dentro del recinto (regla del propio templo).","El templo avisa en su sitio que los amuletos que se venden online son falsificaciones sin relación con ellos: solo se compran en persona."],"refs":["https://inabado.jp/","https://inabado.jp/en/","https://inabado.jp/visit/","https://inabado.jp/event/","https://inabado.jp/market/","https://ja.wikipedia.org/wiki/因幡堂","https://ja.kyoto.travel/tourism/single01.php?tourism_id=443","https://kyoto-design.jp/spot/1437"]},{"id":"u_g_10706320581550947699","n":"Yokohama Red Brick Warehouse","cat":"arq","hood":"Yokohama","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-1-1 Shinko, Naka Ward, Yokohama, Kanagawa 231-0001, Japón","lat":35.452632099999995,"lng":139.6428944,"aprox":false,"gcid":"10706320581550947699","cost":0,"dur":0,"sub":"-","typ":"Edificio histórico","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Yokohama Red Brick Warehouse","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Yokohama","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_6335264300188806609","n":"Hase-dera","cat":"arq","hood":"Kamakura","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"3 Chome-11-2 Hase, Kamakura, Kanagawa 248-0016, Japón","lat":35.3124791,"lng":139.5331106,"aprox":false,"gcid":"6335264300188806609","cost":0,"dur":0,"sub":"-","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Hase-dera","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kamakura","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_2216777826481991500","n":"Templo Kotoku-in","cat":"arq","hood":"Kamakura","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"4 Chome-2-28 Hase, Kamakura, Kanagawa 248-0016, Japón","lat":35.3168228,"lng":139.5356758,"aprox":false,"gcid":"2216777826481991500","cost":0,"dur":0,"sub":"-","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Templo Kotoku-in","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Kamakura","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_13390302821165147767","n":"Castillo de Nagoya","cat":"arq","hood":"Nagoya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1-1 Honmaru, Naka Ward, Nagoya, Aichi 460-0031, Japón","lat":35.184750099999995,"lng":136.89968829999998,"aprox":false,"gcid":"13390302821165147767","cost":0,"dur":0,"sub":"-","typ":"Castillo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Castillo de Nagoya","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nagoya","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_3068678493933843282","n":"Nagoya","cat":"barrio","hood":"Prefectura de Aichi","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Prefectura de Aichi, Japón","lat":35.1820124,"lng":136.9054486,"aprox":false,"gcid":"3068678493933843282","cost":0,"dur":0,"sub":"-","typ":"Ciudad","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: no encaja en ninguna categoría. Es la ciudad entera, no un punto concreto; lo meto en barrio por ser una zona, pero no encaja del todo en ninguna categoría.","src":"lista","gname":"Nagoya","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nagoya","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_3897385516668359307","n":"Parque Ghibli","cat":"evento","hood":"Nagakute","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Ibaragabasama, Nagakute, Aichi 480-1342, Japón","lat":35.1750366,"lng":137.0887701,"aprox":false,"gcid":"3897385516668359307","cost":0,"dur":0,"sub":"-","typ":"Parque temático","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Ghibli Park mezcla pabellones de exhibición con parque al aire libre. Prioricé la exhibición, pero podría ir como parque.","src":"lista","gname":"Parque Ghibli","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nagoya","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_695644022830879363","n":"Tenjinbashi-suji Shopping Street 3 Chome, Tensan ( for Minamimorimachi )","cat":"tienda","hood":"Osaka","why":"No es un negocio: el pin cae en Tenjinbashi 3-5-15, que es la sede de la asociación de comerciantes del tramo 3-chome (天神橋三丁目商店街振興組合). O sea, \"el lugar\" es un pedazo del Tenjinbashi-suji, la galería comercial techada más larga de Japón: 2,6 km de norte a sur según su propio sitio oficial, dividida en tramos de 1-chome a 6-chome. El 3 es uno de los tres tramos del sur —los que se acceden desde la estación Minami-morimachi (Metro Tanimachi/Sakaisuji) y JR Osaka-Tenmangu—, aunque el extremo sur propiamente dicho es 1-chome: saliendo por la salida 4 de Minami-morimachi se cae sobre la galería a la altura de 2-chome, junto al Osaka Tenmangu, y 3-chome empieza unas cuadras más al norte. Su directorio oficial lista unos 170 comercios (12 páginas de fichas) mezclando gastronomía (ramen, yakiniku, izakaya de cocina regional, cafés, mala tang, wagashi) con peluquerías, kinesiólogos y casas de altares budistas: es una calle de barrio real, no una peatonal turística. Para dos foodies con 25 días vale como base de picoteo —se camina y se come de local en local, techado, lo cual en pleno invierno y con el sol poniéndose cerca de las 16:50 es una ventaja concreta— pero no como \"atracción\" a la que se le dedica una visita: se cruza yendo al Osaka Tenmangu, que está a unos 400 m al sur del pin.","addr":"3 Chome-5-15 Tenjinbashi, Kita Ward, Osaka, 530-0041, Japón","lat":34.700877999999996,"lng":135.5116262,"aprox":false,"gcid":"695644022830879363","cost":0,"dur":1.5,"sub":"Galería comercial techada (tramo sur del Tenjinbashi-suji)","typ":"Calle comercial","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tenjinbashi-suji Shopping Street 3 Chome, Tensan ( for Minamimorimachi )","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"No es un local, es una galería con decenas de locales; hay que elegir uno adentro. El directorio oficial de 3-chome lista, entre otros, 醤ちゃんラーメン (ramen), 焼肉レトロ (yakiniku), 魂風土 (izakaya de cocina regional japonesa) y ONDO, que son dos locales distintos del directorio, 食堂うらろじ, みやび亭 y Cotti Coffee. NO verifiqué puntaje Tabelog ni horarios de ninguno de ellos: antes de mandar a alguien hay que fichar el local puntual, no la calle. Como zona de comida, el nervio del Tenjinbashi-suji está más al norte (tramos 4 a 6, la zona de izakayas de Tenma); 3-chome es el tramo más de servicios del barrio.","season":"Techada: funciona con lluvia y frío, y sigue transitable después del anochecer (el sol se pone cerca de las 16:50 en diciembre en Osaka). No es estacional. · Año nuevo (29/12 al 3/1): Sin verificar para los comercios: la asociación no publica calendario de 年末年始 en su sitio oficial, y en una galería cada negocio decide por su cuenta (lo habitual en Japón es cerrar del 1 al 3 de enero, con excepciones). Lo que sí está verificado es el imán de al lado: el Osaka Tenmangu celebra el 歳旦祭 el 1 de enero y es uno de los hatsumōde grandes de Osaka, y la salida 4 de Minami-morimachi desemboca directo sobre esta galería. Traducción práctica: del 1 al 3 esta cuadra va a estar llena de gente yendo al santuario, con parte de los locales cerrados. No es día para venir a comer tranquilo.","conf":"alta","warn":["El pin NO es un comercio: es la oficina de la asociación del tramo 3-chome. Si se agenda como 'lugar' se llega a una puerta administrativa. Lo que se visita es la galería.","La zona está bien asignada: Tenjinbashi 3-chome, Kita-ku, ciudad de Osaka, a 400 m del Osaka Tenmangu. No hay error de prefectura.","Probable duplicado en el catálogo: es casi seguro que la lista de Thais tenga también pines de otros tramos (1, 2, 4, 5, 6-chome) del MISMO Tenjinbashi-suji. Conviene fusionarlos en una entrada sola o el mapa va a mostrar cinco veces la misma calle.","Del 1 al 3 de enero, gentío de hatsumōde del Osaka Tenmangu pasando por acá y cierres parciales de comercios sin calendario publicado.","No leí horarios de ningún local individual: los campos de horario quedan vacíos a propósito."],"refs":["https://www.tenjin123.com/access/","https://www.tenjin123.com/history/","https://tenjin3.com/","https://tenjin3.com/shops/","https://osakatemmangu.or.jp/access/","https://osakatemmangu.or.jp/about/"]},{"id":"u_g_12102612551678828418","n":"Sumiyoshi Taisha","cat":"arq","hood":"Osaka","why":"Cabecera de unos 2.300 santuarios Sumiyoshi de todo Japón, y el argumento para ir es arquitectónico: los cuatro honden son Tesoro Nacional y están construidos en sumiyoshi-zukuri, un estilo anterior a la llegada del budismo que no se parece a nada de lo que van a ver en Kioto o Nara. Eso, más el Sorihashi (el puente arqueado rojo, casi una escalera), lo hace una parada de una hora y media que se combina bien con Tennoji o Shinsekai tomando el tranvía Hankai. La contra es la fecha: el propio santuario dice que recibe más de dos millones de personas a comienzo de año, así que del 1 al 3 de enero se ve gente, no arquitectura. La puerta perimetral cierra a las 16:00 todo el año y en invierno abre recién a las 6:30, o sea que es plan de mañana o primera hora de la tarde, no de después del almuerzo largo.","addr":"2 Chome-9-89 Sumiyoshi, Sumiyoshi Ward, Osaka, 558-0045, Japón","lat":34.6123945,"lng":135.4937612,"aprox":false,"gcid":"12102612551678828418","cost":0,"dur":1.5,"sub":"Santuario shintoísta","typ":"Santuario","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Sumiyoshi Taisha","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Abierto, y es de los lugares que se llenan en vez de cerrar: el propio santuario declara más de 2 millones de visitantes a comienzo de año. Calendario oficial verificado: 31/12 a las 16:00 Shiwasu no Ōharae seguido del Joya-sai; 1/1 a las 5:00 Wakamizu no gi y a las 6:00 Saitansai; 3/1 a las 8:00 Genshisai; después 4/1 a las 13:00 Tōka Shinji y 7/1 a las 11:00 Aouma Shinji. Lo que NO está verificado es el horario de puertas durante esos días: el sitio oficial dice que difiere del habitual y pide llamar, y a septiembre de 2026 no había publicado el aviso de la edición 2026-27.","conf":"alta","warn":["Del 1 al 3 de enero es el peor momento del año para ir: más de 2 millones de personas en hatsumōde según el propio santuario. Si el objetivo es ver la arquitectura, conviene meterlo antes del 29/12 o después del 4/1. Si en cambio quieren VER un hatsumōde, este es de los grandes de Kansai, pero asumiendo colas largas y nada de fotos tranquilas.","El horario de puertas del período de Año Nuevo es distinto al normal y el sitio oficial no lo publica: pide llamar al 06-6672-0753. Al 9/9/2026 no había aviso de la edición 2026-27. Revisar sumiyoshitaisha.net/news/ en diciembre antes de fijar el día.","La puerta perimetral cierra a las 16:00 todo el año y en invierno abre recién a las 6:30 (octubre a marzo). Es visita de luz de día y hay que llegar bastante antes de las 16:00.","No está en el centro de Osaka sino en Sumiyoshi-ku, al sur. Acceso verificado en el sitio oficial: Nankai Main Line hasta Sumiyoshitaisha, 3 min a pie al este; Nankai Koya Line hasta Sumiyoshi-Higashi, 5 min al oeste; o el tranvía Hankai hasta Sumiyoshi-Toriimae, que baja en la puerta. Sumar el viaje desde Namba o Tennoji a la hora y media de visita.","Fecha bien asignada: la dirección oficial es Osaka-shi, Sumiyoshi-ku, prefectura de Osaka. El rótulo Osaka/Osaka es correcto, no hay que corregir zona."],"refs":["https://www.sumiyoshitaisha.net/access/","https://www.sumiyoshitaisha.net/about/architect.html","https://www.sumiyoshitaisha.net/events/annualevents/01.html","https://www.sumiyoshitaisha.net/events/annualevents/12.html","https://www.sumiyoshitaisha.net/","https://www.sumiyoshitaisha.net/news/"]},{"id":"u_g_568806299433826162","n":"Hiroshima","cat":"barrio","hood":"Hiroshima","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Prefectura de Hiroshima, Japón","lat":34.3852894,"lng":132.45530549999998,"aprox":false,"gcid":"568806299433826162","cost":0,"dur":0,"sub":"-","typ":"Barrio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Hiroshima","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Hiroshima","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_18337499502386135590","n":"Tempozan Ferris Wheel","cat":"mirador","hood":"Osaka","why":"Noria de 100 m de diámetro en Tempozan Harbor Village, a 5 minutos a pie de la estación Osakako (metro Chuo), pegada al acuario Kaiyukan. La vuelta dura 15 minutos y se ve la bahía de Osaka, el puente Tempozan y la zona portuaria: es vista de puerto y agua, no de skyline — para panorámica de ciudad rinden más Umeda Sky Building o Abeno Harukas. Sirve como complemento de 15 minutos si ya están en la zona por el Kaiyukan; no justifica cruzar Osaka solo por esto. En diciembre juega a favor que el sol se pone cerca de las 17:00: la estructura tiene iluminación LED (luz directa e indirecta sobre el diámetro de 100 m) y la vuelta nocturna se consigue sin quedarse hasta tarde.","addr":"1 Chome-1-10 Kaigandori, Minato Ward, Osaka, 552-0022, Japón","lat":34.656267899999996,"lng":135.4309659,"aprox":false,"gcid":"18337499502386135590","cost":1000,"dur":0.5,"sub":"Noria de 100 m junto al acuario Kaiyukan, con vista de la bahía de Osaka","typ":"Noria","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Tempozan Ferris Wheel","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Opera todo el año, sin cierre estacional: no es montaña ni depende de la nieve. Pero no es 'siempre abierto': el cierre declarado es 不定休 (irregular) y las fichas de datos lo dan atado al calendario del acuario Kaiyukan, que sí tiene días de mantenimiento en enero. Sumado a eso, el clima puntual (viento/tormenta) puede cambiar el horario sin aviso. Verificar el día exacto en el calendario oficial antes de ir.","conf":"media","warn":["Precio actualizado: 1.000 yenes por persona desde la revisión de tarifas del 31/3/2026 publicada en el sitio oficial. La página oficial de turismo de Osaka (osaka-info) todavía dice 900 yenes: está desactualizada. Descuento a 500 yenes con certificado de discapacidad (más un acompañante).","El calendario oficial publica el mes en curso y el anterior, no los meses futuros (verificado el 9/9/2026: solo agosto y septiembre). Los horarios de fin de diciembre recién se van a poder ver ya entrado diciembre, y los del 1-3 de enero probablemente solo en enero. La página es http://tempozan-kanransya.com/tempozan-kanransya.com/schedule/ (solo HTTP, el sitio no tiene HTTPS).","Shōgatsu sin verificar. No hay ningún aviso de cierre de año nuevo en la sección de noticias del sitio (la última entrada es del 19/8/2026), pero tampoco hay confirmación de que opere el 1/1. Chequear también si hacen operativo especial de hatsuhinode (primer amanecer), habitual en norias japonesas.","No planificar el viaje al puerto solo por la noria: el ancla real de Tempozan es el acuario Kaiyukan, que sí come medio día y que además tiene su propio calendario de cierres en enero (verificar aparte).","Hay 8 góndolas see-through (asiento y piso transparentes) y 3 adaptadas para silla de ruedas; no están garantizadas, se asignan por disponibilidad. No hay dato oficial sobre calefacción en las góndolas: en una noche de diciembre asumir frío.","Requiere luz o, mejor, oscuridad total: en diciembre el sol se pone cerca de las 16:50 y a las 17:20 ya es noche cerrada, así que la ventana de 'atardecer sobre la bahía' es muy corta. Para vista diurna del puerto hay que ir antes de las 16:00."],"refs":["http://tempozan-kanransya.com/","http://tempozan-kanransya.com/tempozan-kanransya.com/schedule/","http://tempozan-kanransya.com/tempozan-kanransya.com/aboutwheel/","http://tempozan-kanransya.com/tempozan-kanransya.com/news/","https://osaka-info.jp/spot/tempozan-ferris-wheel/","https://osaka-info.jp/en/spot/tempozan-ferris-wheel/"]},{"id":"u_g_6323866581023509245","n":"Umeda Sky Building (osaka)","cat":"mirador","hood":"Osaka","why":"Dos torres de 40 pisos unidas arriba por un anillo abierto a 173 m, con una escalera mecánica que cruza el vacío entre ambas: el edificio es más interesante que la vista, que es la mancha urbana de Osaka sin un hito que la ordene (no hay Fuji ni bahía enfrente). La azotea es al aire libre y en pleno invierno, con viento a esa altura, se aguanta poco: es una visita de una hora, no una tarde. Vale por la hora azul —a fin de diciembre oscurece cerca de las 17:00, así que subir 16:15-16:30 te da día, atardecer y ciudad encendida en la misma entrada— y porque abre hasta las 22:30, lo que lo vuelve un plan de después de cenar. Está a unos 7 minutos a pie de la estación de Osaka, del lado norte cruzando un túnel peatonal: encaja como cierre de un día en Umeda, no como destino propio.","addr":"1 Chome-1-88 Oyodonaka, Kita Ward, Osaka, 531-6023, Japón","lat":34.7052872,"lng":135.4896527,"aprox":false,"gcid":"6323866581023509245","cost":2000,"dur":1.5,"sub":"Umeda / Kita-ku","typ":"Torre","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Umeda Sky Building (osaka)","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Opera todo el año, no es estacional ni de montaña. La única interrupción es la azotea al aire libre, que cierra con lluvia fuerte; los pisos 39 y 40 (cerrados) siguen abiertos. · Año nuevo (29/12 al 3/1): En el último aviso oficial de fin de año (05/12/2025) el observatorio figura como 無休 (sin cierre, horario normal) durante todo el período de fin de año y Año Nuevo; los locales del edificio sí tienen días de descanso propios. El 31/12 el observatorio suele extender hasta las 25:00 (1:00 de la madrugada) con la entrada normal, sin ticket especial. Además hace apertura especial por el primer amanecer del 1 de enero: en 2026 fue de 6:00 a 8:00, 6.000 ¥, 250 lugares, venta web anticipada por orden de llegada, y se agotó (salió a la venta el 12/12/2025 al mediodía). La edición del 1/1/2027 todavía no está anunciada; el calendario específico 2026-2027 se publica recién en diciembre.","conf":"alta","warn":["Zona correcta: está en Kita-ku, Osaka, a unos 7 minutos a pie de la estación de Osaka. No hay error de prefectura.","2.000 ¥ por persona es caro para lo que se ve. Si el día del viaje se usa el Osaka e-pass, entra gratis pero solo hasta las 15:00, o sea justo antes de la mejor hora de diciembre: el pase y el atardecer no se combinan.","Azotea al aire libre a 173 m en pleno invierno. Viento fuerte y frío real: guantes y algo que no vuele. Puede cerrarse por lluvia o temporal sin aviso previo.","El tramo final es una escalera mecánica suspendida sobre el vacío entre las dos torres. Si a alguno le pesan las alturas, este es el punto.","Apertura del 1 de enero (primer amanecer): en 2026 costó 6.000 ¥ con cupo de 250 y se agotó por venta web anticipada. Si interesa, hay que estar mirando la web oficial en noviembre-diciembre de 2026, no improvisar el 31.","El mercado navideño alemán (Deutsche Weihnachtsmarkt Osaka) que se hacía en la explanada NO se hace más: el sitio oficial anunció en octubre de 2022 que se discontinúa desde esa edición en adelante. Lo que sí sigue cada diciembre es 'UMEDA SKY BUILDING Christmas' en la explanada de la planta baja, con un árbol de unos 25 m y ~130.000 luces LED, habitualmente de mediados de noviembre al 25 de diciembre. Las fechas de la edición 2026 todavía no están publicadas (la agenda oficial, a septiembre de 2026, llega solo hasta octubre)."],"refs":["https://www.skybldg.co.jp/en/observatory/","https://www.skybldg.co.jp/en/","https://www.skybldg.co.jp/","https://www.skybldg.co.jp/new/2419.html","https://www.skybldg.co.jp/new/2420.html","https://www.skybldg.co.jp/new/2113.html","https://www.skybldg.co.jp/event/","https://www.osaka-info.jp/en/spot/umeda-sky-building/"]},{"id":"u_g_8578428730799543777","n":"Kichijōji","cat":"barrio","hood":"Tokio","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Musashino, Tokio, Japón","lat":35.704096,"lng":139.58020539999998,"aprox":false,"gcid":"8578428730799543777","cost":0,"dur":0,"sub":"-","typ":"Barrio","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kichijōji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_4205131227157729993","n":"Hands Shinsaibashi Store","cat":"tienda","hood":"Osaka","why":"Hands (la ex Tokyu Hands) es una cadena nacional de variedades: papelería, cocina, viaje, cosmética, bricolaje y chucherías japonesas bien diseñadas. Esta sucursal ocupa los pisos 9 a 11 del Shinsaibashi PARCO, directamente conectado con la salida 4 de la estación Shinsaibashi de la línea Midosuji y a unos diez minutos a pie de Dotonbori. No es un destino: es la parada de souvenirs y de día de lluvia, y sirve justo para lo que la época complica, porque cierra a las 20:00 y no necesita luz de día. Si ya pasaron por la Hands de Shibuya o Shinjuku en Tokio, acá no hay nada nuevo.","addr":"Japón, 〒542-0085 Osaka, Chuo Ward, Shinsaibashisuji, 1 Chome−8−3 心斎橋PARCO 9, 11階","lat":34.6742389,"lng":135.50093189999998,"aprox":false,"gcid":"4205131227157729993","cost":0,"dur":1,"sub":"Variedades / souvenirs","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: Google no devolvió el nombre. Sin nombre. Pisos 9 y 11 de Shinsaibashi PARCO: no sé si es una tienda concreta, un restaurante del piso gastronómico o el propio centro comercial.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"","conf":"alta","warn":["La zona está bien: es Osaka, Chuo-ku, Shinsaibashi. Sin corrección de prefectura.","No verifiqué qué hace del 29/12 al 3/1. Ni la ficha de la tienda ni el sitio del PARCO publican todavía el aviso de 年末年始; hay que revisarlo en diciembre antes de meterlo en un día de esa semana.","Es cadena: hay Hands en Shibuya, Shinjuku y otras zonas de Tokio. No gastes tiempo de Osaka en esto si ya cayeron en una.","PARCO opera con horario reducido \"por el momento\" y publica 10:00-20:00 para comercios, el mismo horario que Hands. Los restaurantes del edificio (B2F, 13F) cierran más tarde."],"refs":["https://store.hands.net/shinsaibashi/","https://shinsaibashi.parco.jp/floor/","https://shinsaibashi.parco.jp/shop/","https://shinsaibashi.parco.jp/"]},{"id":"u_g_9034359797011625702","n":"Ginza Sushi Ko Honten","cat":"comida","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"6 Chome-3-8 Ginza, Chuo City, Tokyo 104-0061, Japón","lat":35.6713233,"lng":139.7611437,"aprox":false,"gcid":"9034359797011625702","cost":0,"dur":0,"sub":"-","typ":"Sushi","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Ginza Sushi Ko Honten","must":0,"tags":["lista-google rn":[],"refs":[]},{"id":"u_g_9540248764764221208","n":"Shiro-Hige’s Cream Puff Factory","cat":"comida","hood":"Setagaya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒155-0033 Tokyo, Setagaya City, Daita, 5 Chome−3−1 1F","lat":35.6589646,"lng":139.6627349,"aprox":false,"gcid":"9540248764764221208","cost":0,"dur":0,"sub":"-","typ":"Pastelería","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Shiro-Hige’s Cream Puff Factory","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_8190717095247196857","n":"Todoroki Ravine Park","cat":"parque","hood":"Setagaya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-22-26 Todoroki, Setagaya City, Tokyo 158-0082, Japón","lat":35.603897599999996,"lng":139.6462372,"aprox":false,"gcid":"8190717095247196857","cost":0,"dur":0,"sub":"-","typ":"Parque","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Todoroki Ravine Park","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_14367238699361365428","n":"Togakushi Shrine","cat":"arq","hood":"Nara","why":"No es el Togakushi de Nagano. Es un santuario tutelar de aldea en 奈良市北村町字宮山552, en las colinas del este de la ciudad de Nara, uno de varios \"Togakushi\" repartidos por esos pueblos (hay otro en 南庄町, a menos de 1 km). Consagra a Ame-no-Tajikarao; las linternas de piedra todavía dicen 九頭大明神社, señal de un culto anterior al dios dragón Kuzuryū, y por eso se lo asocia a los pedidos de lluvia. En el siglo XVI el clan Tsutsui, señor del castillo de Sagawa, trajo la deidad desde el Togakushi de Sagawa como protectora del castillo. Es un recinto chico de aldea, sin web ni horarios ni tarifa publicados en ninguna parte; se llega en auto (la calle de enfrente es ancha y se puede estacionar sobre ella, aunque el camino de entrada al recinto es angosto) o con un bus rural muy espaciado que hay que verificar antes de intentarlo. Para dos foodies con 25 días y 334 lugares en la lista, esto es una hora y media de viaje ida y vuelta desde el centro de Nara para ver un santuario de barrio. Descartar.","addr":"Kitamuracho, Nara, 630-1113, Japón","lat":34.716861099999996,"lng":135.8993317,"aprox":false,"gcid":"14367238699361365428","cost":0,"dur":0.5,"sub":"santuario de aldea","typ":"Santuario","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: El nombre es el santuario de Togakushi (Nagano) pero la dirección es Kitamuracho, Nara. Santuario igual, aunque el pin parece mal ubicado o es una sucursal local.","src":"lista","gname":"Togakushi Shrine","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":0,"tip":"","season":"","conf":"alta","warn":["Confusión de nombre casi segura: el Togakushi Shrine famoso (Okusha, la avenida de cedros, los 2.000 años de historia) está en NAGANO, a ~450 km de Nara. Este NO es ese. Si alguien lo puso en la lista pensando en el de Nagano, hay que decidirlo aparte: el de Nagano es de montaña y en diciembre-enero tiene nieve y accesos limitados.","La zona sí es prefectura de Nara y ciudad de Nara, pero NO el Nara turístico: Kitamura-cho está en el extremo este de la ciudad, zona rural de Sagawa/Ōyagyū, a ~15 km del centro (Kintetsu Nara / Parque de Nara) — 7,7 km en línea recta, ~30-40 min en auto por ruta de montaña. En transporte público hay que verificar el bus rural antes de intentarlo: no está confirmada la línea, la parada ni la frecuencia.","Sin horarios ni tarifa publicados en ninguna parte: no hay web oficial ni ficha del 奈良県神社庁 accesible. No inventar horario. Recinto de aldea, presumiblemente abierto siempre, pero sin verificar.","La calle frente al santuario es ancha y se puede estacionar sobre ella; el camino de entrada al recinto sí es angosto, ojo si intentás meter el auto adentro.","Necesita luz de día y no hay iluminación: en diciembre-enero el sol se pone cerca de las 16:50 y el trayecto de vuelta es por camino rural sin alumbrado."],"refs":["https://ameblo.jp/keith4862/entry-12392750804.html","https://mirokunomichi.org/voyages/2022010800/1.shtml"]},{"id":"u_g_15490653164204088489","n":"Tsutaya Books Daikanyama","cat":"tienda","hood":"Shibuya","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒150-0033 Tokyo, Shibuya, Sarugakucho, 17−5 代官山Ｔ－ＳＩＴＥ １号館～３号館 １階～２階","lat":35.6488866,"lng":139.6997888,"aprox":false,"gcid":"15490653164204088489","cost":0,"dur":0,"sub":"-","typ":"Librería","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Japón","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_11176644897176580696","n":"Togakushi","cat":"parque","hood":"Nagano","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Nagano, Prefectura de Nagano 381-4101, Japón","lat":36.7313098,"lng":138.07630939999999,"aprox":false,"gcid":"11176644897176580696","cost":0,"dur":0,"sub":"-","typ":"Montaña","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Togakushi es un área de montaña (santuarios, bosque de cedros, soba). No sé si el pin apunta a la naturaleza, al santuario o al pueblo; podría ir como barrio/zona.","src":"lista","gname":"Togakushi","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nagano","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_5814346422745768836","n":"Gotemba Premium Outlets","cat":"tienda","hood": 89622","cost":0,"dur":0,"sub":"-","typ":"Cascada","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Cascada Nachi","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Otras zonas","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_13217055646239221321","n":"Japanese YAKITORI restaurant Nonotori Nihonbashi","cat":"comida","hood":"Chiyoda","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒101-0044 Tokyo, Chiyoda City, Kajicho, 1 Chome−9−19 GEMS新日本橋 6階","lat":35.6904647,"lng":139.7725862,"aprox":false,"gcid":"13217055646239221321","cost":0,"dur":0,"sub":"-","typ":"Yakitori","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Japanese YAKITORI restaurant Nonotori Nihonbashi","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_3194737460227863412","n":"Akame 48 Waterfalls","cat":"parque","hood":"Nabari","why":"Opera en diciembre y enero, pero con horario recortado (9:00–16:30) y con una lista de días cerrados que pega justo en las fechas del viaje: del 28 al 31 de diciembre cerrado, y TODOS los jueves desde diciembre hasta marzo. Es una garganta con un sendero de piedra al lado del río, salpicado de cascadas: la web oficial habla de un circuito de 3,3 km y unas 3 horas ida y vuelta, la JNTO de unos 4 km y 3 a 4 horas, más el viaje. En invierno el camino pide cuidado —roca mojada, hielo en los tramos de sombra— y a cambio se pueden ver las cascadas parcialmente congeladas si hizo frío. El problema no es el lugar sino el costo de oportunidad: es un día entero desde Osaka (poco más de una hora de tren a Akameguchi más 10 minutos de colectivo, y lo mismo de vuelta) para un cañón que en enero está gris, con apenas un par de casas de té sobre el sendero y nada de comer que valga el viaje, y con la luz muriéndose a las 16:30. Para dos foodies con 25 días y Tokio, Kioto, Nara y Osaka sobre la mesa, es una elección de naturaleza y senderismo, no un desvío barato.","addr":"Nagasaka-671-1 Akamecho, Nabari, Mie 518-0469, Japón","lat":34.5636079,"lng":136.08574389999998,"aprox":false,"gcid":"3194737460227863412","cost":1000,"dur":6,"sub":"Garganta con sendero de 4 km y cascadas, Nabari (Mie)","typ":"Cascada","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Akame 48 Waterfalls","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Nara","rate":0,"tip":"","season":"Abierto en diciembre y enero: no es una ruta alpina que cierre por nieve, es una garganta a baja altura. El sendero funciona todo el invierno, con horario reducido y superficie resbaladiza. Calzado con agarre, no zapatilla urbana. · Año nuevo (29/12 al 3/1): Cerrado del 28 al 31 de diciembre. Reabre el 1 y 2 de enero con horario recortado 9:00–15:00, y del 3 en adelante vuelve al horario de invierno (menos los jueves). Ojo con el transporte: la web oficial en inglés avisa que los servicios de colectivo están suspendidos del 30 de diciembre al 4 de enero, así que aun estando abierto el 1 y 2 hay que resolver la subida desde la estación en taxi (~¥1.500–2.000 según ENN Tourism; Mie Kintetsu Taxi 0595-63-0103).","conf":"media","warn":["ZONA MAL ROTULADA: figura como Nara y está en la prefectura de MIE, ciudad de Nabari. La JNTO lo confirma. No es una salida desde Nara ciudad: desde Kintetsu Nara hay que hacer dos o tres transbordos. La puerta natural es Osaka —línea Kintetsu Osaka desde Namba, poco más de una hora hasta Akameguchi— y desde Kioto son unos 90 minutos. Si el itinerario no pasa por Osaka, este lugar se cae solo.","CERRADO del 28 al 31 de diciembre y todos los jueves de la temporada. Dentro del viaje eso mata el 17 de diciembre, el 24 de diciembre y el 7 de enero (jueves), más toda la ventana del 28 al 31.","LUZ: cierra 16:30 y a esa hora ya está oscureciendo. Un sendero de 3 a 4 horas hay que arrancarlo antes del mediodía o no se completa. Hay hora límite de retorno desde la última cascada, más temprana en invierno, pero no la pude confirmar en fuente oficial.","ILUMINACIÓN «Mie Akame Taki Akari»: la home oficial en inglés confirma la edición 2026/10/31 al 2027/1/24, 17:00–19:30, ¥700 adulto y ¥400 chicos (gratis con la entrada del día). El patrón de días sale de la edición anterior, que ENN Tourism describe así: del 6/12 al 25/1 solo sábados, domingos y feriados, más el 22 al 25 de diciembre. Ese patrón NO está confirmado para 2026-27 y no hay dato oficial sobre qué pasa en Año Nuevo: llamar al 0595-41-1180 antes de armar el día en función de la iluminación.","No hay escena gastronómica: es un pueblo de aguas termales con un puñado de posadas. Como parada de foodies no aporta nada; si se va, se come antes o después, en Osaka."],"refs":["https://www.akame48taki.com/about/","https://www.akame48taki.com/en/","https://www.akame48taki.com/en/about/","https://www.akame48taki.com/en/access/","https://www.akame48taki.com/news/","https://www.akame48taki.com/8190/","https://www.akame48taki.com/activity_post/%E4%B8%89%E9%87%8D%E8%B5%A4%E7%9B%AE%E3%83%A9%E3%82%A4%E3%83%88%E3%82%A2%E3%83%83%E3%83%97/","https://www.japan.travel/en/spot/1215/","https://enntourism.com/spots/akame-48-waterfalls/","https://enntourism.com/akame_illumination/"]},{"id":"u_g_14569132032462000222","n":"CAFE ANNON Namba","cat":"comida","hood":"Osaka","why":"Café de souffle pancakes en Namba Sennichimae, a 228 m (5 min a pie) de la estación de Namba, en pleno Chuo-ku de Osaka. Tabelog 3,51 con 374 reseñas. Lo que lo hace útil no es tanto el pancake sino el horario: abre 8:00 y cierra 22:45 (último ingreso y última orden 21:30) todos los días, sin día de cierre fijo, así que entra como desayuno, como merienda o como cierre dulce después de cenar en Dotonbori — y en diciembre eso sirve porque a las 17 ya está oscureciendo y este lugar no necesita luz. Los pancakes se hornean uno por uno en plancha de cobre al pedido: contá espera larga aunque consigas mesa.","addr":"Japón, 〒542-0075 Osaka, Chuo Ward, Nanbasennichimae, 4−20 せんだビル 1・2F","lat":34.6642499,"lng":135.5041282,"aprox":false,"gcid":"14569132032462000222","cost":2000,"dur":1.25,"sub":"café / pancakes","typ":"Café","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"CAFE ANNON Namba","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.51,"tip":"Los ANNON pancakes de souffle, en versión japonesa con sirope de matcha o kuromitsu (es lo que distingue a la casa frente a cualquier otro pancake shop); también parfaits y café en sifón. Presupuesto Tabelog: ¥2.000-2.999. Toma tarjetas y QR (PayPay, Alipay, WeChat), NO e-money: no es solo efectivo. Ojo con la reserva: la web oficial dice que solo se reservan las salas privadas (6+ personas) y encima excluyendo viernes, sábado, domingo y feriados, así que para dos es cola sí o sí — el turno de espera se toma con el sistema EPARK, pero presencialmente en el mostrador: la reserva web con día y hora está suspendida. Hay que ir hasta el local a anotarse. Son 39 asientos en dos pisos (10 abajo, 29 arriba). Estrategia: caer a las 8:00 de desayuno y saltarse la fila del mediodía.","season":"Año nuevo (29/12 al 3/1): El local publica cada año un aviso de fin de año en su web (@cafe_annon_namba en Instagram) con horario reducido y días cerrados. NO está verificado el detalle de ninguna edición reciente ni está publicada la de 2026-2027. Lo único razonable como hipótesis es que cierre alrededor del 31/12 y el 1/1 y que los días vecinos tengan horario recortado — en al menos una edición previa el cierre se extendió también al 2/1. Reconfirmar en su web o Instagram a fines de diciembre de 2026 antes de ir.","conf":"media","warn":["No se reserva para dos personas: la reserva online es solo para salas privadas de 6+ y encima no aplica viernes, sábado, domingo ni feriados. Se hace cola por EPARK, anotándose en el mostrador del local.","El horario de fin de año cambia todos los años y el de 2026-2027 no está publicado. No dar por abierto ni el 31/12, ni el 1/1, ni el 2/1: reconfirmar en su web o Instagram (@cafe_annon_namba) en diciembre.","Abrieron una sucursal en Shinsaibashi (anuncio del 07/11/2025). El puntaje 3,51 es de la casa central de Namba, no de esa: no confundir fichas de Tabelog.","Los pancakes se hornean al momento en plancha de cobre; sumá espera de cocina además de la cola de mesa. No es una parada de 30 minutos."],"refs":["https://tabelog.com/en/osaka/A2701/A270202/27101706/","https://tabelog.com/en/osaka/A2701/A270202/27101706/dtlmap/","https://cafe-annon.com/"]},{"id":"u_g_9787715230558271059","n":"Bic Camera Yurakucho Store - Camera Store","cat":"tienda","hood":"Chiyoda","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"1 Chome-11-1 Yurakucho, Chiyoda City, Tokyo 100-0006, Japón","lat":35.6753814,"lng":139.7629088,"aprox":false,"gcid":"9787715230558271059","cost":0,"dur":0,"sub":"-","typ":"Tienda","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Bic Camera Yurakucho Store - Camera Store","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_17857681122251904502","n":"Books KYOBUNKWAN","cat":"tienda","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"4 Chome-5-1 Ginza, Chuo City, Tokyo 104-0061, Japón","lat":35.672028,"lng":139.76563769999998,"aprox":false,"gcid":"17857681122251904502","cost":0,"dur":0,"sub":"-","typ":"Librería","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Books KYOBUNKWAN","must":0,"tags":["lista-google"],"autor":"Thais Helena de Re
