.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}

	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

}

	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}

	visibility: hidden;
	}

	visibility: inherit;
	}

.leaflet-control {

	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}

	float: left;
	clear: both;
	}

	margin-top: 10px;

	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}

.leaflet-interactive {
	cursor: pointer;
	}

	}

.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {

	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;

.leaflet-touch .leaflet-bar a:first-child {

	border-bottom-right-radius: 2px;

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}

/* ── modal ── */
.ov{position:fixed;inset:0;background:rgba(16,26,36,.55);z-index:1200;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:620px;
  max-height:86vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px;max-height:82vh}}
.grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.opt{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:7px;font-size:14px;background:#fff}
.opt:hover{background:#f7f5f1}
.opt b{display:block;font-size:12px;color:var(--mut);font-weight:650;margin-top:2px}

/* ── bottom bar ── */
.bar{position:fixed;bottom:0;left:0;width:100vw;max-width:100vw;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:950;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.barin{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;min-width:0}
.barin>.stat{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin>.spacer{flex:0 1 auto}
.barin .btn{flex:0 0 auto}
@media(max-width:420px){.barin{gap:6px}.barin .btn{padding:9px 11px;font-size:12.5px}}
.btn{padding:9px 14px;border-radius:11px;font-size:13px;font-weight:650;
  background:var(--navy);color:#fff}
.btn.ghost{background:#eee9e1;color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12px}
.stat{font-size:11.5px;color:var(--mut);line-height:1.35}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{font-weight:700;color:var(--navy);white-space:nowrap}
.kv dd{margin:0}
details{border:1px solid var(--line);border-radius:12px;background:var(--card);
  margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
summary{padding:13px 15px;font-weight:680;font-size:14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--accent);font-weight:800}
details[open] summary::before{content:"▾ "}
details .dbody{padding:0 15px 15px}

/* ══════════════════════════════════════════════════════════════════════════
   V2 · rediseño para el uso real: parado en la calle, una mano, 10 segundos.
   Todo lo de abajo pisa a lo de arriba a propósito (misma especificidad,
   más tarde en el archivo), así el CSS original queda como referencia.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── cromo superior: header + pestañas en UN solo sticky ──────────────────
   Antes los dos eran sticky top:0 y el header tapaba las pestañas al
   scrollear: cambiar de pestaña obligaba a volver arriba de todo. */
.topbar{position:sticky;top:0;z-index:900;box-shadow:0 2px 16px rgba(20,41,61,.16)}
header{position:static;z-index:auto;box-shadow:none;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.brand{font-size:15.5px;font-weight:750;display:flex;align-items:baseline;gap:8px;
  min-width:0;overflow:hidden}
.brand small{display:inline;font-size:11.5px;font-weight:500;opacity:.75;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.iconbtn{width:33px;height:33px;font-size:14px;border-radius:9px}
nav.tabs{position:static;z-index:auto;border-bottom:1px solid var(--line)}
.tab{padding:11px 12px 9px;font-size:13px}

main{padding-top:12px}

/* ── tira de días: más baja, y hoy se ve ─────────────────────────────────── */
.days{gap:6px;padding-bottom:11px}
.dbtn{min-width:0;padding:7px 11px;border-radius:11px}
.dbtn .dd{font-size:14px;font-weight:750;margin:0;letter-spacing:-.01em}
.dbtn .dw{font-size:10.5px;font-weight:600;color:var(--mut);margin-top:1px}
.dbtn.on .dw{color:rgba(255,255,255,.8)}
.dbtn.today{outline:2px solid var(--gold);outline-offset:1px}
.dbtn .hoylb{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;
  color:var(--gold);text-transform:uppercase}

/* ── AHORA: la respuesta a "¿qué toca?" ──────────────────────────────────── */
.ahora{margin:0 0 13px;border-radius:15px;overflow:hidden;background:var(--navy);
  color:#fff;box-shadow:0 4px 20px rgba(20,41,61,.22)}
.ahlb{display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:rgba(255,255,255,.09);font-size:10.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.ahlb .sp{flex:1}
.ahhoy{font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:none;
  background:rgba(255,255,255,.16);color:#fff;padding:4px 10px;border-radius:8px}
.ahmain{padding:12px 14px 12px}
.aht{font-size:12px;font-weight:750;color:#7fd4ae;letter-spacing:.03em}
.ahn{font-size:19px;font-weight:700;line-height:1.24;margin:3px 0 5px;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ahd{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.74)}
.ahnext{padding:10px 14px;border-top:1px solid rgba(255,255,255,.14);
  font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.78)}
.ahnext b{color:#fff}
.ahacts{display:flex;gap:7px;padding:11px 14px calc(13px);flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.14)}
.ahbtn{background:var(--accent);color:#fff;padding:10px 15px;border-radius:11px;
  font-size:13.5px;font-weight:750;text-decoration:none;display:inline-block;
  flex:0 1 auto;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center}
.ahbtn.g2{background:rgba(255,255,255,.15);color:#fff}
.ahora.pre{background:#1d3a52}
.ahora.fin{background:#3a3630}

/* ── cabecera del día: el título manda, el porqué se despliega ───────────── */
.dhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:13px 14px;margin-bottom:12px}
.dhead h2{font-size:18px;font-weight:700;line-height:1.25;margin-bottom:7px}
.dhead .dchips{display:flex;gap:6px;flex-wrap:wrap}
/* El «base:» del día 5 es una frase entera ("JGStay SoHo → New Jersey (la ÚNICA
   noche…"): con `white-space:nowrap` el chip medía 359 px dentro de 317 y el texto
   quedaba cortado — invisible, porque `overflow-x:clip` lo tapa sin avisar. Envuelve. */
.dhead .dchips .chip{white-space:normal;text-align:left;line-height:1.4;max-width:100%}
.dporque{margin-top:10px;border:0;box-shadow:none;background:none;border-radius:0}
.dporque summary{padding:0;font-size:12px;font-weight:700;color:var(--accent)}
.dporque .dbody{padding:9px 0 0}
.dporque p{margin:0 0 8px;font-size:13px;line-height:1.55;color:var(--mut)}
.dporque p:last-child{margin-bottom:0}

/* ── el bloque de itinerario ─────────────────────────────────────────────
   `.itb` es la clase nueva: `.blk` a secas la sigue usando Reservas y no se
   toca. Plegado por defecto — el texto completo está a un toque, no borrado. */
.blk.itb{display:flex;gap:9px;padding:10px 12px;align-items:flex-start;
  border-bottom:1px solid var(--line)}
.itb .tmw{flex:0 0 46px;padding-top:1px}
.itb .tm{font-size:13.5px;font-weight:800;color:var(--navy);letter-spacing:-.02em;
  padding:0;background:none;border:0;width:100%;text-align:left}
.itb input.tm{border:1px solid var(--line);border-radius:7px;padding:3px 4px;
  background:#fff;font-weight:700;font-size:13px}
.itb.on .tmw{flex:0 0 56px}
.itb .tmend{font-size:10px;color:var(--mut);margin-top:1px}
.itb .btog{cursor:pointer;-webkit-tap-highlight-color:rgba(193,68,14,.07)}
.bhead{display:flex;gap:7px;align-items:flex-start}
.cdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;
  box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.bttl{font-size:14.5px;font-weight:650;line-height:1.34;letter-spacing:-.008em;
  color:var(--ink);flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.itb.hi .bttl,.itb.star .bttl{font-size:15.5px;font-weight:700}
.bsub{font-size:12.5px;line-height:1.45;color:var(--mut);margin:2px 0 0 15px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.bfacts{font-size:11px;color:#78818f;margin:3px 0 0 15px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bfacts .mas{color:#a8a49d;font-weight:800}
.stx{color:var(--gold)}
.bfacts .ojo{color:#8a5a08;font-weight:750}
.bfacts .cerr{color:var(--red);font-weight:750}
/* logística: es pegamento entre paradas, no plan. Una línea y gris. */
.itb.logi{padding:7px 12px;background:#fbfaf7}
.itb.logi .bttl{font-size:12.5px;font-weight:500;color:#67707c;-webkit-line-clamp:2}
.itb.logi .tm{font-size:12px;font-weight:700;color:#7c8593}
.itb.done .bttl{text-decoration:line-through}
.itb.on{background:#fffcf5}
.itb.on .bttl{-webkit-line-clamp:unset;display:block}
/* estado respecto del reloj (solo cuando el día que mirás es hoy) */
.itb.past{opacity:.62}
.itb.past.done{opacity:.4}
.itb.now{background:#fff7e7;box-shadow:inset 3.5px 0 0 var(--gold)}
.itb.now .bttl{font-weight:750}
.itb.flash{animation:fl 1.3s ease}
@keyframes fl{0%,100%{background:#fff7e7}30%{background:#ffe9b8}}
@media(prefers-reduced-motion:reduce){.itb.flash{animation:none}}
/* detalle desplegado: acá vuelve TODO lo que la v1 mostraba siempre */
.bdet{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.bdet .btxt{font-size:13.5px;line-height:1.55}
.bedit{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  display:flex;gap:6px;align-items:center}
.bedit .mini{font-size:13px;opacity:.55;border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;background:#fff}
.bedit .lb{font-size:10.5px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;flex:1}
.bedit .del{color:var(--red);border-color:#f0cdd2;margin-left:auto}
/* columna de acción: plegado, SOLO lo que se usa caminando */
.itb .bact{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:center;
  padding-top:1px}
.itb .ck{width:26px;height:26px;border-radius:8px;font-size:13px}
.goto{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:#e6f3ea;color:#1e6b41;font-weight:800;font-size:14px;text-decoration:none;
  border:1px solid #bfdfcb}
.plegar{margin-top:9px;font-size:11px;font-weight:700;color:var(--mut);
  border:1px dashed var(--line);border-radius:8px;padding:4px 10px}
.itb.logi .bact .ck{width:22px;height:22px;font-size:11px}
/* traslado entre paradas: se queda, es info de calle pura */
.trav{padding:5px 12px 5px 57px;font-size:11.5px}

/* ── barra inferior ──────────────────────────────────────────────────────── */
.bar .stat{font-size:11.5px}
#bAhora{background:var(--accent);padding:10px 16px;font-size:13.5px;font-weight:750}

.hint{font-size:11px;color:var(--mut);margin:2px 0 10px;text-align:center}

@media print{header,nav.tabs,.bar,.tools,.days,.bact,.addbtn{display:none!important}
  .itb .bttl,.itb.on .bttl{-webkit-line-clamp:unset;display:block}.bsub,.bfacts{display:block!important}
  .view{display:block!important}body{padding:0;background:#fff}}
</style>
</head>
<body>

<div class="topbar">
<header>
 <div class="hrow">
  <div class="brand"><span id="hbrand"></span><small id="hsub"></small></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="bWho" title="Filtrar por persona">👥</button>
  <button class="iconbtn" id="bMenu" title="Datos">⋯</button>
 </div>
</header>

<nav class="tabs"><div class="tabsin" id="tabs"></div></nav>
</div>

<main>
 <section class="view on" id="v-itin"></section>
 <section class="view" id="v-places"></section>
 <section class="view" id="v-map"></section>
 <section class="view" id="v-costs"></section>
 <section class="view" id="v-trans"></section>
 <section class="view" id="v-res"></section>
</main>

<div class="bar"><div class="barin">
  <div class="stat" id="stat"></div>
  <div class="spacer"></div>
  <button class="btn sm" id="bAhora" title="Saltar al bloque que toca ahora">Ahora</button>
  <button class="btn ghost sm" id="bExp">Exportar</button>
  <button class="btn sm" id="bSave">Guardado ✓</button>
</div></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

const MONBASE = TRIP.moneda;
const SIMB = TRIP.simbolos || {};
const DECS = TRIP.decimales || {};
const FX = TRIP.fx || null;
const MONEDAS_VER = (TRIP.monedasVer && TRIP.monedasVer.length) ? TRIP.monedasVer : [MONBASE];
/* En qué moneda quiere ver ESTA persona. Es preferencia de cada uno, no del
   viaje: uno puede razonar en pesos y el otro en dólares mirando el mismo plan. */
function monedaVista(){
  const m = S && S.moneda;
  return (m && MONEDAS_VER.indexOf(m) >= 0) ? m : MONBASE;
}
/* La tasa que se usa: la del build, salvo que alguien la haya pisado a mano —
   la del cajero no es la del mercado, y la del aeropuerto menos. */
function tasa(a){
  if (a === MONBASE) return 1;
  const mia = S && S.fxMio && S.fxMio[a];
  if (Number.isFinite(+mia) && +mia > 0) return +mia;
  return (FX && FX.tasas && FX.tasas[a]) || null;
}
const MON = SIMB[MONBASE] || MONBASE;   /* compatibilidad con lo que ya lo usaba */

function fmtMoneda(v, cod){
  const d = DECS[cod] != null ? DECS[cod] : 0;
  const num = new Intl.NumberFormat('es-CO', {minimumFractionDigits: d, maximumFractionDigits: d})
    .format(v);
  return (SIMB[cod] || cod) + ' ' + num;
}
/* Convierte y formatea. `aprox` marca que el número pasó por una cotización.
   ⚠ Se convierte el TOTAL, nunca se suman convertidos: con siete filas
   redondeadas el total no cierra contra su propia columna y eso se ve. */
function plata(v, cod){
  const x = +v;
  if (!Number.isFinite(x)) return '—';
  cod = cod || monedaVista();
  if (cod === MONBASE) return fmtMoneda(x, cod);
  const t = tasa(cod);
  if (!t) return fmtMoneda(x, MONBASE);
  return '~ ' + fmtMoneda(x * t, cod);
}
const money0 = v => plata(Number.isFinite(+v) ? Math.round(+v) : 0);
/* ── EL CATÁLOGO ES UNA PROYECCIÓN, NO UNA CONSTANTE ──────────────────────────
   Hasta acá PLACES y PBY se armaban una sola vez al cargar y no se volvían a
   tocar: el catálogo venía entero del build y era inmutable. Ahora se puede
   crear, editar y borrar un lugar desde la app, así que lo que se ve es

       catálogo del build  +  S.edits  +  S.nuevos  menos  S.bajas

   y esa suma se recalcula con rebuildCatalog() en el arranque, después de cada
   alta / edición / baja, y después de importar un plan. La VERDAD son los tres
   deltas de S; PLACES y PBY son lo que se dibuja. Mutar directamente el objeto
   de DATA.places lo mostraría en pantalla pero no lo guardaría, porque S no lo
   contiene: ese es el error que este diseño evita. */
const BASE_PLACES = DATA.places;
let PBY = {};
/* subcategorías agrupadas por categoría, para los <optgroup> de los filtros.
   Se recalculan también: un tipo nuevo tiene que poder filtrarse. */
let SUBS = DATA.subs || {};

function rebuildCatalog(){
  const bajas = (S && S.bajas) || {}, edits = (S && S.edits) || {}, nuevos = (S && S.nuevos) || {};
  PLACES = BASE_PLACES
    .filter(p => !bajas[p.id])
    .map(p => edits[p.id] ? Object.assign({}, p, edits[p.id]) : p)
    .concat(Object.values(nuevos).filter(p => p && p.id && !bajas[p.id]));
  PBY = Object.fromEntries(PLACES.map(p => [p.id, p]));
  const subs = {};
  PLACES.forEach(p => {
    const t = p.typ || 'Sin clasificar';
    (subs[p.cat] = subs[p.cat] || new Set()).add(t);
  });
  SUBS = Object.fromEntries(Object.entries(subs).map(([k, v]) => [k, [...v].sort()]));
}

  teatro:{n:'Teatro',c:'#9c36b5'},  transporte:{n:'Logística',c:'#495057'},
  /* Dos categorías que el set original —pensado para Nueva York— no tenía, y
     que en un viaje largo son la mitad del catálogo. Sin ellas, 35 ryokan
     terminaron en «Logística» y 15 tiendas en «Arquitectura»: no fue mal
     criterio, no había casillero. */
  tienda:{n:'Tienda',c:'#e67700'}, alojamiento:{n:'Dónde dormir',c:'#c92a2a'},
  /* Para lo que no se sabe qué es, y para lo que no entra en ninguna de las de
     arriba. Es una categoría de verdad —se filtra, se cuenta, se puede elegir en
     el formulario— y no un cajón de descarte: un head spa pintado de
     verde-naturaleza o una peluquería de patrimonio es peor que un gris que
     dice «esto hay que mirarlo». Va último a propósito. */
  sinclasificar:{n:'Sin clasificar',c:'#8a8577'}
};
/* ── LEER UN LUGAR SIN QUE UN CAMPO FLOJO TUMBE UNA VISTA ────────────────────
   CAT[p.cat] se desreferenciaba en 11 puntos sin guarda: UN lugar con una
   categoría que no está en CAT —importado, editado a mano, escrito con un
   typo— tiraba la pestaña Lugares entera, el mapa y, si estaba agendado, el
   itinerario completo. Con el catálogo editable desde la app eso deja de ser
   hipotético. cat() nunca devuelve undefined. */
const cat = p => (p && CAT[p.cat]) || CAT.sinclasificar;
/* ── Quién hace un bloque o un día ────────────────────────────────────────────
   `who` es SIEMPRE un string: 'both' si van todos, un id si va uno solo, o
   'id+id' si es un subconjunto. Lo canoniza plan.py del lado Python; acá solo
   se lee.
   whoArr() ante un id desconocido devuelve TODOS a propósito: si alguien saca
   un viajero de un viaje en curso, sus bloques pasan a leerse como del grupo en
   vez de volverse invisibles. Es una mentira benigna — perder un bloque de
   vista es peor que atribuirlo de más — y el build avisa cuando la detecta. */
const NEUTRO = '#4a5460';
function whoArr(w){
  if (!w || w === 'both' || w === 'all') return VIDS;
  const a = String(w).split('+').filter(x => VBY[x]);
  return a.length ? a : VIDS;
}
const esDeTodos = w => whoArr(w).length === NV;
const hace = (w, vid) => whoArr(w).indexOf(vid) >= 0;
function whoLabel(w){
  if (esDeTodos(w)) return NV === 2 ? 'Ambos' : 'Todos';
  const ns = whoArr(w).map(v => VBY[v].corto);
  return 'Solo ' + (ns.length > 1
    ? ns.slice(0, -1).join(', ') + ' y ' + ns[ns.length - 1] : ns[0]);
}
/* El color identifica a UNA persona. Un subconjunto de varios no es de nadie. */
function whoColor(w){
  const a = whoArr(w);
  return (a.length === 1 && VBY[a[0]].color) ? VBY[a[0]].color : NEUTRO;
}
/* ── Los 9 días en el mapa ────────────────────────────────────────────────────
   Nueve colores simultáneos NO se distinguen: se probaron siete paletas contra

   12,4, y el par rojo/naranja de esta da 7,1. Por eso el color acá es APOYO y

   La paleta son los 8 slots categóricos de referencia (ya validados entre sí)
   más un violeta; ninguno lee gris, que era el otro modo de fallar. */
const DIA_COLOR = ['#2a78d6','#eb6834','#008300','#4a3aa7','#eda100',
                   '#e87ba4','#1baf7a','#e34948','#9a3fbf'];

function fresh(){
  const it = JSON.parse(JSON.stringify(BASE_ITIN));
  it.forEach(d => d.blocks.forEach((b,i) => { b.id = 'd'+d.n+'b'+i; b.done = false; b.mynote = ''; }));

              nuevos = lugares creados acá · edits = campos pisados de lugares

           nuevos: {}, edits: {}, bajas: {}, yo: '',
           /* En qué moneda ve la plata ESTA persona, y las tasas que haya
              corregido a mano. Es preferencia de cada uno: uno puede razonar en

           moneda: '', fxMio: {},
           /* La fecha en que arranca el viaje, si se cambió desde la app. Vacío

           arranque: '',

           listas: {},

/* El itinerario base cambió desde que este navegador guardó su plan: adoptar el NUEVO
   conservando lo del usuario — tildes y notas (matcheadas por texto o por lugar+hora),
   bloques agregados a mano, el interés de cada viajero, reservas y filtros. */
var MIGRATED;   // var sin inicializar: load() corre antes y puede ponerla en true — un '= false' acá la pisaría
function migrate(old){
  const ns = fresh();
  ns.interest = old.interest || {};
  /* ⚠ migrate() copia clave por clave: toda clave nueva que no se nombre acá se
     PIERDE la primera vez que cambie el itinerario. Un lugar que alguien creó a
     mano desaparecería sin aviso al rearmar un día. */
  ns.arranque = old.arranque || '';
  ns.listas = old.listas || {};
  ns.moneda = old.moneda || '';
  ns.fxMio = old.fxMio || {};
  ns.nuevos = old.nuevos || {};
  ns.edits = old.edits || {};
  ns.bajas = old.bajas || {};
  ns.yo = old.yo || '';
  ns.res = old.res || {};
  ns.whoF = old.whoF || 'all';
  ns.pv = old.pv || 'cards';
  normMarks(old); ns.must = old.must; ns.mv = 2;
  ns.tab = old.tab || 'itin';
  ns.day = old.day || 1;
  for (const nd of ns.itin){
    const od = (old.itin || []).find(d => d.n === nd.n);
    if (!od) continue;
    for (const nb of nd.blocks){
      const ob = od.blocks.find(b => b.txt === nb.txt) ||
                 (nb.pid ? od.blocks.find(b => b.pid === nb.pid && b.t === nb.t) : null);
      if (ob){ nb.done = !!ob.done; nb.mynote = ob.mynote || ''; }
    }
    od.blocks.filter(b => String(b.id).startsWith('x')).forEach(b => nd.blocks.push(b));
  }
  try { localStorage.setItem(KEY, JSON.stringify(ns)); } catch(e){}
  MIGRATED = true;
  return ns;
}
/* Completa un estado guardado con las claves que agregamos después de que se guardó.
   Sin esto, una versión nueva de la app rompía la vista Lugares en el navegador de alguien
   que ya tenía plan guardado y cuyo itinerario no había cambiado (no se disparaba migrate). */
/* ── SANEAR ───────────────────────────────────────────────────────────────────
   hydrate() rellena claves que FALTAN en el primer nivel del estado; no mira
   nada por dentro. Esto es lo otro: valores guardados que ya no significan nada
   porque cambió la config del viaje. Devuelve true si tocó algo, para avisar.

   El caso concreto: alguien filtró el itinerario por un viajero y después ese
   viajero salió del viaje. `whoF` guardado apunta a un fantasma, ningún bloque
   matchea, y la app muestra «Sin bloques para este filtro» sin decir por qué. */
function sanear(s){
  let toco = false;
  if (s.whoF && s.whoF !== 'all' && s.whoF !== 'both' && !VBY[s.whoF]){
    s.whoF = 'all'; toco = true;
  }
  /* «Quién soy» apuntando a alguien que ya no viaja: se olvida y se vuelve a
     preguntar la próxima vez que haga falta. */
  if (s.yo && !VBY[s.yo]){ s.yo = ''; toco = true; }
  /* Una moneda que este viaje ya no ofrece: se vuelve a la del viaje. */
  if (s.moneda && MONEDAS_VER.indexOf(s.moneda) < 0){ s.moneda = ''; toco = true; }
  /* Un lugar creado a mano al que le falta lo mínimo tumbaría vistas enteras.
     Se descarta acá, en la puerta, y no en cada render. */
  if (s.nuevos && typeof s.nuevos === 'object'){
    for (const k of Object.keys(s.nuevos)){
      const p = s.nuevos[k];
      if (!p || typeof p !== 'object' || p.id !== k || !p.n || !CAT[p.cat]){
        delete s.nuevos[k]; toco = true;
      }
    }
  }
  /* Una edición de un lugar que ya no está en el catálogo (lo sacaron del build)
     no tiene a qué aplicarse. */
  if (s.edits && typeof s.edits === 'object')
    for (const k of Object.keys(s.edits))
      if (!BASE_PLACES.some(p => p.id === k)){ delete s.edits[k]; toco = true; }
  if (s.interest && typeof s.interest === 'object'){
    for (const pid of Object.keys(s.interest)){
      const o = s.interest[pid];
      if (!o || typeof o !== 'object'){ delete s.interest[pid]; toco = true; continue; }
      for (const k of Object.keys(o))
        if (!VBY[k] || ![0,1,2].includes(o[k])){ delete o[k]; toco = true; }
      if (!Object.keys(o).length){ delete s.interest[pid]; toco = true; }
    }
  }
  return toco;
}
function hydrate(s){
  normMarks(s);
  if (sanear(s)) MIGRATED = true;
  const base = fresh();
  for (const k of Object.keys(base)){
    if (s[k] === undefined || s[k] === null) s[k] = base[k];
    else if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])
             && (typeof s[k] !== 'object' || Array.isArray(s[k]))) s[k] = base[k];
  }
  if (!Array.isArray(s.itin) || !s.itin.length) return base;
  return s;
}
function load(){
  try { const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw);
      /* >= y no ===: con igualdad, el día que alguien suba `v` a 2 «para forzar
         una re-lectura» todo plan guardado cae a fresh() y se borran tildes,
         notas, bloques propios, intereses y reservas sin un solo aviso. */
      if (s && s.v >= 1 && s.itin)
        return s.baseHash === DATA.itinHash ? hydrate(s) : migrate(s);
    } } catch(e){}
  return fresh();
}
let saveT = null, dirty = false;

  dirty = true; setStat();
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); dirty = false; }
    catch(e){ console.warn('localStorage no disponible', e); }

}
/* ── EL INTERÉS, LEÍDO CLAVE POR CLAVE ────────────────────────────────────────
   La versión anterior preguntaba `o ? o.jp : p.jp`: si EXISTÍA la entrada
   guardada, devolvía su campo — aunque ese campo no estuviera. Con un viajero
   agregado después, todo lugar que alguien hubiera tocado alguna vez devolvía
   undefined para el nuevo, y ese undefined se propagaba a todos lados:
   class="ib vundefined", (undefined+1)%3 = NaN que se guardaba como null, el
   filtro «lo quieren» siempre falso y su columna de costos clavada en cero.
   Ahora se pregunta por LA CLAVE (`vid in o`), así que una entrada vieja a la
   que le falta un viajero cae al default del catálogo, que es lo correcto.
   Esto vale con o sin viajeros nuevos: era un bug de hoy. */
function interest(id){
  const p = PBY[id] || {};
  const o = (S.interest || (S.interest = {}))[id] || {};
  const out = {};
  for (const vid of VIDS){
    const v = (o && vid in o) ? o[vid] : p[vid];
    out[vid] = (v === 0 || v === 1 || v === 2) ? v : 1;
  }
  return out;
}
/* Guarda SOLO la clave que se tocó. La versión anterior congelaba el lugar
   entero al primer toque, y desde ese momento esa entrada dejaba de escuchar al
   catálogo para todos los viajeros, no solo para el que se tocó. */
function setInterest(id, vid, val){
  if (!VBY[vid]) return;                       // clave muerta: no se escribe basura
  val = (val === 0 || val === 1 || val === 2) ? val : 1;
  if (!S.interest) S.interest = {};
  if (!S.interest[id]) S.interest[id] = {};
  S.interest[id][vid] = val; save();
}

/* IMPRESCINDIBLE: marca sí / vacío. Igual que el interés, el default sale del catálogo
   (editable desde el Excel) y lo que toques acá lo pisa y queda guardado en este navegador. */
/* La marca de un lugar tiene TRES estados:
     1  ★ imprescindible  · tiene que entrar en el itinerario
    -1  ✕ no imprescindible · lo descartaste a proposito
     0  sin marcar        · todavia no lo decidiste
   Si el navegador no tiene nada guardado, manda el valor del catalogo (lo que ve el otro).
   Compatibilidad: la version anterior guardaba 0 al DES-marcar una estrella, o sea
   "esto no es imprescindible" — que es exactamente el nuevo -1. Por eso 0 guardado = -1. */
function markOf(id){
  const s = S.must || (S.must = {});
  if (!(id in s)){ const d = PBY[id] && PBY[id].must; return d === -1 ? -1 : d ? 1 : 0; }
  const v = s[id];
  return v > 0 ? 1 : v < 0 ? -1 : 0;
}
function cycleMark(id){
  const m = markOf(id);
  (S.must || (S.must = {}))[id] = m === 0 ? 1 : m === 1 ? -1 : 0;   // ☆ → ★ → ✕ → ☆
  save();
}
/* La version anterior guardaba 0 al DES-marcar una estrella, o sea "esto NO es
   imprescindible" — que hoy es -1. Ahora 0 significa "sin marcar". Esta conversion
   corre una sola vez por navegador (la marca S.mv) para no dar vuelta el sentido. */
function normMarks(s){
  if (s.mv === 2) return s;
  const mm = (s.must && typeof s.must === 'object' && !Array.isArray(s.must)) ? s.must : {};
  for (const k of Object.keys(mm)) if (!mm[k]) mm[k] = -1;
  s.must = mm; s.mv = 2;
  return s;
}
const isMust  = id => markOf(id) === 1;
const isOut   = id => markOf(id) === -1;
const mustCount = () => PLACES.filter(p => isMust(p.id)).length;
const outCount  = () => PLACES.filter(p => isOut(p.id)).length;

const VER = DATA.ver || '—', VERID = DATA.verId || '';
/* ── ABRIR UN LUGAR EN GOOGLE MAPS ───────────────────────────────────────────
   Por orden de precisión, y el orden importa porque lo probamos:

   1 · `?cid=` abre LA FICHA EXACTA del negocio. Es lo que se saca del link que
       alguien pega (la segunda mitad del ftid !1s0x…:0x<cid>). Verificado
       contra el endpoint interno de Maps: cid=17751151207481345944 devuelve
       «Motorino Pizza · 139 Broadway, Brooklyn» y nada más.

   2 · nombre + dirección + ciudad. Es lo que usa el catálogo verificado y
       funciona bien: Maps muestra el lugar por su nombre.

   3 · coordenadas sueltas. OJO: `query=lat,lng` NO identifica nada — abre un
       pin mudo titulado con los grados, sin nombre ni ficha. Aun así es mejor
       que buscar por nombre cuando no hay dirección, porque cae en el punto
       correcto en vez de ofrecer tres homónimos. Fue exactamente el problema:
       «Motorino Pizza, New York» devuelve los tres Motorino de la ciudad.

   4 · nombre + barrio + ciudad, cuando no hay ni dirección ni coordenadas. */
function gmaps(p){
  const q = t => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t);
  if (p.gcid) return 'https://maps.google.com/?cid=' + encodeURIComponent(p.gcid);
  if (p.addr && !p.aprox) return q(p.n + ', ' + p.addr + ', ' + TRIP.ciudadBusqueda);
  if (tieneUbic(p)) return q(+p.lat + ',' + (+p.lng));
  return q(p.n + (p.hood ? ', ' + p.hood : '') + ', ' + TRIP.ciudadBusqueda);
}
/* ── Apple Maps ────────────────────────────────────────────────────────────────
   maps.apple.com/directions, el formato unificado de iOS 18.4 / watchOS 11.4:
   source, waypoint (se repite, una por parada intermedia), destination y mode.
   SIN source, Maps arranca desde donde esté parado el que abre el link — que es
   justo el punto: seguir la ruta desde donde estés. Iniciada la navegación en el
   iPhone, el Watch la toma solo y va dando los taps en la muñeca.
   Ojo con dos cosas: ?daddr=lat,lng (el formato viejo) dejó de andar en 18.4, y
   pasarle nombre + dirección en vez de coordenadas hace que Maps muestre el lugar
   por su nombre en vez de un pin mudo. */
const AM_CIUDAD = TRIP.zonas || {};
const AM_MAX = 15;   /* tope de paradas de una ruta en Maps: destino + 14 waypoints */
/* El nombre del catálogo lleva aclaraciones que a Maps le sobran y le empeoran la
   búsqueda: "Hotel Ink48 (29-31 ago)" encuentra peor que "Hotel Ink48". */
const amNombre = p => String(p.n || '').split(/\s+[—·(]/)[0].trim();
function amPunto(p){
  if (!p) return '';
  const ciudad = AM_CIUDAD[p.boro] || '';
  /* aprox = la dirección no se pudo verificar y el pin es del barrio: ahí el nombre
     manda, que lo busque Maps. Con dirección verificada, nombre + dirección. */
  const partes = (!p.aprox && p.addr) ? [amNombre(p), p.addr, ciudad]
                                      : [amNombre(p), p.hood, ciudad];
  return partes.filter(Boolean).join(', ') || (p.lat ? p.lat + ',' + p.lng : '');
}
/* Una ruta con todas las paradas en orden. La última es el destino, el resto van
   como waypoint. Sin source: Maps usa la ubicación actual. */
function amRuta(places, mode){
  const pts = places.map(amPunto).filter(Boolean).slice(0, AM_MAX);
  if (!pts.length) return '';
  const q = pts.slice(0, -1).map(t => 'waypoint=' + encodeURIComponent(t));
  q.push('destination=' + encodeURIComponent(pts[pts.length - 1]));
  q.push('mode=' + mode);
  if (mode === 'transit') q.push('transit-preferences=subway,bus');
  return 'https://maps.apple.com/directions?' + q.join('&');
}
/* ── Google Maps, el plan B ────────────────────────────────────────────────────
   Maps URLs (api=1): origin, destination, waypoints separados por | y travelmode.
   Sin origin arranca desde la ubicación del aparato, igual que Apple.
   EL LÍMITE MANDA EL DISEÑO: Google acepta hasta 3 waypoints EN NAVEGADOR MÓVIL
   (nueve en el resto de las plataformas), y los días tienen entre 6 y 11 paradas.
   Por eso la ruta se parte en tramos de 4 paradas — 3 waypoints + el destino —
   que es lo que entra seguro en el celular. Cada tramo arranca donde estés, así
   que al terminar uno se abre el siguiente y no hay que repetir la última parada. */
const GM_PARADAS = 4;
function gmRuta(places, mode){
  const pts = places.map(amPunto).filter(Boolean);
  if (!pts.length) return '';
  const q = ['api=1', 'travelmode=' + mode,
             'destination=' + encodeURIComponent(pts[pts.length - 1])];
  if (pts.length > 1) q.push('waypoints=' + pts.slice(0, -1).map(encodeURIComponent).join('%7C'));
  return 'https://www.google.com/maps/dir/?' + q.join('&');
}
/* Parte una lista en grupos de n, respetando el orden. */
function enTramos(arr, n){
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}
/* ── Lugares de paso ──────────────────────────────────────────────────────────
   Entre dos paradas consecutivas, qué del catálogo queda EN EL CAMINO. No son
   visitas y no tocan el itinerario: son referencia por si vale un desvío corto.

   La medida es el DESVÍO —cuánto se alarga el trayecto si paso por ahí,
   d(A,P) + d(P,B) - d(A,B)— y no la distancia al lugar, porque son preguntas
   distintas: el Puente de Brooklyn está a 800 m de DUMBO y cuesta CERO metros
   pasar por él, porque queda justo sobre la línea hacia el Oculus.

   Arriba de PASO_CORREDOR el tramo ya no se camina, se va en subte: ahí el
   corredor no existe (no pasás por el medio) y solo valen las puntas. */
const PASO_DESVIO = R.pasoDesvio;    /* m de desvío que se tolera en un tramo caminable */
/* En un tramo corto el desvío miente: si A y B están a 100 m, pasar por algo que está
   a la vuelta de la esquina "cuesta" 500 m y queda afuera. Por eso también entra lo
   que está a menos de PASO_CERCA de cualquiera de las dos puntas — es el caso del
   paseo por el Lower East Side, donde la parada siguiente está a una cuadra y el
   barrio entero está a tiro. */
const PASO_CERCA = R.pasoCerca;
const PASO_CORREDOR = R.pasoCorredor; /* m: hasta acá el tramo se hace a pie */
const PASO_PUNTA = R.pasoPunta;      /* m alrededor de cada punta en los tramos largos */
const PASO_TOP = R.pasoTop;          /* cuántos se muestran por tramo */
/* ACÁ CERCA: lo que está pegado a una parada, no en el camino hacia ella.
   Son preguntas distintas y confundirlas engaña. OddFellows está DENTRO de
   Domino Park, a 296 m del punto, y como referencia de tramo salía con
   «+591 m de desvío» colgado del traslado anterior — el número correcto es
   otro y el lugar donde mostrarlo también: va en la parada, mientras estás
   ahí parado una hora. */
const ACA_RADIO = R.acaRadio;       /* m alrededor de una parada */
const ACA_TOP = R.acaTop;
const PASO_FUERA = {transporte:1, alojamiento:1, evento:1, teatro:1};
/* Acá decía `hotel:1`, una categoría que nunca existió en CAT: la clave estaba
   muerta y no filtraba nada. Ahora se llama como la categoría de verdad.
   transporte y alojamiento son logística; evento y teatro tienen fecha, hora y entrada
   —Broadway no es un desvío de cinco minutos—. La música es el caso fino: un club
   de jazz cuesta $25-45 y hay que reservar, pero un bar con música en vivo se paga
   en la puerta y se entra sin nada. Solo pasa el segundo, y solo de noche: Bar
   Bayeux a las once de la mañana no es una referencia útil. */
const PASO_MUSICA_COVER = TRIP.musica.cover; /* hasta acá es cover de puerta, no una entrada */
const PASO_MUSICA_DESDE = TRIP.musica.desde; /* antes de esta hora un bar de música no sirve */
const esDesvioPosible = (p, horaTramo) =>
  p.cat !== 'musica' ? true
  : !p.book && (p.cost || 0) <= PASO_MUSICA_COVER && horaTramo >= PASO_MUSICA_DESDE;

function hav(a, b){
  const R = 6371000, r = Math.PI/180;
  const la1 = a[0]*r, la2 = b[0]*r, dla = (b[0]-a[0])*r, dlo = (b[1]-a[1])*r;
  const h = Math.sin(dla/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
/* Los de paso de un día entero: { idDelBloqueDestino: [{p, desvio}] }.
   Se calcula sobre el itinerario VIVO —no en el build— para que siga bien
   después de que Juan mueva, agregue o saque un bloque. */
function dePasoDelDia(d){
  const wd = DOW_IDX[d.dow];
  const usados = {};                     /* agendado en CUALQUIER día: no es novedad */
  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));
  const cand = PLACES.filter(p => p.lat && !usados[p.id] && !PASO_FUERA[p.cat]
    && VIDS.some(v => (p[v] || 0) > 0)   /* lo que TODOS bajaron a 0 está descartado */
    && horario(p, wd) !== 'CERRADO');    /* cerrado ese día no es una referencia útil */

  const paradas = paradasDe(d);

  /* PRIMERO lo que está pegado a una parada: si algo está a menos de ACA_RADIO
     de donde vas a estar, la respuesta útil es «lo tenés acá», no «te queda de
     camino». Se lo queda la parada MÁS cercana, y sale del reparto de tramos. */
  const aca = {}, tomadoAca = {};
  paradas.forEach(({b, p: A}) => {
    const a = [A.lat, A.lng];
    const hora = parseInt(String(b.t).slice(0, 2), 10);
    cand.forEach(q => {
      if (!esDesvioPosible(q, hora)) return;
      const dist = hav(a, [q.lat, q.lng]);
      if (dist > ACA_RADIO) return;
      if (!tomadoAca[q.id] || dist < tomadoAca[q.id].dist)
        tomadoAca[q.id] = {p: q, dist, destino: b.id};
    });
  });
  Object.values(tomadoAca).forEach(x => (aca[x.destino] = aca[x.destino] || []).push(x));
  Object.keys(aca).forEach(k => {
    aca[k].sort((x, y) => x.dist - y.dist);
    aca[k] = aca[k].slice(0, ACA_TOP);
  });
  const yaEnAca = {};
  Object.values(aca).flat().forEach(x => { yaEnAca[x.p.id] = 1; });

  /* Qué candidatos tiene cada tramo, ordenados por lo que cuesta pasar. */
  const tramos = [];
  for (let i = 0; i < paradas.length - 1; i++){
    const A = paradas[i].p, B = paradas[i+1].p;
    const a = [A.lat, A.lng], b = [B.lat, B.lng], dab = hav(a, b);
    const hora = parseInt(String(paradas[i+1].b.t).slice(0, 2), 10);   /* a qué hora se pasa */
    const lista = [];
    cand.forEach(p => {
      if (!esDesvioPosible(p, hora)) return;
      const q = [p.lat, p.lng], da = hav(a, q), db = hav(q, b);
      const desvio = da + db - dab;
      const entra = dab <= PASO_CORREDOR
        ? (desvio <= PASO_DESVIO || Math.min(da, db) <= PASO_CERCA)
        : Math.min(da, db) <= PASO_PUNTA;
      if (entra && !yaEnAca[p.id]) lista.push({p, desvio});
    });
    lista.sort((x, y) => x.desvio - y.desvio);
    tramos.push({destino: paradas[i+1].b.id, lista});
  }

  /* El reparto va en DOS vueltas, y el orden importa. Con solo "cada lugar al tramo
     donde menos cuesta", los tramos cortos del mismo barrio quedaban mudos: el
     domingo, el Tenement Museum y compañía se los llevaba el tramo de las 10:30 con
     un metro de desvío, y la caminata por el Lower East Side —que los tiene a todos
     a la vuelta— no mostraba nada.
     Primera vuelta: cada tramo se queda con su mejor candidato todavía libre, así
     ninguno con opciones se queda sin nada. Segunda: el resto se reparte al tramo
     donde menos cuesta. Un lugar sigue apareciendo UNA sola vez por día. */
  const tomado = {}, out = {};
  const poner = (destino, x) => { (out[destino] = out[destino] || []).push(x); tomado[x.p.id] = 1; };
  tramos.forEach(t => {
    const primero = t.lista.find(x => !tomado[x.p.id]);
    if (primero) poner(t.destino, primero);
  });
  const resto = {};
  tramos.forEach(t => t.lista.forEach(x => {
    if (tomado[x.p.id]) return;
    if (!resto[x.p.id] || x.desvio < resto[x.p.id].desvio) resto[x.p.id] = {...x, destino: t.destino};
  }));
  Object.values(resto).forEach(x => poner(x.destino, x));

  Object.keys(out).forEach(k => {
    out[k].sort((x, y) => x.desvio - y.desvio);
    out[k] = out[k].slice(0, PASO_TOP);
  });
  return {paso: out, aca};
}
/* ── Qué hay dentro de un barrio ──────────────────────────────────────────────
   Un bloque de "caminar un barrio" no es una parada: son horas sueltas en un
   polígono. Ahí la pregunta no es "qué queda en el camino" —no hay camino— sino
   "qué tengo alrededor mientras camino".
   Se toma por barrio Y por radio: el `hood` del catálogo es la definición
   administrativa y no siempre coincide con lo que uno camina. */
const BARRIO_RADIO = R.barrioRadio;  /* m alrededor del punto del barrio */
const BARRIO_TOP = R.barrioTop;
function enElBarrio(pb){
  if (!pb || pb.cat !== 'barrio' || !pb.lat) return [];
  const usados = {};
  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));
  const c = [pb.lat, pb.lng];
  return PLACES
    .filter(p => p.lat && p.id !== pb.id && !usados[p.id] && !PASO_FUERA[p.cat]
                 && VIDS.some(v => (p[v] || 0) > 0))
    .map(p => ({p, d: hav(c, [p.lat, p.lng])}))
    .filter(x => x.d <= BARRIO_RADIO || x.p.hood === pb.hood)
    .sort((x, y) => x.d - y.d)
    .slice(0, BARRIO_TOP);
}
/* Los mismos lugares, planos, para pintarlos en el mapa del día. */
function dePasoPlano(d){
  const r = dePasoDelDia(d);
  return Object.values(r.paso).flat()
    .concat(Object.values(r.aca).flat().map(x => ({p: x.p, desvio: x.dist})));
}
/* Las paradas de un día, en orden, sin repetir la misma dos bloques seguidos
   (el hotel al salir y al volver son dos paradas distintas; el mismo lugar en
   bloques pegados, una sola). */
function paradasDe(d){
  const out = [];
  d.blocks.forEach(b => {
    const p = b.pid ? PBY[b.pid] : null;
    /* ⚠ SIN COORDENADAS NO ES UNA PARADA para la geometría del día.
       amPunto() solo necesita un NOMBRE —le alcanza para armar un link de
       navegación— así que un lugar sin lat/lng entraba igual acá y después
       hav() lo comparaba contra todo el catálogo: distancia NaN, y como
       `NaN > ACA_RADIO` es false, se llevaba cuatro lugares de cualquier punto
       de la ciudad como «acá cerca» a NaN metros, robándoselos a las paradas
       reales. Con el catálogo editable desde la app, un lugar sin ubicación es
       un estado normal, así que esto pasó de hipótesis a certeza. */
    if (!tieneUbic(p)) return;
    if (!amPunto(p)) return;
    if (out.length && out[out.length - 1].p.id === p.id) return;
    out.push({b, p});
  });
  return out;
}
/* Un costo que no es número pintaba «$undefined» en nueve puntos. */
const money = n => { const v = +n; return !Number.isFinite(v) ? '—' : v === 0 ? 'gratis' : plata(v); };
/* El «por qué» recortado y escapado. p.why.slice reventaba en 4 puntos, y uno
   de ellos es el que arma el texto al agendar un lugar en un día. */
const why = (p, max) => { const w = String((p && p.why) || '');
  return w.length > max ? esc(w.slice(0, max)) + '…' : esc(w); };
/* El texto con el que un lugar entra a un día. Sin why, el nombre solo. */
const txtBloque = p => String(p.n || '') + (p.why ? ' — ' + String(p.why).slice(0, 120) : '');
const DIAS = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
/* Horario del lugar para un día de la semana (0=lunes). Devuelve null si no hay dato. */
function horario(p, wd){
  if (!p.hrs) return null;
  const w = p.hrs[wd];
  return w ? `${w[0]}–${w[1]}` : 'CERRADO';
}
/* Texto compacto de la semana entera, agrupando días con el mismo horario. */
function horarioSemana(p){
  if (!p.hrs) return '';
  const out = []; let ini = 0;
  for (let i = 1; i <= 6; i++){
    const a = JSON.stringify(p.hrs[i]), b = JSON.stringify(p.hrs[i-1]);
    if (a !== b){ out.push([ini, i-1]); ini = i; }
  }
  out.push([ini, 6]);
  return out.map(([a,b]) => {
    const w = p.hrs[a], r = a === b ? DIAS[a] : `${DIAS[a]} a ${DIAS[b]}`;
    return `${r}: ${w ? w[0]+'–'+w[1] : 'cerrado'}`;
  }).join(' · ');
}
/* ── El reloj ─────────────────────────────────────────────────────────────────
   `new Date().toISOString()` es UTC: en Nueva York (UTC-4) a partir de las 20:00
   locales devolvía el día SIGUIENTE, o sea que todas las noches del viaje —Birdland,
   el Vanguard, Café Wha— la app creía que ya era mañana. Va en hora local.
   `window.__NOW` existe solo para poder probar el "ahora" desde Playwright. */
function NOW(){ return window.__NOW ? new Date(window.__NOW) : new Date(); }
function hoyStr(){ const d = NOW();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
let TODAY = hoyStr();
const minOf = t => /^\d{1,2}:\d{2}$/.test(String(t)) ? (+String(t).slice(0,2))*60 + (+String(t).slice(3,5)) : null;
const minsNow = () => { const d = NOW(); return d.getHours()*60 + d.getMinutes(); };
const hhmmNow = () => { const d = NOW();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const enMin = m => m < 60 ? m + ' min' : Math.floor(m/60) + ' h' + (m%60 ? ' ' + (m%60) + ' min' : '');

/* ── leadOf: jerarquía, no tijera ─────────────────────────────────────────────
   Los textos del catálogo ya vienen con una estructura: ★ al principio para lo
   destacado, y un separador temprano —" — ", ". " o ": "— entre el QUÉ y el
   POR QUÉ. Se parte ahí. El resto NO se pierde: se muestra entero al desplegar.
   El ":" se exige precedido de algo que no sea dígito para no cortar en "125 St: 12". */
function leadOf(txt){
  let t = String(txt == null ? '' : txt).trim(), star = 0;
  const m = t.match(/^([★☆]+)\s*/);
  if (m){ star = m[1].length; t = t.slice(m[0].length); }
  const cands = [];
  const cab = t.slice(0, 100);
  const e = cab.search(/\s[—–]\s/);       if (e > 6)  cands.push([e, 3]);
  const p = cab.search(/\.\s/);           if (p > 10) cands.push([p, 2]);
  const c = cab.search(/[^\d]:\s/);       if (c > 10) cands.push([c + 1, 2]);
  cands.sort((a, b) => a[0] - b[0]);
  let head, rest;
  if (cands.length){ head = t.slice(0, cands[0][0]).trim(); rest = t.slice(cands[0][0] + cands[0][1]).trim(); }
  else if (t.length > 92){ const sp = t.lastIndexOf(' ', 92);
    head = t.slice(0, sp > 20 ? sp : 92).trim() + '…'; rest = t; }
  else { head = t; rest = ''; }
  return {star, head, rest, full: t};
}
/* El catálogo escribe en MAYÚSCULAS dos cosas distintas: advertencias
   ("CIERRA LOS SÁBADOS", "RESERVA NO MODIFICABLE") y énfasis o nombres propios
   ("el MET", "SUMMIT", "JOSHUA REDMAN"). Marcar cualquier mayúscula encendía el ⚠
   en 51 de 143 bloques y dejaba de significar algo. Con este vocabulario quedan 28,
   y los 28 son advertencias de verdad: si el ⚠ aparece, hay que abrir el bloque. */
const RX_AVISO = /\b(NO|OJO|CIERRA|CERRAD[AO]S?|S[ÁA]BADOS?|DOMINGOS?|LUNES|MARTES|MI[ÉE]RCOLES|JUEVES|VIERNES|RESERVAR?|RESERVAD[AO]S?|MODIFICABLE|OBLIGAD[AO]S?|LLEGAR|SALIR|SALIDA|[ÚU]LTIM[AO]S?|M[ÁA]XIMO|M[ÍI]NIMO|TIMED|TICKET|AGOTAD[AO]S?|PEDIR|COMPRAR|EVITAR|CUIDADO|IMPRESCINDIBLE|PREINSCRIPCI[ÓO]N|HORARIO|ASIGNADO|PUNTUAL|CONFIRMAR|VERIFICAR|ANTES|EXACT[AO]S?|CUPO|FILA|COLA)\b/;
const tieneAviso = rest => RX_AVISO.test(String(rest || ''));

/* Índice del bloque que toca AHORA en un día: el último cuya hora ya pasó.
   Devuelve -1 si el día no es hoy o si todavía no arrancó. */
function idxAhora(d){
  if (!d || d.date !== TODAY) return -1;
  const m = minsNow(); let idx = -1;
  d.blocks.forEach((b, i) => { const t = minOf(b.t); if (t != null && t <= m) idx = i; });
  return idx;
}

function setStat(){
  const tot = S.itin.reduce((a,d) => a + d.blocks.length, 0);
  const dn  = S.itin.reduce((a,d) => a + d.blocks.filter(b => b.done).length, 0);
  const d = S.itin.find(x => x.n === S.day);
  /* Parado en la calle, "0/143" no dice nada: lo que importa es cómo va HOY.
     El estado de guardado se cuenta acá para que la barra no necesite el botón. */
  $('#stat').innerHTML = (S.tab === 'itin' && d)
    ? `<b>${d.blocks.filter(b => b.done).length}/${d.blocks.length}</b> del día ${d.n}` +
      `<span style="opacity:.55"> · ${dn}/${tot} en total${dirty ? ' · guardando…' : ''}</span>`
    : `<b>${dn}/${tot}</b> bloques hechos`;
  $('#bSave').textContent = dirty ? 'Guardando…' : 'Guardado ✓';
}

function importarLista(){
  pedirQuienSoy(() => planSheet('Importar una lista de Google Maps',
    'Pegá el archivo que te dio Google: el <b>CSV</b> de una lista de Takeout, el ' +
    '<b>Saved Places.json</b>, el <b>KML</b> de Mis Mapas, o una pila de links (uno por línea).<br>' +
    '<b>El link de una lista no sirve</b>: Google no deja leerla desde el navegador. ' +
    'Hay que bajar el archivo desde takeout.google.com o «Mis Mapas → Exportar a KML».',
    '', [{t: 'Leer', f: txt => {
      const filas = leerListaGoogle(txt);
      if (!filas || !filas.length){ toast('No reconocí ese formato'); return; }
      document.getElementById('planSheet').remove();
      revisarLista(filas);
    }},
    {t: 'Desde archivo', f: () => {
      const f = document.createElement('input');
      f.type = 'file'; f.accept = '.csv,.json,.kml,.txt,text/csv,application/json';
      f.onchange = () => { const r = new FileReader();
        r.onload = () => { const filas = leerListaGoogle(r.result);
          if (!filas || !filas.length){ toast('No reconocí ese formato'); return; }
          document.getElementById('planSheet').remove(); revisarLista(filas); };
        r.readAsText(f.files[0]); };
      f.click(); }}], true));
}

/* NO se importa a ciegas. Una lista de Google no trae categoría ni barrio —que
   el catálogo necesita— y trae duplicados de lo que ya está cargado. Además, a
   139 filas, un error que se ve recién después es carísimo de deshacer. */
function revisarLista(filas){
  /* La reconciliación: lo que ya se miró en una importación anterior no se
     vuelve a ofrecer. Sin esto, reimportar la lista para traer los nuevos
     obligaría a destildar de nuevo los cien de la vez pasada. */
  const vistos = new Set();
  Object.values(S.listas || {}).forEach(L => (L.vistos || []).forEach(k => vistos.add(k)));
  const clave = x => x.gcid ? 'c:' + x.gcid : 'n:' + normNom(x.n);
  const nuevas = filas.filter(x => !vistos.has(clave(x)));
  const repetidas = filas.length - nuevas.length;

  if (!nuevas.length){
    sheet(`<h2 style="font-size:17px;margin-bottom:5px">Nada nuevo</h2>
      <p class="sm muted">Las ${filas.length} filas de esta lista ya se miraron antes.
      Cuando agregues lugares en Google Maps y vuelvas a exportar, van a aparecer acá.</p>
      <button class="btn" onclick="closeSheet()" style="margin-top:11px">Cerrar</button>`);
    return;
  }
  const conUbic = nuevas.filter(tieneUbic).length;
  const dups = nuevas.map(yaEsta);

  sheet(`<h2 style="font-size:17px;margin-bottom:3px">Revisar antes de importar</h2>

      <label class="fl" style="flex:1;margin:0">Categoría para todos
        <select class="search" id="liCat">${Object.entries(CAT).map(([k, v]) =>
          `<option value="${k}"${k==='comida'?' selected':''}>${esc(v.n)}</option>`).join('')}</select></label>

        padding:6px 4px;border-bottom:1px solid var(--line)">

            ${dups[i] ? ' · <b style="color:var(--accent)">' + esc(dups[i]) + '</b>' : ''}</span>
          ${x.why ? `<span class="xs muted" style="display:block;font-style:italic">${esc(x.why.slice(0,110))}</span>` : ''}

    </div>
    <div class="flex" style="margin-top:12px;justify-content:flex-end">
      <button class="btn ghost sm" id="liNada" style="margin-right:auto">No importar ninguno</button>

    .map(e => nuevas[+e.dataset.i]);
  $('#liCancel').onclick = closeSheet;

     no me sirve» sin tener que destildar cien casillas cada vez. */
  $('#liNada').onclick = () => guardarLista(filas, []);
  $('#liOk').onclick = () => guardarLista(filas, marcados());
