a «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒104-0045 Tokyo, Chuo City, Tsukiji, 4 Chome−1−9 築地大和ビル 1階","lat":35.6672724,"lng":139.7684487,"aprox":false,"gcid":"7209747445854948254","cost":0,"dur":0,"sub":"-","typ":"Ramen","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Sin nombre, pero Tsukiji 4-1-9 (1er piso) está en pleno mercado exterior de Tsukiji: casi seguro comida.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_10494156101364676452","n":"Matcha stand IPPUKU -wabisabi- 築地店","cat":"comida","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒104-0045 Tokyo, Chuo City, Tsukiji, 4 Chome−9−7 住吉市場内 1階","lat":35.6656787,"lng":139.769837,"aprox":false,"gcid":"10494156101364676452","cost":0,"dur":0,"sub":"-","typ":"Casa de té","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Sin nombre: Tsukiji 4-9-7, dentro del mercado Sumiyoshi. Es un puesto del mercado exterior; no sé cuál.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_7690982991018637456","n":"Glitch Coffee and Roasters GINZA","cat":"comida","hood":"Chūō","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón, 〒104-0061 Tokyo, Chuo City, Ginza, 4 Chome−14−8 VORT銀座イーストIII 1階","lat":35.6688762,"lng":139.7686826,"aprox":false,"gcid":"7690982991018637456","cost":0,"dur":0,"sub":"-","typ":"Café","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Glitch Coffee and Roasters GINZA","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Tokio","rate":0,"tip":"","season":"","conf":"","warn":[],"refs":[]},{"id":"u_g_5537097326964975776","n":"Minoh Falls","cat":"parque","hood":"Osaka","why":"Cascada de 33 m al final de un sendero pavimentado de 2,7 km que sale de la estación Hankyu Minoo, 40-50 min de caminata en subida suave junto al río; opera todo el año y no depende de teleféricos ni rutas de montaña. Es un paseo de bosque a media hora de Umeda (280 yenes por trayecto, ~25 min, transbordo en Ishibashi-handai-mae), gratis y sin horario, pero en la ventana del viaje llega flojo: el pico del koyo es la segunda quincena de noviembre y solo quedan restos hasta los primeros días de diciembre, y el sol se pone alrededor de las 16:50 —antes dentro del desfiladero— en un camino que fuera de los eventos de luces no está iluminado. Lo de la iluminación está abierto: la de Navidad 2025 (20 al 25/12) se canceló por el incendio del local frente al salto, pero esa causa ya no corre —el sendero completo reabrió el 7/8/2026 y el parque volvió a iluminar en verano y en Silver Week de 2026—, así que puede haber edición de diciembre 2026 aunque al 9/9/2026 todavía no esté anunciada; rechequear mino-park.jp/event en noviembre. Sirve si quieren un día de aire y verde entre tanta ciudad, o para combinarlo con la comida del sendero (la tempura de hoja de arce es el snack clásico del camino, aunque japan-guide la ubica en temporada de otoño). No sirve como motivo para armar un día si el tiempo escasea: con 334 lugares y 25 días, esto se descarta antes que Nara o el centro de Osaka.","addr":"2-2 Minookoen, Minoh, Osaka 562-0002, Japón","lat":34.8538281,"lng":135.4719911,"aprox":false,"gcid":"5537097326964975776","cost":0,"dur":4,"sub":"Cascada y sendero de bosque","typ":"Cascada","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Minoh Falls","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Opera en diciembre y enero. No es alta montaña: el sendero es asfaltado, de baja altitud y sin cierre estacional, y ninguna fuente declara cierre invernal. Lo que sí desaparece en la ventana del viaje es el atractivo principal (hojas de otoño, con pico en la segunda quincena de noviembre). · Año nuevo (29/12 al 3/1): El parque no cierra: la ficha de la Prefectura de Osaka dice 24 h y sin días de cierre, y no hay entrada que cobrar. No es santuario, así que no recibe la avalancha de hatsumode. Lo que no verifiqué es qué tiendas y casas de té del sendero abren del 29/12 al 3/1: son negocios chicos de descanso irregular y varias cierran por Año Nuevo; asumir que van a poder comer ahí esos días es arriesgado.","conf":"media","warn":["La zona está bien asignada: Minoh (箕面市) es prefectura de Osaka, no está mal rotulado. Desde Hankyu Osaka-Umeda son ~25 min y 280 yenes por trayecto (560 ida y vuelta), con transbordo en Ishibashi-handai-mae.","Salir temprano. Con 40-50 min de caminata de ida, otro tanto de vuelta y puesta de sol cerca de las 16:50 (antes dentro del desfiladero), la última hora razonable para arrancar el sendero es alrededor de las 14:00. El camino no está iluminado fuera de los eventos de luces.","El sendero (滝道) estuvo cortado a repetición durante todo 2026: por el incendio de la tienda frente al salto (nov-2025, reabierto el 7/8/2026) y por obras de reparación de un derrumbe (19/1 a fines de abril de 2026). Hay obras pendientes de demolición detrás del local incendiado y una valla provisoria que angosta el camino. Rechequear mino-park.jp la semana previa.","Iluminación: la de Navidad 2025 (20 al 25/12) se canceló por el incendio; el parque ya volvió a iluminar en 2026 (verano y Silver Week) con el sendero reabierto, así que puede haber edición de diciembre 2026 aunque al 9/9/2026 no esté anunciada. Confirmar en mino-park.jp/event en noviembre.","El desvío de montaña que se usa cuando cortan el sendero principal es de tierra, con escaleras y desniveles: no pasan cochecitos ni sillas de ruedas. Si el corte vuelve, el paseo deja de ser una caminata fácil.","Al parque no entran autos, motos ni bicicletas; hay estacionamientos pagos fuera. Sin sentido con el tren tan cerca.","No hay cifra de Tabelog: es un parque, no un local."],"refs":["https://www.pref.osaka.lg.jp/shisetsu/o130140/shisetsu_000034.html","https://www.mino-park.jp/","https://www.mino-park.jp/about/182/","https://www.mino-park.jp/access/","https://www.mino-park.jp/article/1278/","https://www.mino-park.jp/article/1135/","https://minohkankou.net/information/%E3%80%90%E4%BA%88%E5%91%8A%E3%80%91%E7%AE%95%E9%9D%A2%E5%A4%A7%E6%BB%9D%E3%81%B8%E3%81%AE%E9%81%8A%E6%AD%A9%E9%81%93%E5%B7%A5%E4%BA%8B%E3%81%AB%E3%82%88%E3%82%8B%E9%80%9A%E8%A1%8C%E6%AD%A2%E3%82%81/","https://osaka-info.jp/en/spot/meiji-no-mori-mino-park/","https://www.japan-guide.com/e/e4019.html"]},{"id":"u_g_963425562183482676","n":"Templo Katsuo-ji","cat":"arq","hood":"Osaka","why":"Templo Shingon del siglo VIII en la sierra de Minoh, número 23 de la peregrinación Saigoku, conocido por el \"katsu-daruma\": miles de muñecos daruma rojos que los visitantes dejan por todo el recinto, sobre piedras, escalones, barandas y linternas. El atractivo real es ese, más el recorrido cuesta arriba entre bosque, puente y estanque con niebla artificial; arquitectónicamente es correcto pero no excepcional. No está en la ciudad de Osaka: es una excursión de medio día (metro Midōsuji + línea Kita-Ōsaka Kyūkō hasta Minoo-Kayano y bus de 20-30 min montaña arriba). En diciembre-enero es todo al aire libre y en pendiente, hace frío, y el horario normal es hasta las 17:00 (último ingreso 16:30) con el sol poniéndose entre las 16:47 (principios de diciembre) y las 16:56 (fin de mes), así que conviene ir a la mañana. El templo hace iluminación nocturna y en esos días abre hasta las 20:30 (Osaka Info), pero las fechas de la edición 2026 no están publicadas en el sitio oficial: si les interesa ir de tarde, hay que confirmarlas antes.","addr":"2914-1 Aomatani, Minoh, Osaka 562-8508, Japón","lat":34.8657752,"lng":135.491087,"aprox":false,"gcid":"963425562183482676","cost":500,"dur":4,"sub":"Minoh (sierra), prefectura de Osaka","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Templo Katsuo-ji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"No es montaña alpina ni tiene cierre estacional: está a unos 400 m en el parque cuasi-nacional de Minoh y la oficina de turismo de Osaka lo lista como abierto todo el año. Puede nevar puntualmente; no encontré ningún aviso de suspensión invernal del bus ni de la ruta. · Año nuevo (29/12 al 3/1): Abierto y es uno de los destinos fuertes de hatsumōde en el área de Osaka: se reza por \"katsu-un\" (fortuna para ganar), así que 31/12 al 3/1 hay mucha gente y el bus desde Minoo-Kayano se satura. En la temporada de Año Nuevo 2026 la entrada de 500 yenes fue gratis durante el período especial, hasta el 5 de enero (Weathernews; la fecha de inicio no la publican); para enero de 2027 todavía no está confirmado — Weathernews publica la ficha de hatsumōde 2027 recién en diciembre. Los horarios especiales de Nochevieja y Año Nuevo no figuran ni en el sitio oficial ni en las fuentes que revisé.","conf":"media","warn":["La zona está bien de prefectura (Minoh es Osaka) pero mal de escala: está a unos 25 km al norte del centro, en la sierra, no en la ciudad. Puerta a puerta desde Umeda/Namba son 1h-1h15 por lado. Entra al viaje solo si se le dedica una mañana entera, no como parada suelta.","El bus es el cuello de botella. Línea 30 de Hankyu Bus desde Minoo-Kayano: en día de semana sale cada 30 min de 9:00 a 15:00 (última ida 15:00) y la última vuelta desde la parada Katsuo-ji es 17:05. Si se pierde el último bus, la salida es taxi (~15 min a la estación).","Del 31/12 al 3/1 esperar colas largas y buses llenos: es templo de hatsumōde muy convocante.","Entrada gratis durante el período especial de Año Nuevo, hasta el 5 de enero: eso pasó en enero de 2026. Para enero de 2027 no está anunciado todavía. No contar con eso.","El estacionamiento para autos particulares pasó a reserva obligatoria los fines de semana, feriados y Año Nuevo (aviso oficial del 1/4/2026). Irrelevante si van en bus, crítico si alquilan auto.","Recinto grande, en cuesta y con escalones, todo a la intemperie: en diciembre-enero calzado cómodo y abrigo, y visita de mañana porque a las 16:30-17:00 ya está oscuro y cerrando."],"refs":["https://katsuo-ji-temple.or.jp/access/index.php","https://katsuo-ji-temple.or.jp/","https://katsuo-ji-temple.or.jp/news/583/","https://katsuo-ji-temple.or.jp/news/19311/","https://katsuo-ji-temple.or.jp/pray/event/winter.php","https://osaka-info.jp/en/spot/katsuoji/","https://weathernews.jp/hatsumoude/spot/3603011/","https://ekitan.com/timetable/route-bus/company/5146/1150278/1140547/d1","https://ekitan.com/timetable/route-bus/company/5146/1100658/1140547/d1"]},{"id":"u_g_14595198704287762144","n":"Tower Slider (Tsutenkaku)","cat":"mirador","hood":"Osaka","why":"No es un mirador: es un tobogán de acero de 60 m que baja en espiral por afuera del ascensor del Tsutenkaku, del piso 3 (22 m) al subsuelo, en unos 10 segundos, con casco puesto y dentro de un tubo cerrado. El mirador es otra cosa y se paga aparte: la entrada al observatorio son ¥1.500 y el Tower Slider ¥1.100 más, o sea ~¥2.600 por cabeza para 10 segundos de tobogán, con espera el día de la visita que la propia web reconoce sin cuantificar. Como dupla de adultos foodies, lo que justifica ir a Shinsekai es el barrio y el kushikatsu, no esto; si igual suben, el Tsutenkaku abre hasta las 21:45, así que el atardecer temprano (el sol se pone cerca de las 16:50 a fin de diciembre) no molesta y la torre iluminada de noche rinde más que de día. Dato que cambia la cuenta: con el pase Osaka (大阪楽遊パス) tanto el observatorio como el tobogán entran gratis mostrando el QR — ahí el costo deja de ser el argumento y la única pregunta es la cola. Veredicto: descartable salvo que les copen las atracciones bobas; el observatorio solo, sin tobogán, es defendible como parada corta de paso.","addr":"1 Chome-18-6 Ebisuhigashi, Naniwa Ward, Osaka, 556-0002, Japón","lat":34.652454999999996,"lng":135.5064993,"aprox":false,"gcid":"14595198704287762144","cost":2600,"dur":1.5,"sub":"Tobogán-atracción dentro del Tsutenkaku, Shinsekai","typ":"Observatorio","book":"","free":"","closed":"","main":false,"costN":"⚠ sin clasificar: no encaja en ninguna categoría. Es el tobogán-atracción que baja por la Tsutenkaku, no un mirador en sí; no hay categoría de atracción, se agrupa con la torre","src":"lista","gname":"Tower Slider (Tsutenkaku)","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Figura como 無休 (sin días de cierre) en la ficha oficial del Osaka e-Pass, y la web del Tsutenkaku no publica ningún aviso de cierre de fin de año. Los horarios especiales del 31/12 y 1/1 no están publicados todavía: la propia web dice que cualquier cambio de horario o cierre temporal se anuncia en su cuenta oficial de X. Hay que reconfirmar sobre la fecha.","conf":"alta","warn":["No está incluido en la entrada al observatorio. Son dos tickets: observatorio ¥1.500 (adultos 15+) + Tower Slider ¥1.100. Total ¥2.600 por persona.","Restricciones duras: solo 7 a 65 años (66+ no puede), mínimo 120 cm, máximo 120 kg. Prohibido a embarazadas, con alcohol encima, y a quien tenga problemas de corazón, huesos o equilibrio, propensión al mareo, o sensibilidad a la luz, la altura o los espacios cerrados. Casco obligatorio y todo (bolsos, teléfono) va a un locker gratuito.","El ticket del Tower Slider también exige reservar horario de entrada al comprarlo, y la web oficial recomienda comprarlo online por anticipado (ars-tsutenkaku.triplabo.jp); avisa que después del atardecer las entradas se pueden agotar. Igual puede haber espera el día de la visita; la web no publica cuánta. Si van con el pase Osaka (楽遊パス), ahí sí el canje es presencial: se cambia el QR por un turno horario en el mostrador del piso 1 el mismo día.","La torre exige reserva de horario de entrada para cualquier ticket y a la tarde se agota. Comprar online antes.","El propio Tower Slider cierra sin previo aviso por temperatura alta o baja, sequedad, humedad o condensación (así lo dice la web oficial). En diciembre, con frío, es un riesgo concreto: conviene confirmar que está operando antes de pagar los ¥1.100."],"refs":["https://www.tsutenkaku.co.jp/tour/tower-slider.html","https://www.tsutenkaku.co.jp/annai/index.html","https://www.e-pass.osaka-info.jp/jp/facility/detail?id=240","https://www.e-pass.osaka-info.jp/jp/facility/detail?id=14"]},{"id":"u_g_10259376924244450706","n":"WAREWAREWA","cat":"comida","hood":"Osaka","why":"Café de desayuno japonés en Honmachi (Chuo-ku, Osaka), del grupo パンとエスプレッソと — es su único local de formato washoku, no una panadería más. Lo que se come es una bandeja de mini-onigiri sobre hoja de bambú con guarniciones (huevo, salmón y otros acompañamientos), sopa de miso y té; también hay chazuke de dashi y bebidas de matcha o hōjicha (latte y float). Tabelog 3,54 con 455 reseñas, que para un café es alto. Sirve para resolver un desayuno de verdad a las 8 de la mañana en el centro de Osaka: abre 8:00 y cierra 17:00, así que no es opción para cena ni para la tarde-noche de diciembre.","addr":"3 Chome-1-20 Kyutaromachi, Chuo Ward, Osaka, 541-0056, Japón","lat":34.681149399999995,"lng":135.5025781,"aprox":false,"gcid":"10259376924244450706","cost":1500,"dur":1,"sub":"Desayuno / café — cocina japonesa","typ":"Café","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"WAREWAREWA","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.54,"tip":"La おにぎり定食 / bandeja de mini-onigiri con guarniciones, sopa de miso y té (menú de mañana, 8:00–11:00); la carta de la mañana tiene tres opciones, entre ellas chazuke de salmón con dashi (la versión fría, 冷やし出汁茶漬け, es solo de verano y en diciembre no está). También matcha o hōjicha, en latte y en float. NO se puede reservar (Tabelog: \"Reservations unavailable\") y son solo 20 asientos: una nota de 2024 dice que se llena ~30 minutos después de abrir, así que hay que caer a las 8:00 o bancarse cola. Es CASHLESS ONLY — no toman efectivo; sí tarjetas (Visa/Master/JCB/Amex/Diners), IC de transporte y QR.","season":"","conf":"alta","warn":["Solo pagos sin efectivo (cashless only): sin tarjeta o IC no se come acá.","No acepta reservas y tiene 20 asientos; se llena cerca de media hora después de abrir. Ir 8:00 en punto.","Cierra 17:00 y el cierre semanal es irregular (不定休): confirmar por su Instagram @warewarewa.renewal el día antes.","No verificamos si abre entre el 29/12 y el 3/1. Muchos cafés de Osaka cierran esos días — chequear antes de contar con él para un desayuno de shōgatsu.","Es desayuno/almuerzo temprano, no sirve para cena.","La zona del catálogo es correcta: Kyutaromachi 3-1-20 es Honmachi, Chuo-ku, Osaka ciudad, a 2-3 minutos a pie de la estación Honmachi (Metro)."],"refs":["https://tabelog.com/en/osaka/A2701/A270106/27120812/","https://bread-espresso.jp/shop/warewarewa.html","https://r.gnavi.co.jp/gh13jn6z0000/","https://asajikan.jp/article/276167"]},{"id":"u_g_11434774819813114308","n":"aoma coffee","cat":"comida","hood":"Osaka","why":"Tostador de specialty de tueste claro en el distrito de oficinas de Senba, abierto en julio de 2020 por Hiroshi Aono, a 338 m de la estación Honmachi. Tabelog 3,24 con 84 reseñas: sólido para un coffee stand, no un destino por sí mismo. Es literalmente una barra: seis lugares, la mayoría toma parado o se lo lleva, y el foco está en filtrados de origen único que rotan (Kenia, Etiopía, Honduras, Perú, Brasil). Encaja como parada de café de media mañana o de sobremesa temprana caminando por Honmachi, nunca como plan propio: abre 10:00 y cierra 17:00, así que no sirve ni para desayuno temprano ni para merienda de tarde-noche.","addr":"Japón, 〒541-0056 Osaka, Chuo Ward, Kyutaromachi, 3 Chome−4−2 WRAP/英守大阪ビル１F","lat":34.681434599999996,"lng":135.5024135,"aprox":false,"gcid":"11434774819813114308","cost":900,"dur":0.5,"sub":"Honmachi / Senba (Chuo-ku)","typ":"Café","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Sin nombre. Planta baja de un edificio en Kyutaromachi (Semba, zona de oficinas): puede ser café, restaurante o tienda.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.24,"tip":"Filtrado de origen único de tueste claro (la carta de granos rota: hoy Honduras, Etiopía, Perú, Kenia y Brasil; se elige en el mostrador). Si no, latte con la mezcla de temporada ¥650, espresso ¥550, americano helado ¥650; leche de avena +¥50. NO es solo efectivo: Tabelog verifica tarjeta, dinero electrónico y PayPay. No se reserva ni hay cola formal, pero con seis lugares en horario pico se toma parado o para llevar. Venden grano para llevar a casa, ¥2.600-3.600 la bolsa.","season":"Año nuevo (29/12 al 3/1): Sin confirmar para 2026-27. El precedente verificado es el aviso de su propio blog publicado el 28/12/2025: abrieron el 31/12 de 10 a 17 como último día, cerraron del 1 al 3 de enero de 2026 y reabrieron el 4/1. La edición 2026-27 todavía no está anunciada; si repiten el patrón, del 1 al 3 de enero de 2027 está cerrado.","conf":"alta","warn":["Cierre irregular (不定休): no hay día fijo de descanso. Confirmar en @aomacoffee de Instagram antes de cruzar la ciudad.","Abre 10:00 y cierra 17:00. No sirve como opción de desayuno ni de merienda tardía; solo café de media mañana o sobremesa de almuerzo.","Shōgatsu: el año pasado cerró del 1 al 3 de enero. Las fechas 2026-27 NO están publicadas todavía — verificar en diciembre.","Seis lugares nada más. Con dos personas y horario de oficina puede tocar tomarlo parado o para llevar; en diciembre a la intemperie eso importa."],"refs":["https://tabelog.com/en/osaka/A2701/A270106/27118471/","https://aomacoffee.com/blogs/%E3%83%8B%E3%83%A5%E3%83%BC%E3%82%B9/%E5%B9%B4%E6%9C%AB%E5%B9%B4%E5%A7%8B%E5%96%B6%E6%A5%AD%E3%81%AE%E3%81%8A%E7%9F%A5%E3%82%89%E3%81%9B-4","https://aomacoffee.com/","https://danielfooddiary.com/2025/01/10/aomacoffee/"]},{"id":"u_g_18216687611946411123","n":"Star Rist","cat":"comida","hood":"Osaka","why":"Descartar. No es un bar de autor ni un izakaya de comer: es un salón de fiestas privadas en el 4º piso de un edificio de Ohatsu Tenjin (Umeda), pensado para 二次会 de casamiento y despedidas — sofás reclinables, dardos, karaoke, billar, hasta 124 personas, y cursos de 3.000-5.500 yenes con barra libre de 2-3 horas. La carta es pizza, pasta, tabla de embutidos, frituras y snacks: nada de lo que dos foodies van a buscar a Japón. Tabelog le da 3,00 con 10 reseñas, que es literalmente el piso por defecto de la plataforma (no un puntaje ganado). Abre a las 18:00 y cierra a las 5:00; el mediodía es solo con reserva de grupo.","addr":"Japón, 〒530-0057 Osaka, Kita Ward, Sonezaki, 2 Chome−5−20 お初天神ビル 4F","lat":34.699510599999996,"lng":135.5007369,"aprox":false,"gcid":"18216687611946411123","cost":3500,"dur":2,"sub":"bar de eventos privados","typ":"Bar","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Star Rist","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.0,"tip":"Cursos de fiesta de 3.000 a 5.500 yenes: 3.000 son 4 platos con 2 h de barra libre, 3.500 son 6-7 platos con 2 h, y desde 4.000 la barra libre pasa a 3 h. Hay además un plan de 2.500 de lunes a jueves para grupos de 15+ con dardos y billar incluidos. A la carta pizza (margherita, quattro formaggi, teriyaki, 750 c/u), pasta (napolitana 800), tabla de embutidos (500), frituras y snacks (edamame, frutos secos, papas 400) y postres. Se reserva por teléfono (06-6755-4505); Hot Pepper toma reservas hasta las 2:00 del día previo. No publican política de cancelación en ninguna de las fuentes. Aceptan VISA, Master, Amex, Diners, JCB, Discover, UnionPay, dinero electrónico (Suica, ICOCA, iD, QUICPay) y pagos QR tipo PayPay: no es solo efectivo. El almuerzo NO se puede caer sin reserva.","season":"Año nuevo (29/12 al 3/1): Hot Pepper y el sitio propio declaran 年中無休 (abierto todo el año, sin día de descanso), pero ninguno publica un aviso específico de 年末年始, así que si abre el 29/12–3/1 no está confirmado. Da igual: no vale el viaje.","conf":"alta","warn":["Recomendado descartar: es un salón para fiestas privadas y segundos tiempos de casamiento (hasta 124 personas, dardos, karaoke, billar), no un bar de barra ni un lugar de comer.","El 3,00 de Tabelog es el valor por defecto de la plataforma con solo 10 reseñas — no indica calidad, ni buena ni mala.","Carta italiana genérica (pizza, pasta, embutidos, frituras) en el barrio con más izakayas y kushikatsu de Osaka.","La zona SÍ está bien asignada: Kita-ku, Sonezaki, a 175 m de la estación Higashi-Umeda, pleno centro de Osaka.","Abre recién a las 18:00; el turno de mediodía es solo con reserva de grupo, no se cae sin avisar."],"refs":["https://tabelog.com/en/osaka/A2701/A270101/27146524/","https://www.hotpepper.jp/strJ003917070/","https://keku500.gorp.jp/"]},{"id":"u_g_5078452780384267527","n":"The Most Deserted Ramen-Bar in the World","cat":"comida","hood":"Osaka","why":"Ramen shoyu en el segundo piso del edificio de oficinas Nakanoshima Daibiru, a 3 minutos de la estación Watanabebashi (línea Keihan Nakanoshima), en pleno centro de Osaka. El nombre es un chiste al revés: tiene 3,69 en Tabelog con 2.479 reseñas y entró seis años seguidos en el Tabelog 100 de ramen (Ramen WEST 2020, 2021 y 2022; Ramen Osaka 2023, 2024 y 2025), así que hay cola en el pico del mediodía. Es del grupo UNCHI, los mismos de Jinrui Mina Menrui, y sigue operando (Retty publica ajustes de horario para agosto de 2026). Para diciembre-enero el detalle que manda es que está adentro de un edificio corporativo en un distrito de oficinas: Tabelog lista cierre de fin de año del 31/12 al 3/1, y aunque abriera, Nakanoshima en shōgatsu es un barrio vacío.","addr":"Japón, 〒530-0005 Osaka, Kita Ward, Nakanoshima, 3 Chome−3−23 2階","lat":34.6928221,"lng":135.4937501,"aprox":false,"gcid":"5078452780384267527","cost":1200,"dur":0.8,"sub":"Ramen shoyu","typ":"Ramen","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"The Most Deserted Ramen-Bar in the World","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.69,"tip":"El emblemático es WITCH'S RED, un shoyu equilibrado (¥800 en el relevamiento de menú de 2024); insideosaka lo describe con un amargor herbal leve y un toque de pimienta. Las otras dos líneas base son CAPTAIN GOLD (shoyu claro, ¥800) y KUROFUNE (shoyu intenso, ¥800), cada una con su variante con aceite de yuzu y picante a ¥840 (CAPTAIN GOLD COME BACK!! y KUROFUNE RETURN!!); hay una mazesoba, KANKO DORI (¥900). De 11:00 a 15:00 hay sets: +¥100 ramen con arroz (refill gratis), +¥200 con bol de cerdo, +¥250 con gyoza. Toppings: huevo ¥50, menma / cebolla / kimchi ¥100 cada uno, chashu ¥150; medio extra de fideo ¥100, kaedama ¥150. SOLO EFECTIVO: Tabelog y Retty coinciden en que no toman tarjeta ni pago digital. NO se reserva, se hace cola. 27 asientos (9 de barra y 18 de mesa); la ficha en inglés de Tabelog dice 42 pero desglosa los mismos 9+18. Conviene caer temprano: cierra antes si se les acaba el chashu (insideosaka), y el pico es el mediodía de días hábiles. Los precios son de 2024; Tabelog ubica el ticket real en ¥1.000-1.999 por persona, así que asumí que subieron. Como comparten platos, conviene pedir dos ramen distintos (uno GOLD, uno RED) y un gyoza.","season":"Año nuevo (29/12 al 3/1): La ficha de Tabelog lista como cierre de fin de año del 31 de diciembre al 3 de enero (el dato que figura es el de la temporada 2025-2026; el calendario 2026-2027 todavía no está anunciado en el sitio de UNCHI). Dar por hecho que del 31/12 al 3/1 está cerrado y confirmar por Instagram o Google unos días antes. Del 29 y 30 de diciembre no hay información. Sumado a eso, Nakanoshima es distrito de oficinas: en shōgatsu el barrio entero baja la persiana.","conf":"media","warn":["Solo efectivo. No toman tarjeta ni pago digital (verificado en Tabelog y Retty).","No se reserva. Se hace cola; el pico de almuerzo de días hábiles es el peor momento.","Las tres fuentes fetcheadas dan días de cierre distintos (sin cierre / lunes / domingos). Confirmar el mismo día antes de cruzar la ciudad.","Cierre de fin de año listado del 31/12 al 3/1 (dato de la temporada pasada, el calendario 2026-2027 no está publicado). No planificar este lugar dentro del shōgatsu.","Está en el piso 2 de un edificio de oficinas, no a la calle: buscar el acceso al Nakanoshima Daibiru, no un local con cortina.","La zona está bien asignada: es Osaka, Kita-ku, Nakanoshima, centro pleno. Watanabebashi (Keihan) a 3 minutos, Higobashi (Yotsubashi) a 8, Umeda a unos 20 minutos caminando.","Un aviso de cierre de 'último día del año' que circula en el sitio de UNCHI es de octubre de 2020 y está obsoleto: el local reabrió y sigue funcionando."],"refs":["https://tabelog.com/en/osaka/A2701/A270102/27077402/","https://retty.me/area/PRE27/ARE91/SUB9103/100000869320/","https://sekaiichi-ramen.com/","https://osakalucci.jp/sekahima-ramen","https://daibiru-tsushin.com/nakanoshima/sekaiichihimanaramenya.html","https://insideosaka.com/sekai-ichi-hima-na-ramen-ya-the-most-deserted-ramen-bar-in-the-world/","https://www.unchi-co.com/jinrui_renew_osakaopen/"]},{"id":"u_g_9705100202105808941","n":"Sukiyaki & Shabu-Shabu Kobe Beef IshidaHERBIS PLAZA Branch","cat":"comida","hood":"Osaka","why":"Sukiyaki y shabu-shabu de wagyu y carne de Kobe en el subsuelo B2 del shopping Herbis PLAZA, en Umeda, a 5 minutos a pie de Nishi-Umeda y de Kitashinchi y 8 de la estación de Osaka. Tabelog 3,42 con 275 reseñas: sólido, no excepcional. Lo que elogian es el servicio y que las 54 plazas estén todas en boxes privados; la queja que se repite es la relación precio-calidad (\"no sentí que valiera lo que gasté\"). La jugada acá es el ALMUERZO: el set (定食) de sukiyaki con Kobe especial sale ¥6.380 al mediodía, y el de kuroge wagyu (no Kobe) ¥4.180. De noche solo hay cursos completos —wagyu ¥9.680, Kobe magro ¥10.780, Kobe especial ¥14.080—; traen más comida (entrada, ~120 g de lomo, guarnición y cierre de udon o ramen), pero si el objetivo es probar carne de Kobe, el mediodía rinde el doble. Lo opera Dancin' Diner, un grupo gastronómico de Osaka con 17 locales, y este es el único con la marca Ishida: si van a pasar por Kobe o Kioto, ahí hay sukiyaki con más pedigrí por plata parecida.","addr":"Japón, 〒530-0001 Osaka, Kita Ward, Umeda, 2 Chome−5−25 ハービスPLAZA B2","lat":34.6991534,"lng":135.49335969999998,"aprox":false,"gcid":"9705100202105808941","cost":6380,"dur":1.5,"sub":"Sukiyaki y shabu-shabu de wagyu / carne de Kobe","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Sukiyaki & Shabu-Shabu Kobe Beef IshidaHERBIS PLAZA Branch","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.42,"tip":"A mediodía, el set (定食) de sukiyaki o de shabu-shabu: ¥2.310 con wagyu japonés común, ¥4.180 con kuroge wagyu, ¥6.380 con Kobe especial. La versión 御膳 (gozen), con más platos, cuesta ¥3.190 / ¥5.060 / ¥7.260. Lo más barato es el sukiyaki-don (すき焼き丼定食) a ¥1.870, o ¥5.940 con Kobe especial. A la noche solo hay cursos grandes: wagyu ¥9.680, Kobe magro ¥10.780, Kobe especial ¥14.080; incluyen entrada, verduras, huevo, tororo con encurtidos y cierre de udon (sukiyaki) o ramen (shabu-shabu). A la carta, 100 g de Kobe especial ¥7.480 y el strip loin de 60 g ¥11.000. Guarniciones baratas para compartir: verduras ¥924, arroz ¥330, udon o ramen ¥220, tororo con encurtidos ¥528. NO es solo efectivo: toma VISA, Mastercard, JCB, AMEX, Diners, UnionPay, dinero electrónico y pagos con QR. Se reserva (web, Ikyu o tel. 06-6442-3929) y conviene: hay penalidad del 100% si cancelan el mismo día y liberan la mesa a los 10 minutos de tardanza. Todos los asientos están en salas privadas: 54 lugares en 13 boxes (dos de 2 personas, nueve de 4, uno de 6 y uno de 8), así que compartir platos no molesta a nadie.","season":"Año nuevo (29/12 al 3/1): CERRADO el 31/12/2026 y el 1/1/2027: el shopping Herbis PLAZA cierra esos dos días (休館日｜2026年12月31日（木）、2027年1月1日（金・祝）, literal en herbis.jp) y el restaurante declara seguir su calendario (d-diner.net: 定休日 ハービスPLAZAに準ずる). El 29, 30 de diciembre y del 2 de enero en adelante debería abrir con horario normal, pero a septiembre de 2026 Herbis todavía no publicó ningún aviso de horarios especiales de año nuevo: los shoppings de Umeda suelen recortar esos días, así que si caen el 2 o el 3 de enero confirmen por teléfono (06-6442-3929) antes de cruzar.","conf":"media","warn":["La zona está bien asignada: es Umeda, Kita-ku, ciudad de Osaka, prefectura de Osaka. Subsuelo B2 del shopping Herbis PLAZA, 5 min a pie de Nishi-Umeda y Kitashinchi, 8 min de la estación de Osaka.","CERRADO el 31/12/2026 y el 1/1/2027 (cierre del shopping Herbis PLAZA, verificado en herbis.jp para la edición 2026-27).","Herbis no publicó todavía (a septiembre de 2026) horarios especiales de año nuevo más allá de los dos días de cierre. Si van el 2 o el 3 de enero, confirmen el horario por teléfono: 06-6442-3929.","Almuerzo vs. cena: al mediodía hay set de Kobe especial a ¥6.380; de noche el mínimo es un curso de ¥9.680 (wagyu) y el de Kobe especial cuesta ¥14.080. Los cursos de noche traen más comida (entrada, ~120 g, shime), pero si el objetivo es probar carne de Kobe, el almuerzo rinde mucho más.","Reserva con penalidad del 100% si cancelan el mismo día y liberan la mesa a los 10 minutos de tardanza — riesgoso si el día viene con trenes llenos de shōgatsu.","Lo opera Dancin' Diner, grupo gastronómico de Osaka con 17 locales; este es el único con la marca Kobe Gyu Ishida.","Cierra entre las 15:00 y las 17:00 — no sirve para tapar el bache de la tarde. Última orden de almuerzo, 14:30."],"refs":["https://tabelog.com/en/osaka/A2701/A270101/27103871/","https://tabelog.com/en/osaka/A2701/A270101/27103871/dtlmenu/","https://tabelog.com/en/osaka/A2701/A270101/27103871/dtlmenu/lunch/","https://d-diner.net/brands/ishida_herbis/","https://d-diner.net/brands/","https://www.herbis.jp/","https://www.herbis.jp/news/"]},{"id":"u_g_6563931466028447156","n":"Gensei","cat":"comida","hood":"Osaka","why":"Es 石挽き十割蕎麦 玄盛 北新地本店 (Ishibiki Juwari Soba Gensei), una soba-izakaya de cuatro pisos en Kitashinchi que muele su propio sarraceno y trabaja juwari: 100% sarraceno, sin harina de trigo como ligante en el fideo. Ojo: eso no lo vuelve apto para celiacos — el tsuyu estandar lleva salsa de soja con trigo y en la misma cocina se fríe tempura; el local no se declara gluten-free en ninguna fuente. Tabelog le da 3,49 con 876 resenas. Sirve dos cosas distintas segun la hora: al mediodia sets de soba desde 780 yenes sin reservas y por orden de llegada, y de noche una izakaya de soba con sake que de lunes a viernes abre hasta las 3:30 de la manana, lo que la vuelve la comida tardia de la zona de bares. Su rareza es la wanko soba, el ritual de Iwate de bochas chicas servidas sin parar, pero solo sabados, domingos y feriados y con reserva por telefono. No justifica cruzar Osaka, pero funciona bien si duermen en Umeda: esta en Sonezaki-Shinchi 1-10-6, a pasos de la estacion Kitashinchi (JR Tozai) y a unos 10 minutos a pie de Osaka Station.","addr":"Japón, 〒530-0002 Osaka, Kita Ward, 10, 曽根崎新地１−１０−６ 北新地シリウスビル 1～4F","lat":34.698074,"lng":135.49748499999998,"aprox":false,"gcid":"6563931466028447156","cost":3500,"dur":1,"sub":"Kitashinchi, Kita-ku, Osaka","typ":"Restaurante","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Sin nombre. Edificio de 4 pisos en Kitashinchi (barrio de restaurantes y bares nocturnos): casi seguro comida o bar, pero no sé cuál ni si tiene música en vivo.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.49,"tip":"Juwari soba (100% sarraceno en el fideo) fria en zaru o caliente. Almuerzo: set de mori soba con kayaku gohan y encurtidos, 780 yenes, sin reservas y por orden de llegada. Cena: carta de izakaya con sake; TableCheck vende un curso de 8 platos con 1,5 h de barra libre a 5.500 yenes, y 900 yenes extra agregan siete sakes a la barra libre. La wanko soba se sirve solo sabados, domingos y feriados y hay que reservarla por TELEFONO (06-6485-8810), con condiciones de cantidad minima que conviene preguntar al llamar: ninguna fuente publica su precio, hay que preguntarlo tambien. Tabelog confirma tarjeta, dinero electronico y pagos por QR: NO es solo efectivo. Presupuesto declarado en Tabelog: 1.000-1.999 yenes al mediodia y 3.000-3.999 de noche, aunque el set de almuerzo mas barato del menu arranca en 780 yenes.","season":"","conf":"alta","warn":["La zona esta bien asignada: es Kitashinchi, Kita-ku, ciudad de Osaka, prefectura de Osaka. A 1 minuto de la estacion Kitashinchi (JR Tozai) y unos 10 minutos a pie de Osaka/Umeda. No hay error de prefectura.","Shogatsu sin verificar. Ninguna fuente publica el calendario del 29/12 al 3/1. Que gnavi diga 'sin dia de cierre fijo' NO significa que abra en Ano Nuevo: en Kitashinchi, barrio de bares y clientes de oficina, es normal cerrar varios dias. Hay que llamar al 06-6485-8810 antes de contar con el.","La wanko soba, que es lo unico que este local tiene y otros no, solo va sabados, domingos y feriados y exige reserva por telefono (no online). Eso implica una llamada en japones. Si no la reservan, van a comer soba normal.","El almuerzo no acepta reservas: se entra por orden de llegada y es un set de 780 yenes en zona de oficinas, o sea cola probable entre 12:00 y 13:00. Conviene ir 11:30 o despues de las 13:30.","Sirve hasta las 3:30 AM de lunes a viernes, pero los fines de semana cierra 21:30. No lo pongan como cena tardia un sabado."],"refs":["https://tabelog.com/en/osaka/A2701/A270101/27104902/","https://www.tablecheck.com/en/gensei-kitashinchi","https://r.gnavi.co.jp/mbgns76j0000/","https://hitosara.com/0031356166/","https://awapass-osaka.com/shop/701"]},{"id":"u_g_14828165178368814742","n":"Koji Kinutani Tenku Art Museum","cat":"museo","hood":"Osaka","why":"Museo de un solo artista: Kōji Kinutani (1943-2025), pintor japonés que se formó en Venecia desde 1971 —dos años y medio estudiando fresco clásico— y trabajó el buon fresco con colores muy saturados. Murió en agosto de 2025 y desde entonces el museo funciona de hecho como memorial: la muestra de 2026 se llama «mensaje a la próxima generación» y conmemora el primer aniversario. Es chico —un piso, una sala de proyección 3D, un café con vista al oeste— y se recorre en 45-60 minutos; el atractivo grande del edificio es otro, el observatorio Kūchū Teien de los pisos 39-40, y por eso existe la entrada combinada. En diciembre-enero el problema no es el museo sino el calendario: cierra del 30/12 al 3/1 completo, cierra todos los martes, y además cierra sin aviso durante los cambios de montaje. Vale como parada de 60 minutos si ya van a subir al observatorio y les interesa la pintura; no justifica cruzar Osaka por sí solo.","addr":"Japón, 〒531-0076 Osaka, Kita Ward, Oyodonaka, 1 Chome−1−30 TOWER WEST, 27階","lat":34.705318999999996,"lng":135.4896224,"aprox":false,"gcid":"14828165178368814742","cost":1300,"dur":1,"sub":"Museo monográfico en el piso 27 de la Umeda Sky Building (Kita-ku, Osaka)","typ":"Museo de arte","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Koji Kinutani Tenku Art Museum","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): Cerrado del 30/12 al 3/1 inclusive. Verificado en la página oficial de acceso en inglés (la versión japonesa solo dice 年末年始, sin fechas). El 29/12 abriría con horario normal salvo que caiga martes (en 2026 el 29/12 es martes: cerrado también). O sea, del 29/12 al 3/1 no se puede entrar, y el martes 5/1/2027 vuelve a cerrar.","conf":"alta","warn":["Cerrado del 30/12 al 3/1 por año nuevo, y además cerrado todos los martes. El 29/12/2026 cae martes, así que la ventana muerta va del 29/12 al 3/1. Reabre el lunes 4/1/2027 y vuelve a cerrar el martes 5/1/2027.","Al 9/9/2026 la única exposición anunciada es «絹谷幸二 次代へのメッセージ», del 4/7/2026 al 30/11/2026. Para diciembre 2026 y enero 2027 no hay NADA publicado: puede haber cierre por cambio de montaje justo en las fechas del viaje. El patrón de los últimos cinco años es que la muestra siguiente arranca entre el 12 y el 21 de diciembre, pero esta termina el 30/11, antes que de costumbre, así que el hueco puede ser más largo. Reconfirmar en kinutani-tenku.jp/topics más cerca de la fecha o llamar al 06-6440-3760.","Entrada 1.300 yenes solo museo. El observatorio Kūchū Teien cuesta 2.000 aparte (abre 9:30-22:30, última entrada 22:00): la entrada combinada sale 2.500 contra 3.300 por separado. Se compra en ventanilla —el sitio oficial del observatorio dice que la venden en su boletería del piso 39, y el museo la lista en su tarifario del piso 27—, no online. Gratis con el Osaka e-Pass, confirmado en osaka-info.jp.","No necesita luz de día, pero el observatorio del mismo edificio sí depende de la hora: en pleno invierno oscurece temprano, así que si van por los dos conviene entrar al museo primero y subir al observatorio para el atardecer.","La zona del catálogo está bien: es Osaka ciudad, Kita-ku, a ~7-10 minutos caminando de la estación de Osaka/Umeda. No hay error de prefectura acá."],"refs":["https://www.kinutani-tenku.jp/access","https://www.kinutani-tenku.jp/en","https://www.kinutani-tenku.jp/en/access","https://www.kinutani-tenku.jp/en/s_exhib","https://www.kinutani-tenku.jp/topics","https://www.kinutani-tenku.jp/","https://osaka-info.jp/en/spot/koji-kinutani-tenku-art-museum/"]},{"id":"u_g_16565124373109652187","n":"Gyoza no Katchan Sennichimae Stire","cat":"comida","hood":"Osaka","why":"Izakaya de cadena en Namba (2do y 3er piso, 170 asientos) que hace gyoza barata a granel: 219 ¥ las 3 piezas de la básica, nueve variantes (jugosa, negi-shio, china, frita, mapo, queso, italiana al vapor, hervida) y karaage con varias salsas. Tabelog 3,07 con 85 reseñas: correcto para lo que es, pero es volumen y all-you-can-drink para grupos, no cocina que justifique un viaje. Para dos que van a compartir platos funciona como cena tardía y barata en Namba —abre hasta la 1 de la mañana todos los días, con última orden de comida a medianoche— y nada más; si el objetivo es gyoza buena en Osaka hay mejores paradas. Descartable sin culpa salvo que caigan por la zona después de las 16:00 con hambre y poco presupuesto.","addr":"Japón, 〒542-0075 Osaka, Chuo Ward, Nanbasennichimae, 11−24 ２Ｆ，３Ｆ","lat":34.6654147,"lng":135.5035874,"aprox":false,"gcid":"16565124373109652187","cost":2500,"dur":1.5,"sub":"Gyoza / izakaya","typ":"Gyoza","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Gyoza no Katchan Sennichimae Stire","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.07,"tip":"La «Kacchan gyoza» a la plancha, que es la número 1 de la casa: 219 ¥ por 3, 429 ¥ por 6, 660 ¥ por 10. Para compartir, mezclar con la jugosa (329 ¥/3), la negi-shio (329 ¥/3) y la mapo (329 ¥/3), más karaage de muslo (539 ¥) o con salsa especial (649 ¥). Hay plan de comer y beber sin límite (4.500 ¥ rebajado a 2.780 ¥ según la web oficial). Acepta tarjeta VISA, Master y JCB; no acepta dinero electrónico ni QR. No hace falta reservar; si se reserva mesa, cancelar desde las 00:00 del mismo día cuesta 2.000 ¥ por persona (y el 100% del curso si se reservó un curso).","season":"Año nuevo (29/12 al 3/1): Sin verificar. El único dato de época en la web oficial es «12月28日～31日は年末料金＋10%» (recargo del 10% del 28 al 31 de diciembre, sin año indicado), lo que sugiere que abre esos días; del 1 al 3 de enero no hay ninguna información publicada. Si lo quieren en esas fechas hay que llamar (06-6536-8058).","conf":"media","warn":["Entre semana abre recién a las 16:00: no es opción de almuerzo salvo sábado, domingo o feriado (desde las 12:00).","Recargo de 10% del 28 al 31 de diciembre según la web oficial (no dice de qué año, pero es la página vigente del local).","Hay otras sucursales de la cadena «Gyoza no Kacchan» en Osaka, con fichas de Tabelog distintas. El puntaje 3,07 (85 reseñas) es SOLO del local de Sennichimae: Namba-Sennichimae 11-24, pisos 2 y 3.","Cobra otoshi (cubierto obligatorio). Cancelar desde las 00:00 del mismo día cuesta 2.000 ¥ por persona si la reserva era solo de mesa, y el 100% del precio si se reservó un curso (el plan de comer y beber sin límite).","La zona del rótulo es correcta: Nanba-Sennichimae, Chuo-ku, ciudad de Osaka, a pasos de la estación de Namba. No hay error de prefectura."],"refs":["https://tabelog.com/en/osaka/A2701/A270202/27142310/","https://tabelog.com/en/osaka/A2701/A270202/27142310/dtlmenu/","https://gyozanokacchannambasennitimae.owst.jp/","https://r.gnavi.co.jp/1xacs3350000/"]},{"id":"u_g_17670300510256525139","n":"Hozen-ji","cat":"arq","hood":"Osaka","why":"Es un patio-templo diminuto metido entre los callejones de Namba: un Fudō Myōō de piedra tapado de musgo al que se le echa agua con un cucharón, más un par de altares chicos. Se ve entero en cinco minutos y no hay arquitectura que mirar — el garan se quemó entero en el bombardeo de 1945 y lo único que sobrevivió fue justamente el Fudō; el hondō nunca se reconstruyó (fuente: Ciudad de Osaka, Chuo-ku). Vale como parada de dos minutos camino a otra cosa, no como destino: el interés real es el Hozenji Yokocho, los dos callejones empedrados paralelos con kappō y bares viejos que lo rodean, que es donde ustedes van a comer. Ventaja para diciembre: está al aire libre, es gratis, se puede entrar a cualquier hora y con los faroles prendidos se ve mejor de noche que de día, así que no le roba nada a las horas de luz — en Osaka en diciembre oscurece cerca de las 17:00 y este lugar mejora justo después.","addr":"1 Chome-2-16 Namba, Chuo Ward, Osaka, 542-0076, Japón","lat":34.6679398,"lng":135.5024676,"aprox":false,"gcid":"17670300510256525139","cost":0,"dur":0.25,"sub":"-","typ":"Templo","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Hozen-ji","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): El recinto no cierra nunca —es un patio abierto sin puertas—, así que del 29/12 al 3/1 se puede entrar igual. Jorudan lo lista en su especial de hatsumōde (edición 2026) como el puesto 19 de la prefectura de Osaka, pero no publica horarios especiales ni cifras de visitantes: solo el ranking y un teléfono. Deduzco (no está verificado) que un top-20 de hatsumōde en un callejón donde entran dos personas de ancho va a tener cola el 1-3 de enero. No verifiqué horarios especiales de año nuevo ni si hay 除夜の鐘 el 31: el sitio oficial (houzenji.jp) devuelve 403 y no se pudo leer. Los locales del Hozenji Yokocho cierran cada uno por su cuenta en año nuevo; hay que chequear bar por bar.","conf":"media","warn":["La zona está bien: 1-2-16 Namba, Chuo-ku, Osaka, a 2-5 minutos a pie de Namba (Osaka Metro y Kintetsu). No hay error de prefectura.","No es una visita, es una parada. 5 minutos como mucho. Programarlo como bloque propio en el itinerario es desperdiciar un slot: va pegado a la cena en Dotonbori/Hozenji Yokocho.","El sitio oficial houzenji.jp bloquea el acceso automatizado (HTTP 403, probado dos veces). El horario del 授与所 sale de fuente secundaria fetcheada (10:00-18:00) y hay fuentes que dicen 8:00-23:00: si les importa el goshuin, confirmarlo en el lugar.","1-3 de enero: es un spot de hatsumōde (puesto 19 de Osaka según Jorudan). Nadie publica cifras, pero callejón angosto + Namba en año nuevo pinta a cola: si van esos días, temprano a la mañana o de madrugada.","Mejor de noche que de día, pero eso significa mezclarse con la marea de Dotonbori. No necesita luz solar."],"refs":["https://www.gltjp.com/en/directory/item/14647/","https://www.japan.travel/en/spot/1109/","https://www.city.osaka.lg.jp/chuo/page/0000641943.html","https://sp.jorudan.co.jp/newyear/spot_J6530.html"]},{"id":"u_g_8126294779654769743","n":"Tenma","cat":"barrio","hood":"Osaka","why":"Tenma es el barrio de comer y tomar barato de Osaka: alrededor de la estación JR Tenma hay un enredo de callecitas (Ura-Tenma) con cientos de izakayas chicos, y lo cruza el Tenjinbashisuji, el arcade techado más largo de Japón (2,6 km). Para dos que quieren compartir platos funciona, y es plan de noche: la zona arranca cerca de las 18:00, así que no compite con las horas de luz, que en diciembre se acaban antes de las 17:00. De día el arcade sirve porque está techado (frío o lluvia no importan), pero es comercio de barrio, no turismo: se camina un tramo, no los 2,6 km. Y no es un punto en el mapa sino una zona: el pin de Google cubre medio Kita-ku.","addr":"Kita-ku, Osaka, Prefectura de Osaka 530-0043, Japón","lat":34.6936088,"lng":135.51930389999998,"aprox":false,"gcid":"8126294779654769743","cost":0,"dur":3.5,"sub":"Barrio de izakayas","typ":"Barrio","book":"","free":"","closed":"","main":true,"costN":"","src":"lista","gname":"Tenma","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"Hashigo-zake: dos o tres paradas chicas en vez de una cena sentada. Kushikatsu, doteyaki, oden, yakitori, sashimi barato. Muchos locales son solo efectivo y varios cierran domingo o lunes; conviene caer 17:30-18:00 para sentarse sin cola (viernes y sábado se llena). La elección fina de restaurantes con Tabelog arriba de 3 hay que hacerla uno por uno: esto es la zona, no el local.","season":"Año nuevo (29/12 al 3/1): Verificado en fuente japonesa de terceros (no oficial): el 31/12 abre casi todo el arcade pero cierra temprano; el 1/1 cierra parte del comercio y quedan sobre todo los gastronómicos, varios abiertos de noche por el hatsumōde; el 2 y 3/1 reabre la mayoría con rebajas de año nuevo. En contra: del 1 al 3, de 11:00 al atardecer, el arcade y el entorno del Osaka Tenmangu quedan casi intransitables. Ventanas buenas: alrededor de las 10:00 (más temprano el arcade todavía no abrió) o después de las 18:00.","conf":"media","warn":["El Museo de la Vivienda de Osaka (Konjakukan) está CERRADO del 1/9/2026 al 5/1/2027: durante todo el viaje no se puede visitar","Es zona de comer y tomar, no de ver cosas: dedicarle un día entero de luz no rinde","El costo 0 es la entrada (calle pública, Tenmangu gratis), no el gasto de la noche: las 3,5 h descritas son de comer y tomar","Muchos izakayas de Ura-Tenma son solo efectivo","Tres estaciones distintas que no son lo mismo: JR Tenma (izakayas), Osaka-Tenmangu (santuario) y Tenjinbashisuji 6-chome (punta norte del arcade)","Del 1 al 3 de enero el barrio es masa humana por el hatsumōde en el Osaka Tenmangu"],"refs":["https://www.japan-guide.com/e/e4024.html","https://osakaa.net/osaka-city/kita-area/ultimate-guide-osaka-tenma-izakaya-hopping/","https://banzokubiology.com/tenjinbashi-newyear-crowd/","https://www.osaka-angenet.jp/konjyakukan/","https://osakatemmangu.or.jp/"]},{"id":"u_g_3941168473429300987","n":"Calle comercial Shinsekai Hondori","cat":"barrio","hood":"Osaka","why":"No es una tienda: es una de las calles del barrio Shinsekai, la zona de Osaka que se armó en 1912 alrededor de la torre Tsutenkaku y que hoy vive de kushikatsu, salones retro de juegos, tiro al blanco y carteles de neón apilados. El eje entero —Tsutenkaku Hondori, Shinsekai Hondori y Janjan Yokocho— entra en 300 m: caminarlo son cinco minutos, mirándolo con calma quince, así que el motivo real para ir es comer parados y mirar, no recorrer. Para dos foodies funciona como una parada de una a dos horas, no como un día: se come kushikatsu (una sola mojada en la salsa comunitaria, es la regla local), se sigue a Janjan Yokocho a 200 m y listo. Rinde más de noche que de día: el valor visual es el neón, y en diciembre en Osaka el sol se pone cerca de las 16:50, así que a partir de las 17:15 ya se ve como corresponde.","addr":"2 Chome-5 Ebisuhigashi, Naniwa Ward, Osaka, 556-0002, Japón","lat":34.651601299999996,"lng":135.50595619999999,"aprox":false,"gcid":"3941168473429300987","cost":0,"dur":1.5,"sub":"Calle de Shinsekai · kushikatsu y neón","typ":"Calle comercial","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Un shotengai cabe tanto en arq (calle histórica/tiendas) como en barrio (zona para caminar de Shinsekai).","src":"lista","gname":"Calle comercial Shinsekai Hondori","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"Kushikatsu: brochetas rebozadas y fritas, se mojan en la salsa comunitaria UNA sola vez (volver a mojar está prohibido; hay repollo gratis para usar de cuchara). Daruma Tsutenkaku no toma reservas y hace cola en horario pico, 1500-2500 ¥ por cabeza según su web, con mínimo de una bebida por persona; si quieren reservar, la sucursal Janjan de la misma cadena sí toma reservas desde 2 personas. La calle también tiene okonomiyaki y tonkatsu de barrio. Muchos locales chicos de Shinsekai son solo efectivo: llevar yenes.","season":"Año nuevo (29/12 al 3/1): Parcialmente verificado. La calle es vía pública, se camina cualquier día del año. Del lado gastronómico, Kushikatsu Daruma sucursal Tsutenkaku declara 年中無休 en su sitio oficial, lo que sugiere que abre también en shōgatsu — pero 年中無休 quiere decir \"sin día de descanso fijo\" y no descarta un cierre de 正月 no publicado: confirmar el 1-3 de enero. El resto de los locales, sin verificar. La torre Tsutenkaku (ficha aparte) no publica su calendario de 年末年始 en el sitio oficial.","conf":"alta","warn":["Hay TRES calles casi homónimas pegadas y se confunden en las guías: 通天閣本通 (Tsutenkaku Hondori, Ebisuhigashi 1-chome, los 200 m de Ebisucho a la torre), 新世界本通 (Shinsekai Hondori, Ebisuhigashi 2-chome, que es a donde apunta este cid) y ジャンジャン横丁 (Janjan Yokocho, 3-chome). Están todas dentro de 300 m, así que no cambia el plan, pero si el catálogo tiene entradas separadas son la misma parada: revisar duplicados de Shinsekai / Tsutenkaku / Janjan Yokocho.","Shinsekai limita al oeste con Airin/Kamagasaki (Nishinari), la zona de jornaleros de Osaka. El eje turístico (torre, Hondori, Janjan) está iluminado y con gente hasta tarde; las calles laterales hacia el oeste y hacia Shin-Imamiya de noche, no. Dato de guías, no de fuente oficial.","La torre Tsutenkaku, que es el ancla visual de la calle, cambió horarios en marzo de 2026 y tarifas en abril de 2026: ya rigen los nuevos, y no los publica en la portada. Además exige reservar franja horaria al comprar la entrada (ars-tsutenkaku.triplabo.jp); los pases tipo Osaka Amazing Pass reservan en la ventanilla el mismo día. Si la torre entra al plan, verificar precio y horario vigentes antes de ir, no reusar datos viejos.","Muchos locales chicos de la zona son solo efectivo."],"refs":["https://osaka-shotengai.com/shotengai_list/shinsekaihontouri.html","https://tsutenkaku-hondori.com/","https://osaka-info.jp/en/spot/tsutenkaku-hondori-merchants-association/","https://www.gltjp.com/en/directory/item/12293/","https://co-trip.jp/spot/334679","https://www.kushikatu-daruma.com/location/tsutenkaku","https://www.tsutenkaku.co.jp/"]},{"id":"u_g_17667264106499753238","n":"Shinsaibashi Station","cat":"transporte","hood":"Osaka","why":"Es una estación de subte, no un lugar para visitar: cruce de la línea Midosuji (M19) y la Nagahori Tsurumi-ryokuchi (N15), con pasaje de transferencia oficial hasta Yotsubashi (Y14, línea Yotsubashi), con cinta transportadora. Sirve como ancla logística del barrio de compras y comida de Shinsaibashi/Minami: una parada de Namba, tres de Umeda, y salidas a la galería techada Shinsaibashi-suji y al subterráneo comercial Crysta Nagahori — techo continuo, que en diciembre con lluvia o frío vale. En la ficha va como punto de referencia para armar el día o para elegir alojamiento, no como visita con tiempo asignado. Ojo con la luz: acá no importa (todo bajo tierra y galería), pero el barrio de arriba se queda sin sol antes de las 17 y funciona igual, es zona de neón.","addr":"3-chōme-12 Minamisenba, Chuo Ward, Osaka, 542-0081, Japón","lat":34.6750572,"lng":135.5003772,"aprox":false,"gcid":"17667264106499753238","cost":190,"dur":0.2,"sub":"Estación de metro (Osaka Metro M19 / N15, conexión con Yotsubashi Y14)","typ":"Estación","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Shinsaibashi Station","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"Año nuevo (29/12 al 3/1): El subte funciona todos los días del año, no cierra. Lo verificable hoy (sept-2026) es la edición ANTERIOR: en el aviso oficial del 1/12/2025, Osaka Metro confirmó que NO hace servicio nocturno continuo (終夜運転) de Nochevieja a Año Nuevo y que del 27/12/2025 al 4/1/2026 todas las líneas corrieron con horario de sábado/feriado. El calendario 2026-2027 todavía no está publicado; lo más probable es que repita el mismo esquema, pero hay que revisarlo en diciembre. Consecuencia práctica: en esos días hay menos frecuencia y el último tren es el de fin de semana, así que si se sale a hatsumōde de madrugada no hay subte de vuelta.","conf":"alta","warn":["La zona está bien asignada: Chuo-ku, ciudad de Osaka, prefectura de Osaka. La dirección del registro (Minamisenba 3-chome) corresponde a una de las bocas del lado norte; la estación ocupa el eje de Shinsaibashi-suji, misma zona. No hay error de ciudad.","No es una atracción. Si entra al catálogo, que sea como punto de referencia/transporte o como zona de alojamiento, no como parada del itinerario con tiempo asignado.","Sin servicio nocturno continuo el 31/12 según el aviso oficial de la edición 2025-26, y horario de sábado/feriado del 27/12 al 4/1. El calendario 2026-27 no está anunciado: verificar en diciembre.","La salida 7 de la línea Midosuji cierra desde el primer tren del 12/9/2026 por obras del edificio al que conecta (aviso oficial de Osaka Metro, sin fecha de reapertura anunciada). Si alguien se orienta por una guía vieja, esa boca puede no estar. Fuente: https://subway.osakametro.co.jp/guide/maintenance/gateway/20260812_shinsaibashi_7gou_heisa.php"],"refs":["https://subway.osakametro.co.jp/station_guide/m/m19/","https://subway.osakametro.co.jp/guide/fare/fare/price.php","https://subway.osakametro.co.jp/news/news_release/20251201_oomisoka.php","https://subway.osakametro.co.jp/guide/maintenance/gateway/20260812_shinsaibashi_7gou_heisa.php"]},{"id":"u_g_9006986552695684426","n":"PATHFINDER XNOBU","cat":"comida","hood":"Osaka","why":"Cafetería de especialidad estilo Melbourne en Ukita 1-6-9 (Kita-ku), a la vuelta de Nakazakicho, el local original de Shimoyama (下山修正), dos veces campeón mundial de latte art; funciona además como escuela de baristas, y eso puede correr el horario los días de clase. Tabelog 3,51 sobre 164 reseñas. La zona está bien asignada: Nakazakicho es Osaka de verdad, dos minutos de la estación de la línea Tanimachi (244 m) y unos 12-15 minutos caminando desde Umeda, en un barrio de casas viejas reconvertidas que se recorre a pie. Cierra a las 18:00, así que es café de media mañana o merienda temprana, nunca cena; en diciembre a las 17:00 ya es de noche y el barrio pierde bastante.","addr":"Japón, 〒530-0021 Osaka, Kita Ward, Ukida, 1 Chome−6−9 Plum Garden Nakazaki, 1F","lat":34.708279,"lng":135.5073482,"aprox":false,"gcid":"9006986552695684426","cost":1000,"dur":0.75,"sub":"café de especialidad","typ":"Café","book":"","free":"","closed":"","main":false,"costN":"⚠ categoría por confirmar: Sin nombre. 1F en Nakazakicho, barrio de cafés de autor: asumo café, pero podría ser tienda o galería.","src":"lista","gname":"Japón","must":0,"tags":["lista-google","revisar-categoria"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":3.51,"tip":"El café con leche es lo que se viene a tomar: flat white 450 ¥ o \"magic\" (el corto de Melbourne, doble ristretto con leche en taza chica) 500 ¥ según la carta oficial del sitio; un artículo de 2021 los daba a 550 ¥, así que puede haber aumentado. Espresso 350-400 ¥, long black 400 ¥. Se elige tipo de leche, temperatura, cantidad de espuma y grano — hay soja y almendra. Dulces y pastelería: no hay carta publicada. La pastelería la traen de la panadería vecina Boulanger S.KAGAWA (pan/tostadas) y de Patisserie Ravi,e relier (dulces), según pretty-online; los precios no están confirmados — un artículo de 2021 daba un financier a 450 ¥. Acepta tarjeta, dinero electrónico y QR según Tabelog: NO es solo efectivo. Local chico de barra y pocas mesas, sin reserva necesaria pero con cola posible los fines de semana; Tabelog marca que sí toma reservas.","season":"Año nuevo (29/12 al 3/1): Sin confirmar para 2026-27. La única fuente que fetcheé con el dato (pretty-online.jp, artículo de marzo de 2021) lista 定休日: 年末年始, o sea cierra en el bloque de fin de año / Año Nuevo. Es plausible y típico de un café chico, pero tiene cinco años: chequear el Instagram @pathfinder_nakazaki en diciembre. Asumir cerrado del 29/12 al 3/1 y tener plan B.","conf":"media","warn":["Horarios: 10:00-18:00 en tres fuentes (Tabelog, Yahoo, pretty-online) contra 12:00-18:00 solo en Retty. Ninguna fuente confirma cierre los jueves. El sitio avisa que el horario se corre cuando hay clases de la escuela: mirar el Instagram el día antes.","Cierra 18:00. No sirve para cena, y en diciembre a las 17:00 ya está oscuro.","Shōgatsu sin verificar: la fuente de 2021 dice que cierra 年末年始. No agendarlo entre el 29/12 y el 3/1 sin confirmar.","El 3,51 de Tabelog corresponde a ESTE local, 浮田1-6-9 (Ukita 1-6-9), Kita-ku. Si buscás el nombre en Tabelog o Google verificá la dirección antes de guiarte por el puntaje: no está confirmado cuántos locales con este nombre hay en Osaka.","Local chico. Con dos personas compartiendo, entra y sale rápido; no es lugar para sentarse dos horas."],"refs":["https://tabelog.com/en/osaka/A2701/A270101/27114171/","https://pathfinderxnobu.com/","https://pathfinderxnobu.com/cafe/","https://retty.me/area/PRE27/ARE92/SUB62104/100001523716/","https://www.pretty-online.jp/news/2681/","https://map.yahoo.co.jp/v3/place/cwslmEvJ0Xk"]},{"id":"u_g_9092937571432888268","n":"Kema Sakuranomiya Park","cat":"parque","hood":"Osaka","why":"Es una franja de parque de 33,7 ha y unos 4 km sobre la ribera del río Ōkawa, entre Tenmabashi y el vertedero de Kema (毛馬洗堰), con ~4.500 cerezos: o sea, un lugar cuya razón de existir es abril. En diciembre-enero son árboles pelados y una vereda ancha al lado del agua, con viento de río; los locales la usan para correr y andar en bici, no es un destino. Sirve como tramo: bajás en Sakuranomiya y caminás hacia el Castillo de Osaka (~40 min por la ribera), o al revés desde Tenmabashi, y de paso pasás por los edificios Meiji de ladrillo de la zona de la Casa de la Moneda. Como parada propia en un viaje de 25 días no se defiende; como forma de hacer a pie un traslado que igual ibas a hacer, sí.","addr":"12 Nakanocho, Miyakojima Ward, Osaka, 534-0027, Japón","lat":34.7051508,"lng":135.51884379999998,"aprox":false,"gcid":"9092937571432888268","cost":0,"dur":0.75,"sub":"Miyakojima / ribera del Ōkawa","typ":"Parque","book":"","free":"","closed":"","main":false,"costN":"","src":"lista","gname":"Kema Sakuranomiya Park","must":0,"tags":["lista-google"],"autor":"Thais Helena de Rezende","cuando":"","jp":1,"th":1,"boro":"Osaka","rate":0,"tip":"","season":"No es de montaña y no cierra por nieve, pero es estacional en el sentido que importa: es un parque de hanami. En diciembre y enero no hay flor ni follaje, queda el paseo ribereño pelado. · Año nuevo (29/12 al 3/1): Abierto: es un parque público sin cierre, la ficha oficial dice 常時開園 sin excepción de 年末年始. Es de las pocas cosas que funcionan del 29/12 al 3/1, pero funciona como vereda, no como atracción. Los edificios históricos y museos de adentro y de al lado sí cierran en esas fechas y eso no lo verifiqué uno por uno.","conf":"alta","warn":["En diciembre-enero los ~4.500 cerezos están sin hojas ni flores. Todo lo que se lee de este parque describe abril: no traslades esas fotos a las fechas del viaje.","Necesita luz de día. A fin de diciembre oscurece cerca de las 16:30-17:00 y es una ribera larga con poca iluminación; después de esa hora no tiene sentido.","Es ribera abierta al viento del río, sin techo ni refugio. En pleno invierno, caminata corta y abrigo.","El Senbutsukan (edificio Meiji dentro del parque) abre muy pocos días al año y no verifiqué su calendario; no cuentes con entrar."],"refs":["https://parksgreenery.city.osaka.lg.jp/article/parks-sakuranomiya/","https://osaka-info.jp/spot/kema-sakuranomiya-park/","https://www.japan.travel/en/spot/1091/"]},{"id":"u_g_4905233868421630160","n":"Prefectura de Shiga","cat":"barrio","hood":"Otras zonas","why":"Está en la lista «Japón» de Google Maps. Falta escribir por qué vale la pena.","addr":"Japón","lat":35.329201399999995,"lng":136.05632119999999,"aprox":false,"gcid":"4905
